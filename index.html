    </div>`);
  openModal(html);
  bindModalClose();

  function preencherDadosTutor(){
    const t = tutorById(document.getElementById('nfTutorSel').value);
    document.getElementById('nfNomeTutorInput').value = t?.nome||'';
    document.getElementById('nfCpfTutorInput').value = t?.cpf||'';
    document.getElementById('nfEmailInput').value = t?.email||'';
    document.getElementById('nfCepTutorInput').value = t?.cep||'';
    document.getElementById('nfEnderecoCidadeInput').value = t?.enderecoCidade||'';
    document.getElementById('nfRuaInput').value = t?.rua||'';
    document.getElementById('nfBairroInput').value = t?.bairro||'';
    document.getElementById('nfNumeroInput').value = t?.numero||'';
    document.getElementById('nfComplementoInput').value = t?.complemento||'';
    document.getElementById('nfTelefoneInput').value = t?.telefone||'';
  }
  function renderItens(){
    const cont = document.getElementById('nfItensList');
    cont.innerHTML = itens.map(it=>`
      <div style="display:flex; gap:6px; margin-bottom:6px; align-items:center;">
        <select data-item-cat="${it.id}" style="flex:1;">
          ${(DB.categoriasNF||[]).map(c=>`<option ${it.categoria===c?'selected':''}>${c}</option>`).join('')}
        </select>
        <input data-item-desc="${it.id}" placeholder="Descrição (opcional)" value="${it.descricao||''}" style="flex:2;">
        <input data-item-valor="${it.id}" type="number" step="0.01" min="0" placeholder="0,00" value="${it.valor||''}" style="width:100px;">
        ${itens.length>1?`<button type="button" class="icon-btn" data-item-del="${it.id}">${ICONS.x}</button>`:''}
      </div>`).join('');
    cont.querySelectorAll('[data-item-cat]').forEach(el=>el.addEventListener('change', e=>{
      const it = itens.find(x=>x.id===el.dataset.itemCat); if(it) it.categoria=e.target.value;
    }));
    cont.querySelectorAll('[data-item-desc]').forEach(el=>el.addEventListener('input', e=>{
      const it = itens.find(x=>x.id===el.dataset.itemDesc); if(it) it.descricao=e.target.value;
    }));
    cont.querySelectorAll('[data-item-valor]').forEach(el=>el.addEventListener('input', e=>{
      const it = itens.find(x=>x.id===el.dataset.itemValor); if(it) it.valor=Number(e.target.value)||0;
      atualizarTotal();
    }));
    cont.querySelectorAll('[data-item-del]').forEach(el=>el.addEventListener('click', ()=>{
      itens = itens.filter(x=>x.id!==el.dataset.itemDel);
      renderItens(); atualizarTotal();
    }));
  }
  function atualizarTotal(){
    const cobrado = itens.reduce((s,it)=>s+(Number(it.valor)||0),0);
    const splits = Number(document.getElementById('nfSplitsInput')?.value)||0;
    const nota = Math.max(0, cobrado-splits);
    document.getElementById('nfCobrado').textContent = 'R$ '+cobrado.toFixed(2).replace('.',',');
    document.getElementById('nfValorTotal').textContent = 'R$ '+nota.toFixed(2).replace('.',',');
    document.getElementById('nfValorNotaNum').textContent = nota.toFixed(2).replace('.',',');
  }
  document.getElementById('nfSplitsInput').addEventListener('input', atualizarTotal);
  renderItens(); atualizarTotal(); preencherDadosTutor();

  document.getElementById('nfAddItemBtn').addEventListener('click', ()=>{
    itens.push({id:uid(), categoria:(DB.categoriasNF||[])[0]||'', descricao:'', valor:''});
    renderItens(); atualizarTotal();
  });
  function mostrarHistoricoNF(tid){
    const el = document.getElementById('nfHistorico'); if(!el) return;
    if(!tid){ el.innerHTML=''; return; }
    const fmtR = v=>'R$ '+(v||0).toFixed(2).replace('.',',');
    const linhas = [];
    (DB.notasFiscais||[]).filter(x=>x.tutorId===tid && (!nf||x.id!==nf.id)).forEach(x=>linhas.push({d:x.data, tipo:'Nota', txt:`${fmtR(x.valorTotal)}${x.animalId?' · '+(animalById(x.animalId)?.nome||''):''}`, st:x.status, cls:x.status==='Feita'?'st-Realizado':'st-AguardandoConfirmacao'}));
    DB.agendamentos.filter(x=>x.tutorId===tid).forEach(x=>linhas.push({d:x.data, tipo:'Atendimento', txt:`${x.tipo||''}${x.animalId?' · '+(animalById(x.animalId)?.nome||''):''}`, st:x.status, cls:'st-'+String(x.status||'').replace(/\s/g,'')}));
    DB.contatos.filter(x=>x.tutorId===tid && x.dataContato).forEach(x=>linhas.push({d:x.dataContato, tipo:'Contato', txt:x.tipoAtendimento||'', st:x.status, cls:'st-AguardandoConfirmacao'}));
    linhas.sort((a,b)=>(b.d||'').localeCompare(a.d||''));
    if(!linhas.length){ el.innerHTML=''; return; }
    el.innerHTML = `<div style="background:var(--sage-pale); border-radius:12px; padding:12px 14px; margin-bottom:14px;">
      <div style="font-size:12px; font-weight:800; letter-spacing:.04em; text-transform:uppercase; color:var(--ink-soft); margin-bottom:8px;">Histórico deste cliente</div>
      ${linhas.slice(0,5).map(l=>`<div style="display:flex; align-items:center; gap:10px; font-size:13px; padding:4px 0;">
        <span style="width:78px; color:var(--ink-soft);">${fmtDate(l.d)}</span>
        <span style="width:84px; font-weight:700;">${l.tipo}</span>
        <span style="flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${l.txt}</span>
        <span class="badge ${l.cls}">${l.st||''}</span></div>`).join('')}
      ${linhas.length>5?`<div style="font-size:12px; color:var(--ink-soft); margin-top:4px;">e mais ${linhas.length-5} registro(s)</div>`:''}
    </div>`;
  }
  mostrarHistoricoNF(document.getElementById('nfTutorSel').value);
  document.getElementById('nfTutorSel').addEventListener('change', e=>{
    const tid = e.target.value;
    mostrarHistoricoNF(tid);
    document.getElementById('nfAnimalSel').innerHTML = `<option value="">—</option>` + (tid?animaisDoTutor(tid):[]).map(a=>`<option value="${a.id}">${a.nome}</option>`).join('');
    document.getElementById('nfAgSel').innerHTML = `<option value="">— nenhum, é de outra coisa —</option>` + (tid?agendamentosDoTutor(tid):[]).map(a=>`<option value="${a.id}">${fmtDate(a.data)} — ${a.tipo} — ${animalById(a.animalId)?.nome||''}</option>`).join('');
    preencherDadosTutor();
  });
  document.getElementById('nfStatusSel').addEventListener('change', e=>{
    document.getElementById('nfDataFeitaWrap').style.display = e.target.value==='Feita'?'':'none';
  });
  document.getElementById('nfUsarDadosTutor').addEventListener('change', e=>{
    document.getElementById('nfDadosTutorWrap').style.display = e.target.value==='sim'?'':'none';
    document.getElementById('nfDadosAlternativosWrap').style.display = e.target.value==='sim'?'none':'';
  });

  document.getElementById('modalSave').addEventListener('click', ()=>{
    const f = document.getElementById('formNF');
    if(!f.reportValidity()) return;
    const itensValidos = itens.filter(it=>it.valor && Number(it.valor)>0);
    if(!itensValidos.length){ toast('Adicione pelo menos um item com valor'); return; }
    const data = Object.fromEntries(new FormData(f));
    const usaTutor = data.usarDadosTutor==='sim';
    if(usaTutor){
      if(!data.nomeTutorNF || !data.cpfTutorNF){ toast('Preencha nome e CPF para emitir a nota'); return; }
      const t = tutorById(data.tutorId);
      if(t){
        t.nome = data.nomeTutorNF;
        if(data.cpfTutorNF) t.cpf = data.cpfTutorNF;
        if(data.email) t.email = data.email;
        if(data.cepTutorNF) t.cep = data.cepTutorNF;
        if(data.enderecoCidadeTutorNF) t.enderecoCidade = data.enderecoCidadeTutorNF;
        if(data.ruaTutorNF) t.rua = data.ruaTutorNF;
        if(data.bairroTutorNF) t.bairro = data.bairroTutorNF;
        if(data.numeroTutorNF) t.numero = data.numeroTutorNF;
        if(data.complementoTutorNF) t.complemento = data.complementoTutorNF;
        if(data.telefoneTutorNF) t.telefone = data.telefoneTutorNF;
      }
      delete data.complementoTutorNF; delete data.telefoneTutorNF; delete data.complementoAlternativo;
      delete data.nomeTutorNF; delete data.cpfTutorNF; delete data.cepTutorNF; delete data.enderecoCidadeTutorNF; delete data.ruaTutorNF; delete data.bairroTutorNF; delete data.numeroTutorNF;
      delete data.nomeAlternativo; delete data.cpfAlternativo; delete data.telefoneAlternativo; delete data.emailAlternativo;
      delete data.cepAlternativo; delete data.enderecoCidadeAlternativo; delete data.ruaAlternativo; delete data.bairroAlternativo; delete data.numeroAlternativo;
    } else {
      if(!data.nomeAlternativo || !data.cpfAlternativo){ toast('Preencha nome e CPF de quem vai receber a nota'); return; }
      if(data.emailAlternativo) data.email = data.emailAlternativo;
      delete data.emailAlternativo;
    }
    data.usarDadosTutor = usaTutor;
    if(data.enviarCliente==='sim') data.enviarCliente=true; else if(data.enviarCliente==='nao') data.enviarCliente=false; else delete data.enviarCliente;
    if(!data.animalId) delete data.animalId;
    if(!data.agendamentoId) delete data.agendamentoId;
    if(data.status!=='Feita') delete data.dataFeita;
    const cobrado = itensValidos.reduce((s,it)=>s+(Number(it.valor)||0),0);
    const splits = Math.min(cobrado, Number(data.splits)||0);
    delete data.splits;
    const valorTotal = Math.max(0, cobrado-splits);
    data.cobrado = cobrado; data.splits = splits;
    const tutorNome = tutorById(data.tutorId)?.nome||'—';
    if(editing){
      Object.assign(nf, data, {itens:itensValidos, valorTotal});
      logAction(`editou a nota fiscal de ${tutorNome}`);
      toast('Nota fiscal atualizada');
    } else {
      const novaNF = {id:uid(), ...data, itens:itensValidos, valorTotal, anexos:[], enviado:false, criadoPor:getCurrentUser(), criadoEm:new Date().toISOString()};
      DB.notasFiscais.push(novaNF);
      logAction(`criou uma nota fiscal de ${tutorNome} (R$ ${valorTotal.toFixed(2)})`);
      toast('Nota fiscal criada');
      saveDB(); closeModal(); closeDrawer(); render();
      perguntarAvaliacao(novaNF);
      return;
    }
    saveDB(); closeModal(); closeDrawer(); render();
  });
  if(editing){
    document.getElementById('delNF').addEventListener('click', ()=>{
      confirmDialog('Excluir nota fiscal?','Esta ação não pode ser desfeita.', ()=>{
        DB.notasFiscais = DB.notasFiscais.filter(x=>x.id!==nf.id);
        logAction(`excluiu uma nota fiscal de ${tutorById(nf.tutorId)?.nome||'—'}`);
        saveDB(); closeModal(); closeDrawer(); render(); toast('Nota fiscal excluída');
      });
    });
  }
}

function openNFDrawer(nfId){

  const cpf = usaTutor ? (t?.cpf||'') : (nf.cpfAlternativo||'');
  const telefone = usaTutor ? (t?.telefone||'') : (nf.telefoneAlternativo||'');
  const email = nf.email||'';
  const rua = usaTutor ? (t?.rua||'') : (nf.ruaAlternativo||'');
  const numero = usaTutor ? (t?.numero||'') : (nf.numeroAlternativo||'');
  const bairro = usaTutor ? (t?.bairro||'') : (nf.bairroAlternativo||'');
  const cidadeEndereco = usaTutor ? (t?.enderecoCidade||'') : (nf.enderecoCidadeAlternativo||'');

    {label:'Nome completo', valor:nome},
    {label:'CPF', valor:cpf},
    {label:'Telefone', valor:telefone},
    {label:'E-mail', valor:email},
    {label:'Rua', valor:rua},
    {label:'Número', valor:numero},
    {label:'Bairro', valor:bairro},
    {label:'Cidade', valor:cidadeEndereco},
    {label:'CEP', valor:cep},
    {label:'Valor da nota', valor:valorNota},
  ].filter(c=>c.valor);
  openDrawer(`
    <div class="drawer-head">
      <div><h2>Nota — ${nome||'—'}</h2><div class="drawer-sub">${fmtDate(nf.data)} · R$ ${valorNota}</div></div>
      <button class="icon-btn" id="drawerClose">${ICONS.x}</button>
    </div>
    <div class="drawer-body">
      <div style="display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap;">
        <span class="badge ${nf.status==='Feita'?'st-Realizado':'st-AguardandoConfirmacao'}">${nf.status}</span>
        ${nf.formaPagamento?`<span class="pill-muted">${nf.formaPagamento}</span>`:''}
        ${an?`<span class="pill-muted">${an.nome}</span>`:''}
        ${!usaTutor?`<span class="pill-muted">nome diferente do tutor</span>`:''}
      </div>
      ${camposCopiaveis.length?`<div class="section-title">Dados para a NF <span class="hint" style="font-weight:400; font-size:11.5px;">(clique para copiar)</span></div>
      <div style="display:flex; flex-direction:column; gap:6px; margin-bottom:16px;">
        ${camposCopiaveis.map(c=>`
          <div style="display:flex; align-items:center; justify-content:space-between; gap:8px; background:var(--sage-pale); border-radius:9px; padding:7px 10px;">
            <div style="min-width:0;"><div style="font-size:11px; color:var(--ink-soft);">${c.label}</div><div style="font-size:13.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${c.valor}</div></div>
            <button type="button" class="icon-btn" data-copiar-campo-nf="${c.valor.replace(/"/g,'&quot;')}" title="Copiar ${c.label}">${ICONS.copy}</button>

      <div style="display:flex; gap:8px; flex-wrap:wrap;">
        <button class="btn btn-primary btn-sm" data-edit-nf="${nf.id}">${ICONS.edit} Editar</button>
        <button class="btn btn-danger btn-sm" data-del-nf="${nf.id}">${ICONS.trash} Excluir nota</button>
      </div>
    </div>`);
  document.getElementById('drawerClose').addEventListener('click', closeDrawer);
  document.querySelectorAll('[data-copiar-campo-nf]').forEach(el=>el.addEventListener('click', ()=>{
    const valor = el.dataset.copiarCampoNf;
    navigator.clipboard?.writeText(valor).then(()=>toast('Copiado!')).catch(()=>toast('Não foi possível copiar'));
  }));
  document.getElementById('nfAnexoUpload').addEventListener('change', e=>{
    const file = e.target.files[0]; if(!file) return;
    if(file.type!=='application/pdf'){ toast('Apenas arquivos PDF'); return; }
    const reader = new FileReader();
    reader.onload = ev=>{
      nf.anexos = nf.anexos||[];
      nf.anexos.push({id:uid(), nome:file.name, dataUrl:ev.target.result});

      saveDB(); toast('Anexo adicionado');
      document.getElementById('nfAnexosList').innerHTML = nfAnexosListHtml(nf);
      attachViewHandlers();
    };
    reader.readAsDataURL(file);
  });
}
function nfAnexosListHtml(nf){
  if(!nf.anexos || !nf.anexos.length) return `<div class="hint">Nenhum PDF anexado ainda.</div>`;
  return nf.anexos.map(a=>`

      <a href="${a.dataUrl}" download="${a.nome}" class="icon-btn" title="Baixar">${ICONS.download}</a>
      <button class="icon-btn" data-del-anexo-nf="${nf.id}" data-anexo-id="${a.id}" title="Excluir anexo">${ICONS.x}</button>
    </div>`).join('');
}

/* =========================================================
   RELATÓRIOS (manuais, semanais/mensais)
========================================================= */
let relatoriosFiltroTipo = '';
let relatMes = todayISO().slice(0,7);
function metricasDoMes(mk){
  const ags = DB.agendamentos.filter(a=>monthKey(a.data||'')===mk);
  const valido = a=>!['Cancelado','Desmarcado','Reagendado'].includes(a.status);
  return {
    contatos: DB.contatos.filter(c=>!c.mesmoTelefonema && monthKey(c.dataContato||'')===mk).length,
    agendados: ags.filter(valido).length,
    realizados: ags.filter(a=>a.status==='Realizado').length,
    desmarcados: ags.filter(a=>['Cancelado','Desmarcado'].includes(a.status)).length,
    faltas: ags.filter(a=>a.status==='Falta').length,
    notas: (DB.notasFiscais||[]).filter(n=>monthKey(n.data||'')===mk).reduce((t,n)=>t+(n.valorTotal||0),0),
  };
}
/* ---------- Relatório automático (mensal e semanal) ---------- */
let relatTab = 'mensal';
let relatSemana = (()=>{ const t=todayISO(); const d=new Date(t+'T00:00:00'); return addDays(t, -((d.getDay()+6)%7)); })();
function segundaDe(iso){ const d=new Date(iso+'T00:00:00'); return addDays(iso, -((d.getDay()+6)%7)); }
function ultimoDiaMes(mk){ const [y,m]=mk.split('-').map(Number); return mk+'-'+String(new Date(y,m,0).getDate()).padStart(2,'0'); }
function periodoRel(){
  if(relatTab==='semanal'){
    const ini=relatSemana, fim=addDays(ini,6), pIni=addDays(ini,-7), pFim=addDays(ini,-1);

function metricasPeriodo(ini,fim){
  const noPer = d=> d && d>=ini && d<=fim;
  const ags = (DB.agendamentos||[]).filter(a=>noPer(a.data));
  const valido = a=>!['Cancelado','Desmarcado','Reagendado'].includes(a.status);
  const cts = (DB.contatos||[]).filter(c=>!c.mesmoTelefonema && noPer(c.dataContato));
  const desm = ags.filter(a=>['Cancelado','Desmarcado'].includes(a.status));
  const nao = cts.filter(c=>c.status==='Não agendado');
  const motivos = {};
  const add = m=>{ if(m) motivos[m]=(motivos[m]||0)+1; };
  desm.forEach(a=>add(a.motivoStatus)); nao.forEach(c=>add(c.motivoNaoAgendamento));
  const motivosNao = {}; nao.forEach(c=>{ if(c.motivoNaoAgendamento) motivosNao[c.motivoNaoAgendamento]=(motivosNao[c.motivoNaoAgendamento]||0)+1; });
  const detalhes = [];
  desm.forEach(a=>detalhes.push({data:a.data, hora:a.horario||'', atend:a.tipo||'Sem tipo', animal:a.animalId?(animalById(a.animalId)?.nome||''):(a.animalAvulso||''), quem:agTutorNome(a), tel:(a.tutorId?tutorById(a.tutorId)?.telefone:a.telefoneAvulso)||'', tipo:a.status==='Cancelado'?'Cancelou':'Desmarcou', motivo:a.motivoStatus||'', texto:a.observacoes||''}));
  nao.forEach(c=>detalhes.push({data:c.dataContato, hora:'', atend:c.tipoAtendimento||'Sem tipo', animal:c.animalId?(animalById(c.animalId)?.nome||''):(c.animalAvulso||''), quem:c.tutorId?(tutorById(c.tutorId)?.nome||''):(c.nomeAvulso||''), tel:c.telefone||(c.tutorId?tutorById(c.tutorId)?.telefone:'')||'', tipo:'Não agendou', motivo:c.motivoNaoAgendamento||'', texto:c.observacoes||''}));
  detalhes.sort((a,b)=>b.data.localeCompare(a.data));
  return {
    contatos: cts.length,
    cliente: cts.filter(c=>c.origem!=='Realizado').length,
    nos: cts.filter(c=>c.origem==='Realizado').length,
    agendados: ags.filter(valido).length,
    consultas: ags.filter(a=>valido(a) && a.tipo==='Consulta').length,
    acompanhamentos: ags.filter(a=>valido(a) && a.tipo==='Acompanhamento').length,
    naoCons: nao.filter(c=>c.tipoAtendimento==='Consulta').length,
    naoAcomp: nao.filter(c=>c.tipoAtendimento==='Acompanhamento').length,
    naoCir: nao.filter(c=>c.tipoAtendimento==='Cirurgia').length,
    naoOutros: nao.filter(c=>!['Consulta','Acompanhamento','Cirurgia'].includes(c.tipoAtendimento)).length,
    motivosNao,
    cirurgias: ags.filter(a=>valido(a) && a.tipo==='Cirurgia').length,
    realizados: ags.filter(a=>a.status==='Realizado').length,
    desmarques: desm.length,
    naoAgendaram: nao.length,
    motivos, detalhes
  };
}
function relPl(n,s,p){ return `${n} ${n===1?s:p}`; }
function relVar(a,b){
  if(a===b) return {txt:'igual', cls:'eq', dir:0};
  if(b===0) return {txt:'novo', cls:'up', dir:1};
  const p = Math.min(100, Math.round(Math.abs(a-b)/b*100));
  return a>b ? {txt:'▲ '+p+'%', cls:'up', dir:1} : {txt:'▼ '+p+'%', cls:'down', dir:-1};
}
function relTopMotivos(A,n){ return Object.entries(A.motivosNao).sort((x,y)=>y[1]-x[1]||x[0].localeCompare(y[0],'pt-BR')).slice(0,n); }
function relDif(a,b){
  if(a===b) return 'igual';
  if(b===0) return 'novo';
  return Math.min(999,Math.round(Math.abs(a-b)/b*100))+'% '+(a>b?'a mais':'a menos');
}
function relResumoTexto(P, A, B){
  const ant = P.anterior.replace(/^(o|a) /,'').replace(/^./,c=>c.toUpperCase());
  const L = (rot,txt)=>`<strong>${rot}:</strong> ${txt}`;
  const cmp = (a,b)=>`${ant}: ${b} (${relDif(a,b)}).`;
  const f = [];
  f.push(L('Contatos', `${A.contatos}, sendo ${A.cliente} do cliente e ${A.nos} nossos. ${cmp(A.contatos,B.contatos)}`));
  f.push(L('Agendados', `${relPl(A.consultas,'consulta','consultas')}, ${relPl(A.acompanhamentos,'acompanhamento','acompanhamentos')} e ${relPl(A.cirurgias,'cirurgia','cirurgias')}. ${ant}: ${B.consultas}, ${B.acompanhamentos} e ${B.cirurgias}.`));
  f.push(L('Realizados', `${A.realizados}. ${cmp(A.realizados,B.realizados)}`));
  f.push(L('Desmarques', `${A.desmarques}. ${cmp(A.desmarques,B.desmarques)}`));
  let nao = `${A.naoAgendaram}`;
  if(A.naoAgendaram) nao += `, sendo ${A.naoCons} de consulta, ${A.naoAcomp} de acompanhamento, ${A.naoCir} de cirurgia${A.naoOutros?` e ${A.naoOutros} sem tipo`:''}`;
  nao += `. ${cmp(A.naoAgendaram,B.naoAgendaram)}`;
  f.push(L('Não agendaram', nao));
  const top = relTopMotivos(A,3);
  if(top.length) f.push(L('Principais motivos', top.map(([m,n])=>`${m} (${n})`).join(', ')+'.'));
  return f;
}
function relSanitiza(html){
  const doc = new DOMParser().parseFromString('<div>'+(html||'')+'</div>','text/html');
  const ok = ['B','STRONG','U','I','BR','DIV','P','SPAN'];
  (function limpa(n){ [...n.childNodes].forEach(c=>{
    if(c.nodeType===1){ if(!ok.includes(c.tagName)){ c.replaceWith(doc.createTextNode(c.textContent)); return; } const fs = c.tagName==='SPAN' ? (c.getAttribute('style')||'').match(/font-size:\s*(\d{1,2})px/) : null; [...c.attributes].forEach(at=>c.removeAttribute(at.name)); if(fs) c.setAttribute('style','font-size:'+fs[1]+'px'); limpa(c); }
  }); })(doc.body.firstChild);
  return doc.body.firstChild.innerHTML;
}
function relTabelaMeses(P){
  const meses=[]; let mk=P.mesRef; for(let i=0;i<6;i++){ meses.unshift(mk); mk=metaStepMonth(mk,-1); }
  const M = meses.map(m=>metricasPeriodo(m+'-01', ultimoDiaMes(m)));
  const top5 = relTopMotivos(metricasPeriodo(P.ini,P.fim),5).map(x=>x[0]);
  const cel = (i,v)=>`<td class="${meses[i]===P.mesRef?'cur':''}">${v}</td>`;
  const linha = (n,fn,cls)=>`<tr class="${cls||''}"><td>${n}</td>${M.map((x,i)=>cel(i,fn(x))).join('')}</tr>`;
  const sec = n=>`<tr class="sec"><td colspan="${meses.length+1}">${n}</td></tr>`;
  const temOutros = M.some(x=>x.naoOutros>0);
  return `<table class="rel-tab"><thead><tr><th>Indicador</th>${meses.map(m=>`<th class="${m===P.mesRef?'cur':''}">${MESES_ABREV[+m.slice(5)-1]}/${m.slice(2,4)}</th>`).join('')}</tr></thead><tbody>
    ${linha('Total de contatos',x=>x.contatos)}
    ${sec('Agendados')}
    ${linha('Consultas',x=>x.consultas)}${linha('Acompanhamentos',x=>x.acompanhamentos)}${linha('Cirurgias',x=>x.cirurgias)}
    ${sec('Desmarques')}
    ${linha('Desmarques e cancelamentos',x=>x.desmarques)}
    ${sec('Não agendados')}
    ${linha('Consultas',x=>x.naoCons)}${linha('Acompanhamentos',x=>x.naoAcomp)}${linha('Cirurgias',x=>x.naoCir)}${temOutros?linha('Sem tipo',x=>x.naoOutros):''}
    ${top5.length?sec('Principais motivos de não agendamento'):''}
    ${top5.map(mo=>linha(mo,x=>x.motivosNao[mo]||0,'mot')).join('')}
  </tbody></table>`;
}

  if(ed){
    let t, hist=[], ultimoDigito=0;
    const salva = ()=>{ DB.relatObs = DB.relatObs||{}; DB.relatObs[ed.dataset.key] = {html: relSanitiza(ed.innerHTML), size:15}; saveDB(); };
    const snap = ()=>{ const h=ed.innerHTML; if(hist[hist.length-1]!==h){ hist.push(h); if(hist.length>5) hist.shift(); } };
    ed.addEventListener('beforeinput', ()=>{ const agora=Date.now(); if(agora-ultimoDigito>1000) snap(); ultimoDigito=agora; });
    ed.addEventListener('input', ()=>{ clearTimeout(t); t=setTimeout(salva, 600); });
    ed.addEventListener('blur', ()=>{ clearTimeout(t); salva(); });
    const selecaoNoEditor = ()=>{ const sel=window.getSelection(); if(!sel.rangeCount || sel.isCollapsed) return null; const r=sel.getRangeAt(0); return ed.contains(r.commonAncestorContainer) ? sel : null; };

      b.addEventListener('mousedown', e=>e.preventDefault());
      b.addEventListener('click', ()=>{
        const k=b.dataset.relfmt;
        if(k==='desfazer'){ if(!hist.length){ toast('Nada para desfazer'); return; } ed.innerHTML = hist.pop(); salva(); return; }
        if(k==='limpar'){ if(!ed.textContent.trim()){ return; } snap(); ed.innerHTML=''; salva(); toast('Texto apagado. Use Desfazer para voltar'); return; }
        if(!selecaoNoEditor()){ toast('Selecione o trecho do texto primeiro'); return; }
        snap();

        else if(k==='underline') document.execCommand('underline');

          const sl=window.getSelection(), r=sl.getRangeAt(0);
          const baseEl = r.startContainer.nodeType===3 ? r.startContainer.parentElement : r.startContainer;
          const base = parseFloat(getComputedStyle(baseEl).fontSize)||15;
          const novo = k==='mais' ? Math.min(32,base+2) : (k==='menos' ? Math.max(10,base-2) : 15);
          const frag = r.extractContents();
          frag.querySelectorAll('span[style]').forEach(x=>x.style.removeProperty('font-size'));
          let sp = document.createElement('span'); sp.style.fontSize = Math.round(novo)+'px'; sp.appendChild(frag);
          r.insertNode(sp);
          while(sp.parentElement && sp.parentElement.tagName==='SPAN' && sp.parentElement!==ed && sp.parentElement.childNodes.length===1){ const par=sp.parentElement; par.style.fontSize=sp.style.fontSize; par.replaceChildren(...sp.childNodes); sp=par; }
          ed.querySelectorAll('span').forEach(x=>{ if(!x.style.cssText) x.replaceWith(...x.childNodes); });
          ed.normalize();
          const nr=document.createRange(); nr.selectNodeContents(sp); sl.removeAllRanges(); sl.addRange(nr);
        }
        salva();
      });
    });
  }

  document.getElementById('relatSemInput')?.addEventListener('change', e=>{ if(e.target.value){ relatSemana=segundaDe(e.target.value); render(); } });

      <div class="field"><label>Título *</label><input name="titulo" required value="${rel?.titulo||''}"></div>
      <div class="field-row">
        <div class="field"><label>Tipo</label><select name="tipo">
          <option ${(!rel||rel.tipo==='Semanal')?'selected':''}>Semanal</option>
          <option ${rel?.tipo==='Mensal'?'selected':''}>Mensal</option>
        </select></div>
        <div class="field"><label>Data de referência</label><input type="date" name="data" value="${rel?.data||todayISO()}"></div>
      </div>
      <div class="field"><label>Anotações *</label><textarea name="texto" required style="min-height:220px;">${rel?.texto||''}</textarea></div>
      <div class="field">
        <label>Links úteis (opcional)</label>
        <div id="relLinksList"></div>
        <button type="button" class="btn btn-secondary btn-sm" id="relAddLinkBtn" style="margin-top:8px;">${ICONS.plus} Adicionar link</button>
      </div>
    </form>`,
    `<div style="display:flex; gap:10px; width:100%; justify-content:space-between;">
      <div>${editing?`<button type="button" class="btn btn-danger" id="delRelatorio">${ICONS.trash} Excluir</button>`:''}</div>
      <div style="display:flex; gap:10px;"><button class="btn btn-secondary" id="modalCancel">Cancelar</button><button class="btn btn-primary" id="modalSave">${editing?'Salvar':'Criar'}</button></div>
    </div>`);
  openModal(html);
  bindModalClose();
  function renderLinks(){
    const cont = document.getElementById('relLinksList');
    cont.innerHTML = links.map(l=>`
      <div style="display:flex; gap:6px; margin-bottom:6px; align-items:center;">
        <input data-link-nome="${l.id}" placeholder="Nome do botão (ex: Site da faculdade)" value="${l.nome||''}" style="flex:1;">
        <input data-link-url="${l.id}" placeholder="https://..." value="${l.url||''}" style="flex:2;">
        <button type="button" class="icon-btn" data-link-del="${l.id}">${ICONS.x}</button>
      </div>`).join('') || `<div class="hint">Nenhum link adicionado ainda.</div>`;
    cont.querySelectorAll('[data-link-nome]').forEach(el=>el.addEventListener('input', e=>{
      const l = links.find(x=>x.id===el.dataset.linkNome); if(l) l.nome=e.target.value;
    }));
    cont.querySelectorAll('[data-link-url]').forEach(el=>el.addEventListener('input', e=>{
      const l = links.find(x=>x.id===el.dataset.linkUrl); if(l) l.url=e.target.value;
    }));
    cont.querySelectorAll('[data-link-del]').forEach(el=>el.addEventListener('click', ()=>{
      links = links.filter(x=>x.id!==el.dataset.linkDel); renderLinks();
    }));
  }
  renderLinks();
  document.getElementById('relAddLinkBtn').addEventListener('click', ()=>{
    links.push({id:uid(), nome:'', url:''}); renderLinks();
  });
  document.getElementById('modalSave').addEventListener('click', ()=>{
    const f = document.getElementById('formRelatorio');
    if(!f.reportValidity()) return;
    const data = Object.fromEntries(new FormData(f));
    const linksValidos = links.filter(l=>l.nome && l.nome.trim() && l.url && l.url.trim()).map(l=>({...l, url: /^https?:\/\//i.test(l.url.trim()) ? l.url.trim() : 'https://'+l.url.trim()}));
    data.links = linksValidos;
    if(editing){
      Object.assign(rel, data);
      logAction(`editou o relatório "${rel.titulo}"`);
      toast('Relatório atualizado');
    } else {
      DB.relatorios = DB.relatorios||[];
      DB.relatorios.push({id:uid(), ...data, criadoPor:getCurrentUser(), criadoEm:new Date().toISOString()});
      logAction(`criou o relatório "${data.titulo}"`);
      toast('Relatório criado');
    }
    saveDB(); closeModal(); closeDrawer(); render();
  });
  if(editing){
    document.getElementById('delRelatorio').addEventListener('click', ()=>{
      confirmDialog('Excluir relatório?','Esta ação não pode ser desfeita.', ()=>{
        DB.relatorios = (DB.relatorios||[]).filter(x=>x.id!==rel.id);
        logAction(`excluiu o relatório "${rel.titulo}"`);
        saveDB(); closeModal(); closeDrawer(); render(); toast('Relatório excluído');
      });
    });
  }
}
function openRelatorioDrawer(relId){
  const rel = (DB.relatorios||[]).find(x=>x.id===relId); if(!rel) return;
  openDrawer(`
    <div class="drawer-head">
      <div><h2>${rel.titulo}</h2><div class="drawer-sub">${rel.tipo} · ${fmtDate(rel.data)}</div></div>
      <button class="icon-btn" id="drawerClose">${ICONS.x}</button>
    </div>
    <div class="drawer-body">
      <p style="font-size:13.5px; white-space:pre-wrap; line-height:1.6;">${rel.texto||''}</p>
      ${(rel.links||[]).length?`<div style="display:flex; flex-wrap:wrap; gap:8px; margin-top:16px;">
        ${rel.links.map(l=>`<a href="${l.url}" target="_blank" rel="noopener" class="btn btn-secondary btn-sm" style="text-decoration:none;">${ICONS.download} ${l.nome}</a>`).join('')}
      </div>`:''}
      <button class="btn btn-primary btn-sm" data-edit-relatorio="${rel.id}" style="margin-top:16px;">${ICONS.edit} Editar</button>

}

   AVALIAÇÕES (Google)
========================================================= */
let avaliacoesFiltro = '';
function perguntarAvaliacao(nf){
  const t = tutorById(nf.tutorId);
  const nome = nf.usarDadosTutor===false ? (nf.nomeAlternativo||'cliente') : (t?.nome||'cliente');
  const html = modalShell('Avaliação no Google', `<p style="font-size:14px;">Pedir para ${nome} avaliar a clínica no Google?</p>`,
    `<button class="btn btn-secondary" id="btnAvalNao">Não</button><button class="btn btn-primary" id="btnAvalSim">Sim</button>`);
  openModal(html, {narrow:true});
  document.getElementById('modalClose').addEventListener('click', closeModal);
  document.getElementById('btnAvalNao').addEventListener('click', closeModal);
  document.getElementById('btnAvalSim').addEventListener('click', ()=>{
    perguntarStatusPedido(nf.tutorId, nf.animalId, nf.id);
  });
}
function perguntarStatusPedido(tutorId, animalId, nfId){
  const html = modalShell('Avaliação no Google', `<p style="font-size:14px;">Você já pediu, ou vai pedir depois?</p>`,
    `<button class="btn btn-secondary" id="btnVouPedir">Vou pedir</button><button class="btn btn-primary" id="btnJaPedi">Já pedi</button>`);
  openModal(html, {narrow:true});
  document.getElementById('modalClose').addEventListener('click', closeModal);
  document.getElementById('btnVouPedir').addEventListener('click', ()=>{
    salvarAvaliacao({tutorId, animalId, nfId, status:'Vou pedir', avaliou:null});
    closeModal(); toast('Anotado, você pode atualizar depois em Avaliações');
  });
  document.getElementById('btnJaPedi').addEventListener('click', ()=>{
    closeModal();
    perguntarSeAvaliou(tutorId, animalId, nfId);
  });
}
function perguntarSeAvaliou(tutorId, animalId, nfId, avaliacaoId){
  const html = modalShell('Avaliação no Google', `<p style="font-size:14px;">O cliente já avaliou?</p>`,
    `<button class="btn btn-secondary" id="btnNaoAvaliou">Ainda não</button><button class="btn btn-primary" id="btnSimAvaliou">Sim, avaliou</button>`);
  openModal(html, {narrow:true});
  document.getElementById('modalClose').addEventListener('click', closeModal);
  document.getElementById('btnNaoAvaliou').addEventListener('click', ()=>{
    salvarAvaliacao({id:avaliacaoId, tutorId, animalId, nfId, status:'Já pedi', avaliou:false});
    closeModal(); toast('Anotado'); render();
  });
  document.getElementById('btnSimAvaliou').addEventListener('click', ()=>{
    const link = prompt('Link da avaliação no Google (opcional):', '');
    salvarAvaliacao({id:avaliacaoId, tutorId, animalId, nfId, status:'Já pedi', avaliou:true, link: link?link.trim():''});
    closeModal(); toast('Que ótimo! Anotado'); render();
  });
}
function salvarAvaliacao(dadosNovos){
  DB.avaliacoes = DB.avaliacoes||[];
  if(dadosNovos.id){
    const existente = DB.avaliacoes.find(x=>x.id===dadosNovos.id);
    if(existente){ Object.assign(existente, dadosNovos, {alteradoEm:new Date().toISOString()}); saveDB(); return; }
  }
  const {id, ...resto} = dadosNovos; // remove id ausente/undefined pra não sobrescrever o novo id gerado abaixo
  DB.avaliacoes.push({id:uid(), data:todayISO(), criadoPor:getCurrentUser(), criadoEm:new Date().toISOString(), ...resto});
  logAction(`registrou pedido de avaliação (${dadosNovos.status})`);
  saveDB();
}
function renderAvaliacoes(){
  let list = (DB.avaliacoes||[]).slice();
  if(avaliacoesFiltro==='vouPedir') list = list.filter(a=>a.status==='Vou pedir');
  if(avaliacoesFiltro==='aguardando') list = list.filter(a=>a.status==='Já pedi' && a.avaliou===null);
  if(avaliacoesFiltro==='avaliou') list = list.filter(a=>a.avaliou===true);
  if(avaliacoesFiltro==='naoAvaliou') list = list.filter(a=>a.avaliou===false);
  list.sort((a,b)=>(b.criadoEm||'').localeCompare(a.criadoEm||''));
  const total = (DB.avaliacoes||[]).length;
  const avaliaram = (DB.avaliacoes||[]).filter(a=>a.avaliou===true).length;
  const pendentes = (DB.avaliacoes||[]).filter(a=>a.status==='Já pedi' && a.avaliou===null).length;
  const todasAv = DB.avaliacoes||[];
  const contAv = {'':todasAv.length, vouPedir:todasAv.filter(a=>a.status==='Vou pedir').length, aguardando:pendentes, avaliou:avaliaram, naoAvaliou:todasAv.filter(a=>a.avaliou===false).length};
  const taxaAv = total ? Math.round(avaliaram/total*100) : 0;
  return `
  <div class="grid g3" style="margin-bottom:16px;">
    ${statCard('Total de pedidos', total, 'var(--brown)')}
    ${statCard('Avaliaram', avaliaram, 'var(--st-realizado)', total?`${taxaAv}% dos pedidos viraram avaliação`:'')}
    ${statCard('Aguardando resposta', pendentes, 'var(--st-aguardando)')}
  </div>
  <div class="view-head">
    <div class="filters" style="margin-bottom:0;">
<div style="display:flex; gap:6px; flex-wrap:wrap;">
      ${[['','Todos'],['vouPedir','Vou pedir'],['aguardando','Aguardando resposta'],['avaliou','Avaliou'],['naoAvaliou','Não avaliou']].map(([v,l])=>`<button class="chip-btn ${avaliacoesFiltro===v?'on':''}" data-avalchip="${v}">${l} <span style="opacity:.7;">${contAv[v]}</span></button>`).join('')}
      </div>
    </div>
    <button class="btn btn-primary" id="novaAvaliacao">${ICONS.plus} Nova avaliação</button>
  </div>
  <div class="card">
    ${list.length? `<div class="table-wrap"><table><thead><tr><th>Data</th><th>Tutor</th><th>Animal</th><th>Status</th><th>Avaliou?</th><th>Observações</th></tr></thead><tbody>
      ${list.map(a=>`
        <tr>
          <td>${fmtDate(a.data)}</td>
          <td>${tutorById(a.tutorId)?.nome||'—'}</td>
          <td>${a.animalId?(animalById(a.animalId)?.nome||'—'):'—'}</td>
          <td><span class="pill-muted">${a.status}</span></td>
          <td>
            ${a.status==='Vou pedir'?`<button class="btn btn-secondary btn-sm" data-marcar-ja-pedi="${a.id}">Marcar "Já pedi"</button>`
              : a.avaliou===null?`<div style="display:flex; gap:6px;"><button class="btn btn-secondary btn-sm" data-marcar-avaliou="${a.id}" data-valor="nao">Ainda não</button><button class="btn btn-primary btn-sm" data-marcar-avaliou="${a.id}" data-valor="sim">Avaliou</button></div>`
              : a.avaliou? `<div style="display:flex; align-items:center; gap:8px;"><span class="badge st-Realizado">Sim</span>${a.link?`<a href="${a.link}" target="_blank" rel="noopener" style="font-size:12px;">Ver avaliação</a>`:`<button class="btn btn-secondary btn-sm" data-add-link-avaliacao="${a.id}">+ Link</button>`}</div>` : `<span class="badge st-Cancelado">Não</span>`}
          </td>
          <td style="max-width:180px;">
            <div style="display:flex; align-items:center; gap:6px;">
              <span style="overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--ink-soft); font-size:12.5px;" title="${(a.observacoes||'').replace(/"/g,'&quot;')}">${a.observacoes||'—'}</span>
              <button class="icon-btn" data-edit-obs-avaliacao="${a.id}" title="Editar observação">${ICONS.edit}</button>
            </div>
          </td>
        </tr>`).join('')}
    </tbody></table></div>` : `<div class="pad">${emptyState('Nenhum pedido de avaliação ainda','Depois de criar uma nota fiscal, o sistema pergunta se quer pedir avaliação, ou clique em "Nova avaliação" aqui.')}</div>`}
  </div>`;
}
function formAvaliacao(){
  const html = modalShell('Nova avaliação', `
    <form id="formAvaliacao">
      <div class="field"><label>Tutor *</label>
        <select name="tutorId" id="avalTutorSel" required><option value="">— selecione —</option>${DB.tutores.map(t=>`<option value="${t.id}">${t.nome}</option>`).join('')}</select>
      </div>
      <div class="field"><label>Animal (opcional)</label>
        <select name="animalId" id="avalAnimalSel"><option value="">—</option></select>
      </div>
    </form>`,
    `<button class="btn btn-secondary" id="modalCancel">Cancelar</button><button class="btn btn-primary" id="modalSave">Continuar</button>`);
  openModal(html, {narrow:true});
  bindModalClose();
  document.getElementById('avalTutorSel').addEventListener('change', e=>{
    const tid = e.target.value;
    document.getElementById('avalAnimalSel').innerHTML = `<option value="">—</option>` + (tid?animaisDoTutor(tid):[]).map(a=>`<option value="${a.id}">${a.nome}</option>`).join('');
  });
  document.getElementById('modalSave').addEventListener('click', ()=>{
    const f = document.getElementById('formAvaliacao');
    if(!f.reportValidity()) return;
    const data = Object.fromEntries(new FormData(f));
    if(!data.animalId) delete data.animalId;
    closeModal();
    perguntarStatusPedido(data.tutorId, data.animalId, null);
  });
}

/* =========================================================
   ANOTAÇÕES (livres, por dia)
========================================================= */
function renderPendencias(){
  const dataRef = state.dash.granularity==='dia' ? state.dash.refDate : todayISO();
  if(state.dash.granularity!=='dia'){ state.dash.granularity='dia'; state.dash.refDate=dataRef; }
  const entrada = (DB.pendencias||[]).find(p=>p.data===dataRef);
  const busca = (pendenciasBusca||'').trim().toLowerCase();
  let outrosDias = (DB.pendencias||[]).filter(p=>p.data!==dataRef && p.texto && stripHtml(p.texto).trim());
  if(busca) outrosDias = outrosDias.filter(p=>stripHtml(p.texto).toLowerCase().includes(busca));
  if(pendenciasFiltroDe) outrosDias = outrosDias.filter(p=>p.data>=pendenciasFiltroDe);
  if(pendenciasFiltroAte) outrosDias = outrosDias.filter(p=>p.data<=pendenciasFiltroAte);
  outrosDias = outrosDias.sort((a,b)=>b.data.localeCompare(a.data)).slice(0,30);
  return `
  ${renderDashNav(true)}
  <div class="grid" style="grid-template-columns:2fr 1fr; gap:16px; align-items:start;">
    <div class="card pad">
      <div class="section-title" style="justify-content:space-between;">
        <span>${fmtDateLong(dataRef)}</span>
        <span class="hint" id="pendenciasSalvoIndicador">${entrada?.alteradoEm?'Salvo às '+new Date(entrada.alteradoEm).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}):''}</span>
      </div>
      <div style="display:flex; gap:4px; margin-bottom:8px; border-bottom:1px solid var(--line); padding-bottom:8px; flex-wrap:wrap; align-items:center;">
        <button type="button" class="icon-btn" id="pendenciasBoldBtn" title="Negrito" style="font-weight:800;">B</button>
        <button type="button" class="icon-btn" id="pendenciasItalicBtn" title="Itálico" style="font-style:italic; font-weight:700;">I</button>
        <button type="button" class="icon-btn" id="pendenciasUnderlineBtn" title="Sublinhado" style="text-decoration:underline; font-weight:700;">S</button>
        <button type="button" class="icon-btn" id="pendenciasFontIncBtn" title="Aumentar letra" style="font-weight:800;">A+</button>
        <button type="button" class="icon-btn" id="pendenciasFontDecBtn" title="Diminuir letra" style="font-weight:800; font-size:11px;">A-</button>
        <label class="icon-btn" title="Cor do texto" style="cursor:pointer; padding:4px;">
          ${ICONS.sparkle}<input type="color" id="pendenciasColorInput" style="width:0; height:0; opacity:0; position:absolute;">
        </label>
        <span style="width:1px; height:20px; background:var(--line); margin:0 2px;"></span>
        <button type="button" class="icon-btn" id="pendenciasResetBtn" title="Limpar formatação (voltar ao padrão)" style="font-size:11px; font-weight:700;">Limpar</button>
      </div>
      <div id="pendenciasTextarea" contenteditable="true" data-placeholder="Escreva aqui qualquer coisa sobre o dia ${fmtDate(dataRef)}…" style="min-height:380px; padding:6px 2px; font-size:14.5px; line-height:1.7; outline:none;">${entrada?.texto||''}</div>
      <div style="border-top:1px solid var(--line); margin-top:14px; padding-top:14px; display:flex; gap:8px; flex-wrap:wrap; justify-content:space-between;">
        <button type="button" class="btn btn-primary btn-sm" id="pendenciasSalvarBtn">${ICONS.check} Salvar alterações</button>
        <button type="button" class="btn btn-danger btn-sm" id="pendenciasExcluirBtn" ${entrada?'':'disabled'}>${ICONS.trash} Excluir toda a anotação deste dia</button>
      </div>
    </div>
    <div class="card pad">
      <div class="section-title">Outros dias com anotação</div>
      <div class="search-input" style="margin-bottom:10px;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <input id="pendenciasBuscaInput" placeholder="Buscar palavra-chave em anotações antigas…" value="${pendenciasBusca||''}">
      </div>
      <div style="display:flex; gap:8px; align-items:end; margin-bottom:12px; flex-wrap:wrap;">
        <div class="field" style="margin:0; flex:1; min-width:110px;"><label style="font-size:11px;">De</label><input type="date" id="pendenciasFiltroDeInput" value="${pendenciasFiltroDe||''}"></div>
        <div class="field" style="margin:0; flex:1; min-width:110px;"><label style="font-size:11px;">Até</label><input type="date" id="pendenciasFiltroAteInput" value="${pendenciasFiltroAte||''}"></div>
        ${(pendenciasFiltroDe||pendenciasFiltroAte)?`<button type="button" class="icon-btn" id="pendenciasFiltroLimparBtn" title="Limpar filtro de datas">${ICONS.x}</button>`:''}
      </div>
      ${outrosDias.length? outrosDias.map(p=>`
        <div class="pend-row rowlink" data-ir-dia="${p.data}">
          <span class="pend-dot"></span>
          <span><strong>${fmtDate(p.data)}</strong> — ${stripHtml(p.texto).replace(/\n/g,' ').slice(0,40)}${stripHtml(p.texto).length>40?'…':''}</span>
        </div>`).join('') : `<div class="hint">${(busca||pendenciasFiltroDe||pendenciasFiltroAte)?'Nenhuma anotação encontrada com esses filtros.':'Nenhuma outra anotação ainda.'}</div>`}
    </div>
  </div>`;
}

function openModal(html, {narrow=false}={}){
  const root = document.getElementById('modalRoot');
  root.innerHTML = `<div class="modal-backdrop" id="modalBackdrop"><div class="modal ${narrow?'narrow':''}">${html}</div></div>`;
  document.getElementById('modalBackdrop').addEventListener('mousedown', e=>{ if(e.target.id==='modalBackdrop') closeModal(); });
}
function closeModal(){ document.getElementById('modalRoot').innerHTML=''; }

function modalShell(title, bodyHtml, footHtml){
  return `
    <div class="modal-head"><h3>${title}</h3><button class="icon-btn" id="modalClose">${ICONS.x}</button></div>
    <div class="modal-body">${bodyHtml}</div>
    <div class="modal-foot">${footHtml}</div>`;
}

function normalizePhone(p){ return (p||'').replace(/\D/g,''); }
function findPossibleDuplicateTutor(nome, telefone){
  const ph = normalizePhone(telefone);
  return DB.tutores.filter(t=> ph && ph.length>=8 && (normalizePhone(t.telefone)===ph || normalizePhone(t.telefone2)===ph));
}
function showDuplicateTutorWarning(dups, data, onCreated, animaisExtras){
  const html = modalShell('Já existe um cadastro parecido', `
    <p style="font-size:13.5px; color:var(--ink-soft); margin-bottom:12px;">Encontramos ${dups.length>1?'tutores':'um tutor'} com o mesmo telefone. É a mesma pessoa?</p>
    <div style="display:flex; flex-direction:column; gap:8px; margin-bottom:6px;">
      ${dups.map(t=>`<div class="insight" style="cursor:pointer;" data-view-dup="${t.id}"><div class="dot"></div><div><strong>${t.nome}</strong> — ${t.telefone||'sem telefone'} · ${animaisDoTutor(t.id).map(a=>a.nome).join(', ')||'sem animal'}</div></div>`).join('')}
    </div>
    <div class="hint">Clique num nome acima para abrir o cadastro existente (e adicionar o animal lá), ou confirme abaixo que é uma pessoa diferente.</div>
  `, `<button class="btn btn-secondary" id="modalCancel">Cancelar</button><button class="btn btn-danger" id="btnNotDup">Não é, cadastrar mesmo assim</button>`);
  openModal(html);
  document.getElementById('modalClose').addEventListener('click', closeModal);
  document.getElementById('modalCancel').addEventListener('click', closeModal);
  document.querySelectorAll('[data-view-dup]').forEach(el=>el.addEventListener('click', ()=>{
    closeModal(); openTutorDrawer(el.dataset.viewDup);
  }));
  document.getElementById('btnNotDup').addEventListener('click', ()=>{ criarTutorEAnimal(data, onCreated, animaisExtras); });
}
function gerarCodigoTutor(){
  const max = (DB.tutores||[]).reduce((m,t)=>{
    const n = parseInt(String(t.codigo||'').replace(/\D/g,''), 10);
    return isNaN(n) ? m : Math.max(m, n);
  }, 0);
  return String(max+1).padStart(4,'0');
}
function criarTutorEAnimal(data, onCreated, animaisExtras){
  const {animalNome, animalEspecie, animalSexo, ...tutorData} = data;
  const agora = new Date().toISOString();
  const t={id:uid(), codigo:gerarCodigoTutor(), ...tutorData, criadoPor:getCurrentUser(), criadoEm:agora}; DB.tutores.push(t);
  const a={id:uid(), nome:animalNome, especie:animalEspecie, sexo:animalSexo, obito:false, criadoEm:agora};
  DB.animais.push(a);
  DB.vinculos.push({id:uid(), tutorId:t.id, animalId:a.id});
  let nomesExtras = []; const extrasCriados = [];
  (animaisExtras||[]).forEach(extra=>{
    const aExtra={id:uid(), nome:extra.nome, especie:extra.especie||'', sexo:extra.sexo||'', obito:false, criadoEm:agora};
    DB.animais.push(aExtra);
    DB.vinculos.push({id:uid(), tutorId:t.id, animalId:aExtra.id});
    nomesExtras.push(aExtra.nome); extrasCriados.push(aExtra);
  });
  logAction(`cadastrou o tutor ${t.nome} (código ${t.codigo}) com o animal ${a.nome}${nomesExtras.length?' e mais '+nomesExtras.length+' animal(is): '+nomesExtras.join(', '):''}`);
  toast(onCreated ? 'Tutor e animal cadastrados, agora é só marcar o agendamento' : 'Tutor e animal(is) cadastrados');
  saveDB(); closeModal(); render();
  if(onCreated) onCreated(t, a, extrasCriados);
}
function cascadeDeleteAnimal(animal){
  const loteId = uid();
  const vinc = DB.vinculos.filter(v=>v.animalId===animal.id);
  const agsAnimal = DB.agendamentos.filter(a=>a.animalId===animal.id);
  agsAnimal.forEach(a=>moveToTrash('agendamento', a, null, loteId));
  DB.agendamentos = DB.agendamentos.filter(a=>a.animalId!==animal.id);
  const contatosDoAnimal = DB.contatos.filter(c=>c.animalId===animal.id);
  contatosDoAnimal.forEach(c=>moveToTrash('contato', c, null, loteId));
  DB.contatos = DB.contatos.filter(c=>c.animalId!==animal.id);
  const nfsDoAnimal = (DB.notasFiscais||[]).filter(nf=>nf.animalId===animal.id);
  nfsDoAnimal.forEach(nf=>moveToTrash('nf', nf, null, loteId));
  DB.notasFiscais = (DB.notasFiscais||[]).filter(nf=>nf.animalId!==animal.id);
  DB.avaliacoes = (DB.avaliacoes||[]).filter(av=>av.animalId!==animal.id);
  DB.vinculos = DB.vinculos.filter(v=>v.animalId!==animal.id);
  DB.animais = DB.animais.filter(x=>x.id!==animal.id);
  moveToTrash('animal', animal, vinc, loteId);
}
function cascadeDeleteTutor(tutor){
  const loteId = uid();
  const vinc = DB.vinculos.filter(v=>v.tutorId===tutor.id);
  const animalIds = vinc.map(v=>v.animalId);
  const agsDoTutor = DB.agendamentos.filter(a=>a.tutorId===tutor.id);
  agsDoTutor.forEach(a=>moveToTrash('agendamento', a, null, loteId));
  DB.agendamentos = DB.agendamentos.filter(a=>a.tutorId!==tutor.id);
  const contatosDoTutorArr = DB.contatos.filter(c=>c.tutorId===tutor.id);
  contatosDoTutorArr.forEach(c=>moveToTrash('contato', c, null, loteId));
  DB.contatos = DB.contatos.filter(c=>c.tutorId!==tutor.id);
  DB.avaliacoes = (DB.avaliacoes||[]).filter(av=>av.tutorId!==tutor.id);
  const nfsDoTutorArr = (DB.notasFiscais||[]).filter(nf=>nf.tutorId===tutor.id);
  nfsDoTutorArr.forEach(nf=>moveToTrash('nf', nf, null, loteId));
  DB.notasFiscais = (DB.notasFiscais||[]).filter(nf=>nf.tutorId!==tutor.id);
  animalIds.forEach(aid=>{
    const outrosTutores = DB.vinculos.filter(v=>v.animalId===aid && v.tutorId!==tutor.id);
    if(!outrosTutores.length){
      const animal = animalById(aid);
      if(animal){
        const agsAnimal = DB.agendamentos.filter(a=>a.animalId===aid);
        agsAnimal.forEach(a=>moveToTrash('agendamento', a, null, loteId));
        DB.agendamentos = DB.agendamentos.filter(a=>a.animalId!==aid);
        DB.avaliacoes = (DB.avaliacoes||[]).filter(av=>av.animalId!==aid);
        const vincAnimal = DB.vinculos.filter(v=>v.animalId===aid);
        moveToTrash('animal', animal, vincAnimal, loteId);
        DB.animais = DB.animais.filter(x=>x.id!==aid);
      }
    }
  });
  DB.vinculos = DB.vinculos.filter(v=>v.tutorId!==tutor.id);
  DB.tutores = DB.tutores.filter(t=>t.id!==tutor.id);
  // limpa referências de "indicado por este tutor" em contatos/agendamentos que sobraram
  DB.contatos.forEach(c=>{ if(c.indicacaoTutorId===tutor.id) c.indicacaoTutorId=null; });
  DB.agendamentos.forEach(a=>{ if(a.indicacaoTutorId===tutor.id) a.indicacaoTutorId=null; });
  moveToTrash('tutor', tutor, vinc, loteId);
}

  bindModalClose();

  const addExtraRow = ()=>{

          <option value="">Sexo —</option>
          <option value="Macho">Macho</option>
          <option value="Fêmea">Fêmea</option>
        </select></div>
      </div>`;
    list.appendChild(row);
    row.querySelector('[data-remove-animal-extra]').addEventListener('click', ()=>row.remove());
    return row;

  document.getElementById('modalSave').addEventListener('click', ()=>{

    if(!f.reportValidity()) return;

function openLinkAnimalPicker(tutorId){
  const disponiveis = DB.animais.filter(a=>!DB.vinculos.some(v=>v.tutorId===tutorId && v.animalId===a.id));
  const html = modalShell('Vincular animal', `
    <div class="field"><label>Selecionar animal existente</label>
      <select id="pickAnimal"><option value="">— selecione —</option>${disponiveis.map(a=>{
        const tutoresAtuais = tutoresDoAnimal(a.id).map(t=>t.nome);
        const detalhe = [a.especie, tutoresAtuais.length? 'tutor(es): '+tutoresAtuais.join(', ') : 'sem tutor vinculado ainda'].filter(Boolean).join(' · ');
        return `<option value="${a.id}">${a.nome} — ${detalhe}</option>`;
      }).join('')}</select>
    </div>
    <div class="hint">Cuidado: animais costumam repetir nome (ex: "Thor", "Mel"). Confira a espécie e o tutor atual mostrados ao lado antes de vincular.</div>
    <div class="hint" style="margin-top:10px;">Ou cadastre um novo animal já vinculado a este tutor:</div>
    <button class="btn btn-secondary btn-sm" style="margin-top:8px;" id="newAnimalInline">${ICONS.plus} Novo animal</button>
  `, `<button class="btn btn-secondary" id="modalCancel">Cancelar</button><button class="btn btn-primary" id="modalSave">Vincular</button>`);
  openModal(html, {narrow:true});
  bindModalClose(()=>formTutor(tutorById(tutorId)));
  document.getElementById('modalSave').addEventListener('click', ()=>{
    const id = document.getElementById('pickAnimal').value;
    if(!id) return toast('Selecione um animal');
    DB.vinculos.push({id:uid(), tutorId, animalId:id}); saveDB(); toast('Animal vinculado');
    formTutor(tutorById(tutorId));
  });
  document.getElementById('newAnimalInline').addEventListener('click', ()=> formAnimal(null, tutorId));
}

/* ---- Form Animal ---- */
function formAnimal(animal, presetTutorId){
  const editing = !!animal;
  const tutoresAtuais = editing ? tutoresDoAnimal(animal.id) : (presetTutorId?[tutorById(presetTutorId)]:[]);
  const precisaEscolherTutor = !editing && !presetTutorId;
  const html = modalShell(editing?'Editar animal':'Novo animal', `
    <form id="formAnimal">
      <div class="field"><label>Nome do animal *</label><input name="nome" required value="${animal?.nome||''}"></div>
      <div class="field-row">
        <div class="field"><label>Espécie *</label><select name="especie" required>
          <option value="">— selecione —</option>
          <option value="Canina" ${animal?.especie==='Canina'?'selected':''}>Canina</option>
          <option value="Felina" ${animal?.especie==='Felina'?'selected':''}>Felina</option>
          <option value="Equina" ${animal?.especie==='Equina'?'selected':''}>Equina</option>
        </select></div>
        <div class="field"><label>Sexo *</label><select name="sexo" required>
          <option value="">— selecione —</option>
          <option value="Macho" ${animal?.sexo==='Macho'?'selected':''}>Macho</option>
          <option value="Fêmea" ${animal?.sexo==='Fêmea'?'selected':''}>Fêmea</option>
        </select></div>
      </div>
      <div class="field"><label style="display:flex; align-items:center; gap:8px; margin-bottom:0;"><input type="checkbox" name="obito" style="width:auto;" ${animal?.obito?'checked':''}> Animal foi a óbito</label></div>
      ${precisaEscolherTutor?`<div class="field"><label>Tutor *</label>
        <select name="tutorIdNovo" id="animalTutorNovo" required>
          <option value="">— selecione um tutor —</option>
          ${DB.tutores.map(t=>`<option value="${t.id}">${t.nome}</option>`).join('')}
        </select>
        <div class="hint">Todo animal precisa estar vinculado a um tutor. Se o tutor ainda não existe, ${DB.tutores.length?'':'cadastre-o primeiro em "+ Tutor": '}<button type="button" class="btn btn-ghost btn-sm" id="novoTutorInline" style="padding:2px 4px; text-decoration:underline;">cadastre um tutor novo</button>.</div>
      </div>`:''}
      <div class="field"><label>Observações</label><textarea name="obs">${animal?.obs||''}</textarea></div>
      ${editing?`<div class="field"><label>Tutor(es)</label>
        <div class="chip-list" id="animalTutoresChips">${tutoresAtuais.filter(Boolean).map(t=>`<span class="chip">${t.nome}<button type="button" data-unlink-tutor="${t.id}">${ICONS.x}</button></span>`).join('')||'<span class="hint">Nenhum tutor vinculado ainda.</span>'}</div>
        <button type="button" class="btn btn-secondary btn-sm" id="linkTutorBtn" style="margin-top:10px;">${ICONS.plus} Vincular tutor existente</button>
      </div>`:''}
    </form>`,
    `<div style="display:flex; gap:10px; width:100%; justify-content:space-between;">
      <div>${editing?`<button type="button" class="btn btn-danger" id="delAnimal">${ICONS.trash} Excluir</button>`:''}</div>
      <div style="display:flex; gap:10px;"><button class="btn btn-secondary" id="modalCancel">Cancelar</button><button class="btn btn-primary" id="modalSave">${editing?'Salvar':'Cadastrar'}</button></div>
    </div>`);
  openModal(html);
  bindModalClose();
  document.getElementById('novoTutorInline')?.addEventListener('click', ()=>{
    const nomeDigitado = document.querySelector('#formAnimal [name="nome"]')?.value.trim() || '';
    closeModal();
    formTutor(null, {animalNome: nomeDigitado});
  });
  document.getElementById('modalSave').addEventListener('click', ()=>{
    const f = document.getElementById('formAnimal');
    if(!f.reportValidity()) return;
    const data = Object.fromEntries(new FormData(f));
    data.obito = f.querySelector('[name="obito"]') ? f.querySelector('[name="obito"]').checked : (animal?.obito||false);
    const tutorEscolhido = presetTutorId || data.tutorIdNovo;
    if(!editing && !tutorEscolhido){ toast('Selecione o tutor deste animal'); return; }
    delete data.tutorIdNovo;
    let id;
    if(editing){ const eraObito=animal.obito; Object.assign(animal, data); id=animal.id; logAction(`alterou o cadastro do animal ${animal.nome}${(!eraObito&&data.obito)?' (registrado óbito)':''}`); toast('Animal atualizado'); }
    else{ id=uid(); const a={id, ...data, criadoEm:new Date().toISOString()}; DB.animais.push(a); DB.vinculos.push({id:uid(), tutorId:tutorEscolhido, animalId:id}); logAction(`cadastrou o animal ${a.nome}`); toast('Animal cadastrado'); }
    saveDB(); closeModal(); render();
  });
  document.getElementById('linkTutorBtn')?.addEventListener('click', ()=>{
    if(!editing){ toast('Salve o animal primeiro para vincular outros tutores'); return; }
    openLinkTutorPicker(animal.id);
  });
  document.querySelectorAll('[data-unlink-tutor]').forEach(b=>b.addEventListener('click', ()=>{
    DB.vinculos = DB.vinculos.filter(v=>!(v.animalId===animal.id && v.tutorId===b.dataset.unlinkTutor));
    saveDB(); formAnimal(animal);
  }));
  if(editing){
    document.getElementById('delAnimal')?.addEventListener('click', ()=>{
      const agCount = agendamentosDoAnimal(animal.id).length;
      const ctCount = DB.contatos.filter(c=>c.animalId===animal.id).length;
      confirmDialog('Excluir animal?', `O animal vai para a Lixeira${agCount?`, junto com ${agCount} agendamento(s) vinculado(s)`:''}${ctCount?`${agCount?' e':', junto com'} ${ctCount} contato(s) vinculado(s)`:''}.`, ()=>{
        cascadeDeleteAnimal(animal);
        logAction(`excluiu o animal ${animal.nome} com agendamentos vinculados`);
        saveDB(); closeModal(); closeDrawer(); render(); toast('Animal movido para a Lixeira');
      });
    });
  }
}
function openLinkTutorPicker(animalId){
  const disponiveis = DB.tutores.filter(t=>!DB.vinculos.some(v=>v.animalId===animalId && v.tutorId===t.id));
  const html = modalShell('Vincular tutor', `
    <div class="field"><label>Selecionar tutor existente</label>
      <select id="pickTutor"><option value="">— selecione —</option>${disponiveis.map(t=>`<option value="${t.id}">${t.nome}${t.telefone?' — '+t.telefone:''}</option>`).join('')}</select>
    </div>
    <div class="hint">Confira o telefone ao lado do nome pra não vincular o tutor errado, caso dois tenham nome parecido.</div>`, `<button class="btn btn-secondary" id="modalCancel">Cancelar</button><button class="btn btn-primary" id="modalSave">Vincular</button>`);
  openModal(html, {narrow:true});
  bindModalClose(()=>formAnimal(animalById(animalId)));
  document.getElementById('modalSave').addEventListener('click', ()=>{
    const id = document.getElementById('pickTutor').value;
    if(!id) return toast('Selecione um tutor');
    DB.vinculos.push({id:uid(), tutorId:id, animalId}); saveDB(); toast('Tutor vinculado');
    formAnimal(animalById(animalId));
  });
}

function cidadeClinicaFieldsHtml(idPrefix, obj){
  const cidade = obj?.cidade || '';

  return `

      <div class="field"><label>Cidade</label>
        <select name="cidade" id="${idPrefix}CidadeSel">
          <option value="">— selecione —</option>
          ${Object.keys(DB.cidadesClinicas).map(c=>`<option ${cidade===c?'selected':''}>${c}</option>`).join('')}
        </select>
      </div>
      <div class="field"><label>Clínica</label>
        <select name="clinica" id="${idPrefix}ClinicaSel">
          <option value="">${cidade?'— selecione —':'selecione a cidade primeiro'}</option>
          ${(DB.cidadesClinicas[cidade]||[]).map(c=>`<option ${clinica===c?'selected':''}>${c}</option>`).join('')}
        </select>
      </div>
    </div>`;
}
function wireCidadeClinicaFields(idPrefix){
  const sel = document.getElementById(idPrefix+'CidadeSel');
  if(!sel) return;
  sel.addEventListener('change', ()=>{
    const cidade = sel.value;
    const clinicaSel = document.getElementById(idPrefix+'ClinicaSel');
    clinicaSel.innerHTML = `<option value="">${cidade?'— selecione —':'selecione a cidade primeiro'}</option>` + (DB.cidadesClinicas[cidade]||[]).map(c=>`<option>${c}</option>`).join('');
  });
}
function autoFillCidadeClinica(idPrefix, tutorId){
  const t = tutorById(tutorId);
  if(!t || !t.cidade) return;
  const cidadeSel = document.getElementById(idPrefix+'CidadeSel');
  const clinicaSel = document.getElementById(idPrefix+'ClinicaSel');
  if(!cidadeSel || !clinicaSel) return;
  cidadeSel.value = t.cidade;
  clinicaSel.innerHTML = `<option value="">— selecione —</option>` + (DB.cidadesClinicas[t.cidade]||[]).map(c=>`<option ${t.clinica===c?'selected':''}>${c}</option>`).join('');
}

    }

  function atualizarOutrosAnimais(){

    const outros = tid ? animaisDoTutor(tid).filter(a=>a.id!==animalPrincipal && !a.obito) : [];

  document.getElementById('agTutorSel').addEventListener('change', e=>{
    const tid = e.target.value; const animais = (tid?animaisDoTutor(tid):DB.animais).filter(a=>!a.obito);
    document.getElementById('agAnimalSel').innerHTML = `<option value="">— selecione —</option>` + animais.map(a=>`<option value="${a.id}">${a.nome}</option>`).join('');
    if(!editing) autoFillCidadeClinica('ag', tid);

    mostrarHistoricoContatoAg(tid);

  if(!editing && tutorSel) autoFillCidadeClinica('ag', tutorSel);

  document.getElementById('agAddProfissionalBtn')?.addEventListener('click', ()=>{
    const nome = prompt('Nome do profissional:', '');
    if(!nome || !nome.trim()) return;

    const tipoAtual = document.getElementById('agTipoSel').value;
    const row = document.createElement('div');
    row.className = 'field-row';
    row.style.marginTop = '6px';
    row.innerHTML = `<div class="field" style="flex:1;"><input data-animal-avulso-extra-nome placeholder="Nome do animal"></div>

    const data = Object.fromEntries(new FormData(f));
    if(!data.indicacaoTutorId) delete data.indicacaoTutorId;
    if(!data.qualExame) delete data.qualExame;
    data.profissionais = Array.from(document.querySelectorAll('[data-ag-profissional]:checked')).map(el=>el.dataset.agProfissional);
    if(!data.horarioFim) delete data.horarioFim;
    const semCadastroAtivo = data.tutorAvulso && data.tutorAvulso.trim();
    if(semCadastroAtivo){
      delete data.tutorId; delete data.animalId;
    } else {
      delete data.tutorAvulso; delete data.telefoneAvulso; delete data.animalAvulso;
      if(!data.tutorId){ toast('Selecione um tutor, ou marque "tutor ainda não tem cadastro"'); return; }
    }
    const an = data.animalId ? animalById(data.animalId) : {nome: data.animalAvulso};
    if(editing){
      const prevStatus = ag.status;
      if(['Cancelado','Desmarcado'].includes(data.status) && prevStatus!==data.status){
        const novoStatus = data.status; data.status = prevStatus;
        Object.assign(ag, data, {alteradoEm:new Date().toISOString()});
        logAction(`editou o agendamento de ${an?.nome||'—'}`); saveDB();
        abrirMotivoStatusModal(ag, novoStatus);
        return;
      }
      Object.assign(ag, data, {alteradoEm:new Date().toISOString()});
      if(['Cancelado','Desmarcado'].includes(data.status) && prevStatus!==data.status){ ag.dataOriginal = ag.dataOriginal||ag.data; }
      if(prevStatus!==data.status) logAction(`alterou o status do agendamento de ${an?.nome||'—'} para ${statusLabel(data.status)}`);
      else logAction(`editou o agendamento de ${an?.nome||'—'}`);
      toast('Agendamento atualizado');
    } else {
      const duplicado = !semCadastroAtivo && DB.agendamentos.find(x=>x.tutorId===data.tutorId && x.animalId===data.animalId && x.data===data.data && x.horario===data.horario && !['Cancelado','Desmarcado','Reagendado'].includes(x.status));
      const criarAgendamento = ()=>{
        const a = {id:uid(), ...data, criadoEm:new Date().toISOString(), alteradoEm:new Date().toISOString()};
        if(contatoOrigemAtivo) a.contatoOrigemId = contatoOrigemAtivo;
        DB.agendamentos.push(a); logAction(`criou um agendamento para o animal ${an?.nome||'—'}`);
        if(contatoOrigemAtivo){
          const c = DB.contatos.find(x=>x.id===contatoOrigemAtivo);
          if(c){ c.status='Agendado'; c.agendadoEm=new Date().toISOString(); }
        } else if(data.dataContato){
          DB.contatos.push({
            id:uid(), tutorId:data.tutorId||null, animalId:data.animalId||null,
            nomeAvulso:data.tutorAvulso||null, animalAvulso:data.animalAvulso||null,
            telefone:data.telefoneAvulso||(data.tutorId?tutorById(data.tutorId)?.telefone:'')||'',
            dataContato:data.dataContato, origem:'Agendamento direto', tipoAtendimento:data.tipo,
            cidade:data.cidade||null, clinica:data.clinica||null, status:'Agendado',
            motivoNaoAgendamento:null, indicacaoTipo:data.indicacaoTipo||null, indicacaoVet:data.indicacaoVet||null,
            indicacaoClinica:data.indicacaoClinica||null, observacoes:null, tentativas:[],
            agendadoEm:new Date().toISOString(), agendamentoId:a.id,
          });
        }
        const outrosMarcados = Array.from(document.querySelectorAll('[data-outro-animal]:checked')).map(el=>el.dataset.outroAnimal);
        let extras = 0;
        outrosMarcados.forEach(animalIdExtra=>{
          const tipoSelExtra = document.querySelector(`[data-outro-animal-tipo="${animalIdExtra}"]`);
          const tipoExtra = tipoSelExtra ? tipoSelExtra.value : data.tipo;
          const extraData = {...data, animalId: animalIdExtra, tipo: tipoExtra};
          const aExtra = {id:uid(), ...extraData, criadoEm:new Date().toISOString(), alteradoEm:new Date().toISOString()};
          DB.agendamentos.push(aExtra); extras++;
        });
        if(semCadastroAtivo){
          const linhasExtra = Array.from(document.querySelectorAll('#agAnimaisAvulsosExtraList > div'));
          linhasExtra.forEach(row=>{
            const nomeExtra = row.querySelector('[data-animal-avulso-extra-nome]')?.value.trim();
            if(!nomeExtra) return;
            const tipoExtra = row.querySelector('[data-animal-avulso-extra-tipo]')?.value || data.tipo;
            const extraData = {...data, animalAvulso: nomeExtra, tipo: tipoExtra};
            const aExtra = {id:uid(), ...extraData, criadoEm:new Date().toISOString(), alteradoEm:new Date().toISOString()};
            DB.agendamentos.push(aExtra); extras++;
          });
        }
        if(extras) logAction(`criou mais ${extras} agendamento(s) no mesmo horário para outros animais do mesmo tutor`);
        toast(extras? `Agendamento criado para ${1+extras} animais` : 'Agendamento criado');
        saveDB(); closeModal(); render();
      };
      if(duplicado){
        confirmDialog('Agendamento repetido?', `Já existe um agendamento de ${an?.nome||'—'} em ${fmtDate(data.data)} às ${data.horario} pra esse tutor. Quer criar mesmo assim?`, ()=>{
          closeModal(); criarAgendamento();
        });
        return;
      }
      criarAgendamento();
      return;
    }
    saveDB(); closeModal(); render();
  });
  if(editing){
    document.getElementById('delAg').addEventListener('click', ()=>{
      confirmDialog('Excluir agendamento?','O registro vai para a Lixeira e pode ser restaurado em Configurações.', ()=>{
        DB.agendamentos = DB.agendamentos.filter(x=>x.id!==ag.id);
        moveToTrash('agendamento', ag);
        logAction(`excluiu o agendamento de ${animalById(ag.animalId)?.nome||'—'}`);
        saveDB(); closeModal(); render(); toast('Agendamento movido para a Lixeira');
      });
    });
  }
}

const INDICACAO_OPCOES = ['Sem indicação','Google','Instagram','Veterinário','Clínica','Clínica e Veterinário','Amigo'];
function indicacaoFieldsHtml(idPrefix, c){
  const tipo = c?.indicacaoTipo || 'Sem indicação';
  const precisaVet = ['Veterinário','Clínica e Veterinário'].includes(tipo);
  const precisaClinica = ['Clínica','Clínica e Veterinário'].includes(tipo);
  const ehAmigo = tipo==='Amigo';
  return `
    <div class="field"><label>Indicação</label>
      <select name="indicacaoTipo" id="${idPrefix}IndTipo">
        ${INDICACAO_OPCOES.map(o=>`<option ${tipo===o?'selected':''}>${o}</option>`).join('')}
      </select>
    </div>
    <div class="field-row" id="${idPrefix}IndDetalheWrap" style="${(precisaVet||precisaClinica)?'':'display:none;'}">
      <div class="field" id="${idPrefix}IndVetWrap" style="${precisaVet?'':'display:none;'}">
        <label>Nome do veterinário</label>
        <input name="indicacaoVet" id="${idPrefix}IndVet" value="${c?.indicacaoVet||''}">
      </div>
      <div class="field" id="${idPrefix}IndClinicaWrap" style="${precisaClinica?'':'display:none;'}">
        <label>Nome da clínica</label>
        <input name="indicacaoClinica" id="${idPrefix}IndClinica" value="${c?.indicacaoClinica||''}">
      </div>
    </div>
    <div class="field" id="${idPrefix}IndAmigoWrap" style="${ehAmigo?'':'display:none;'}">
      <label>O amigo é um cliente já cadastrado?</label>
      <select name="indicacaoTutorId" id="${idPrefix}IndTutor">
        <option value="">Não / não sei</option>
        ${DB.tutores.map(t=>`<option value="${t.id}" ${c?.indicacaoTutorId===t.id?'selected':''}>${t.nome}</option>`).join('')}
      </select>
    </div>`;
}
function wireIndicacaoFields(idPrefix){
  const sel = document.getElementById(idPrefix+'IndTipo');
  if(!sel) return;
  sel.addEventListener('change', ()=>{
    const v = sel.value;
    const precisaVet = ['Veterinário','Clínica e Veterinário'].includes(v);
    const precisaClinica = ['Clínica','Clínica e Veterinário'].includes(v);
    document.getElementById(idPrefix+'IndDetalheWrap').style.display = (precisaVet||precisaClinica)?'':'none';
    document.getElementById(idPrefix+'IndVetWrap').style.display = precisaVet?'':'none';
    document.getElementById(idPrefix+'IndClinicaWrap').style.display = precisaClinica?'':'none';
    document.getElementById(idPrefix+'IndAmigoWrap').style.display = v==='Amigo'?'':'none';
  });
}
function indicacaoLabel(obj){
  if(!obj || !obj.indicacaoTipo || obj.indicacaoTipo==='Sem indicação') return null;
  if(obj.indicacaoTipo==='Amigo'){
    const t = obj.indicacaoTutorId? tutorById(obj.indicacaoTutorId) : null;
    return `Amigo${t?' ('+t.nome+')':(obj.indicacaoDetalhe?' ('+obj.indicacaoDetalhe+')':'')}`;
  }
  if(['Veterinário','Clínica','Clínica e Veterinário'].includes(obj.indicacaoTipo)){
    const partes = [];
    if(obj.indicacaoVet) partes.push(/^dra?\.?\s/i.test(obj.indicacaoVet) ? obj.indicacaoVet : 'Dr(a). '+obj.indicacaoVet);
    if(obj.indicacaoClinica) partes.push(obj.indicacaoClinica);
    if(!partes.length && obj.indicacaoDetalhe) partes.push(obj.indicacaoDetalhe);
    return `${obj.indicacaoTipo}${partes.length?': '+partes.join(' · '):''}`;
  }
  return obj.indicacaoTipo;
}

  function normTel(t){ return (t||'').replace(/\D/g,''); }
  function checarTelefoneDuplicado(){
    const wrap = document.getElementById('ctTelefoneDuplicado');
    const tel = normTel(document.getElementById('ctTelefoneInput').value);
    if(tel.length<8){ wrap.innerHTML=''; return; }
    const outrosContatos = DB.contatos.filter(c=>(!contato||c.id!==contato.id) && normTel(c.telefone)===tel);
    const tutorComTelefone = DB.tutores.find(t=>normTel(t.telefone)===tel || normTel(t.telefone2)===tel);
    if(!outrosContatos.length && !tutorComTelefone){ wrap.innerHTML=''; return; }
    const nomes = new Set();
    if(tutorComTelefone) nomes.add(tutorComTelefone.nome);
    outrosContatos.forEach(c=>{ const t=c.tutorId?tutorById(c.tutorId):null; nomes.add(t?t.nome:(c.nomeAvulso||'contato sem nome')); });
    wrap.innerHTML = `<div class="alert alert-warn" style="margin-bottom:10px;">${ICONS.bell}<div>Esse telefone já aparece em <strong>${outrosContatos.length}</strong> outro(s) contato${outrosContatos.length===1?'':'s'}${tutorComTelefone?' e já é de um tutor cadastrado':''}: <strong>${[...nomes].join(', ')}</strong>. Pode ser a mesma pessoa, confira antes de duplicar.</div></div>`;
  }
  document.getElementById('ctTelefoneInput').addEventListener('input', checarTelefoneDuplicado);
  aplicarMascaraTelefone(document.getElementById('ctTelefoneInput'));
  checarTelefoneDuplicado();
  document.getElementById('ctStatusSel').addEventListener('change', e=>{
    document.getElementById('ctRecontatoWrap').style.display = e.target.value==='Aguardando'?'':'none';
  });
  document.getElementById('ctMotivoSel').addEventListener('change', e=>{
    document.getElementById('ctMotivoOutroWrap').style.display = e.target.value==='Outro motivo'?'':'none';
  });
  wireIndicacaoFields('ct');
  wireCidadeClinicaFields('ct');
  document.getElementById('modalSave').addEventListener('click', ()=>{
    const f = document.getElementById('formContato');
    if(!f.reportValidity()) return;
    const data = Object.fromEntries(new FormData(f));
    if(!data.tutorId) delete data.tutorId; if(!data.animalId) delete data.animalId;
    if(!data.indicacaoTutorId) delete data.indicacaoTutorId;
    if(data.motivoNaoAgendamento==='Outro motivo' && data.motivoOutroTexto && data.motivoOutroTexto.trim()){
      data.motivoNaoAgendamento = data.motivoOutroTexto.trim();
    }
    delete data.motivoOutroTexto;
    data.mesmoTelefonema = !!data.mesmoTelefonema;
    if(data.status!=='Aguardando' || !data.recontatarEm) delete data.recontatarEm;
    const nomeRef = (data.tutorId&&tutorById(data.tutorId)?.nome) || data.nomeAvulso || 'contato';
    if(editing){ if(!data.recontatarEm) delete contato.recontatarEm; Object.assign(contato, data); logAction(`editou o contato de ${nomeRef}`); toast('Contato atualizado'); }
    else { const c={id:uid(), tentativas:[], criadoPor:getCurrentUser(), ...data}; DB.contatos.push(c); logAction(`registrou um contato de ${nomeRef}`); toast('Contato registrado'); }
    saveDB(); closeModal(); render();
  });
  if(editing){
    document.getElementById('delContato')?.addEventListener('click', ()=>{
      confirmDialog('Excluir contato?','O registro vai para a Lixeira e pode ser restaurado em Configurações.', ()=>{
        DB.contatos = DB.contatos.filter(x=>x.id!==contato.id);
        moveToTrash('contato', contato);
        logAction(`excluiu um registro de contato`);
        saveDB(); closeModal(); closeDrawer(); render(); toast('Contato movido para a Lixeira');
      });
    });
  }
}

function formUsuario(usuario){
  const html = modalShell('Editar nome de exibição', `
    <form id="formUsuario">
      <div class="field"><label>Nome *</label><input name="nome" required value="${usuario.nome}" autofocus></div>
      <div class="hint">Esse é só o nome mostrado no sistema, não altera o e-mail nem a senha da sua conta.</div>
    </form>`,
    `<button class="btn btn-secondary" id="modalCancel">Cancelar</button><button class="btn btn-primary" id="modalSave">Salvar</button>`);
  openModal(html, {narrow:true});
  bindModalClose();
  document.getElementById('modalSave').addEventListener('click', ()=>{
    const f = document.getElementById('formUsuario');
    if(!f.reportValidity()) return;
    const novoNome = new FormData(f).get('nome').trim();
    if(novoNome!==usuario.nome){
      if(DB.usuarios.some(x=>x.nome===novoNome && x.id!==usuario.id)){ toast('Já existe um usuário com esse nome'); return; }
      const antigo = usuario.nome;
      usuario.nome = novoNome;
      (DB.auditLog||[]).forEach(l=>{ if(l.usuario===antigo) l.usuario=novoNome; });
      logAction(`renomeou o usuário "${antigo}" para "${novoNome}"`);
    }
    saveDB(); closeModal(); render(); renderUserSelect(); toast('Usuário atualizado');
  });
}

function openQuickAgSearch(){
  const html = modalShell('Confirmar / Desmarcar / Cancelar', `
    <div class="field"><label>Buscar por tutor ou animal</label><input id="qaSearchInput" placeholder="Digite para buscar…" autofocus></div>
    <div id="qaSearchResults" style="max-height:320px; overflow-y:auto;"></div>
  `, `<button class="btn btn-secondary" id="modalCancel">Fechar</button>`);
  openModal(html);
  document.getElementById('modalClose').addEventListener('click', closeModal);
  document.getElementById('modalCancel').addEventListener('click', closeModal);
  const renderResults = q=>{
    q = (q||'').trim().toLowerCase();
    let list = DB.agendamentos.filter(a=>!['Realizado','Cancelado','Desmarcado'].includes(a.status));
    if(q) list = list.filter(a=>(tutorById(a.tutorId)?.nome||'').toLowerCase().includes(q) || (animalById(a.animalId)?.nome||'').toLowerCase().includes(q));
    list.sort((a,b)=>a.data.localeCompare(b.data));
    const el = document.getElementById('qaSearchResults');
    if(!list.length){ el.innerHTML = `<div class="hint" style="padding:10px 0;">Nenhum agendamento em aberto encontrado.</div>`; return; }
    el.innerHTML = list.slice(0,25).map(a=>`
      <div style="display:flex; align-items:center; gap:10px; padding:9px 4px; border-bottom:1px solid #F1EEE4;">
        <div style="flex:1; font-size:13px;"><strong>${animalById(a.animalId)?.nome||'—'}</strong> · ${tutorById(a.tutorId)?.nome||'—'} — ${fmtDate(a.data)} ${a.horario} ${badge(a.status)}</div>
        <button class="icon-btn" title="Confirmar" data-qa-status="${a.id}" data-status="Confirmado">${ICONS.check}</button>
        <button class="icon-btn" title="Desmarcar" data-qa-status="${a.id}" data-status="Desmarcado">${ICONS.desmarcacoes}</button>
        <button class="icon-btn" title="Cancelar" data-qa-status="${a.id}" data-status="Cancelado">${ICONS.x}</button>
      </div>`).join('');
    el.querySelectorAll('[data-qa-status]').forEach(btn=>btn.addEventListener('click', ()=>{
      const ag = DB.agendamentos.find(x=>x.id===btn.dataset.qaStatus);
      const status = btn.dataset.status;
      if(['Desmarcado','Cancelado'].includes(status)){ abrirMotivoStatusModal(ag, status); return; }
      ag.status = status; ag.alteradoEm = new Date().toISOString();
      logAction(`alterou o status do agendamento de ${animalById(ag.animalId)?.nome||'—'} para ${statusLabel(status)}`);
      saveDB(); toast('Status atualizado: '+statusLabel(status));
      renderResults(document.getElementById('qaSearchInput').value);
      render();
    }));
  };
  document.getElementById('qaSearchInput').addEventListener('input', e=>renderResults(e.target.value));
  renderResults('');
}

function buildAnimalTimeline(animalId){
  const items = [];
  agendamentosDoAnimal(animalId).forEach(ag=>{
    items.push({data:ag.data, dot:'var(--sage)', kind:'Agendamento',
      title:`${ag.tipo} — ${statusLabel(ag.status)}`,
      detail:`${ag.horario||''}${ag.observacoes?' · '+ag.observacoes:''}${ag.motivoStatus?' · Motivo: '+ag.motivoStatus:''}${ag.retornoPrevisto?' · Retorno previsto: '+fmtDate(ag.retornoPrevisto):''}`,
      ref:{type:'ag', id:ag.id}});
  });
  DB.contatos.filter(c=>c.animalId===animalId).forEach(c=>{
    items.push({data:c.dataContato, dot:'var(--brown)', kind:c.origem==='Realizado'?'Contato da clínica':'Contato recebido',
      title:`${c.origem==='Realizado'?'Clínica contatou o tutor':'Tutor entrou em contato'} — ${c.status}`,
