<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Olhatta</title>
<link rel="icon" type="image/svg+xml" sizes="any" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='9' fill='%235C7355'/%3E%3Cpath d='M20 10C12 10 6.5 20 6.5 20S12 30 20 30 33.5 20 33.5 20 28 10 20 10Z' fill='%23EFEFE6'/%3E%3Ccircle cx='20' cy='20' r='6.2' fill='%238A6647'/%3E%3Ccircle cx='20' cy='20' r='2.8' fill='%23331F12'/%3E%3C/svg%3E">
<link rel="icon" type="image/png" href="favicon-32.png">
<link rel="apple-touch-icon" href="olhatta-logo-180.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#5C7355">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Olhatta">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --sage:#7C9473; --sage-dark:#5C7355; --sage-light:#E7EEE2; --sage-pale:#F3F6F0;
  --brown:#A9805F; --brown-dark:#8A6647; --brown-light:#F1E6D8; --brown-pale:#FAF5EE;
  --cream:#FBF8F3; --ink:#33362F; --ink-soft:#6B6E63; --ink-faint:#9A9C90;
  --line:#E6E0D2; --white:#FFFFFF;
  --st-agendado:#5C8A52; --st-agendado-bg:#E5EEE0;
  --st-realizado:#1F8A6E; --st-realizado-bg:#D9EFE8;
  --st-cancelado:#B03B3B; --st-cancelado-bg:#F3DCDC;
  --st-desmarcado:#C9682A; --st-desmarcado-bg:#F6E3D2;
  --st-reagendado:#6B4FA0; --st-reagendado-bg:#E7E1F1;
  --st-falta:#7A3B52; --st-falta-bg:#EEDCE4;
  --st-confirmado:#2F6690; --st-confirmado-bg:#DCE8F0;
  --st-aguardando:#B8901E; --st-aguardando-bg:#F5EBD3;
  --radius:14px; --radius-sm:9px;
  --shadow:0 1px 2px rgba(51,54,47,.05), 0 6px 20px -8px rgba(51,54,47,.12);
}
.rolagem-lista, .pend-list{scrollbar-width:none; -ms-overflow-style:none;}
.rolagem-lista::-webkit-scrollbar, .pend-list::-webkit-scrollbar{display:none; width:0; height:0;}
/* nada ultrapassa a margem: palavras longas quebram dentro do quadro */
.card, .modal, .drawer, .alert, .tl-item, .insight, .pend-row, .gsr-item, .field, .hint, .section-title{overflow-wrap:anywhere; word-break:normal;}
td, th, td strong, .stat-card, .stat-card .label{overflow-wrap:break-word; word-break:normal;}
.view, .modal, .drawer, td, th, .stat-card, .card{hyphens:auto; -webkit-hyphens:auto; hyphenate-limit-chars:6 3 3;}
th{hyphens:manual; -webkit-hyphens:manual;}
input, textarea, select, .btn, button, .chip-btn, .nav-badge, .pill-muted, .tag, code, a[href^="mailto"]{hyphens:none; -webkit-hyphens:none;}
button, .btn, .chip-btn, .pill-muted, .tag, .nav-badge{overflow-wrap:normal; word-break:keep-all;}
input, select, textarea, button{max-width:100%;}
img, svg, video{max-width:100%;}
.grid > *, .view > *, .view-head > *, .card > *{min-width:0;}
/* linhas de tabela com a mesma altura; cards lado a lado com a mesma altura */
.table-wrap tbody tr{height:52px;}
.grid{align-items:stretch;}
.grid > .card, .grid > .stat-card{height:100%;}
.table-wrap, .rolagem-lista, .pend-list{-webkit-overflow-scrolling:touch; overscroll-behavior:auto;}
/* tabelas que crescem: rolagem própria em vez de esticar a tela */
.table-wrap{max-width:100%; overflow-x:auto;}
.table-wrap{max-height:72vh; overflow-y:auto;}
/* sem retângulo azul/cinza ao tocar no celular */
*{-webkit-tap-highlight-color:rgba(0,0,0,0) !important;}
a, button, [role=button], .rowlink, .navlink{-webkit-touch-callout:none; touch-action:manipulation;}
::selection{background:rgba(124,148,115,.28);}

.recontato{background:var(--brown-light); color:var(--brown-dark);}
.recontato.hoje{background:#F5EBD3; color:#8A6A12;}
.recontato.atrasado{background:var(--st-cancelado-bg); color:var(--st-cancelado);}
.field.copiavel{background:var(--brown-pale); border:1px solid var(--brown-light); border-radius:12px; padding:8px 10px 10px;}
.field.copiavel > label{margin-bottom:4px;}
.copy-row{display:flex; gap:8px; align-items:center;}
.copy-row input, .copy-row textarea{flex:1; min-width:0; background:#fff;}
.copy-row textarea{min-height:70px;}
.copy-btn{display:inline-flex; align-items:center; gap:5px; padding:7px 10px; border:1px solid var(--brown-light); border-radius:9px; background:#fff; color:var(--brown-dark); font-weight:700; font-size:12px; cursor:pointer; flex-shrink:0; transition:transform .15s, background .15s;}
.copy-btn svg{width:14px; height:14px;}
.copy-btn:hover{background:var(--brown-light);} .copy-btn:active{transform:scale(.94);}
.copy-btn.copiado{background:var(--sage-dark); color:#fff; border-color:var(--sage-dark);}
.nf-valor{flex:1; font-family:'Fraunces',serif; font-size:20px; font-weight:600; padding:6px 2px;}
.nf-valor-nota{color:var(--sage-dark);}
/* relatório automático */
.rel-var{display:flex; align-items:baseline; gap:2px; font-size:12.5px; font-weight:800; margin-top:6px;}
.rel-var.ok{color:var(--st-realizado);} .rel-var.bad{color:var(--st-cancelado);} .rel-var.ink{color:var(--ink-soft);}
.rel-prev{font-weight:600; color:var(--ink-faint);}
.rel-texto p{margin:0 0 10px; font-size:14.5px; line-height:1.6; color:var(--ink);}
.rel-texto p:last-child{margin-bottom:0;}
.rel-motivos{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px;}
.rel-detalhes{display:flex; flex-direction:column; gap:8px; max-height:280px; overflow-y:auto;}
.rel-det{background:var(--sage-pale); border-radius:10px; padding:10px 12px;}
.rel-det-top{display:flex; flex-wrap:wrap; gap:6px 12px; align-items:center; font-size:13px;}
.rel-det-data{margin-left:auto; color:var(--ink-soft); font-size:12px;}
.rel-det-txt{margin-top:6px; font-size:13px; color:var(--ink-soft); white-space:pre-wrap;}
.rel-fmt{display:inline-flex; gap:4px;}
.rel-fmt-btn{min-width:34px; height:32px; font-size:13px; border:1px solid var(--line); border-radius:8px; background:#fff;}
.rel-obs{min-height:130px; padding:12px 14px; border:1px solid var(--line); border-radius:12px; background:#fff; line-height:1.6; outline:none; overflow-wrap:anywhere;}
.rel-obs:focus{border-color:var(--sage);}
.rel-print-only, .rel-print-head{display:none;}
.rel-tab{width:100%; border-collapse:collapse; font-size:13px;}
.rel-tab th, .rel-tab td{padding:8px 10px; text-align:center; border-bottom:1px solid #D9D5C8;}
.rel-tab th:first-child, .rel-tab td:first-child{text-align:left;}
.rel-tab thead th{background:#5C7355; color:#fff;}
.rel-tab tr.mot td{color:#555;}
.rel-tab tr.sec td{background:#F3F1E8; font-weight:800; font-size:11.5px; letter-spacing:.04em; text-transform:uppercase; color:#6B6E63; text-align:left !important;}
.rel-tab td.cur{box-shadow:inset 2px 0 0 #5C7355, inset -2px 0 0 #5C7355;}
.rel-tab thead th.cur{background:#33452F;}
.rel-tab td.cur{background:#E9EFE2; font-weight:700; color:#2E3A2A;}
@media print{
  @page{size:A4; margin:14mm;}
  body.imprimindo-rel, body.imprimindo-rel html{overflow:visible !important;}
  html:has(body.imprimindo-rel){overflow:visible !important; height:auto !important;}
  body.imprimindo-rel #app{display:block !important; min-height:0 !important; max-width:none !important; width:auto !important;}
  body.imprimindo-rel main{display:block !important; width:auto !important; max-width:none !important; overflow:visible !important;}
  body.imprimindo-rel .view, body.imprimindo-rel .rel-area{width:auto !important; max-width:none !important; overflow:visible !important; height:auto !important;}
  body.imprimindo-rel .rel-tab{width:100% !important; table-layout:fixed; font-size:11.5px;}
  body.imprimindo-rel .rel-tab th, body.imprimindo-rel .rel-tab td{padding:6px 5px; overflow-wrap:break-word;}
  body.imprimindo-rel .rel-tab th:first-child, body.imprimindo-rel .rel-tab td:first-child{width:34%;}
  body.imprimindo-rel .rel-tab tr{break-inside:avoid;}
  body.imprimindo-rel .rel-texto p{break-inside:avoid; margin:0 0 6px;}
  body.imprimindo-rel{background:#fff !important;}
  body.imprimindo-rel .sidebar, body.imprimindo-rel .topbar, body.imprimindo-rel .sidebar-scrim, body.imprimindo-rel #modalRoot, body.imprimindo-rel #drawerRoot, body.imprimindo-rel .mobile-toggle, body.imprimindo-rel .toast, body.imprimindo-rel .rel-noprint{display:none !important;}
  body.imprimindo-rel main{margin:0 !important;}
  body.imprimindo-rel .view{padding:0 !important;}
  body.imprimindo-rel .rel-print-only{display:block !important;}
  body.imprimindo-rel .rel-print-head{display:block !important; margin-bottom:18px; border-bottom:2px solid #5C7355; padding-bottom:10px;}
  body.imprimindo-rel .rel-print-brand{font-family:'Fraunces',serif; font-size:13px; color:#5C7355; letter-spacing:.08em; text-transform:uppercase;}
  body.imprimindo-rel .rel-print-title{font-family:'Fraunces',serif; font-size:24px; font-weight:600; color:#33362F;}
  body.imprimindo-rel .rel-print-per{font-size:13px; color:#6B6E63;}
  body.imprimindo-rel .rel-resumo{box-shadow:none !important; border:0 !important; padding:0 !important;}
  body.imprimindo-rel .rel-tab{break-inside:avoid;}
  body.imprimindo-rel .rel-obs-box{border:1px solid #D9D5C8; border-radius:8px; padding:10px 12px; line-height:1.6;}
  body.imprimindo-rel *{-webkit-print-color-adjust:exact; print-color-adjust:exact;}
}
/* barra de rolagem: trilho sempre transparente, só o puxador discreto */
*{scrollbar-width:thin; scrollbar-color:rgba(138,102,71,.35) transparent;}
::-webkit-scrollbar{width:8px; height:8px; background:transparent;}
::-webkit-scrollbar-track, ::-webkit-scrollbar-corner{background:transparent;}
::-webkit-scrollbar-thumb{background:rgba(138,102,71,.32); border-radius:8px; border:2px solid transparent; background-clip:content-box;}
::-webkit-scrollbar-thumb:hover{background:rgba(138,102,71,.55); background-clip:content-box;}
.sidebar{scrollbar-color:rgba(255,255,255,.25) transparent;}
.sidebar ::-webkit-scrollbar-thumb, .sidebar::-webkit-scrollbar-thumb{background:rgba(255,255,255,.25); background-clip:content-box;}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent; -webkit-touch-callout:none;}
button, a, input, select, textarea, .rowlink, .chip, .pend-row, .insight{ -webkit-tap-highlight-color:transparent; outline:none; }
button:focus, .icon-btn:focus, .btn:focus{ outline:none; box-shadow:none; }
html,body{margin:0;padding:0; overflow-x:clip; max-width:100%;}
body{
  font-family:'Manrope',sans-serif; color:var(--ink);
  background:var(--cream) linear-gradient(170deg, #E3E8D6 0%, #ECEDDF 40%, #F5F0E4 100%) fixed;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,.display{font-family:'Fraunces',serif;}
button{font-family:inherit;}
::selection{background:var(--sage-light);}
a{color:inherit;}
svg{width:16px; height:16px; flex-shrink:0; display:inline-block; vertical-align:-3px;}

/* ---------- Layout ---------- */
#app{display:flex; min-height:100vh; max-width:100vw;}
.sidebar{
  width:230px; flex-shrink:0; background:linear-gradient(180deg,#4E5D46,#3F4B38);
  color:#EFEFE6; display:flex; flex-direction:column;
  position:fixed; top:0; left:0; bottom:0; height:auto; z-index:60; overflow-y:auto;
}
.brand{display:flex; align-items:center; gap:10px; padding:24px 20px 18px;}
.brand-mark{width:34px;height:34px;flex-shrink:0;}
.brand-text{font-family:'Fraunces',serif; font-size:19px; font-weight:600; letter-spacing:.02em; color:#F6F4EC;}
.brand-sub{font-size:10.5px; color:#C7CDBB; letter-spacing:.08em; text-transform:uppercase; margin-top:1px;}
nav.navlist{padding:6px 12px; display:flex; flex-direction:column; gap:2px; flex:1;}
.navlink{
  display:flex; align-items:center; gap:11px; padding:10px 12px; border-radius:10px;
  color:#D9DECB; text-decoration:none; font-size:14px; font-weight:600; cursor:pointer;
  border:none; background:none; text-align:left; width:100%;
}
.navlink svg{width:17px;height:17px;flex-shrink:0; opacity:.85;}
.navlink:hover{background:rgba(255,255,255,.07); color:#fff;}
.navlink.active{background:#EFEFE6; color:#3F4B38;}
.navlink.active svg{opacity:1;}
.sidebar-foot{padding:16px 20px; font-size:11px; color:#9DA593; border-top:1px solid rgba(255,255,255,.08);}

main{flex:1; min-width:0; display:flex; flex-direction:column; margin-left:230px;}
.topbar{
  position:sticky; top:0; z-index:20; background:rgba(231,235,219,.78); backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line); padding:18px 30px; display:flex; align-items:center; justify-content:space-between; gap:16px;
}
.topbar h1{font-size:22px; margin:0; font-weight:600; color:var(--ink);}
.topbar .sub{font-size:12.5px; color:var(--ink-soft); margin-top:2px; font-family:'Manrope',sans-serif; font-weight:500;}
.quicklink-pill{display:inline-flex; align-items:center; padding:6px 12px; border-radius:20px; background:var(--sage-pale); color:var(--sage-dark); font-size:12px; font-weight:700; text-decoration:none; border:1px solid var(--line); white-space:nowrap; max-width:140px; overflow:hidden; text-overflow:ellipsis;}
.quicklink-pill:hover{background:var(--sage-light);}
.search-global{
  display:flex; align-items:center; gap:8px; background:#fff; border:1px solid var(--line); border-radius:10px;
  padding:8px 12px; min-width:260px;
}
.search-global input{border:none;outline:none;font-size:13.5px;width:100%;background:transparent;font-family:'Manrope',sans-serif;}
.search-global svg{width:15px;height:15px;color:var(--ink-faint);flex-shrink:0;}
.view{padding:26px 30px 60px; min-width:0;}
.view-head{display:flex; align-items:center; justify-content:space-between; gap:14px; margin-bottom:20px; flex-wrap:wrap;}

/* ---------- Buttons ---------- */
.btn{
  display:inline-flex; align-items:center; gap:7px; border-radius:10px; padding:9px 16px; font-size:13.5px;
  font-weight:700; border:1px solid transparent; cursor:pointer; white-space:nowrap; font-family:'Manrope',sans-serif;
  transition:transform .08s ease;
}
.btn{transition:transform .18s cubic-bezier(.34,1.56,.64,1), box-shadow .18s ease, background .15s ease, border-color .15s ease;}
.btn:hover{transform:translateY(-1px); box-shadow:0 4px 12px rgba(60,70,50,.14);}
.btn:active{transform:scale(.96); box-shadow:none;}
.avatar-ini{width:30px; height:30px; border-radius:50%; background:var(--sage-pale); color:var(--sage-dark); font-size:11.5px; font-weight:800; display:inline-flex; align-items:center; justify-content:center; flex-shrink:0; transition:transform .2s cubic-bezier(.34,1.56,.64,1), background .2s;}
tr.rowlink:hover .avatar-ini{transform:scale(1.12); background:var(--sage); color:#fff;}
tr.rowlink{transition:background .15s ease;}
.semana-col:hover > div:nth-child(2){filter:brightness(.93); transform:translateY(-2px); transition:filter .2s, transform .2s;}
@keyframes growY{from{transform:scaleY(0);}to{transform:scaleY(1);}}
@media (prefers-reduced-motion: reduce){ .semana-col div{animation:none !important;} }
.timeline{position:relative; margin:4px 0 20px 6px; padding-left:20px; border-left:2px solid var(--line);}
.tl-item{position:relative; padding:2px 8px 14px 4px; border-radius:8px; transition:background .15s;}
.tl-item:hover{background:color-mix(in srgb, var(--sage) 8%, transparent);}
.tl-dot{position:absolute; left:-27px; top:6px; width:12px; height:12px; border-radius:50%; background:#fff; border:3px solid var(--sage-dark); transition:transform .2s cubic-bezier(.34,1.56,.64,1);}
.tl-item:hover .tl-dot{transform:scale(1.25);}
.tl-item[data-tl-tipo="contato"] .tl-dot{border-color:var(--brown);}
.tl-item[data-tl-tipo="nota"] .tl-dot{border-color:var(--st-confirmado);}
.tl-head{display:flex; align-items:center; gap:8px; flex-wrap:wrap; font-size:12px;}
.tl-data{font-weight:800; color:var(--ink);}
.tl-tag{color:var(--ink-soft); text-transform:uppercase; letter-spacing:.04em; font-size:10.5px; font-weight:700;}
.tl-txt{font-size:13px; margin-top:3px;}
.bar-fill{transform-origin:left center; animation:growBar .9s cubic-bezier(.22,1,.36,1);}
@keyframes growBar{from{transform:scaleX(0);}to{transform:scaleX(1);}}
.meta-card{background:linear-gradient(145deg, color-mix(in srgb, var(--brown) 7%, #fff), #fff 60%); transition:transform .22s cubic-bezier(.34,1.56,.64,1), box-shadow .22s ease;}
.meta-card:hover{transform:translateY(-3px); box-shadow:0 10px 24px rgba(138,102,71,.14);}
@media (prefers-reduced-motion: reduce){ .bar-fill{animation:none;} .meta-card{transition:none;} .meta-card:hover{transform:none;} }
.nav-badge{margin-left:auto; background:#C9A66B; color:#fff; font-size:11px; font-weight:800; border-radius:999px; padding:1px 8px; min-width:20px; text-align:center;}
.navlink.active .nav-badge{background:#6B7D63;}
.chip-btn{border:1px solid var(--line); background:#fff; border-radius:999px; padding:6px 14px; font-size:12.5px; font-weight:700; cursor:pointer; font-family:inherit; transition:transform .18s cubic-bezier(.34,1.56,.64,1), background .15s;}
.chip-btn:hover{transform:translateY(-1px); border-color:var(--brown);}
.chip-btn.on{background:var(--sage-dark); color:#fff; border-color:var(--sage-dark);}
@media (prefers-reduced-motion: reduce){ .btn,.chip-btn{transition:none !important;} .btn:hover,.chip-btn:hover{transform:none;} }
.btn svg{width:15px;height:15px;}
.btn-primary{background:var(--sage-dark); color:#fff;}
.btn-primary:hover{background:#4d5f46;}
.btn-secondary{background:#fff; color:var(--ink); border-color:var(--line);}
.btn-secondary:hover{border-color:var(--brown);}
.btn-ghost{background:transparent; color:var(--ink-soft); border-color:transparent; padding:8px 10px;}
.btn-ghost:hover{background:var(--sage-pale); color:var(--ink);}
.btn-danger{background:#fff; color:var(--st-cancelado); border-color:var(--st-cancelado-bg);}
.btn-danger:hover{background:var(--st-cancelado-bg);}
.btn-sm{padding:6px 11px; font-size:12.5px; border-radius:8px;}
.icon-btn{background:none;border:none;cursor:pointer;padding:6px;border-radius:8px;color:var(--ink-soft);display:flex;}
.icon-btn:hover{background:var(--sage-pale); color:var(--ink);}
.icon-btn.active{background:var(--sage-dark); color:#fff;}
.icon-btn svg{width:16px;height:16px;}

/* ---------- Cards / grid ---------- */
.card{background:#fff; border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); min-width:0;}
.pad{padding:20px;}
.grid{display:grid; gap:16px;}
.g4{grid-template-columns:repeat(4,minmax(0,1fr));}
.g3{grid-template-columns:repeat(3,minmax(0,1fr));}
.g2{grid-template-columns:repeat(2,minmax(0,1fr));}
@media (max-width:1100px){.g4{grid-template-columns:repeat(2,1fr);} .g3{grid-template-columns:repeat(3,minmax(0,1fr));} .table-wrap td:not(:last-child){white-space:nowrap;} td .btn{white-space:nowrap;} .view .grid.g3{grid-template-columns:repeat(3,minmax(0,1fr)) !important;}}
@media (max-width:640px){
  .g2{grid-template-columns:1fr;}
  .g4,.g3{grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px;}
  .g4 > :last-child:nth-child(odd), .g3 > :last-child:nth-child(odd){grid-column:1/-1;}
  body .stat-card{padding:12px 14px;} body .stat-card .label{font-size:10.5px; letter-spacing:.03em;} body .stat-card .value{font-size:24px; margin-top:3px;}
  .table-wrap td, .table-wrap th{white-space:nowrap;}
  body .lemb-row{flex-wrap:wrap;} body .lemb-acoes{margin-left:auto; width:100%; justify-content:flex-end;}
  .icon-btn{min-width:36px; min-height:36px;} .btn-sm,.chip-btn{min-height:34px;}
  table{font-size:12px;}
  th{padding:6px 8px; font-size:9.5px;}
  td{padding:8px 8px;}
  .view-head{gap:10px;}
  .view-head .filters.search-input{max-width:100%; width:100%;}
  .btn-danger, .btn-secondary, .btn-primary{white-space:normal; text-align:center;}
}

.stat-card{padding:18px 20px; border-radius:var(--radius); border:1px solid var(--line); background:#fff; position:relative; overflow:hidden;}
.stat-card .label{font-size:12px; font-weight:700; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.05em;}
.stat-card .value{font-family:'Fraunces',serif; font-size:32px; font-weight:600; margin-top:6px; color:var(--ink);}
.stat-card .delta{font-size:12px; margin-top:4px; font-weight:700;}
.stat-card .delta.up{color:var(--st-realizado);}
.stat-card .delta.down{color:var(--st-cancelado);}
.stat-card{--c:var(--brown); background:linear-gradient(135deg, color-mix(in srgb, var(--brown) 9%, #fff) 0%, #fff 65%); border-color:var(--line); transition:transform .22s cubic-bezier(.34,1.56,.64,1), box-shadow .22s ease, border-color .22s ease;}
.stat-card:hover{transform:translateY(-3px); box-shadow:0 10px 24px rgba(138,102,71,.14); border-color:color-mix(in srgb, var(--brown) 30%, var(--line));}
.stat-card .stripe{display:none;}

@media (prefers-reduced-motion: reduce){ .stat-card{transition:none !important;} .stat-card:hover{transform:none;} }

.section-title{font-family:'Fraunces',serif; font-size:16px; font-weight:600; margin:0 0 14px; color:var(--ink); display:flex; align-items:center; gap:8px;}
.section-title .tag{font-family:'Manrope',sans-serif; font-size:11px; font-weight:700; background:var(--brown-light); color:var(--brown-dark); padding:2px 8px; border-radius:20px;}

/* ---------- Table ---------- */
table{width:100%; border-collapse:collapse; font-size:13.5px;}
th{text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-soft); font-weight:700; padding:8px 12px; border-bottom:1px solid var(--line);}
.table-wrap thead th, .card > table thead th{background:var(--sage-dark); color:#fff; border-bottom:none;}
.table-wrap thead th:first-child{border-top-left-radius:10px;} .table-wrap thead th:last-child{border-top-right-radius:10px;}
td{padding:11px 12px; border-bottom:1px solid #F1EEE4; vertical-align:middle;}
tr.rowlink{cursor:pointer;}
tr.rowlink:hover td{background:var(--sage-pale);}
.table-wrap{overflow-x:auto;}
.table-wrap thead th{position:sticky; top:0; background:var(--sage-dark); z-index:2;}

/* ---------- Badges/status ---------- */
.badge{display:inline-flex; align-items:center; gap:5px; font-size:11.5px; font-weight:700; padding:4px 10px; border-radius:20px;}
.badge::before{content:''; width:6px;height:6px;border-radius:50%;background:currentColor;}
.st-Agendado{background:var(--st-agendado-bg); color:var(--st-agendado-dark, var(--st-agendado));}
.st-Agendado{color:#5C7355;}
.st-Realizado{background:var(--st-realizado-bg); color:var(--st-realizado);}
.st-Cancelado{background:var(--st-cancelado-bg); color:var(--st-cancelado);}
.st-Desmarcado{background:var(--st-desmarcado-bg); color:var(--st-desmarcado);}
.st-Reagendado{background:var(--st-reagendado-bg); color:var(--st-reagendado);}
.st-Falta{background:var(--st-falta-bg); color:var(--st-falta);}
.st-Confirmado{background:var(--st-confirmado-bg); color:var(--st-confirmado);}
.st-AguardandoConfirmacao{background:var(--st-aguardando-bg); color:var(--st-aguardando);}
.pill{background:var(--brown-pale); color:var(--brown-dark); font-size:11.5px; font-weight:700; padding:3px 9px; border-radius:20px;}
.pill-muted{background:#F1EEE4; color:var(--ink-soft); font-size:11.5px; font-weight:700; padding:3px 9px; border-radius:20px;}
.pill-link{background:var(--sage-pale); color:var(--sage-dark); font-size:11.5px; font-weight:700; padding:3px 9px; border-radius:20px; cursor:pointer; border:none; display:inline-flex; align-items:center; gap:4px;}
.pill-link:hover{background:var(--sage-light);}
.timeline{display:flex; flex-direction:column;}
.tl-item{display:flex; gap:12px; padding:12px 0; border-bottom:1px solid #F1EEE4;}
.tl-item:last-child{border-bottom:none;}
.tl-dot{width:9px;height:9px;border-radius:50%; margin-top:5px; flex-shrink:0;}
.tl-date{font-size:11px; color:var(--ink-faint); font-weight:700; white-space:nowrap; width:74px; flex-shrink:0; margin-top:3px;}
.tl-content{flex:1; font-size:13px;}
.tl-content .tl-title{font-weight:700; color:var(--ink);}
.user-select-wrap{padding:12px 20px; border-top:1px solid rgba(255,255,255,.08);}
.user-select-wrap label{color:#B9C0A9; font-size:10px; margin-bottom:5px;}
.user-select-wrap select{background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.15); color:#F6F4EC; font-size:12.5px; padding:7px 9px;}
.user-select-wrap select option{color:#222;}
.mini-stat{background:var(--sage-pale); border-radius:10px; padding:10px 12px;}
.mini-stat .n{font-family:'Fraunces',serif; font-size:20px; font-weight:600; color:var(--ink);}
.mini-stat .l{font-size:11px; color:var(--ink-soft); font-weight:700; text-transform:uppercase; letter-spacing:.03em;}

/* ---------- Forms ---------- */
label{display:block; font-size:12.5px; font-weight:700; color:var(--ink-soft); margin-bottom:6px;}
input,select,textarea{
  width:100%; border:1px solid var(--line); border-radius:9px; padding:10px 12px; font-size:13.5px;
  font-family:'Manrope',sans-serif; background:#fff; color:var(--ink); outline:none;
}
input:focus,select:focus,textarea:focus{border-color:var(--sage);}
textarea{resize:vertical; min-height:70px;}
[contenteditable][data-placeholder]:empty::before{content:attr(data-placeholder); color:var(--ink-faint);}
input[type="date"],input[type="time"]{color-scheme:light; min-height:38px;}
.filters input[type="date"]{min-width:130px;}
.field{margin-bottom:14px;}
.field-row{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
@media (max-width:560px){.field-row{grid-template-columns:1fr;}}
.hint{font-size:11.5px; color:var(--ink-faint); margin-top:5px;}
.chip-list{display:flex; flex-wrap:wrap; gap:6px; margin-top:8px;}
.chip{display:inline-flex; align-items:center; gap:6px; background:var(--sage-pale); color:var(--sage-dark); padding:5px 6px 5px 11px; border-radius:20px; font-size:12.5px; font-weight:700;}
.chip button{background:none;border:none;cursor:pointer;color:var(--sage-dark);display:flex;padding:2px;border-radius:50%;}
.chip button:hover{background:rgba(0,0,0,.08);}

/* ---------- Filters bar ---------- */
.filters{display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:16px;}
.filters select,.filters input{width:auto; min-width:140px; font-size:13px; padding:8px 11px;}
.search-input{position:relative; flex:1; min-width:200px;}
.search-input svg{position:absolute; left:11px; top:50%; transform:translateY(-50%); width:14px;height:14px;color:var(--ink-faint);}
.search-input input{padding-left:32px;}

/* ---------- Empty state ---------- */
.empty{text-align:center; padding:26px 20px; color:var(--ink-soft);}
.empty svg{width:26px;height:26px; color:var(--brown); margin-bottom:8px; opacity:.55;}
.empty .t{font-family:'Fraunces',serif; font-size:14.5px; color:var(--ink); margin-bottom:3px;}
.empty .d{font-size:12.5px; max-width:320px; margin:0 auto; line-height:1.4;}

/* ---------- Modal ---------- */
.modal-backdrop{position:fixed; inset:0; background:rgba(51,54,47,.45); display:flex; align-items:flex-start; justify-content:center; padding:5vh 16px; z-index:100; overflow-y:auto;}
.modal{background:#fff; border-radius:16px; width:100%; max-width:520px; box-shadow:0 20px 60px rgba(0,0,0,.25); animation:pop .15s ease;}
@keyframes pop{from{opacity:0; transform:translateY(6px) scale(.98);} to{opacity:1; transform:none;}}
.modal-head{display:flex; align-items:center; justify-content:space-between; padding:20px 22px 0;}
.modal-head h3{margin:0; font-size:18px; font-weight:600;}
.modal-body{padding:16px 22px 22px;}
.modal-foot{display:flex; justify-content:flex-end; gap:10px; padding:0 22px 22px;}
.modal.narrow{max-width:400px;}

/* ---------- Alerts / reminders ---------- */
.alert{display:flex; gap:12px; padding:13px 15px; border-radius:12px; align-items:flex-start; font-size:13px;}
.alert svg{width:18px;height:18px;flex-shrink:0; margin-top:1px;}
.alert-brown{background:var(--brown-light); color:var(--brown-dark);}
.alert-sage{background:var(--sage-light); color:var(--sage-dark);}
.alert-warn{background:var(--st-aguardando-bg); color:var(--st-aguardando);}
.alert-danger{background:var(--st-cancelado-bg); color:var(--st-cancelado);}
.alert-hoje{background:var(--st-confirmado-bg); color:var(--st-confirmado); border:1.5px solid var(--st-confirmado);}
.alert .t1{font-weight:700; margin-bottom:2px;}

/* insight list */
.insight{display:flex; gap:10px; padding:11px 0; border-bottom:1px solid #F1EEE4; font-size:13.5px; align-items:flex-start;}
.insight:last-child{border-bottom:none;}
.insight .dot{width:7px;height:7px;border-radius:50%; background:var(--brown); margin-top:6px; flex-shrink:0;}

/* mini bar chart */
.bars{display:flex; flex-direction:column; gap:10px;}
.bar-row{display:grid; grid-template-columns:120px 1fr 34px; gap:10px; align-items:center; font-size:12.5px;}
.bar-track{background:var(--sage-pale); border-radius:6px; height:10px; overflow:hidden;}
.bar-fill{height:100%; background:var(--brown); border-radius:6px;}

/* Detail drawer */
.drawer-backdrop{position:fixed; inset:0; background:rgba(51,54,47,.4); z-index:90;}
.drawer{position:fixed; top:0; right:0; bottom:0; width:420px; max-width:92vw; background:#fff; z-index:91; box-shadow:-10px 0 40px rgba(0,0,0,.15); overflow-y:auto; animation:slidein .18s ease;}
@keyframes slidein{from{transform:translateX(16px); opacity:.6;} to{transform:none; opacity:1;}}
.drawer-head{padding:22px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:flex-start; background:var(--sage-pale);}
.drawer-head h2{margin:0 0 4px; font-size:20px;}
.drawer-body{padding:22px;}
.drawer-sub{color:var(--ink-soft); font-size:13px;}

.tabs{display:flex; gap:4px; border-bottom:1px solid var(--line); margin-bottom:16px; flex-wrap:wrap;}
.cal-grid{display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:3px; background:transparent; border:none; border-radius:12px;}
.cal-head{text-align:center; font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-soft); padding:10px 0; background:var(--sage-pale); border-radius:8px;}
.cal-cell{background:#fff; border:1px solid var(--line); border-radius:9px; min-height:150px; padding:7px 6px; cursor:pointer; transition:background .12s; display:flex; flex-direction:column;}
.cal-cell:hover{background:var(--sage-pale);}
.cal-cell.cal-empty{background:transparent; border:none; cursor:default;}
.cal-cell.cal-hoje{background:#F3F8F1; border-color:var(--sage-dark);}
.cal-daynum{font-size:12px; font-weight:800; color:var(--ink-soft); margin-bottom:5px; width:22px; height:22px; display:flex; align-items:center; justify-content:center; border-radius:50%;}
.cal-cell.cal-hoje .cal-daynum{background:var(--sage-dark); color:#fff;}
.cal-events{display:flex; flex-direction:column; gap:3px; flex:1;}
.cal-event{font-size:10px; padding:4px 7px; border-radius:7px; overflow:hidden; font-weight:700; color:#fff !important; line-height:1.35; margin-bottom:2px;}
.cal-event-l3{overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-weight:500; opacity:.85; font-size:8.5px;}
.cal-event-l1{overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.cal-event-l2{overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-weight:500; opacity:.9; font-size:9px;}
.cal-more{font-size:10px; color:var(--ink-soft); font-weight:700; padding-left:3px; margin-top:1px;}
.cal-dots{display:none; gap:3px; flex-wrap:wrap; margin-top:2px;}
.cal-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;}
@media (max-width:760px){
  .cal-grid{border-radius:8px; gap:1px;}
  .cal-cell{min-height:52px; padding:4px;}
  .cal-daynum{width:19px;height:19px; font-size:11px;}
  .cal-event{display:none;}
  .cal-dots{display:flex;}
  .cal-daynum{margin-bottom:2px;}
}
.tab{padding:9px 14px; font-size:13px; font-weight:700; color:var(--ink-soft); cursor:pointer; border-bottom:2px solid transparent; background:none; border-top:none; border-left:none; border-right:none;}
.tab.active{color:var(--sage-dark); border-bottom-color:var(--sage-dark);}

.toast-wrap{position:fixed; bottom:20px; right:20px; z-index:200; display:flex; flex-direction:column; gap:8px;}
.toast{background:var(--ink); color:#fff; padding:11px 16px; border-radius:10px; font-size:13px; font-weight:600; box-shadow:0 8px 24px rgba(0,0,0,.25); animation:toastin .18s ease;}
@keyframes toastin{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;}}

.mobile-toggle{display:none;}
.gsr-panel{position:absolute; top:calc(100% + 8px); left:0; right:0; background:#fff; border:1px solid var(--line); border-radius:12px; box-shadow:0 16px 40px rgba(0,0,0,.14); max-height:420px; overflow-y:auto; z-index:50; display:none;}
.gsr-panel.show{display:block;}
.gsr-item{padding:12px 16px; border-bottom:1px solid #F1EEE4; cursor:pointer;}
.gsr-item:last-child{border-bottom:none;}
.gsr-item:hover{background:var(--sage-pale);}
.gsr-name{font-weight:700; font-size:13.5px; color:var(--ink); display:flex; align-items:center; gap:8px;}
.gsr-meta{font-size:12px; color:var(--ink-soft); margin-top:3px; display:flex; flex-wrap:wrap; gap:10px;}
.gsr-empty{padding:18px 16px; font-size:13px; color:var(--ink-soft); text-align:center;}
.dash-nav{display:flex; align-items:center; justify-content:space-between; gap:12px; background:#fff; border:1px solid var(--line); border-radius:12px; padding:8px 10px; margin-bottom:18px; flex-wrap:wrap;}
.dash-nav-gran{display:flex; background:var(--sage-pale); border-radius:9px; padding:3px; gap:2px;}
.dgran{border:none; background:none; padding:6px 13px; border-radius:7px; font-size:12.5px; font-weight:700; color:var(--ink-soft); cursor:pointer; font-family:'Manrope',sans-serif;}
.dgran.active{background:#fff; color:var(--sage-dark); box-shadow:0 1px 3px rgba(0,0,0,.08);}
.dash-nav-ctrl{display:flex; align-items:center; gap:4px; position:relative;}
.dash-nav-label{border:none; background:none; font-family:'Fraunces',serif; font-size:14.5px; font-weight:600; color:var(--ink); padding:6px 8px; cursor:pointer; border-radius:8px;}
.dash-nav-label:hover{background:var(--sage-pale);}
.dash-greeting{margin-bottom:16px;}
.dash-greeting-title{font-family:'Fraunces',serif; font-size:24px; font-weight:600; color:var(--ink);}
.dash-greeting-sub{font-size:13px; color:var(--ink-soft); margin-top:2px;}
.pend-summary{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:10px;}
.pend-chip{background:var(--brown-pale); color:var(--brown-dark); font-size:11.5px; font-weight:700; padding:4px 10px; border-radius:20px;}
.pend-chip b{font-weight:800;}
.pend-list{max-height:190px; overflow-y:auto; border-top:1px solid #F1EEE4;}
.pend-row{display:flex; align-items:center; gap:8px; font-size:12.5px; padding:7px 2px; cursor:pointer; border-bottom:1px solid #F1EEE4; line-height:1.3;}
.pend-row:hover{color:var(--sage-dark); background:var(--sage-pale);}
.pend-row:last-child{border-bottom:none;}
.pend-tipo{font-size:10px; font-weight:800; text-transform:uppercase; letter-spacing:.03em; color:var(--brown-dark); background:var(--brown-light); padding:2px 7px; border-radius:20px; flex-shrink:0;}
.pend-dot{width:5px;height:5px;border-radius:50%;background:var(--brown); flex-shrink:0;}
@media (max-width:880px){
  .sidebar{left:-230px; z-index:99; transition:left .2s ease; box-shadow:0 0 40px rgba(0,0,0,.2);}
  .sidebar.open{left:0;}
  .mobile-toggle{display:flex;}
  main{margin-left:0;}
  .topbar{padding:12px 16px; flex-wrap:wrap;}
  .search-global{order:3; width:100%; min-width:0; margin-top:2px;}
  #quickLinksBar{order:2;}
  .view{padding:14px 14px 50px;}
  .field-row{grid-template-columns:1fr;}
  .card.pad, .pad{padding:16px;}
  .card{margin-bottom:0;}
  .section-title{font-size:14.5px; margin-bottom:10px;}
  .dash-greeting-title{font-size:20px;}
  .stat-card{padding:14px 16px;}
  .stat-card .value{font-size:26px;}
  .view .card{margin-bottom:14px !important;}
  .view .grid{grid-template-columns:1fr !important;}
  .view .grid.g3, .view .grid.g4{grid-template-columns:repeat(2,minmax(0,1fr)) !important; gap:10px !important;}
  .view .grid.g3 > :last-child:nth-child(odd){grid-column:1/-1;}
  .hide-md{display:none;}
  .table-wrap td, .table-wrap th{padding-left:8px; padding-right:8px;}
}
.sidebar-scrim{display:none; position:fixed; inset:0; background:rgba(0,0,0,.3); z-index:98;}
.sidebar-scrim.show{display:block;}

/* ---------- Tela de login ---------- */
.app-hidden{display:none !important;}
.initial-loader{position:fixed; inset:0; background:var(--cream); display:flex; flex-direction:column; align-items:center; justify-content:center; z-index:500; padding:20px;}
.spinner{width:34px;height:34px;border:3px solid var(--sage-light); border-top-color:var(--sage-dark); border-radius:50%; animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.login-screen{
  min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;
  background:linear-gradient(160deg,var(--sage-pale),var(--cream) 60%,var(--brown-pale));
}
.login-screen.hide{display:none;}
.login-card{width:100%; max-width:400px; background:#fff; border:1px solid var(--line); border-radius:20px; box-shadow:0 20px 60px -12px rgba(51,54,47,.18); padding:32px 28px;}
.login-brand{display:flex; align-items:center; gap:12px; margin-bottom:26px;}
.login-brand svg{width:46px; height:46px;}
.login-brand-text{font-family:'Fraunces',serif; font-size:22px; font-weight:600; color:var(--ink);}
.login-brand-sub{font-size:12px; color:var(--ink-soft); font-weight:600;}
.login-title{font-family:'Fraunces',serif; font-size:19px; font-weight:600; margin-bottom:4px;}
.login-sub{font-size:13px; color:var(--ink-soft); margin-bottom:20px;}
.profile-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin-bottom:10px;}
.profile-card{display:flex; flex-direction:column; align-items:center; gap:8px; background:none; border:none; cursor:pointer; padding:10px 4px; border-radius:12px;}
.profile-card:hover{background:var(--sage-pale);}
.profile-card .name{font-size:12px; font-weight:700; color:var(--ink); text-align:center; line-height:1.25;}
.profile-add{display:flex; flex-direction:column; align-items:center; gap:8px; background:none; border:2px dashed var(--line); cursor:pointer; padding:10px 4px; border-radius:12px; color:var(--ink-soft);}
.profile-add:hover{border-color:var(--sage); color:var(--sage-dark);}
.profile-add-icon{width:44px;height:44px;border-radius:50%;border:2px dashed var(--line); display:flex; align-items:center; justify-content:center;}
.pin-dots{display:flex; gap:12px; justify-content:center; margin:18px 0;}
.pin-dot{width:14px;height:14px;border-radius:50%; border:2px solid var(--line); background:#fff;}
.pin-dot.filled{background:var(--sage-dark); border-color:var(--sage-dark);}
.pin-keypad{display:grid; grid-template-columns:repeat(3,1fr); gap:10px;}
.pin-key{padding:14px 0; border-radius:12px; border:1px solid var(--line); background:#fff; font-size:17px; font-weight:700; cursor:pointer; font-family:'Fraunces',serif; color:var(--ink);}
.pin-key:hover{background:var(--sage-pale);}
.pin-key.wide{grid-column:span 1; font-size:12px; font-family:'Manrope',sans-serif; color:var(--ink-soft);}
.login-back{background:none; border:none; color:var(--ink-soft); font-size:12.5px; font-weight:700; cursor:pointer; display:flex; align-items:center; gap:5px; margin-bottom:14px; padding:0;}
.login-back:hover{color:var(--ink);}
.login-divider{display:flex; align-items:center; gap:10px; margin:16px 0; font-size:11.5px; color:var(--ink-faint); font-weight:700; text-transform:uppercase; letter-spacing:.04em;}
.login-divider::before,.login-divider::after{content:''; flex:1; height:1px; background:var(--line);}
.login-link{background:none; border:none; color:var(--sage-dark); font-size:12.5px; font-weight:700; cursor:pointer; padding:2px;}
.login-link:hover{text-decoration:underline;}
.login-error{background:var(--st-cancelado-bg); color:var(--st-cancelado); font-size:12.5px; font-weight:600; padding:9px 12px; border-radius:9px; margin-top:12px;}
.account-row{display:flex; align-items:center; gap:12px; background:var(--sage-pale); border-radius:12px; padding:12px 14px;}
.stat-card.clicavel{cursor:pointer; transition:transform .18s, box-shadow .18s;} .stat-card.clicavel:hover{transform:translateY(-2px); box-shadow:0 6px 16px rgba(90,60,30,.12);} .stat-card.clicavel:focus-visible{outline:2px solid var(--brown); outline-offset:2px;}
th.sortavel{cursor:pointer; user-select:none;} th.sortavel:hover{color:var(--brown);}
th.sortavel[data-dir=asc]::after{content:' \2191'; font-size:11px;} th.sortavel[data-dir=desc]::after{content:' \2193'; font-size:11px;}
.table-wrap{cursor:grab;} .table-wrap.arrastando{cursor:grabbing; user-select:none;}
.semanas-tab tr.semana-atual td{background:#F6EFE0;} .semanas-tab .rowlink{cursor:pointer;}
.rel-det-cli{font-size:12.5px; color:var(--ink-soft); margin-top:3px;}
</style>
</head>
<body>

<div id="initialLoader" class="initial-loader">

/* ---------- Persistência ---------- */
const DB_KEY = 'olhatta_db_v1';
function blankDB(){
  return { tutores:[], animais:[], vinculos:[], agendamentos:[], contatos:[], lembretes:[],
    usuarios:[{id:'u_default', nome:'Recepção', foto:null}], auditLog:[], lixeira:[], metas:[],
    notasFiscais:[], categoriasNF:['Consulta','Cirurgia','Medicamento','Colírio','Material cirúrgico','Outro'],
    relatorios:[], relatObs:{}, avaliacoes:[], profissionais:[], linksRapidos:[], pendencias:[],
    motivosPadrao:['Preço','Não respondeu','Vai pensar','Procurou outra clínica','Não tinha disponibilidade','Outro motivo'],
    tiposAtendimento:[
      {nome:'Consulta', cor:'#3F7FBF'}, {nome:'Acompanhamento', cor:'#3F7FBF'},
      {nome:'Retorno', cor:'#D9679B'}, {nome:'Segmento', cor:'#E08A2E'},
      {nome:'Cirurgia', cor:'#E0B929'}, {nome:'Exame', cor:'#EDD888'},
      {nome:'Retirada de pontos', cor:'#8A6647'}
    ],
    cidadesClinicas:{'Sinop':['Olhatta','Volante','Equibem','Outro'], 'Lucas':['Pet Center','Espaço Pet','Outro']},
    meta:{criadoEm:Date.now(), proximoCodigoTutor:1} };
}
let DB = loadDB();
function loadDB(){
  try{
    const raw = localStorage.getItem(DB_KEY);
    if(!raw) return blankDB();
    const parsed = JSON.parse(raw);
    const db = Object.assign(blankDB(), parsed);
    // migração: versões antigas guardavam usuarios como lista de nomes (strings)
    if(db.usuarios && db.usuarios.length && typeof db.usuarios[0]==='string'){
      db.usuarios = db.usuarios.map(nome=>({id:uid(), nome, foto:null}));
    }
    if(!db.usuarios || !db.usuarios.length) db.usuarios=[{id:'u_default', nome:'Recepção', foto:null}];
    return db;
  }catch(e){ console.error('Erro ao carregar dados', e); return blankDB(); }
}
function saveDB(){
  localStorage.setItem(DB_KEY, JSON.stringify(DB));
  pushToFirestore();
}
function pushToFirestore(){
  if(!auth.currentUser) return;
  clearTimeout(firestoreSyncTimer);
  firestoreSyncTimer = setTimeout(()=>{
    FIRESTORE_DOC.set(DB).catch(e=>{ console.error('Erro ao sincronizar', e); toast('Não foi possível sincronizar com a nuvem'); });
  }, 500);
}
function pushToFirestoreImmediate(){
  if(!auth.currentUser) return Promise.resolve();
  return FIRESTORE_DOC.set(DB).catch(e=>console.error('Erro ao sincronizar', e));
}
function uid(){ return 'id' + Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
function maskTelefone(v){
  if(!v) return v;
  if(v.includes('+')) return v; // número internacional (com +), não mexe
  const d = v.replace(/\D/g,'');
  if(d.length>11) return v; // mais dígitos que um celular brasileiro, deixa a pessoa digitar do jeito que quiser
  if(d.length<=2) return d;
  if(d.length<=3) return d.slice(0,2)+' '+d.slice(2);
  if(d.length<=7) return d.slice(0,2)+' '+d.slice(2,3)+' '+d.slice(3);
  return d.slice(0,2)+' '+d.slice(2,3)+' '+d.slice(3,7)+' '+d.slice(7);
}
function aplicarMascaraTelefone(input){
  if(!input) return;
  input.addEventListener('input', ()=>{
    const cursorNoFim = input.selectionEnd===input.value.length;
    input.value = maskTelefone(input.value);
    if(cursorNoFim) input.setSelectionRange(input.value.length, input.value.length);
  });
}

/* ---------- Usuário atual ---------- */
const CURRENT_USER_KEY = 'olhatta_current_user_id';
function getCurrentUserObj(){
  if(!DB.usuarios || !DB.usuarios.length) DB.usuarios=[{id:'u_default', nome:'Recepção', foto:null}];
  const savedId = localStorage.getItem(CURRENT_USER_KEY);
  let u = DB.usuarios.find(x=>x.id===savedId);
  if(!u) u = DB.usuarios.find(x=>x.nome===savedId); // compatibilidade com versão antiga (guardava o nome)
  if(!u) u = DB.usuarios[0];
  return u;
}
function getCurrentUser(){ return getCurrentUserObj().nome; }
function setCurrentUser(id){ localStorage.setItem(CURRENT_USER_KEY, id); }

/* ---------- Vínculo do perfil local com a conta Firebase ---------- */
function ensureLocalProfile(fbUser){
  DB.usuarios = DB.usuarios||[];
  if(DB.usuarios.length===0){
    const u = {id:uid(), nome:fbUser.displayName || (fbUser.email?fbUser.email.split('@')[0]:'Usuário'), foto:fbUser.photoURL||null};
    DB.usuarios.push(u);
    setCurrentUser(u.id);
    return true;
  }
  const current = getCurrentUserObj();
  if(!current || !DB.usuarios.some(x=>x.id===current.id)){
    setCurrentUser(DB.usuarios[0].id);
  }
  return false;
}

/* ---------- Sincronização em tempo real com o Firestore ---------- */
function showProfilePicker(){
  hideInitialLoader();
  document.getElementById('app').classList.add('app-hidden');
  document.getElementById('loginScreen').classList.remove('hide');
  const body = document.getElementById('loginBody');
  if(!DB.usuarios || !DB.usuarios.length) DB.usuarios=[{id:'u_default', nome:'Recepção', foto:null}];
  body.innerHTML = `
    <div class="login-title">Quem está usando o sistema?</div>
    <div class="login-sub">Escolha seu perfil para continuar.</div>
    <div class="profile-grid">
      ${DB.usuarios.map(u=>`<button type="button" class="profile-card" data-pick-profile="${u.id}">${avatarHtml(u,52)}<span class="name">${u.nome}</span></button>`).join('')}
    </div>`;
  body.querySelectorAll('[data-pick-profile]').forEach(el=>el.addEventListener('click', ()=>{
    const u = DB.usuarios.find(x=>x.id===el.dataset.pickProfile);
    setCurrentUser(el.dataset.pickProfile);
    logAction(`entrou no sistema (${u?u.nome:'usuário'})`);
    saveDB();
    showApp();
  }));
}
function attachFirestoreListener(fbUser){
  unsubscribeSnapshot = FIRESTORE_DOC.onSnapshot(doc=>{
    const existed = doc.exists;
    if(existed){
      DB = Object.assign(blankDB(), doc.data());
    }
    else {
      DB = blankDB();
    }
    DB.motivosPadrao = DB.motivosPadrao||[];
    if(!DB.motivosPadrao.includes('Outro motivo')) DB.motivosPadrao.push('Outro motivo');
    const profileChanged = ensureLocalProfile(fbUser);
    localStorage.setItem(DB_KEY, JSON.stringify(DB));
    if(!existed || profileChanged){ pushToFirestoreImmediate(); }
    if(!state.__appShown){ state.__appShown = true; showProfilePicker(); }
    else if(pendenciasDirty && state.view==='pendencias'){ /* evita apagar anotação não salva ao chegar uma atualização remota */ }
    else { render(); renderUserSelect(); }
  }, err=>{
    console.error(err);
    showLoginError('Não foi possível conectar ao banco de dados na nuvem. Verifique se o Firestore foi criado e as regras permitem acesso.');
  });
}
function detachFirestoreListener(){
  if(unsubscribeSnapshot){ unsubscribeSnapshot(); unsubscribeSnapshot=null; }
  state.__appShown = false;
}

/* ---------- Histórico de alterações ---------- */
function logAction(acao){
  DB.auditLog = DB.auditLog||[];
  DB.auditLog.push({id:uid(), usuario:getCurrentUser(), dataHora:new Date().toISOString(), acao});
  if(DB.auditLog.length>500) DB.auditLog = DB.auditLog.slice(-500);
}
function fmtDateTime(iso){
  if(!iso) return '—';
  return new Date(iso).toLocaleString('pt-BR', {day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});
}

/* ---------- Lixeira (exclusão reversível) ---------- */
function moveToTrash(tipo, dados, extra, loteId){
  DB.lixeira = DB.lixeira||[];
  DB.lixeira.unshift({id:uid(), tipo, dados, extra:extra||null, loteId:loteId||null, excluidoEm:new Date().toISOString(), excluidoPor:getCurrentUser()});
}
function restoreFromTrash(id){
  const item = (DB.lixeira||[]).find(x=>x.id===id); if(!item) return;
  const grupo = item.loteId ? (DB.lixeira||[]).filter(x=>x.loteId===item.loteId) : [item];
  // restaura tutores/animais primeiro (pra vínculos funcionarem), depois o resto
  const ordem = {tutor:0, animal:1, agendamento:2, contato:3, lembrete:4, nf:5};
  grupo.slice().sort((a,b)=>(ordem[a.tipo]??9)-(ordem[b.tipo]??9)).forEach(it=>{
    if(it.tipo==='tutor'){ DB.tutores.push(it.dados); (it.extra||[]).forEach(v=>DB.vinculos.push(v)); }
    else if(it.tipo==='animal'){ DB.animais.push(it.dados); (it.extra||[]).forEach(v=>DB.vinculos.push(v)); }
    else if(it.tipo==='agendamento'){ DB.agendamentos.push(it.dados); }
    else if(it.tipo==='contato'){ DB.contatos.push(it.dados); }
    else if(it.tipo==='lembrete'){ DB.lembretes.push(it.dados); }
    else if(it.tipo==='nf'){ DB.notasFiscais.push(it.dados); }
  });
  const idsGrupo = new Set(grupo.map(x=>x.id));
  DB.lixeira = DB.lixeira.filter(x=>!idsGrupo.has(x.id));
  logAction(grupo.length>1 ? `restaurou "${trashLabel(item)}" e ${grupo.length-1} registro(s) vinculado(s) da lixeira` : `restaurou "${trashLabel(item)}" da lixeira`);
  saveDB();
}
function trashLabel(item){
  if(item.tipo==='tutor') return item.dados.nome;
  if(item.tipo==='animal') return item.dados.nome;
  if(item.tipo==='agendamento') return `${item.dados.tipo} — ${fmtDate(item.dados.data)}`;
  if(item.tipo==='contato') return `Contato — ${fmtDate(item.dados.dataContato)}`;
  if(item.tipo==='lembrete') return item.dados.titulo;
  if(item.tipo==='nf') return `Nota fiscal — ${fmtDate(item.dados.data)}`;
  return item.tipo;
}
function agruparLixeira(lixeira){
  const mapa = new Map();
  lixeira.forEach(item=>{
    const key = item.loteId || item.id;
    if(!mapa.has(key)) mapa.set(key, []);
    mapa.get(key).push(item);
  });
  return [...mapa.values()];
}
function resumoLote(grupo){
  if(grupo.length<=1) return '';
  const nomes = {tutor:'tutor', animal:'animal', agendamento:'agendamento', contato:'contato', nf:'nota fiscal', lembrete:'lembrete'};
  const contagem = {};
  grupo.slice(1).forEach(it=>{ contagem[it.tipo]=(contagem[it.tipo]||0)+1; });
  const partes = Object.entries(contagem).map(([t,n])=>`${n} ${nomes[t]||t}${n>1?'s':''}`);
  return partes.length? ' · + '+partes.join(', ') : '';
}
function purgeFromTrash(id){
  const item = (DB.lixeira||[]).find(x=>x.id===id); if(!item) return;
  DB.lixeira = item.loteId ? DB.lixeira.filter(x=>x.loteId!==item.loteId) : DB.lixeira.filter(x=>x.id!==id);
}

/* ---------- CSV ---------- */
function toCSV(rows, headers){
  const esc = v => `"${String(v??'').replace(/"/g,'""')}"`;
  const lines = [headers.map(h=>esc(h.label)).join(',')];
  rows.forEach(r=> lines.push(headers.map(h=>esc(h.get(r))).join(',')));
  return lines.join('\r\n');
}
function downloadCSV(filename, content){
  const blob = new Blob(['\uFEFF'+content], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url; a.download=filename; a.click();
  URL.revokeObjectURL(url);
}
function exportCSV(tipo){
  let headers, rows, filename;
  if(tipo==='tutores'){ headers=[{label:'Nome',get:r=>r.nome},{label:'Telefone',get:r=>r.telefone},{label:'Cidade',get:r=>r.cidade||''},{label:'Clínica',get:r=>r.clinica||''},{label:'Observações',get:r=>r.obs||''}]; rows=DB.tutores; filename='olhatta-tutores.csv'; }
  else if(tipo==='animais'){ headers=[{label:'Nome',get:r=>r.nome},{label:'Espécie',get:r=>r.especie||''},{label:'Sexo',get:r=>r.sexo||''},{label:'Óbito',get:r=>r.obito?'Sim':'Não'},{label:'Tutor(es)',get:r=>tutoresDoAnimal(r.id).map(t=>t.nome).join('; ')},{label:'Observações',get:r=>r.obs||''}]; rows=DB.animais; filename='olhatta-animais.csv'; }
  else if(tipo==='agendamentos'){ headers=[{label:'Data',get:r=>r.data},{label:'Horário',get:r=>r.horario},{label:'Tutor',get:r=>tutorById(r.tutorId)?.nome||''},{label:'Animal',get:r=>animalById(r.animalId)?.nome||''},{label:'Tipo',get:r=>r.tipo},{label:'Status',get:r=>STATUS_LABELS[r.status]||r.status},{label:'Cidade',get:r=>r.cidade||''},{label:'Clínica',get:r=>r.clinica||''},{label:'Indicação',get:r=>indicacaoLabel(r)||''},{label:'Agendado por',get:r=>r.usuarioResponsavel||''},{label:'Data do contato',get:r=>r.dataContato||''},{label:'Retorno previsto',get:r=>r.retornoPrevisto||''},{label:'Motivo status',get:r=>r.motivoStatus||''},{label:'Observações',get:r=>r.observacoes||''}]; rows=DB.agendamentos; filename='olhatta-agendamentos.csv'; }
  else if(tipo==='contatos'){ headers=[{label:'Data',get:r=>r.dataContato},{label:'Origem',get:r=>r.origem||'Recebido'},{label:'Tipo de atendimento',get:r=>r.tipoAtendimento||''},{label:'Tutor',get:r=>r.tutorId?(tutorById(r.tutorId)?.nome||''):(r.nomeAvulso||'')},{label:'Animal',get:r=>r.animalId?(animalById(r.animalId)?.nome||''):(r.animalAvulso||'')},{label:'Telefone',get:r=>r.telefone||''},{label:'Cidade',get:r=>r.cidade||''},{label:'Clínica',get:r=>r.clinica||''},{label:'Status',get:r=>r.status},{label:'Motivo',get:r=>r.motivoNaoAgendamento||''},{label:'Indicação',get:r=>indicacaoLabel(r)||''},{label:'Tentativas',get:r=>1+(r.tentativas?.length||0)}]; rows=DB.contatos; filename='olhatta-contatos.csv'; }
  else if(tipo==='lembretes'){ headers=[{label:'Título',get:r=>r.titulo},{label:'Data',get:r=>r.data},{label:'Horário',get:r=>r.horario||''},{label:'Vinculado a (tutor)',get:r=>r.tutorId?(tutorById(r.tutorId)?.nome||''):''},{label:'Vinculado a (animal)',get:r=>r.animalId?(animalById(r.animalId)?.nome||''):''},{label:'Observação',get:r=>r.observacao||''},{label:'Concluído',get:r=>r.concluido?'Sim':'Não'}]; rows=DB.lembretes; filename='olhatta-lembretes.csv'; }
  else if(tipo==='alteracoes'){ headers=[{label:'Data/Hora',get:r=>fmtDateTime(r.dataHora)},{label:'Usuário',get:r=>r.usuario},{label:'Ação',get:r=>r.acao}]; rows=(DB.auditLog||[]).slice().reverse(); filename='olhatta-historico-alteracoes.csv'; }
  else return;
  downloadCSV(filename, toCSV(rows, headers));
  toast('CSV exportado');
}

/* ---------- Helpers de data ---------- */
function todayISO(){ return new Date().toISOString().slice(0,10); }
function stripHtml(html){ const d = document.createElement('div'); d.innerHTML = html||''; return d.textContent||''; }
function fmtDate(iso){
  if(!iso) return '—';
  const [y,m,d]=iso.split('-'); return `${d}/${m}/${y}`;
}
function fmtDateLong(iso){
  if(!iso) return '—';
  const d = new Date(iso+'T00:00:00');
  return d.toLocaleDateString('pt-BR',{weekday:'long', day:'2-digit', month:'long'});
}
function daysBetween(a,b){ return Math.round((new Date(b)-new Date(a))/86400000); }
function addDays(iso,n){ const d=new Date(iso+'T00:00:00'); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); }
function monthKey(iso){ return iso.slice(0,7); }
function isThisMonth(iso){ return monthKey(iso)===monthKey(todayISO()); }
function prevMonthKey(){ const d=new Date(); d.setMonth(d.getMonth()-1); return d.toISOString().slice(0,7); }

/* ---------- Toast ---------- */
function toast(msg){
  const wrap=document.getElementById('toastWrap');
  const el=document.createElement('div'); el.className='toast'; el.textContent=msg;
  wrap.appendChild(el);
  setTimeout(()=>{ el.style.transition='opacity .3s'; el.style.opacity='0'; setTimeout(()=>el.remove(),300); },2600);
}

/* ---------- Navegador de datas do Dashboard ---------- */
function dashStep(dir){
  const g = state.dash.granularity, d = state.dash.refDate;
  if(g==='dia') return addDays(d, dir);
  if(g==='mes'){ const dt=new Date(d+'T00:00:00'); dt.setMonth(dt.getMonth()+dir); return dt.toISOString().slice(0,10); }
  const dt=new Date(d+'T00:00:00'); dt.setFullYear(dt.getFullYear()+dir); return dt.toISOString().slice(0,10);
}
function inRefPeriod(iso){
  if(!iso) return false;
  const g = state.dash.granularity, d = state.dash.refDate;
  if(g==='dia') return iso===d;
  if(g==='mes') return monthKey(iso)===monthKey(d);
  return iso.slice(0,4)===d.slice(0,4);
}
function inPrevRefPeriod(iso){
  if(!iso) return false;
  const g = state.dash.granularity, d = state.dash.refDate;
  if(g==='dia') return iso===addDays(d,-1);
  if(g==='mes'){ const dt=new Date(d+'T00:00:00'); dt.setMonth(dt.getMonth()-1); return monthKey(iso)===dt.toISOString().slice(0,7); }
  return iso.slice(0,4)===String(Number(d.slice(0,4))-1);
}
function dashPeriodLabel(){
  const g = state.dash.granularity, d = state.dash.refDate;
  if(g==='dia') return fmtDateLong(d).replace(/^\w/,c=>c.toUpperCase());
  if(g==='mes'){ const dt=new Date(d+'T00:00:00'); const l=dt.toLocaleDateString('pt-BR',{month:'long',year:'numeric'}); return l.replace(/^\w/,c=>c.toUpperCase()); }
  return d.slice(0,4);
}
function dashPeriodTag(){
  const g = state.dash.granularity, d = state.dash.refDate, real = todayISO();
  if(g==='dia') return d===real?'hoje':fmtDate(d);
  if(g==='mes') return monthKey(d)===monthKey(real)?'este mês':dashPeriodLabel();
  return d.slice(0,4)===real.slice(0,4)?'este ano':d.slice(0,4);
}

function avatarHtml(user, size){
  size = size||28;
  if(user && user.foto){
    return `<img src="${user.foto}" style="width:${size}px;height:${size}px;border-radius:50%;object-fit:cover;flex-shrink:0;">`;
  }
  const iniciais = (user?.nome||'?').trim().split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase();
  return `<div style="width:${size}px;height:${size}px;border-radius:50%;background:var(--brown);color:#fff;display:flex;align-items:center;justify-content:center;font-size:${Math.round(size*0.4)}px;font-weight:700;flex-shrink:0;font-family:'Fraunces',serif;">${iniciais}</div>`;
}

function updatePendenciasToolbarState(){
  const editor = document.getElementById('pendenciasTextarea');
  const map = {pendenciasBoldBtn:'bold', pendenciasItalicBtn:'italic', pendenciasUnderlineBtn:'underline'};
  if(!editor || document.activeElement!==editor){
    Object.keys(map).forEach(id=>document.getElementById(id)?.classList.remove('active'));
    return;
  }
  Object.entries(map).forEach(([id,cmd])=>{
    const btn = document.getElementById(id);
    if(!btn) return;
    let state = false;
    try{ state = document.queryCommandState(cmd); }catch(e){}
    btn.classList.toggle('active', state);
  });
}
function salvarAnotacaoAtual(mostrarToast){
  const el = document.getElementById('pendenciasTextarea');
  if(!el) return;
  const html = el.innerHTML;
  const dataRef = state.dash.refDate;
  DB.pendencias = DB.pendencias||[];
  let entrada = DB.pendencias.find(p=>p.data===dataRef);
  if(!entrada){ entrada = {id:uid(), data:dataRef, texto:'', criadoPor:getCurrentUser(), criadoEm:new Date().toISOString()}; DB.pendencias.push(entrada); }
  entrada.texto = html;
  entrada.alteradoEm = new Date().toISOString();
  saveDB();
  pendenciasDirty = false;
  const indicador = document.getElementById('pendenciasSalvoIndicador');
  if(indicador) indicador.textContent = 'Salvo às '+new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
  const btnExcluir = document.getElementById('pendenciasExcluirBtn');
  if(btnExcluir) btnExcluir.disabled = false;
  if(mostrarToast) toast('Anotação salva');
}

function guardarSaidaAnotacoes(acao){

}
function confirmarSairSemSalvarAnotacao(depois){
  const html = modalShell('Alterações não salvas', `<p style="font-size:14px;">Suas alterações na anotação não foram salvas. Deseja salvar?</p>`,
    `<button class="btn btn-secondary" id="btnNaoSalvarSair">Não</button><button class="btn btn-primary" id="btnSimSalvarSair">Sim</button>`);

  document.getElementById('modalClose').addEventListener('click', closeModal);
  document.getElementById('btnNaoSalvarSair').addEventListener('click', ()=>{ pendenciasDirty=false; closeModal(); depois(); });
  document.getElementById('btnSimSalvarSair').addEventListener('click', ()=>{ salvarAnotacaoAtual(false); closeModal(); depois(); });

  notasfiscais:{get:()=>notasFiscaisTab!=='notas'?notasFiscaisTab:'', set:v=>{notasFiscaisTab=v==='categorias'?'categorias':'notas';}},

function rotaAtual(){
  const sub = ROTA_SUB[state.view] ? ROTA_SUB[state.view].get() : '';
  return '#/'+state.view+(sub?'/'+sub:'');
}
let __aplicandoRota = false;
function aplicarRota(hash){
  const m = /^#\/([a-z]+)(?:\/([A-Za-z-]+))?/.exec(hash||'');
  if(!m || !VIEWS.some(v=>v.id===m[1])) return false;
  __aplicandoRota = true;
  try{
    if(ROTA_SUB[m[1]]) ROTA_SUB[m[1]].set(m[2]||'');
    goTo(m[1], {fromPop:true});
  } finally { __aplicandoRota = false; }
  return true;
}
function atualizarTituloAba(){
  const v = VIEWS.find(x=>x.id===state.view);
  document.title = (v && v.id!=='dashboard') ? `${v.label} · Olhatta` : 'Olhatta';
}
function sincronizarRota(){
  if(!window.__histPronto || __aplicandoRota) return;
  const r = rotaAtual();
  if(location.hash!==r){ try{ history.pushState({olh:1}, '', r); }catch(e){} }
}
function goTo(viewId, opts){
  opts = opts||{};
  if(state.view==='pendencias' && pendenciasDirty && viewId!=='pendencias'){
    confirmarSairSemSalvarAnotacao(()=>goTo(viewId, opts));
    return;
  }
  const mudou = viewId!==state.view;
  scrollPorTela[state.view] = window.scrollY;
  state.view = viewId; state.drawer=null;
  renderNav();
  const v = VIEWS.find(x=>x.id===viewId);
  document.getElementById('pageTitle').textContent = v.label;
  document.getElementById('pageSub').textContent = v.sub;
  document.querySelector('.search-global').style.display = viewId==='configuracoes' ? 'none' : '';
  render();
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('scrim').classList.remove('show');
  window.scrollTo(0, opts.fromPop ? (scrollPorTela[viewId]||0) : 0);
}

const _sa = t=>String(t==null?'':t).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
function globalSearchResults(q){
  const qRaw = q.trim();
  q = _sa(qRaw);
  if(q.length<2) return [];
  const qd = qRaw.replace(/\D/g,'');
  const telOk = tel => qd.length>=3 && String(tel||'').replace(/\D/g,'').includes(qd);
  const results = [];
  DB.tutores.forEach(t=>{
    const anims = animaisDoTutor(t.id);
    if(_sa(t.nome).includes(q) || telOk(t.telefone) || _sa(t.nome2).includes(q) || telOk(t.telefone2) || _sa(t.codigo).includes(q) || anims.some(a=>_sa(a.nome).includes(q))){
      results.push({tutor:t, animais:anims});
    }
  });
  DB.animais.forEach(a=>{
    if(_sa(a.nome).includes(q) && !results.some(r=>r.animais.some(x=>x.id===a.id))){
      const tuts = tutoresDoAnimal(a.id);
      if(tuts.length) tuts.forEach(t=>{ if(!results.some(r=>r.tutor.id===t.id)) results.push({tutor:t, animais:animaisDoTutor(t.id)}); });
      else results.push({tutor:null, animalSemTutor:a});
    }
  });
  const nfResults = (DB.notasFiscais||[]).filter(nf=>{
    const nome = nf.usarDadosTutor===false ? (nf.nomeAlternativo||'') : (tutorById(nf.tutorId)?.nome||'');
    return _sa(nome).includes(q);
  }).slice(0,5).map(nf=>({nf}));
  // agendamentos e contatos de quem ainda não tem cadastro, e lembretes
  const agResults = (DB.agendamentos||[]).filter(a=>!a.tutorId && (_sa(a.tutorAvulso).includes(q) || _sa(a.animalAvulso).includes(q) || telOk(a.telefoneAvulso)))
    .sort((a,b)=>b.data.localeCompare(a.data)).slice(0,5).map(ag=>({ag}));
  const ctResults = (DB.contatos||[]).filter(c=>!c.tutorId && (_sa(c.nomeAvulso).includes(q) || _sa(c.animalAvulso).includes(q) || telOk(c.telefone)))
    .sort((a,b)=>b.dataContato.localeCompare(a.dataContato)).slice(0,5).map(ct=>({ct}));
  const lbResults = (DB.lembretes||[]).filter(l=>_sa(l.titulo).includes(q) || _sa(l.descricao).includes(q)).slice(0,5).map(lb=>({lb}));
  return results.slice(0,8).concat(nfResults, agResults, ctResults, lbResults);
}
function renderGlobalSearchPanel(q){
  const panel = document.getElementById('globalSearchResults');
  const results = globalSearchResults(q);
  if(!q || q.trim().length<2){ panel.classList.remove('show'); panel.innerHTML=''; return; }
  if(!results.length){ panel.innerHTML = `<div class="gsr-empty">Nenhum resultado para "${q}"</div>`; panel.classList.add('show'); return; }
  panel.innerHTML = results.map(r=>{
    if(r.ag){
      const a=r.ag;
      return `<div class="gsr-item" data-gsr-ag="${a.id}"><div class="gsr-name">${ICONS.agenda} ${a.tutorAvulso||'—'}${a.animalAvulso?' · '+a.animalAvulso:''} <span class="pill-muted">Agendamento</span></div><div class="gsr-meta"><span>${fmtDate(a.data)} ${a.horario||''}</span><span>${a.tipo||''}</span><span>${a.status||''}</span></div></div>`;

    if(r.nf){

    }

    const proximoAt = agendamentosDoTutor(t.id).filter(a=>a.data>=todayISO() && ['Agendado','Confirmado','AguardandoConfirmacao'].includes(a.status)).sort((a,b)=>a.data.localeCompare(b.data))[0];
    const proximoLemb = DB.lembretes.filter(l=>!l.concluido && (l.tutorId===t.id || r.animais.some(a=>a.id===l.animalId))).sort((a,b)=>a.data.localeCompare(b.data))[0];
    const ui = getUltimaInteracao(t.id);
    return `<div class="gsr-item" data-gsr-tutor="${t.id}">
      <div class="gsr-name">${t.nome} ${t.codigo?`<span class="pill-muted">#${t.codigo}</span>`:''} ${t.telefone?`<span class="pill-muted">${t.telefone}</span>`:''}</div>
      <div class="gsr-meta">
        <span>Animais: ${r.animais.map(a=>a.nome).join(', ')||'—'}</span>
        <span>Último atendimento: ${ultimoAt?fmtDate(ultimoAt.data):'—'}</span>
        <span>Próximo: ${proximoAt?fmtDate(proximoAt.data):'—'}</span>
        <span>Lembrete: ${proximoLemb?fmtDate(proximoLemb.data):'—'}</span>
        <span>Últ. interação: ${ui?fmtDate(ui.data):'—'}</span>

    </div>`;
  }).join('');
  panel.classList.add('show');
}

function mensagemVars(ctx){

    const [hh,mm] = (a.horario||'00:00').split(':');

// Resultado real de um contato: considera o que aconteceu com o(s) agendamento(s) gerados a partir dele,
// não só o status gravado na hora do "Agendou". Assim desmarques e faltas passam a contar corretamente.
function contatoResultadoFinal(c){
  if(c.status!=='Agendado') return c.status;
  const agsDoContato = DB.agendamentos.filter(a=>a.contatoOrigemId===c.id);
  if(!agsDoContato.length) return 'Agendado';
  const prioridade = {Realizado:4, Agendado:3, Confirmado:3, AguardandoConfirmacao:3, Reagendado:3, Falta:2, Desmarcado:1, Cancelado:1};
  let melhor = agsDoContato[0];
  agsDoContato.forEach(a=>{ if((prioridade[a.status]||0) > (prioridade[melhor.status]||0)) melhor = a; });
  if(['Desmarcado','Cancelado'].includes(melhor.status)) return 'Desmarcado';
  if(melhor.status==='Falta') return 'Faltou';
  return 'Agendado';
}
function contatosDoTutor(tutorId){ return DB.contatos.filter(c=>c.tutorId===tutorId).sort((a,b)=>b.dataContato.localeCompare(a.dataContato)); }

/* ---------- Última interação (agendamento OU contato mais recente) ---------- */
function getUltimaInteracao(tutorId){
  const ags = agendamentosDoTutor(tutorId).map(a=>({data:a.alteradoEm?a.alteradoEm.slice(0,10):a.data, tipo:'agendamento', ref:a}));
  const contatos = contatosDoTutor(tutorId).map(c=>({data:c.dataContato, tipo:'contato', ref:c}));
  const all = [...ags, ...contatos].sort((a,b)=>b.data.localeCompare(a.data));
  if(!all.length) return null;
  const it = all[0];
  if(it.tipo==='agendamento'){
    const ag = it.ref;
    return {data:ag.data, tipoLabel:`Agendamento — ${ag.tipo}`, resultado:statusLabel(ag.status), motivo:ag.motivoStatus||''};
  } else {
    const c = it.ref;
    return {data:c.dataContato, tipoLabel: c.origem==='Realizado'?'Contato realizado pela clínica':'Contato recebido do tutor',
      resultado: c.status==='Agendado'?'Agendamento realizado':(c.status==='Não agendado'?'Não agendou':'Aguardando retorno'),
      motivo: c.motivoNaoAgendamento||''};
  }
}

    <div style="font-weight:700;">Última interação: ${fmtDate(ui.data)}</div>

    <div>Resultado: ${ui.resultado}</div>
    ${ui.motivo?`<div>Motivo: ${ui.motivo}</div>`:''}
  </div>`;
}

  `, `<button class="btn btn-secondary" id="modalCancel">Cancelar</button><button class="btn btn-primary" id="reagConfirmar">Confirmar reagendamento</button>`);
  openModal(html, {narrow:true});
  document.getElementById('modalClose').addEventListener('click', closeModal);
  document.getElementById('modalCancel').addEventListener('click', closeModal);
  document.getElementById('reagConfirmar').addEventListener('click', ()=>{
    const novaData = document.getElementById('reagNovaData').value;
    const novaHora = document.getElementById('reagNovaHora').value || ag.horario;
    const novaHoraFim = document.getElementById('reagNovaHoraFim').value || '';
    if(!novaData){ toast('Escolha a nova data'); return; }
    ag.reagendadoPara = novaData;
    // reagendar = desmarque do horário antigo + novo agendamento (o desmarque conta no ranking de quem tira espaço)
    if(!['Desmarcado','Cancelado','Falta'].includes(ag.status)){ ag.status='Desmarcado'; ag.dataOriginal = ag.dataOriginal||ag.data; ag.motivoStatus = document.getElementById('reagMotivo')?.value||''; }
    ag.alteradoEm=new Date().toISOString();
    const novo = Object.assign({}, ag, {id:uid(), data:novaData, horario:novaHora, horarioFim:novaHoraFim, status:'Agendado', reagendadoDe:ag.data, criadoEm:new Date().toISOString(), alteradoEm:new Date().toISOString()});
    delete novo.reagendadoPara; delete novo.dataOriginal; delete novo.motivoStatus;
    DB.agendamentos.push(novo);
    logAction(`reagendou o atendimento de ${animalById(ag.animalId)?.nome||'—'} para ${fmtDate(novaData)}`);
    saveDB(); closeModal(); closeDrawer(); render(); toast('Reagendado para '+fmtDate(novaData));
  });
}
