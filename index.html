function semanaGraficoHtml(){
  const ref = state.dash.refDate;
  const dow = new Date(ref+'T00:00:00').getDay();
  const seg = addDays(ref, -((dow+6)%7));
  const dias = [0,1,2,3,4,5,6].map(i=>addDays(seg,i));
  const nomes = ['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'];
  const dados = dias.map((d,i)=>{
    const ags = DB.agendamentos.filter(a=>a.data===d && !['Cancelado','Desmarcado','Reagendado'].includes(a.status));
    return {d, nome:nomes[i], total:ags.length, real:ags.filter(a=>a.status==='Realizado').length};
  });
  const mostrar = dados.filter((x,i)=> i<6 || x.total>0);
  const max = Math.max(1, ...mostrar.map(x=>x.total));
  const totalSemana = mostrar.reduce((s,x)=>s+x.total,0);
  const hoje = todayISO();
  return `
  <div class="card pad" style="margin-bottom:20px;">
    <div style="display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; margin-bottom:14px;">
      <div class="section-title" style="margin-bottom:0;">Atendimentos da semana <span class="tag">${fmtDate(seg)} a ${fmtDate(addDays(seg,6))}</span></div>
      <div style="font-size:12.5px; color:var(--ink-soft);"><strong>${totalSemana}</strong> no total · <span style="display:inline-block;width:9px;height:9px;border-radius:3px;background:var(--sage-dark);margin:0 3px 0 6px;"></span>realizados <span style="display:inline-block;width:9px;height:9px;border-radius:3px;background:color-mix(in srgb, var(--sage) 45%, #fff);margin:0 3px 0 8px;"></span>agendados</div>
    </div>
    <div style="display:grid; grid-template-columns:repeat(${mostrar.length},minmax(0,1fr)); gap:10px; align-items:end; height:150px;">
      ${mostrar.map(x=>`
        <button type="button" class="semana-col" data-semana-dia="${x.d}" title="${x.total} atendimento(s), ${x.real} realizado(s)" style="background:none; border:none; cursor:pointer; padding:0; height:100%; display:flex; flex-direction:column; justify-content:flex-end; align-items:center; gap:6px; font-family:inherit;">
          <div style="font-size:12px; font-weight:800;">${x.total||''}</div>
          <div style="width:100%; max-width:56px; height:${Math.max(4, x.total/max*100)}px; border-radius:8px 8px 4px 4px; background:color-mix(in srgb, var(--sage) ${x.total?45:15}%, #fff); position:relative; transform-origin:bottom; animation:growY .7s cubic-bezier(.22,1,.36,1);">
            ${x.real?`<div style="position:absolute; left:0; right:0; bottom:0; height:${x.real/x.total*100}%; background:var(--sage-dark); border-radius:inherit;"></div>`:''}
          </div>
          <div style="font-size:11.5px; font-weight:${x.d===hoje?800:600}; color:${x.d===hoje?'var(--sage-dark)':'var(--ink-soft)'}; ${x.d===hoje?'border-bottom:2px solid var(--sage-dark);':''}">${x.nome} ${x.d.slice(8)}</div>
        </button>`).join('')}
    </div>
  </div>`;
}
function renderDashboard(){
  const today = todayISO();
  const refDay = state.dash.granularity==='dia' ? state.dash.refDate : today;
  const ags = DB.agendamentos;
  const agsDoDia = state.dash.granularity==='dia'
    ? ags.filter(a=>a.data===refDay && !['Cancelado','Desmarcado','Reagendado'].includes(a.status))
    : ags.filter(a=>inRefPeriod(a.data) && !['Cancelado','Desmarcado','Reagendado'].includes(a.status));
  const atendimentosHoje = ags.filter(a=>a.data===today && !['Cancelado','Desmarcado','Reagendado'].includes(a.status));
  function proximoDiaUtil(baseDateStr){
    let d = new Date(baseDateStr+'T00:00:00');
    d.setDate(d.getDate()+1);
    while(d.getDay()===0){ d.setDate(d.getDate()+1); }
    return d.toISOString().slice(0,10);
  }
  const proximoDiaData = proximoDiaUtil(today);
  const ehRealmenteAmanha = proximoDiaData === addDays(today,1);
  const proximoDiaLabel = ehRealmenteAmanha ? 'amanhã' : `de ${new Date(proximoDiaData+'T00:00:00').toLocaleDateString('pt-BR',{weekday:'long'})}`;
  const proximos = ags.filter(a=>a.data===proximoDiaData && !['Cancelado','Desmarcado','Reagendado'].includes(a.status)).sort((a,b)=>a.horario.localeCompare(b.horario));
  const realizadosMes = ags.filter(a=>a.status==='Realizado' && inRefPeriod(a.data));
  const canceladosMes = ags.filter(a=>a.status==='Cancelado' && inRefPeriod(a.data));
  const desmarcadosMes = ags.filter(a=>a.status==='Desmarcado' && inRefPeriod(a.data));
  const faltasMes = ags.filter(a=>a.status==='Falta' && inRefPeriod(a.data));
  // conta só 1x por tutor, mesmo que a mesma pessoa tenha desmarcado/cancelado mais de uma vez no período
  const desmarcadosCanceladosUnicosPorTutor = (()=>{
    const vistos = new Set(); const out = [];
    [...desmarcadosMes, ...canceladosMes].forEach(a=>{ if(!vistos.has(a.tutorId)){ vistos.add(a.tutorId); out.push(a); } });
    return out;
  })();
  const reagendadosMes = ags.filter(a=>a.reagendadoDe && inRefPeriod(a.data));
  const contatosMes = DB.contatos.filter(c=>!c.mesmoTelefonema && inRefPeriod(c.dataContato));
  const naoAgendadosMes = DB.contatos.filter(c=>!c.mesmoTelefonema && c.status==='Não agendado' && inRefPeriod(c.dataContato));
  const agendadosViaContatoMes = DB.contatos.filter(c=>!c.mesmoTelefonema && inRefPeriod(c.dataContato) && ['Agendado','Faltou'].includes(contatoResultadoFinal(c)));

  // período anterior p/ comparação
  const realizadosPM = ags.filter(a=>a.status==='Realizado' && inPrevRefPeriod(a.data)).length;
  const desmarcadosPM = ags.filter(a=>a.status==='Desmarcado' && inPrevRefPeriod(a.data)).length;

  // -- versões fixas em mês-calendário de verdade, só para "Inteligência da rotina" (não seguem o navegador de datas) --
  const inCurrentCalendarMonth = iso => iso && monthKey(iso)===monthKey(today);
  const inPrevCalendarMonth = (()=>{ const d=new Date(today+'T00:00:00'); d.setMonth(d.getMonth()-1); const mk=monthKey(d.toISOString().slice(0,10)); return iso => iso && monthKey(iso)===mk; })();
  const contatosMesFixo = DB.contatos.filter(c=>!c.mesmoTelefonema && inCurrentCalendarMonth(c.dataContato));
  const naoAgendadosMesFixo = DB.contatos.filter(c=>!c.mesmoTelefonema && c.status==='Não agendado' && inCurrentCalendarMonth(c.dataContato));
  const agendadosViaContatoMesFixo = DB.contatos.filter(c=>!c.mesmoTelefonema && inCurrentCalendarMonth(c.dataContato) && ['Agendado','Faltou'].includes(contatoResultadoFinal(c)));
  const realizadosMesFixo = ags.filter(a=>a.status==='Realizado' && inCurrentCalendarMonth(a.data));
  const desmarcadosMesFixo = ags.filter(a=>a.status==='Desmarcado' && inCurrentCalendarMonth(a.data));
  const realizadosPMFixo = ags.filter(a=>a.status==='Realizado' && inPrevCalendarMonth(a.data)).length;
  const desmarcadosPMFixo = ags.filter(a=>a.status==='Desmarcado' && inPrevCalendarMonth(a.data)).length;

  // lembretes próximos (7 dias)
  const lembretesProx = DB.lembretes.filter(l=>!l.concluido && l.data<=addDays(today,7) && l.data>=addDays(today,-1))
    .sort((a,b)=>a.data.localeCompare(b.data));

  // motivos de não agendamento
  function addMotivo(map, texto, tutorId){
    if(!texto || !texto.trim()) return;
    const norm = texto.trim().toLowerCase();
    if(!map[norm]) map[norm] = {label: texto.trim(), count:0, tutores:new Set()};
    map[norm].count++;
    const t = tutorId?tutorById(tutorId):null;
    if(t) map[norm].tutores.add(t.nome);
  }
  const motivosMap = {};
  DB.contatos.forEach(c=>{ if(c.status==='Não agendado' && !c.mesmoTelefonema) addMotivo(motivosMap, c.motivoNaoAgendamento, c.tutorId); });
  const motivosArr = Object.values(motivosMap).sort((a,b)=>b.count-a.count).map(m=>[m.label, m.count, [...m.tutores]]);
  const motivosDesmMap = {};
  DB.agendamentos.forEach(a=>{ if(a.motivoStatus && ['Desmarcado','Cancelado'].includes(a.status)) addMotivo(motivosDesmMap, a.motivoStatus, a.tutorId); });
  const motivosDesmArr = Object.values(motivosDesmMap).sort((a,b)=>b.count-a.count).map(m=>[m.label, m.count, [...m.tutores]]);

  // ---- Indicações (quem indicou) ----
  const indicacoesPorTutor = {};
  DB.contatos.forEach(c=>{ if(c.tutorId && c.indicacaoTipo && c.indicacaoTipo!=='Sem indicação') indicacoesPorTutor[c.tutorId]=c; });
  DB.agendamentos.forEach(a=>{ if(a.tutorId && a.indicacaoTipo && a.indicacaoTipo!=='Sem indicação') indicacoesPorTutor[a.tutorId]=a; });
  const indicacoesList = Object.values(indicacoesPorTutor);
  const fontesIndicacao = {};
  indicacoesList.forEach(i=>{ fontesIndicacao[i.indicacaoTipo]=(fontesIndicacao[i.indicacaoTipo]||0)+1; });
  const fontesArr = Object.entries(fontesIndicacao).sort((a,b)=>b[1]-a[1]);
  const vetsRanking = {}, clinicasRanking = {};
  indicacoesList.forEach(i=>{
    if(i.indicacaoVet) vetsRanking[i.indicacaoVet]=(vetsRanking[i.indicacaoVet]||0)+1;
    if(i.indicacaoClinica) clinicasRanking[i.indicacaoClinica]=(clinicasRanking[i.indicacaoClinica]||0)+1;
  });
  const vetsArr = Object.entries(vetsRanking).sort((a,b)=>b[1]-a[1]).slice(0,5);

  // ---- Origem dos agendamentos (contato deste período vs. anterior) ----
  const origemAg = {desteperiodo:0, anterior:0, semDado:0};
  realizadosMes.forEach(a=>{
    let dataContatoRef = null;
    if(a.contatoOrigemId){
      const c = DB.contatos.find(x=>x.id===a.contatoOrigemId);
      if(c) dataContatoRef = c.dataContato;
    }
    if(!dataContatoRef && a.dataContato) dataContatoRef = a.dataContato;
    if(!dataContatoRef){ origemAg.semDado++; return; }
    if(inRefPeriod(dataContatoRef)) origemAg.desteperiodo++;
    else origemAg.anterior++;
  });
  const clinicasArr = Object.entries(clinicasRanking).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const maxMotivo = motivosArr.length? motivosArr[0][1] : 0;

  // clientes com mais desmarcações
  const desmPorTutor = {};
  ags.filter(a=>a.status==='Desmarcado'||a.status==='Cancelado').forEach(a=>{
    (desmPorTutor[a.tutorId]=desmPorTutor[a.tutorId]||[]).push(a);
  });
  const clientesDesmarcam = Object.entries(desmPorTutor).filter(([,list])=>list.length>=2)
    .map(([tid,list])=>({tutor:tutorById(tid), n:list.length, list})).filter(x=>x.tutor).sort((a,b)=>b.n-a.n).slice(0,4);

  // insights automáticos — só aparecem com dados suficientes
  const insights = [];
  if(contatosMesFixo.length>=5){
    insights.push(`Você recebeu <strong>${contatosMesFixo.length}</strong> contato${contatosMesFixo.length===1?'':'s'} este mês e <strong>${agendadosViaContatoMesFixo.length}</strong> resultaram em agendamento.`);
  }
  if(motivosArr.length>=3){
    insights.push(`O principal motivo de não agendamento é <strong>"${motivosArr[0][0]}"</strong>, com ${motivosArr[0][1]} ocorrências no total.`);
  }
  if(motivosDesmArr.length>=2){
    insights.push(`O principal motivo de desmarcação/cancelamento é <strong>"${motivosDesmArr[0][0]}"</strong>, com ${motivosDesmArr[0][1]} ocorrências no total.`);
  }
  if(desmarcadosPMFixo>0 && desmarcadosMesFixo.length>desmarcadosPMFixo){
    insights.push(`As desmarcações aumentaram em relação ao mês anterior (${desmarcadosMesFixo.length} vs ${desmarcadosPMFixo}).`);
  }
  clientesDesmarcam.slice(0,2).forEach(c=>{
    insights.push(`${c.tutor.nome} já desmarcou/cancelou <strong>${c.n}</strong> vezes.`);
  });
  if(realizadosPMFixo>0){
    const delta = realizadosMesFixo.length-realizadosPMFixo;
    if(delta>0) insights.push(`Os atendimentos realizados aumentaram em relação ao mês anterior (${realizadosMesFixo.length} vs ${realizadosPMFixo}).`);
  }
  if(naoAgendadosMesFixo.length>=3){
    insights.push(`<strong>${naoAgendadosMesFixo.length}</strong> pessoas entraram em contato este mês, mas ainda não agendaram.`);
  }

  // ---- O que preciso fazer? (baseado no período selecionado no navegador) ----
  const pendencias = [];
  DB.lembretes.filter(l=>!l.concluido && (state.dash.granularity==='dia'? l.data===refDay : inRefPeriod(l.data))).forEach(l=>{
    pendencias.push({tipo:'Lembrete', texto:l.titulo, ref:{type:'lembrete', id:l.id}});
  });
  DB.contatos.filter(c=>c.status==='Aguardando').forEach(c=>{
    const nome = c.tutorId? (tutorById(c.tutorId)?.nome||'') : (c.nomeAvulso||'contato');
    const dias = daysBetween(c.dataContato,today);
    const rec = c.recontatarEm && c.recontatarEm<=today ? (c.recontatarEm<today?' · recontatar atrasado':' · recontatar hoje') : '';
    pendencias.push({tipo:'Contato', texto:`${nome}${dias>0?' — contato há '+dias+' dia'+(dias===1?'':'s'):' — contato de hoje'}${rec}`, ref:{type:'contato', id:c.id}});
  });
  ags.filter(a=>a.status==='AguardandoConfirmacao' && a.data<=addDays(today,2)).forEach(a=>{
    pendencias.push({tipo:'Confirmação', texto:`Confirmar ${animalById(a.animalId)?.nome||'—'} — ${fmtDate(a.data)} ${a.horario}`, ref:{type:'ag', id:a.id}});
  });

  // ---- Conversão de contatos ----
  const totalContatosMes = contatosMes.length;
  const contatosComResultado = contatosMes.map(c=>({c, resultado: contatoResultadoFinal(c)}));
  const agendadosConv = contatosComResultado.filter(x=>x.resultado==='Agendado').length;
  const desmarcaramConv = contatosComResultado.filter(x=>x.resultado==='Desmarcado').length;
  const faltaramConv = contatosComResultado.filter(x=>x.resultado==='Faltou').length;
  const naoAgendadosConv = contatosComResultado.filter(x=>x.resultado==='Não agendado').length;
  const pendentesConv = contatosComResultado.filter(x=>x.resultado==='Aguardando').length;
  const taxaConversao = totalContatosMes? Math.round(((agendadosConv+desmarcaramConv+faltaramConv)/totalContatosMes)*100) : null;
  const convPorTipo = ['Consulta','Acompanhamento','Cirurgia'].map(tp=>{
    const doTipo = contatosMes.filter(c=>c.tipoAtendimento===tp);
    const agTipo = doTipo.filter(c=>['Agendado','Faltou'].includes(contatoResultadoFinal(c))).length;
    return {tipo:tp, total:doTipo.length, agendados:agTipo};
  }).filter(x=>x.total>0);


  // ---- Alertas de inconsistência ----
  const alertas = [];
  const agsSemTutor = DB.agendamentos.filter(a=>!a.tutorId || !tutorById(a.tutorId));
  if(agsSemTutor.length) alertas.push(`Existem <strong>${agsSemTutor.length}</strong> agendamento(s) sem tutor vinculado.`);
  const agsSemAnimal = DB.agendamentos.filter(a=>!a.animalId || !animalById(a.animalId));
  if(agsSemAnimal.length) alertas.push(`Existem <strong>${agsSemAnimal.length}</strong> agendamento(s) sem animal vinculado.`);
  const contatosSemResultado = DB.contatos.filter(c=>c.status==='Aguardando' && daysBetween(c.dataContato,today)>=14);
  if(contatosSemResultado.length) alertas.push(`Existem <strong>${contatosSemResultado.length}</strong> contato(s) aguardando retorno há mais de 14 dias.`);
  const agsAntigosAguardando = DB.agendamentos.filter(a=>a.status==='AguardandoConfirmacao' && a.data<today);
  if(agsAntigosAguardando.length) alertas.push(`Existem <strong>${agsAntigosAguardando.length}</strong> agendamento(s) antigo(s) ainda aguardando confirmação.`);
  const tutoresSemTelefone = DB.tutores.filter(t=>!t.telefone);
  if(tutoresSemTelefone.length) alertas.push(`Existem <strong>${tutoresSemTelefone.length}</strong> tutor(es) sem telefone cadastrado.`);
  const animaisSemTutor = DB.animais.filter(a=>!tutoresDoAnimal(a.id).length);
  if(animaisSemTutor.length) alertas.push(`Existem <strong>${animaisSemTutor.length}</strong> animal(is) sem tutor vinculado.`);

  const periodoTag = dashPeriodTag();
  const contatosAguardando = DB.contatos.filter(c=>c.status==='Aguardando').sort((a,b)=>aguardOrdem==='recentes' ? b.dataContato.localeCompare(a.dataContato) : a.dataContato.localeCompare(b.dataContato));
  const pendGroups = {};
  pendencias.forEach(p=>{ (pendGroups[p.tipo]=pendGroups[p.tipo]||[]).push(p); });

  return `

    return `<div class="alert alert-warn" style="margin-bottom:16px; align-items:center;">${ICONS.download}<div style="flex:1;"><strong>${b.dias===null?'Você ainda não baixou nenhum backup neste navegador.':`Faz ${b.dias} dias que você não baixa um backup.`}</strong> Baixar uma cópia de vez em quando protege seus dados.</div><button class="btn btn-primary btn-sm" id="btnBackupAviso">Baixar agora</button><button class="icon-btn" id="btnBackupFechar" title="Fechar aviso (volta a aparecer em 7 dias)">${ICONS.x}</button></div>`; })()}

    ${statCard('Faltas · '+periodoTag, faltasMes.length, 'var(--st-reagendado)', tipoBreakdown(faltasMes), 'agenda:Falta')}
    ${statCard('Reagendados', reagendadosMes.length, 'var(--st-reagendado)', tipoBreakdown(reagendadosMes), 'agenda:Reagendado')}
  </div>

  ${semanaGraficoHtml()}

  <div class="card pad" style="margin-bottom:20px; border-color:var(--st-aguardando);">

      <div class="section-title" style="margin-bottom:0;">${ICONS.contatos} Contatos aguardando resposta <span class="tag">${contatosAguardando.filter(c=>!c.mesmoTelefonema).length}</span></div>
      <div style="display:flex; gap:8px;">
        <button class="chip-btn" id="aguardOrdemBtn">${aguardOrdem==='recentes'?'Mais recentes':'Mais antigos'} primeiro</button>
        <button class="chip-btn" id="aguardRecBtn">${aguardRecolhido?'Expandir':'Recolher'}</button>
      </div>
    </div>
    ${aguardRecolhido?'':`<div class="hint" style="margin-bottom:12px;">Todo contato registrado aparece aqui até você marcar se agendou ou não.</div>`}
    ${aguardRecolhido?'':contatosAguardando.length? `<div class="rolagem-lista" style="display:flex; flex-direction:column; gap:8px; max-height:340px; overflow-y:auto; padding-right:4px;">
      ${contatosAguardando.map(c=>{
        const nome = c.tutorId? (tutorById(c.tutorId)?.nome||'—') : (c.nomeAvulso||(c.telefone?`${c.telefone} (sem nome ainda)`:'—'));
        const animalNome = c.animalId? (animalById(c.animalId)?.nome||'') : (c.animalAvulso||'');
        const dias = daysBetween(c.dataContato, today);
        return `<div style="display:flex; align-items:center; gap:10px; flex-wrap:wrap; background:var(--sage-pale); border-radius:10px; padding:10px 12px;">
          <div style="flex:1; min-width:160px; font-size:13px;">
            <strong>${nome}</strong>${animalNome?' · '+animalNome:''}
            <div style="color:var(--ink-soft); font-size:11.5px; margin-top:2px;">${dias>0?'Contato há '+dias+' dia'+(dias===1?'':'s'):'Contato de hoje'} · ${fmtDate(c.dataContato)}${recontatoPill(c)?' '+recontatoPill(c):''}</div>

          <button class="btn btn-primary btn-sm" data-contato-to-ag="${c.id}">${ICONS.check} Agendou</button>
          <button class="btn btn-secondary btn-sm" data-contato-nao-agendou="${c.id}">${ICONS.x} Não agendou</button>

          <button class="icon-btn" title="Excluir este contato" data-del-contato-rapido="${c.id}">${ICONS.trash}</button>
        </div>`;
      }).join('')}
    </div>` : emptyState('Nenhum contato aguardando resposta', 'Assim que você registrar um contato, ele aparece aqui até ser marcado como agendado ou não.')}
  </div>

  <div class="card pad" style="margin-bottom:20px;">
    <div class="section-title" style="margin-bottom:10px;">Ações rápidas</div>
    <div style="display:flex; gap:8px; flex-wrap:wrap;">
      <button class="btn btn-secondary btn-sm" id="qaCadastro">${ICONS.plus} Cadastrar tutor e animal</button>
      <button class="btn btn-secondary btn-sm" id="qaNovoAgendamento">${ICONS.plus} Agendamento</button>
      <button class="btn btn-secondary btn-sm" id="qaNovoContato">${ICONS.plus} Contato</button>
      <button class="btn btn-secondary btn-sm" id="qaNovoLembrete">${ICONS.plus} Lembrete</button>
      <button class="btn btn-secondary btn-sm" id="qaAlterarAg">${ICONS.desmarcacoes} Confirmar / Desmarcar / Cancelar</button>
      <button class="btn btn-secondary btn-sm" id="qaNovaNF">${ICONS.receipt} Nova NF</button>

        ...DB.tutores.filter(t=>t.criadoEm && new Date(t.criadoEm)>=seteDiasAtras).map(t=>({tipo:'Tutor', item:t, data:t.criadoEm})),

          </span>`).join('')}
      </div>`;
    })()}

                <div style="display:flex; gap:4px;">

                    <button class="icon-btn" title="Marcar realizado" data-set-status="${a.id}" data-status="Realizado">${ICONS.check}</button>

                    <button class="icon-btn" title="Reagendar" data-reagendar="${a.id}">${ICONS.reagendar}</button>
                    <button class="icon-btn" title="Desmarcar" data-set-status="${a.id}" data-status="Desmarcado">${ICONS.x}</button>
                  `:''}
                </div>
              </td>
            </tr>`).join('')}
        </tbody></table></div>` : emptyState('Nenhum atendimento hoje', 'Os atendimentos de hoje aparecem aqui automaticamente.')}

          if(!naoConfirmados.length) return '';
          return `<div class="alert alert-warn" style="margin-bottom:14px;">${ICONS.bell}<div><strong>${naoConfirmados.length} atendimento${naoConfirmados.length>1?'s':''} ${proximoDiaLabel} ainda sem confirmação:</strong> ${naoConfirmados.map(a=>agAnimalNome(a)).join(', ')}.</div></div>`;

              <td><strong>${a.horario}</strong></td><td>${agTutorNome(a)}</td><td>${agAnimalNome(a)}</td><td>${tipoPill(a.tipo)}</td><td>${badge(a.status)}</td>

                <div style="display:flex; gap:4px;">
                  ${!['Realizado','Cancelado','Desmarcado'].includes(a.status)?`

                    ${a.status!=='Confirmado'?`<button class="icon-btn" title="Confirmar" data-set-status="${a.id}" data-status="Confirmado">${ICONS.check}</button>`:''}
                    <button class="icon-btn" title="Faltou" data-set-status="${a.id}" data-status="Falta">${ICONS.faltou}</button>
                    <button class="icon-btn" title="Reagendar" data-reagendar="${a.id}">${ICONS.reagendar}</button>
                    <button class="icon-btn" title="Desmarcar" data-set-status="${a.id}" data-status="Desmarcado">${ICONS.x}</button>
                  `:''}
                </div>
              </td>
            </tr>`).join('')}
        </tbody></table></div>` : emptyState(`Nenhum atendimento ${proximoDiaLabel}`, `Os atendimentos de ${fmtDate(proximoDiaData)} aparecem aqui automaticamente.`)}
      </div>

      <div class="card pad">
        <div class="section-title">Atendimentos por tipo <span class="tag">${periodoTag}</span></div>
        ${(()=>{
          const porTipo = [
            {tipo:'Consulta', cor:'var(--sage)', realizados: ags.filter(a=>a.tipo==='Consulta' && a.status==='Realizado' && inRefPeriod(a.data)).length, agendados: ags.filter(a=>a.tipo==='Consulta' && !['Cancelado','Desmarcado','Reagendado'].includes(a.status) && inRefPeriod(a.data)).length, faltas: ags.filter(a=>a.tipo==='Consulta' && a.status==='Falta' && inRefPeriod(a.data)).length},
            {tipo:'Acompanhamento', cor:'var(--st-confirmado)', realizados: ags.filter(a=>a.tipo==='Acompanhamento' && a.status==='Realizado' && inRefPeriod(a.data)).length, agendados: ags.filter(a=>a.tipo==='Acompanhamento' && !['Cancelado','Desmarcado','Reagendado'].includes(a.status) && inRefPeriod(a.data)).length, faltas: ags.filter(a=>a.tipo==='Acompanhamento' && a.status==='Falta' && inRefPeriod(a.data)).length},
            {tipo:'Cirurgia', cor:'var(--st-reagendado)', realizados: ags.filter(a=>a.tipo==='Cirurgia' && a.status==='Realizado' && inRefPeriod(a.data)).length, agendados: ags.filter(a=>a.tipo==='Cirurgia' && !['Cancelado','Desmarcado','Reagendado'].includes(a.status) && inRefPeriod(a.data)).length, faltas: ags.filter(a=>a.tipo==='Cirurgia' && a.status==='Falta' && inRefPeriod(a.data)).length},
          ];
          const max = Math.max(1, ...porTipo.map(t=>t.agendados));
          const totalGeral = porTipo.reduce((s,t)=>s+t.agendados,0);
          if(!totalGeral) return emptyState('Sem atendimentos neste período','As barras aparecem conforme agendamentos forem registrados.');
          return `<div style="display:flex; flex-direction:column; gap:16px;">
            ${porTipo.map(t=>`
              <div>
                <div style="display:flex; justify-content:space-between; margin-bottom:6px; font-size:13px;">
                  <span style="font-weight:700; display:flex; align-items:center; gap:6px;"><span style="width:9px;height:9px;border-radius:50%;background:${t.cor};display:inline-block;"></span>${t.tipo}</span>
                  <span style="color:var(--ink-soft);">${t.realizados} realizados de ${t.agendados} agendados${t.faltas?` · ${t.faltas} falta${t.faltas>1?'s':''}`:''}</span>

              </div>`).join('')}
          </div>
          <div class="hint" style="margin-top:14px;">Barra clara = agendados no período · barra sólida = já realizados</div>`;
        })()}
      </div>

      ${(()=>{
        const especieCont = {Canina:0, Felina:0, Equina:0};

          const an = animalById(a.animalId);
          if(!an) return;
          if(especieCont[an.especie]!==undefined) especieCont[an.especie]++;
          if(sexoCont[an.sexo]!==undefined) sexoCont[an.sexo]++;
        });

        const coresEspecie = {Canina:'var(--sage)', Felina:'var(--brown)', Equina:'var(--st-reagendado)'};

        <div class="card pad">

              ${donutChartHtml(Object.entries(especieCont).filter(([,n])=>n>0).map(([e,n])=>({label:e, value:n, color:coresEspecie[e]})), totalEspecie, 'animais')}
              <div style="flex:1; display:flex; flex-direction:column; gap:6px;">
                ${Object.entries(especieCont).filter(([,n])=>n>0).map(([e,n])=>`<div style="display:flex; justify-content:space-between; font-size:12.5px;"><span><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${coresEspecie[e]};margin-right:6px;"></span>${e}</span><strong>${n}</strong></div>`).join('')}
              </div>
            </div>
            <div style="display:flex; align-items:center; gap:16px;">
              ${donutChartHtml(Object.entries(sexoCont).filter(([,n])=>n>0).map(([s,n])=>({label:s, value:n, color:coresSexo[s]})), Object.values(sexoCont).reduce((a,b)=>a+b,0), 'animais')}
              <div style="flex:1; display:flex; flex-direction:column; gap:6px;">
                ${Object.entries(sexoCont).filter(([,n])=>n>0).map(([s,n])=>`<div style="display:flex; justify-content:space-between; font-size:12.5px;"><span><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${coresSexo[s]};margin-right:6px;"></span>${s}</span><strong>${n}</strong></div>`).join('')}
              </div>
            </div>
          </div>
        </div>`;
      })()}

      ${motivosArr.length ? `
      <div class="card pad">
        <div class="section-title">Principais motivos de não agendamento</div>
        <div class="bars">
          ${motivosArr.map(([m,n,tutores])=>`
            <div class="bar-row">
              <span>${m}</span>
              <div class="bar-track"><div class="bar-fill" style="width:${Math.max(6,(n/maxMotivo)*100)}%"></div></div>
              <span style="text-align:right; font-weight:700;">${n}</span>
            </div>
            ${tutores.length?`<div class="hint" style="margin:-6px 0 6px; padding-left:2px;">${tutores.slice(0,4).join(', ')}${tutores.length>4?' +'+(tutores.length-4):''}</div>`:''}`).join('')}
        </div>
      </div>` : ''}

          <div style="display:flex; gap:20px; align-items:center; flex-wrap:wrap; margin-bottom:16px;">
            ${donutChartHtml([
              {label:'Agendados', value:agendadosConv, color:'var(--st-realizado)'},
              {label:'Desmarcaram depois', value:desmarcaramConv, color:'var(--st-desmarcado)'},
              {label:'Faltaram', value:faltaramConv, color:'var(--st-reagendado)'},
              {label:'Não agendaram', value:naoAgendadosConv, color:'var(--st-cancelado)'},
              {label:'Pendentes', value:pendentesConv, color:'var(--st-aguardando)'}
            ], totalContatosMes, 'contatos')}
            <div style="flex:1; min-width:160px; display:flex; flex-direction:column; gap:8px;">
              <div style="display:flex; justify-content:space-between; font-size:13px;"><span><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--st-realizado);margin-right:6px;"></span>Agendados</span><strong>${agendadosConv}</strong></div>
              <div style="display:flex; justify-content:space-between; font-size:13px;"><span><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--st-desmarcado);margin-right:6px;"></span>Desmarcaram depois</span><strong>${desmarcaramConv}</strong></div>
              <div style="display:flex; justify-content:space-between; font-size:13px;"><span><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--st-reagendado);margin-right:6px;"></span>Faltaram</span><strong>${faltaramConv}</strong></div>
              <div style="display:flex; justify-content:space-between; font-size:13px;"><span><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--st-cancelado);margin-right:6px;"></span>Não agendaram</span><strong>${naoAgendadosConv}</strong></div>
              <div style="display:flex; justify-content:space-between; font-size:13px;"><span><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--st-aguardando);margin-right:6px;"></span>Pendentes</span><strong>${pendentesConv}</strong></div>
              <div style="display:flex; justify-content:space-between; font-size:13px; border-top:1px solid var(--line); padding-top:6px;"><span>Total de contatos</span><strong>${totalContatosMes}</strong></div>
            </div>
          </div>
          ${taxaConversao!==null?`<div class="alert alert-sage"><div><strong>Taxa de conversão: ${taxaConversao}%</strong> dos contatos deste período chegaram a virar agendamento (inclui os ${desmarcaramConv+faltaramConv} que desmarcaram ou faltaram depois).</div></div>`:''}
          ${convPorTipo.length?`<div class="bars" style="margin-top:14px;">${convPorTipo.map(c=>`
            <div class="bar-row">
              <span>${c.tipo}</span>
              <div class="bar-track"><div class="bar-fill" style="width:${Math.max(6,(c.agendados/c.total)*100)}%"></div></div>
              <span style="text-align:right; font-weight:700;">${c.agendados}/${c.total}</span>
            </div>`).join('')}</div>`:''}
        ` : emptyState('Sem contatos suficientes este mês','A taxa de conversão aparece quando houver contatos registrados no mês.')}
      </div>

      ${indicacoesList.length? `

        <div class="section-title">${ICONS.sparkle} Indicações — quem traz clientes</div>

            <div class="hint" style="margin-bottom:8px; font-weight:700; text-transform:uppercase; font-size:11px;">Fontes mais frequentes</div>
            <div class="bars">
              ${fontesArr.map(([f,n])=>`
                <div class="bar-row">
                  <span>${f}</span>
                  <div class="bar-track"><div class="bar-fill" style="width:${Math.max(6,(n/fontesArr[0][1])*100)}%; background:var(--brown);"></div></div>
                  <span style="text-align:right; font-weight:700;">${n}</span>
                </div>`).join('')}

function statCard(label,value,color,sub,go){
  const isLongText = typeof value==='string' && value.length>6 && !/^R\$/.test(value);
  return `<div class="stat-card${go?' clicavel':''}" style="--c:${color}" ${go?`data-go="${go}" role="button" tabindex="0"`:''}><div class="stripe"></div><div class="label">${label}</div><div class="value" style="${isLongText?'font-size:19px; line-height:1.25; word-break:break-word;':''}">${value}</div>${sub?`<div style="font-size:11px; color:var(--ink-soft); margin-top:5px; line-height:1.5;">${sub}</div>`:''}</div>`;
}
function tipoBreakdown(list){
  const porTipo = {Consulta:0, Acompanhamento:0, Cirurgia:0};
  list.forEach(a=>{ if(porTipo[a.tipo]!==undefined) porTipo[a.tipo]++; });
  return Object.entries(porTipo).filter(([,n])=>n>0).map(([t,n])=>`${t}: <strong>${n}</strong>`).join(' · ') || 'Sem registros';
}
function tipoBreakdownAbrev(list, field){
  const ABREV = {Consulta:'Cons', Acompanhamento:'Acomp', Cirurgia:'Cir'};
  const porTipo = {Consulta:0, Acompanhamento:0, Cirurgia:0};
  let semTipo = 0;
  list.forEach(item=>{ const v=item[field]; if(porTipo[v]!==undefined) porTipo[v]++; else semTipo++; });
  const partes = Object.entries(porTipo).filter(([,n])=>n>0).map(([t,n])=>`${ABREV[t]} ${n}`);
  if(semTipo) partes.push(`Outro ${semTipo}`);
  return partes.join(' · ');
}
function donutChartHtml(segments, total, label){
  if(!total) return '';
  let acc = 0;
  const stops = segments.filter(s=>s.value>0).map(s=>{
    const start = (acc/total)*360; acc += s.value;
    const end = (acc/total)*360;
    return `${s.color} ${start}deg ${end}deg`;
  }).join(', ');
  return `<div style="width:110px;height:110px;border-radius:50%;background:conic-gradient(${stops||'var(--line) 0deg 360deg'}); flex-shrink:0; display:flex; align-items:center; justify-content:center;">
    <div style="width:66px;height:66px;border-radius:50%;background:#fff; display:flex; align-items:center; justify-content:center; flex-direction:column;">
      <div style="font-family:'Fraunces',serif; font-size:18px; font-weight:600; color:var(--ink);">${total}</div>
      <div style="font-size:9px; color:var(--ink-soft); font-weight:700; text-transform:uppercase;">${label||'contatos'}</div>
    </div>
  </div>`;
}
function emptyState(title,desc){
  return `<div class="empty">${ICONS.inbox}<div class="t">${title}</div><div class="d">${desc}</div></div>`;
}

let agendaFilters = {tutor:'', animal:'', data:'', status:'', tipo:'', cidade:'', modoData:'agendamento', todos:false};
let agendaViewMode = 'calendario';
function agruparAgendamentosPorHorario(lista){
  const grupos = {};
  const ordem = [];
  lista.forEach(a=>{
    const chave = `${a.tutorId||a.tutorAvulso||'sem-tutor-'+a.id}|${a.horario}`;
    if(!grupos[chave]){ grupos[chave]=[]; ordem.push(chave); }
    grupos[chave].push(a);
  });
  return ordem.map(chave=>grupos[chave]);
}
function renderCalendarioMes(refDateStr){
  const [y,m] = refDateStr.split('-').map(Number);
  const primeiroDia = new Date(y, m-1, 1);
  const diasNoMes = new Date(y, m, 0).getDate();
  const diaSemanaInicio = primeiroDia.getDay();
  const hoje = todayISO();
  const agsPorDia = {};
  DB.agendamentos.forEach(a=>{
    if(['Cancelado','Desmarcado','Reagendado'].includes(a.status)) return;
    if(a.data && a.data.slice(0,7)===`${y}-${String(m).padStart(2,'0')}`){
      (agsPorDia[a.data] = agsPorDia[a.data]||[]).push(a);
    }
  });
  const celulas = [];
  for(let i=0;i<diaSemanaInicio;i++) celulas.push(null);
  for(let d=1; d<=diasNoMes; d++) celulas.push(`${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`);
  while(celulas.length % 7 !== 0) celulas.push(null);
  const diasSemana = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
  return `
  <div class="card pad">
    <div class="cal-grid">
      ${diasSemana.map(d=>`<div class="cal-head">${d}</div>`).join('')}
      ${celulas.map(dataStr=>{
        if(!dataStr) return `<div class="cal-cell cal-empty"></div>`;
        const agsDia = (agsPorDia[dataStr]||[]).sort((a,b)=>a.horario.localeCompare(b.horario));
        const grupos = agruparAgendamentosPorHorario(agsDia);
        const diaNum = Number(dataStr.slice(-2));
        const ehHoje = dataStr===hoje;
        return `<div class="cal-cell ${ehHoje?'cal-hoje':''}" data-cal-dia="${dataStr}">
          <div class="cal-daynum">${diaNum}</div>
          <div class="cal-events">
            ${grupos.slice(0,2).map(grupo=>{
              const a = grupo[0];
              const horarioTxt = a.horarioFim ? `${a.horario} até ${a.horarioFim}` : a.horario;
              const animais = [...new Set(grupo.map(g=>agAnimalNome(g)).filter(x=>x && x!=='—'))];
              const tutorAnimal = [agTutorNome(a), animais.join(', ')].filter(Boolean).join(' · ');
              const profs = (a.profissionais||[]).length ? ' com '+a.profissionais.join(', ') : '';
              const tiposGrupo = [...new Set(grupo.map(g=>g.tipo))];
              const linha3 = [tiposGrupo.join('/'), a.clinica].filter(Boolean).join(' - ') + profs;
              const tooltip = [horarioTxt, tutorAnimal, linha3].filter(Boolean).join(' · ');
              return `<div class="cal-event" style="background:${agColor(a)};" title="${tooltip}">
                <div class="cal-event-l1">${horarioTxt}${grupo.length>1?` (${grupo.length})`:''}</div>
                <div class="cal-event-l2">${tutorAnimal}</div>
                <div class="cal-event-l3">${linha3}</div>
              </div>`;
            }).join('')}
            ${grupos.length>2?`<div class="cal-more">+${grupos.length-2} mais</div>`:''}
          </div>
          <div class="cal-dots">${grupos.slice(0,5).map(grupo=>`<span class="cal-dot" style="background:${agColor(grupo[0])};"></span>`).join('')}</div>
        </div>`;
      }).join('')}
    </div>
    <div style="display:flex; gap:12px; flex-wrap:wrap; margin-top:14px; padding-top:12px; border-top:1px solid var(--line);">
      ${tiposNomes().map(t=>`<span style="display:inline-flex; align-items:center; gap:5px; font-size:11px; color:var(--ink-soft); font-weight:600;"><span style="width:9px;height:9px;border-radius:3px;background:${tipoColor(t)}; display:inline-block;"></span>${t}</span>`).join('')}
    </div>
  </div>`;
}
function abrirDiaCalendario(dataStr){
  const ags = DB.agendamentos.filter(a=>a.data===dataStr && !['Cancelado','Desmarcado','Reagendado'].includes(a.status)).sort((a,b)=>a.horario.localeCompare(b.horario));
  const html = modalShell(fmtDateLong(dataStr), `
    ${ags.length? `<div style="display:flex; flex-direction:column; gap:8px; margin-bottom:14px;">
      ${ags.map(a=>`
        <div class="pend-row" style="align-items:center; gap:8px;">
          <div class="rowlink" data-open-ag-modal="${a.id}" style="flex:1; display:flex; align-items:center; gap:8px; cursor:pointer;">
            <span class="pend-dot" style="background:${agColor(a)};"></span>
            <span><strong>${a.horario}${a.horarioFim?' até '+a.horarioFim:''}</strong> ${agTutorNome(a)} · ${agAnimalNome(a)}${agSemCadastro(a)?' (sem cadastro)':''} — ${a.tipo}${a.clinica?' - '+a.clinica:''}${(a.profissionais||[]).length?' com '+a.profissionais.join(', '):''} · ${badge(a.status)}</span>
          </div>
          ${!['Confirmado','Realizado'].includes(a.status)?`<button class="btn btn-secondary btn-sm" data-confirmar-modal="${a.id}" title="Marcar como confirmado">${ICONS.check} Confirmar</button>`:''}
          ${(tutorById(a.tutorId)?.telefone||a.telefoneAvulso)?`<a href="${linkWhatsappConfirmacao(a)}" target="_blank" rel="noopener" class="icon-btn" title="Confirmar por WhatsApp" style="color:#25D366;">${ICONS.check}</a>`:''}
        </div>`).join('')}
    </div>` : `<div class="hint" style="margin-bottom:14px;">Nenhum atendimento nesse dia ainda.</div>`}
  `, `<button class="btn btn-secondary" id="modalCancel">Fechar</button><button class="btn btn-primary" id="btnNovoAgDia">${ICONS.plus} Novo agendamento nesse dia</button>`);
  openModal(html);
  document.getElementById('modalClose').addEventListener('click', closeModal);
  document.getElementById('modalCancel').addEventListener('click', closeModal);
  document.querySelectorAll('[data-open-ag-modal]').forEach(el=>el.addEventListener('click', ()=>{
    closeModal(); openAgendamentoDrawer(el.dataset.openAgModal);
  }));
  document.querySelectorAll('[data-confirmar-modal]').forEach(el=>el.addEventListener('click', ()=>{
    const ag = DB.agendamentos.find(x=>x.id===el.dataset.confirmarModal); if(!ag) return;
    ag.status='Confirmado'; ag.alteradoEm=new Date().toISOString();
    logAction(`confirmou o agendamento de ${agAnimalNome(ag)}`);
    saveDB(); toast('Agendamento confirmado');
    closeModal(); abrirDiaCalendario(dataStr); render();
  }));
  document.getElementById('btnNovoAgDia').addEventListener('click', ()=>{
    closeModal(); formAgendamento(null, {data:dataStr});
  });
}
function renderAgenda(){

  if(agendaViewMode==='calendario' && state.dash.granularity!=='mes'){ state.dash.granularity='mes'; }

    tipo, cor: tipoColor(tipo),

  }));
  const agendadosHojeCriados = DB.agendamentos.filter(a=>(a.criadoEm||'').slice(0,10)===today).length;
  const agendadosParaHoje = DB.agendamentos.filter(a=>a.data===today && !['Cancelado','Desmarcado','Reagendado'].includes(a.status)).length;

  let list = DB.agendamentos.slice();
  const modoData = agendaFilters.modoData||'agendamento';
  if(agendaFilters.ult7){ const de=addDays(today,-6); list = list.filter(a=>{ const d = modoData==='contato' ? a.dataContato : a.data; return d && d>=de && d<=today; }); }
  else if(!agendaFilters.todos && !agendaFilters.data) list = list.filter(a=> modoData==='contato' ? inRefPeriod(a.dataContato) : inRefPeriod(a.data));
  const sa = x=>String(x||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
  if(agendaFilters.tutor) list = list.filter(a=>sa(agTutorNome(a)).includes(sa(agendaFilters.tutor)));
  if(agendaFilters.animal) list = list.filter(a=>sa(agAnimalNome(a)).includes(sa(agendaFilters.animal)));
  if(agendaFilters.data) list = list.filter(a=>a.data===agendaFilters.data);
  const contagemAg = {};
  list.forEach(a=>{ contagemAg[a.status]=(contagemAg[a.status]||0)+1; });
  if(agendaFilters.status) list = list.filter(a=>a.status===agendaFilters.status);
  if(agendaFilters.tipo) list = list.filter(a=>a.tipo===agendaFilters.tipo);
  if(agendaFilters.cidade) list = list.filter(a=>a.cidade===agendaFilters.cidade);
  list.sort((a,b)=> (a.data+a.horario).localeCompare(b.data+b.horario));

  const contatosNoPeriodo = agendaFilters.todos ? DB.contatos.filter(c=>!c.mesmoTelefonema).length : DB.contatos.filter(c=>!c.mesmoTelefonema && inRefPeriod(c.dataContato)).length;
  const agendadosNoPeriodo = agendaFilters.todos ? DB.agendamentos.filter(a=>!['Cancelado','Desmarcado','Reagendado'].includes(a.status)).length : DB.agendamentos.filter(a=>inRefPeriod(a.data) && !['Cancelado','Desmarcado','Reagendado'].includes(a.status)).length;

  return `

    </div>
    <div class="grid g3">
      ${hojePorTipo.map(grupo=>`
      <div>
        <div class="pend-group-head">${grupo.tipo}${grupo.tipo.endsWith('s')?'':'s'} <span class="pill-muted">${grupo.lista.length}</span></div>
        ${grupo.lista.length? grupo.lista.map(a=>`<div class="pend-row rowlink" data-open-ag="${a.id}"><span class="pend-dot" style="background:${grupo.cor};"></span><span><strong>${a.horario}</strong> ${agAnimalNome(a)} · ${agTutorNome(a)}</span></div>`).join('') : `<div class="hint">Nenhum hoje.</div>`}
      </div>`).join('')}

  ${renderDashNav(agendaViewMode==='calendario')}

    <button type="button" class="btn btn-sm ${agendaViewMode==='calendario'?'btn-primary':'btn-secondary'}" data-agenda-view="calendario">${ICONS.agenda} Calendário</button>

      </div>
      <select data-fx="tipo">
        <option value="">Todos tipos</option>
        ${tiposNomes().map(t=>`<option ${agendaFilters.tipo===t?'selected':''}>${t}</option>`).join('')}
      </select>
      <select data-fx="cidade">
        <option value="">Todas cidades</option>
        ${Object.keys(DB.cidadesClinicas).map(c=>`<option ${agendaFilters.cidade===c?'selected':''}>${c}</option>`).join('')}
      </select>
      ${(agendaFilters.tutor||agendaFilters.animal||agendaFilters.data||agendaFilters.status||agendaFilters.tipo||agendaFilters.cidade)?`<button class="btn btn-ghost btn-sm" id="clearAgendaFx">Limpar filtros</button>`:''}

  </div>

  <div class="card">
    ${list.length? `<div class="table-wrap"><table><thead><tr><th>Data</th><th>Horário</th><th>Tutor</th><th>Animal</th><th>Tipo</th><th>Status</th><th>Obs.</th><th>Ações rápidas</th></tr></thead><tbody>
      ${(()=>{
        const grupos = [];
        const porChave = new Map();
        list.forEach(a=>{
          const chave = `${a.tutorId||a.tutorAvulso||'sem-tutor-'+a.id}|${a.data}|${a.horario}`;
          if(!porChave.has(chave)){ const g=[]; porChave.set(chave, g); grupos.push(g); }
          porChave.get(chave).push(a);
        });
        return grupos.map(grupo=>grupo.map((a,i)=>`
        <tr class="rowlink" data-open-ag="${a.id}">
          ${i===0?`<td rowspan="${grupo.length}">${fmtDate(a.data)}</td><td rowspan="${grupo.length}"><strong>${a.horario}</strong></td><td rowspan="${grupo.length}">${agTutorNome(a)}${agSemCadastro(a)?` <span class="pill-muted" style="background:var(--st-aguardando-bg); color:var(--st-aguardando);">sem cadastro</span>`:''}</td>`:''}
          <td>${agAnimalNome(a)}</td>
          <td>${tipoPill(a.tipo)}${a.cidade?`<br><span class="pill-muted" style="margin-top:3px; display:inline-block;">${a.cidade}${a.clinica?' · '+a.clinica:''}</span>`:''}</td>
          <td>${badge(a.status)}${(a.status==='Reagendado' && a.reagendadoPara)?`<br><span class="pill" style="margin-top:3px; display:inline-block;">Novo: ${fmtDate(a.reagendadoPara)}</span>`:''}</td>
          <td style="max-width:160px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--ink-soft);">${a.observacoes||''}</td>
          <td onclick="event.stopPropagation()">
            <div style="display:flex; gap:4px;">
              ${(a.status!=='Confirmado' && !['Realizado','Cancelado','Desmarcado','Falta','Reagendado'].includes(a.status) && a.data>=today && (tutorById(a.tutorId)?.telefone||a.telefoneAvulso))?`<a class="icon-btn" href="${linkWhatsappConfirmacao(a)}" target="_blank" rel="noopener" title="Enviar confirmação por WhatsApp" style="color:#25D366; font-weight:800; font-size:11px; width:auto; padding:0 8px;">WhatsApp</a>`:''}
              ${!['Realizado','Cancelado','Desmarcado'].includes(a.status)?`<button class="icon-btn" title="Confirmar" data-set-status="${a.id}" data-status="Confirmado">${ICONS.check}</button>`:''}
              ${(a.status==='Confirmado' && a.data<=today)?`<button class="btn btn-sm btn-secondary" title="Marcar como realizado" data-set-status="${a.id}" data-status="Realizado">Realizado</button>`:''}
              ${!['Realizado','Cancelado','Desmarcado'].includes(a.status)?`<button class="icon-btn" title="Reagendar" data-reagendar="${a.id}">${ICONS.reagendar}</button>`:''}
              ${!['Realizado','Cancelado','Desmarcado'].includes(a.status)?`<button class="icon-btn" title="Desmarcar" data-set-status="${a.id}" data-status="Desmarcado">${ICONS.x}</button>`:''}
              <button class="icon-btn" title="Editar" data-edit-ag="${a.id}">${ICONS.edit}</button>
            </div>
          </td>
        </tr>`).join('')).join('');
      })()}
    </tbody></table></div>` : `<div class="pad">${emptyState('Nenhum agendamento encontrado','Ajuste os filtros ou crie um novo agendamento.')}</div>`}
  </div>`}`;
}

/* =========================================================
   CONTATOS
========================================================= */
let contatosFilters = {status:'', motivo:'', tipo:'', q:'', todos:false, ult7:false, de:'', ate:''};
function semanasDoMes(mk){
  const ini=mk+'-01', fim=ultimoDiaMes(mk); const semanas=[]; let seg=segundaDe(ini);
  while(seg<=fim){ semanas.push({de:seg, ate:addDays(seg,6)}); seg=addDays(seg,7); }
  return semanas;
}
let semanasRecolhido = (()=>{ try{ return localStorage.getItem('olh_semanasRec')==='1'; }catch(e){ return false; } })();
function contatosPorSemanaHtml(){
  const mk = (state.dash.refDate||todayISO()).slice(0,7), hoje=todayISO();
  const rows = semanasDoMes(mk).map(w=>{
    const cs = DB.contatos.filter(c=>!c.mesmoTelefonema && c.dataContato>=w.de && c.dataContato<=w.ate);
    const atual = hoje>=w.de && hoje<=w.ate;
    return {w, atual, total:cs.length, cliente:cs.filter(c=>c.origem!=='Realizado').length, nos:cs.filter(c=>c.origem==='Realizado').length, ag:cs.filter(c=>c.status==='Agendado').length, nao:cs.filter(c=>c.status==='Não agendado').length};
  });
  return `<div class="card pad" style="margin-bottom:16px;">
    <div class="section-title" style="justify-content:space-between; margin-bottom:${semanasRecolhido?0:10}px;">
      <span>Contatos por semana</span>
      <button class="chip-btn" id="semanasRecBtn">${semanasRecolhido?'Expandir':'Recolher'}</button>
    </div>
    ${semanasRecolhido?'':`<div class="table-wrap"><table class="semanas-tab"><thead><tr><th>Semana</th><th>Total</th><th>Do cliente</th><th>Nossos</th><th>Agendou</th><th>Não agendou</th></tr></thead><tbody>
      ${rows.map(r=>`<tr class="rowlink ${r.atual?'semana-atual':''}" data-semana-de="${r.w.de}" data-semana-ate="${r.w.ate}"><td>${fmtDate(r.w.de).slice(0,5)} a ${fmtDate(r.w.ate).slice(0,5)}${r.atual?' <span class="pill-muted">atual</span>':''}</td><td><strong>${r.total}</strong></td><td>${r.cliente}</td><td>${r.nos}</td><td>${r.ag}</td><td>${r.nao}</td></tr>`).join('')}
    </tbody></table></div>`}
  </div>`;
}
function renderContatos(){
  let list = DB.contatos.slice();
  const _de = contatosFilters.ult7 ? addDays(todayISO(),-6) : contatosFilters.de, _ate = contatosFilters.ult7 ? todayISO() : contatosFilters.ate;
  const _intervalo = !!(_de||_ate);
  if(_intervalo) list = list.filter(c=>(!_de || c.dataContato>=_de) && (!_ate || c.dataContato<=_ate));
  else if(!contatosFilters.todos) list = list.filter(c=>c.status==='Aguardando' || inRefPeriod(c.dataContato)); // pendentes sempre aparecem (igual à bolinha da aba)
  const semAcento = t=>String(t||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
  if(contatosFilters.q){
    const q = semAcento(contatosFilters.q), qd = contatosFilters.q.replace(/\D/g,'');
    list = list.filter(c=>{
      const nome = c.tutorId? (tutorById(c.tutorId)?.nome||'') : (c.nomeAvulso||'');
      const animal = c.animalId? (animalById(c.animalId)?.nome||'') : (c.animalAvulso||'');
      return semAcento(nome).includes(q) || semAcento(animal).includes(q) || (qd.length>=3 && (c.telefone||'').replace(/\D/g,'').includes(qd));
    });
  }
  const contagemStatus = {};
  list.forEach(c=>{ if(!c.mesmoTelefonema) contagemStatus[c.status]=(contagemStatus[c.status]||0)+1; });
  if(contatosFilters.status) list = list.filter(c=>c.status===contatosFilters.status);
  if(contatosFilters.motivo) list = list.filter(c=>c.motivoNaoAgendamento===contatosFilters.motivo);
  if(contatosFilters.tipo) list = list.filter(c=>c.tipoAtendimento===contatosFilters.tipo);
  list.sort((a,b)=>b.dataContato.localeCompare(a.dataContato));
  const motivosSet = [...new Set(DB.contatos.map(c=>c.motivoNaoAgendamento).filter(Boolean))];

  return `
  ${renderDashNav()}
  ${contatosPorSemanaHtml()}
  <div class="view-head">
    <div class="filters" style="margin-bottom:0;">
      <input type="text" placeholder="Buscar nome, animal ou telefone" value="${contatosFilters.q||''}" id="contatosBusca" style="min-width:230px;">
      <button type="button" class="chip-btn ${contatosFilters.ult7?'on':''}" id="contatosUlt7">Últimos 7 dias</button>
      <button type="button" class="chip-btn ${contatosFilters.todos?'on':''}" id="contatosTodosPeriodos">Todo o período</button>
      ${(contatosFilters.de||contatosFilters.ate)?`<button type="button" class="chip-btn on" id="contatosLimpaIntervalo">${contatosFilters.de?fmtDate(contatosFilters.de).slice(0,5):''} a ${contatosFilters.ate?fmtDate(contatosFilters.ate).slice(0,5):''} ✕</button>`:''}
      ${['','Aguardando','Agendado','Não agendado'].map(st=>`<button class="chip-btn ${contatosFilters.status===st?'on':''}" data-cstatus="${st}">${st||'Todos'}${st?` <span style="opacity:.7;">${contagemStatus[st]||0}</span>`:''}</button>`).join('')}
      <select data-cfx="tipo">
        <option value="">Todos tipos</option>
        ${tiposNomes().map(t=>`<option ${contatosFilters.tipo===t?'selected':''}>${t}</option>`).join('')}
      </select>
      <select data-cfx="motivo">
        <option value="">Qualquer motivo</option>
        ${motivosSet.map(m=>`<option ${contatosFilters.motivo===m?'selected':''}>${m}</option>`).join('')}
      </select>
      ${(contatosFilters.status||contatosFilters.motivo||contatosFilters.tipo||contatosFilters.q)?`<button class="btn btn-ghost btn-sm" id="clearContatosFx">Limpar filtros</button>`:''}
    </div>
    <button class="btn btn-primary" id="novoContato">${ICONS.plus} Registrar contato</button>
  </div>

  <div class="card">
    ${list.length? `<div class="table-wrap"><table><thead><tr><th>Data</th><th>Origem</th><th>Tipo</th><th>Tutor</th><th>Animal</th><th>Telefone</th><th>Tentativas</th><th>Motivo</th><th>Status</th></tr></thead><tbody>
      ${list.map(c=>`
        <tr class="rowlink" data-open-contato="${c.id}">
          <td>${fmtDate(c.dataContato)}</td>
          <td><span class="pill-muted">${c.origem==='Realizado'?'Clínica → tutor':'Tutor → clínica'}</span></td>
          <td>${c.tipoAtendimento?tipoPill(c.tipoAtendimento):'—'}</td>
          <td>${c.tutorId? (tutorById(c.tutorId)?.nome||'—') : (c.nomeAvulso||'—')}</td>
          <td>${c.animalId? (animalById(c.animalId)?.nome||'—') : (c.animalAvulso||'—')}</td>
          <td onclick="event.stopPropagation()">${c.telefone?`<a href="https://api.whatsapp.com/send?phone=${(()=>{const d=c.telefone.replace(/\D/g,''); return d.length<=11?'55'+d:d;})()}" target="_blank" rel="noopener" title="Abrir conversa no WhatsApp" style="color:inherit; text-decoration:none; display:inline-flex; align-items:center; gap:6px;">${c.telefone} <span style="color:#25D366; font-size:11px; font-weight:800;">WhatsApp</span></a>`:'—'}</td>
          <td><span class="pill-muted">${1+(c.tentativas?.length||0)}x</span></td>
          <td>${c.motivoNaoAgendamento||'—'}</td>
          <td>${contatoBadge(c.status)}${c.mesmoTelefonema?' <span class="pill-muted" title="Mesmo telefonema de outro animal">mesmo telefonema</span>':''}${recontatoPill(c)?'<div style="margin-top:4px;">'+recontatoPill(c)+'</div>':''}</td>
        </tr>`).join('')}
    </tbody></table></div>` : `<div class="pad">${emptyState('Nenhum contato registrado','Registre contatos recebidos que ainda não resultaram em agendamento.')}</div>`}
  </div>`;
}
function recontatoPill(c){
  if(!c.recontatarEm || c.status!=='Aguardando') return '';
  const t=todayISO(), d=c.recontatarEm;
  const cls = d<t ? 'recontato atrasado' : (d===t ? 'recontato hoje' : 'recontato');
  const txt = d<t ? `Recontatar atrasado, ${fmtDate(d)}` : (d===t ? 'Recontatar hoje' : `Recontatar em ${fmtDate(d)}`);
  return `<span class="pill-muted ${cls}">${txt}</span>`;
}
function contatoBadge(status){
  const map = {'Aguardando':'Desmarcado','Agendado':'Agendado','Não agendado':'Cancelado'};
  return `<span class="badge st-${map[status]||'Desmarcado'}">${status}</span>`;
}

/* =========================================================
   DESMARCAÇÕES / CANCELAMENTOS / REAGENDAMENTOS
========================================================= */
let desmarcacoesFilters = {todos:false, tipo:'', q:''};
function renderDesmarcacoes(){
  let list = DB.agendamentos.filter(a=>['Cancelado','Desmarcado'].includes(a.status) || a.reagendadoDe)
    .sort((a,b)=>(b.alteradoEm||'').localeCompare(a.alteradoEm||''));
  if(!desmarcacoesFilters.todos) list = list.filter(a=>inRefPeriod(a.dataOriginal||a.data));
  const saD = x=>String(x||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
  if(desmarcacoesFilters.q) list = list.filter(a=>saD(agTutorNome(a)).includes(saD(desmarcacoesFilters.q)) || saD(agAnimalNome(a)).includes(saD(desmarcacoesFilters.q)));
  const contDesm = {Cancelado:list.filter(a=>a.status==='Cancelado').length, Desmarcado:list.filter(a=>a.status==='Desmarcado').length, Reagendado:list.filter(a=>a.reagendadoDe).length};
  if(desmarcacoesFilters.tipo==='Reagendado') list = list.filter(a=>a.reagendadoDe);
  else if(desmarcacoesFilters.tipo) list = list.filter(a=>a.status===desmarcacoesFilters.tipo);

  // ranking: quem mais tira espaço da agenda (desmarque, cancelamento, falta e reagendamento)
  const espacoPorTutor = {};
  DB.agendamentos.filter(a=>['Cancelado','Desmarcado','Falta','Reagendado'].includes(a.status) && (desmarcacoesFilters.todos || inRefPeriod(a.dataOriginal||a.data))).forEach(a=>{
    const k = a.tutorId || ('av:'+(a.tutorAvulso||'')); const e = espacoPorTutor[k] = espacoPorTutor[k] || {tutor:a.tutorId?tutorById(a.tutorId):null, nome:agTutorNome(a), desm:0, falta:0, reag:0, list:[]};
    if(a.status==='Falta') e.falta++; else e.desm++;
    if(a.reagendadoPara || a.status==='Reagendado') e.reag++;
    e.list.push(a);
  });
  const rankingEspaco = Object.values(espacoPorTutor).map(e=>Object.assign(e,{n:e.desm+e.falta})).sort((a,b)=>b.n-a.n).slice(0,8);

let historicoTab = 'registros';

  return `

}
let historicoFilters = {todos:false};
function renderHistoricoRegistros(){
  const q = (document.getElementById('histSearch')?.value ?? state.globalQuery ?? '').toLowerCase();
  const results = [];
  DB.agendamentos.forEach(a=>{
    const t=tutorById(a.tutorId), an=animalById(a.animalId);
    const text = `${t?.nome||''} ${an?.nome||''} ${a.tipo} ${statusLabel(a.status)}`.toLowerCase();
    if(!q || text.includes(q)) results.push({kind:'Agendamento', date:a.data, tutor:t, animal:an, detail:`${a.tipo} — ${statusLabel(a.status)}${a.motivoStatus?' ('+a.motivoStatus+')':''}`, id:a.id});
  });
  DB.contatos.forEach(c=>{
    const t=c.tutorId?tutorById(c.tutorId):null, an=c.animalId?animalById(c.animalId):null;
    const text = `${t?.nome||c.nomeAvulso||''} ${an?.nome||c.animalAvulso||''} ${c.motivoNaoAgendamento||''} contato`.toLowerCase();
    if(!q || text.includes(q)) results.push({kind:'Contato', date:c.dataContato, tutor:t, animal:an, tutorNome:c.nomeAvulso, animalNome:c.animalAvulso, detail:`Contato — ${c.status}${c.motivoNaoAgendamento?' ('+c.motivoNaoAgendamento+')':''}`, id:c.id, contato:true});
  });
  const filtrados = historicoFilters.todos? results : results.filter(r=>inRefPeriod(r.date));
  filtrados.sort((a,b)=>(b.date||'').localeCompare(a.date||''));

  return `
  ${renderDashNav()}
  <div style="margin:-10px 0 16px;"><label style="display:inline-flex; align-items:center; gap:6px; font-weight:600; cursor:pointer;"><input type="checkbox" id="historicoTodosPeriodos" style="width:auto;" ${historicoFilters.todos?'checked':''}> Ignorar período e mostrar todo o histórico</label></div>
  <div class="view-head">
    <div class="filters search-input" style="margin-bottom:0; max-width:400px;">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input id="histSearch" placeholder="Buscar por tutor, animal, status ou motivo…" value="${q}">
    </div>
  </div>
  <div class="card">
    ${filtrados.length? `<div class="table-wrap"><table><thead><tr><th>Data</th><th>Tipo</th><th>Tutor</th><th>Animal</th><th>Detalhe</th></tr></thead><tbody>
      ${filtrados.slice(0,300).map(r=>`
        <tr class="rowlink" ${r.contato?`data-open-contato="${r.id}"`:`data-open-ag="${r.id}"`}>
          <td>${fmtDate(r.date)}</td>
          <td><span class="pill-muted">${r.kind}</span></td>
          <td>${r.tutor?.nome || r.tutorNome || '—'}</td>
          <td>${r.animal?.nome || r.animalNome || '—'}</td>
          <td>${r.detail}</td>
        </tr>`).join('')}
    </tbody></table></div>` : `<div class="pad">${emptyState('Nenhum resultado encontrado','Tente buscar por outro nome, telefone ou status.')}</div>`}
  </div>`;
}

========================================================= */
const METAS_CATEGORIAS = [
  {key:'Consultas', label:'Consultas', manual:false,
    calcPrevisto:(mesAno)=> DB.agendamentos.filter(a=>['Consulta','Acompanhamento'].includes(a.tipo) && !['Cancelado','Desmarcado','Reagendado'].includes(a.status) && monthKey(a.data)===mesAno).length,
    calc:(mesAno)=> DB.agendamentos.filter(a=>['Consulta','Acompanhamento'].includes(a.tipo) && a.status==='Realizado' && monthKey(a.data)===mesAno).length},
  {key:'Cirurgias', label:'Cirurgias', manual:false,
    calcPrevisto:(mesAno)=> DB.agendamentos.filter(a=>a.tipo==='Cirurgia' && !['Cancelado','Desmarcado','Reagendado'].includes(a.status) && monthKey(a.data)===mesAno).length,
    calc:(mesAno)=> DB.agendamentos.filter(a=>a.tipo==='Cirurgia' && a.status==='Realizado' && monthKey(a.data)===mesAno).length},
  {key:'Produtos', label:'Produtos', manual:true},
  {key:'Exames', label:'Exames', manual:true},
];
let metasMesAno = todayISO().slice(0,7);
function metaFor(mesAno, categoria){ return (DB.metas||[]).find(m=>m.mesAno===mesAno && m.categoria===categoria); }
function metaMesLabel(mesAno){
  const dt = new Date(mesAno+'-01T00:00:00');
  const l = dt.toLocaleDateString('pt-BR',{month:'long', year:'numeric'});
  return l.replace(/^\w/,c=>c.toUpperCase());
}
function metaStepMonth(mesAno, dir){
  const dt = new Date(mesAno+'-01T00:00:00'); dt.setMonth(dt.getMonth()+dir);
  return dt.toISOString().slice(0,7);
}
function renderMetas(){
  const mesAno = metasMesAno;
  return `
  <div class="view-head">
    <div class="dash-nav-ctrl" style="background:#fff; border:1px solid var(--line); border-radius:12px; padding:8px 10px;">
      <button class="icon-btn" id="metaPrevMes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M15 18l-6-6 6-6"/></svg></button>
      <button class="dash-nav-label" data-mes-pick="meta" title="Escolher mês">${metaMesLabel(mesAno)}</button>
      <input type="month" id="mesInput_meta" value="${mesAno}" style="position:absolute; opacity:0; pointer-events:none; width:1px; height:1px;">
      <button class="icon-btn" id="metaNextMes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M9 18l6-6-6-6"/></svg></button>
      ${mesAno!==todayISO().slice(0,7)?`<button class="btn btn-secondary btn-sm" id="metaHoje">Mês atual</button>`:''}
    </div>
  </div>
  <div class="grid g2">
    ${METAS_CATEGORIAS.map(cat=>{
      const m = metaFor(mesAno, cat.key);
      const real = cat.manual ? (m?.valorManual||0) : cat.calc(mesAno);
      const previsto = cat.manual ? null : cat.calcPrevisto(mesAno);
      const meta = m?.meta||0, supermeta = m?.supermeta||0;
      const pctReal = meta? Math.min(100, Math.round((real/meta)*100)) : 0;
      const pctPrevisto = (meta && previsto!==null)? Math.min(100, Math.round((previsto/meta)*100)) : 0;
      let status = 'Sem meta definida para este mês';
      let statusColor = 'var(--ink-faint)';
      if(meta){
        if(supermeta && real>=supermeta){ status='Supermeta batida!'; statusColor='var(--st-realizado)'; }
        else if(real>=meta){ status='Meta batida!'; statusColor='var(--st-realizado)'; }
        else { status='Meta em andamento'; statusColor='var(--brown-dark)'; }
      }
      const faltam = meta ? meta-real : 0;
      const faltamTxt = !meta ? '' : (faltam>0 ? `Faltam <strong>${faltam}</strong> para a meta${supermeta?` · <strong>${Math.max(0,supermeta-real)}</strong> para a supermeta`:''}` : `<strong>${-faltam}</strong> acima da meta`);
      return `
      <div class="card pad meta-card" style="--c:${statusColor==='var(--st-realizado)'?'var(--st-realizado)':'var(--sage)'};">
        <div class="section-title" style="justify-content:space-between;">
          <span>${cat.label} ${meta?`<span class="tag" style="margin-left:6px;">${meta?Math.round(real/meta*100):0}%</span>`:''}</span>
          <button class="icon-btn" data-edit-meta="${cat.key}" title="Definir meta">${ICONS.edit}</button>
        </div>
        ${cat.manual?`
        <div style="margin-bottom:10px;">
          <div class="value" style="font-family:'Fraunces',serif; font-size:26px; font-weight:600; color:var(--brown-dark);">${real}</div>
          <div style="font-size:11px; color:var(--ink-soft); font-weight:700;">REALIZADO (lançado manualmente)</div>
          ${meta?`<div style="color:var(--ink-soft); font-size:12.5px; margin-top:4px;">meta ${meta}${supermeta?' · super '+supermeta:''}</div>`:''}
        </div>
        ${meta?`<div class="bar-track"><div class="bar-fill" style="width:${pctReal}%; background:var(--brown);"></div></div>`:''}
        `:`
        <div style="display:flex; gap:16px; margin-bottom:10px;">
          <div><div class="value" style="font-family:'Fraunces',serif; font-size:26px; font-weight:600; color:var(--sage-dark);">${previsto}</div><div style="font-size:11px; color:var(--ink-soft); font-weight:700;">PREVISTO (agendado)</div></div>
          <div><div class="value" style="font-family:'Fraunces',serif; font-size:26px; font-weight:600; color:var(--brown-dark);">${real}</div><div style="font-size:11px; color:var(--ink-soft); font-weight:700;">REAL (realizado)</div></div>
          ${meta?`<div style="align-self:center; color:var(--ink-soft); font-size:12.5px;">meta ${meta}${supermeta?' · super '+supermeta:''}</div>`:''}
        </div>
        ${meta?`
          <div class="hint" style="margin-bottom:3px;">Previsto · <strong>${Math.round(previsto/meta*100)}%</strong></div>
          <div class="bar-track" style="margin-bottom:8px;"><div class="bar-fill" style="width:${pctPrevisto}%; background:var(--sage);"></div></div>
          <div class="hint" style="margin-bottom:3px;">Real · <strong>${Math.round(real/meta*100)}%</strong></div>
          <div class="bar-track"><div class="bar-fill" style="width:${pctReal}%; background:var(--brown);"></div></div>
        `:''}
        `}
        <div style="margin-top:10px; font-size:12.5px; font-weight:700; color:${statusColor};">${status}${meta?` · ${Math.round(real/meta*100)}%`:''}</div>
        ${faltamTxt?`<div style="margin-top:3px; font-size:12.5px; color:var(--ink-soft);">${faltamTxt}</div>`:''}
      </div>`;
    }).join('')}
  </div>`;
}
function formMeta(categoria){
  const mesAno = metasMesAno;
  const m = metaFor(mesAno, categoria);
  const cat = METAS_CATEGORIAS.find(c=>c.key===categoria);
  const html = modalShell(`Meta — ${cat.label}`, `
    <form id="formMeta">
      <div class="hint" style="margin-bottom:12px;">${metaMesLabel(mesAno)}</div>
      <div class="field-row">
        <div class="field"><label>Meta</label><input type="number" min="0" name="meta" value="${m?.meta||''}"></div>
        <div class="field"><label>Supermeta</label><input type="number" min="0" name="supermeta" value="${m?.supermeta||''}"></div>
      </div>
      ${cat.manual?`<div class="field"><label>Valor realizado neste mês</label><input type="number" min="0" name="valorManual" value="${m?.valorManual||''}"><div class="hint">Como ${cat.label} não é lançado automaticamente no sistema, digite aqui o valor do mês.</div></div>`:''}
    </form>`,
    `<button class="btn btn-secondary" id="modalCancel">Cancelar</button><button class="btn btn-primary" id="modalSave">Salvar</button>`);
  openModal(html, {narrow:true});
  bindModalClose();
  document.getElementById('modalSave').addEventListener('click', ()=>{
    const f = document.getElementById('formMeta');
    const data = Object.fromEntries(new FormData(f));
    const meta = Number(data.meta)||0, supermeta = Number(data.supermeta)||0;
    const valorManual = cat.manual ? (Number(data.valorManual)||0) : undefined;
    if(m){ m.meta=meta; m.supermeta=supermeta; if(cat.manual) m.valorManual=valorManual; }
    else DB.metas.push({id:uid(), mesAno, categoria, meta, supermeta, ...(cat.manual?{valorManual}:{})});
    logAction(`definiu meta de ${cat.label} para ${metaMesLabel(mesAno)} (meta ${meta}, supermeta ${supermeta}${cat.manual?', realizado '+valorManual:''})`);
    saveDB(); closeModal(); render(); toast('Meta salva');
  });
}

/* =========================================================
   VISÃO ANUAL
========================================================= */
let visaoAnualAno = new Date().getFullYear();
const MESES_ABREV = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
function renderVisaoAnual(){
  const ano = visaoAnualAno;
  const tiposLista = tiposNomes();
  const coresPorTipo = ['var(--sage-dark)','var(--st-confirmado)','var(--st-reagendado)','var(--st-aguardando)','var(--brown)','#D9679B','#8A6647','#3F7FBF'];
  const meses = MESES_ABREV.map((label,i)=>{
    const mk = `${ano}-${String(i+1).padStart(2,'0')}`;
    const porTipo = tipo => ({
      agendadas: DB.agendamentos.filter(a=>a.tipo===tipo && !['Cancelado','Desmarcado','Reagendado'].includes(a.status) && monthKey(a.data)===mk).length,
      naoRealizadas: DB.contatos.filter(c=>c.tipoAtendimento===tipo && c.status==='Não agendado' && monthKey(c.dataContato)===mk).length,
      desmarcadas: DB.agendamentos.filter(a=>a.tipo===tipo && ['Cancelado','Desmarcado'].includes(a.status) && monthKey(a.data)===mk).length,
      realizadas: DB.agendamentos.filter(a=>a.tipo===tipo && a.status==='Realizado' && monthKey(a.data)===mk).length,
    });
    const porTipoMes = {};
    tiposLista.forEach(t=>{ porTipoMes[t] = porTipo(t); });
    return {
      label, mk,
      contatos: DB.contatos.filter(c=>!c.mesmoTelefonema && monthKey(c.dataContato)===mk).length,
      ...porTipoMes,
    };
  });
  const linhas = [{label:'Contatos', key:'contatos', color:'var(--brown)', top:true}];
  tiposLista.forEach((tipo,i)=>{
    const cor = coresPorTipo[i%coresPorTipo.length];
    linhas.push({label:`${tipo} — agendados`, tipo, sub:'agendadas', color:cor});
    linhas.push({label:`${tipo} — não realizados (contatos que não marcaram)`, tipo, sub:'naoRealizadas', color:'var(--st-cancelado)'});
    linhas.push({label:`${tipo} — desmarcados/cancelados`, tipo, sub:'desmarcadas', color:'var(--st-desmarcado)'});
  });
  const getVal = (m,l) => l.top ? m[l.key] : m[l.tipo][l.sub];
  const anoTemDados = meses.some(m=>linhas.some(l=>getVal(m,l)>0));
  const destaque = (tipo, sub)=>{
    const comDados = meses.filter(m=>m[tipo] && m[tipo][sub]>0);
    if(!comDados.length) return {maisLabel:'—', menosLabel:'—'};
    const mais = comDados.reduce((a,b)=>b[tipo][sub]>a[tipo][sub]?b:a);
    const menos = comDados.reduce((a,b)=>b[tipo][sub]<a[tipo][sub]?b:a);
    return {maisLabel:`${mais.label} (${mais[tipo][sub]})`, menosLabel:`${menos.label} (${menos[tipo][sub]})`};
  };
  const destaqueContatos = (()=>{
    const comDados = meses.filter(m=>m.contatos>0);
    if(!comDados.length) return {maisLabel:'—'};
    const mais = comDados.reduce((a,b)=>b.contatos>a.contatos?b:a);
    return {maisLabel:`${mais.label} (${mais.contatos})`};
  })();
  const destaquesPorTipo = tiposLista.map(tipo=>({tipo, ...destaque(tipo,'realizadas')}));
  const mesAtualIdx = (ano===new Date().getFullYear()) ? new Date().getMonth() : -1;
  const hl = i => i===mesAtualIdx ? 'background:var(--sage-pale);' : '';
  const realizadasPorTipo = tiposLista.map((t,i)=>({tipo:t, cor:coresPorTipo[i%coresPorTipo.length], n:meses.reduce((s,m)=>s+m[t].realizadas,0)}));
  const totalRealizadas = realizadasPorTipo.reduce((s,x)=>s+x.n,0);
  const totalContatosAno = meses.reduce((s,m)=>s+m.contatos,0);
  let acc = 0;
  const pizzaGrad = totalRealizadas ? realizadasPorTipo.filter(x=>x.n>0).map(x=>{ const a=acc/totalRealizadas*100; acc+=x.n; return `${x.cor} ${a}% ${acc/totalRealizadas*100}%`; }).join(', ') : '';
  const resumoAnoHtml = `
  <div class="card pad" style="margin-bottom:16px;">
    <div class="section-title">Resumo de ${ano}</div>
    <div style="display:flex; align-items:center; gap:32px; flex-wrap:wrap;">
      ${totalRealizadas ? `<div style="width:130px; height:130px; border-radius:50%; background:conic-gradient(${pizzaGrad}); position:relative; flex-shrink:0;"><div style="position:absolute; inset:30px; border-radius:50%; background:#fff; display:flex; flex-direction:column; align-items:center; justify-content:center;"><div style="font-family:'Fraunces',serif; font-size:22px; font-weight:700; line-height:1;">${totalRealizadas}</div><div style="font-size:10.5px; color:var(--ink-soft); margin-top:2px;">realizados</div></div></div>` : ''}
      <div style="flex:1; min-width:220px; display:flex; flex-direction:column; gap:8px; font-size:13.5px;">
        <div style="display:flex; justify-content:space-between; gap:16px; border-bottom:1px solid var(--line); padding-bottom:6px;"><span>Contatos recebidos no ano</span><strong>${totalContatosAno}</strong></div>
        ${realizadasPorTipo.map(x=>`<div style="display:flex; justify-content:space-between; gap:16px; align-items:center;"><span style="display:inline-flex; align-items:center; gap:8px;"><span style="width:10px; height:10px; border-radius:50%; background:${x.cor};"></span>${x.tipo} realizados</span><span><strong>${x.n}</strong> <span style="color:var(--ink-soft); font-size:12px;">${totalRealizadas?Math.round(x.n/totalRealizadas*100):0}%</span></span></div>`).join('')}
      </div>
    </div>
  </div>`;

  return `
  <div class="view-head">
    <div class="dash-nav-ctrl" style="background:#fff; border:1px solid var(--line); border-radius:12px; padding:8px 10px;">
      <button class="icon-btn" id="anoPrev"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M15 18l-6-6 6-6"/></svg></button>
      <span class="dash-nav-label" style="cursor:default;">${ano}</span>
      <button class="icon-btn" id="anoNext"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M9 18l6-6-6-6"/></svg></button>
      ${ano!==new Date().getFullYear()?`<button class="btn btn-secondary btn-sm" id="anoAtual">Ano atual</button>`:''}
    </div>
  </div>

  ${anoTemDados? `
  <div class="grid g4" style="margin-bottom:16px;">
    ${statCard('Mês com mais contatos', destaqueContatos.maisLabel, 'var(--brown)')}
    ${destaquesPorTipo.map((d,i)=>statCard(`Mês com mais "${d.tipo}" realizados`, d.maisLabel, coresPorTipo[i%coresPorTipo.length])).join('')}
  </div>

  ${resumoAnoHtml}
  <div class="card pad">
    <div class="section-title">Comparativo ${ano}</div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>Indicador</th>${MESES_ABREV.map((m,i)=>`<th style="text-align:center; ${hl(i)}">${m}</th>`).join('')}<th style="text-align:center;">Total</th></tr></thead>
        <tbody>
          ${linhas.map(l=>{
            const total = meses.reduce((s,m)=>s+getVal(m,l),0);
            return `<tr ${l.top?'style="background:var(--sage-pale);"':''}><td><span style="display:inline-flex; align-items:center; gap:6px;"><span style="width:8px;height:8px;border-radius:50%;background:${l.color};display:inline-block;"></span>${l.label}</span></td>
              ${meses.map((m,i)=>`<td style="text-align:center; ${hl(i)} ${getVal(m,l)>0?'font-weight:700;':'color:var(--ink-faint);'}">${getVal(m,l)}</td>`).join('')}
              <td style="text-align:center; font-weight:800;">${total}</td></tr>`;
          }).join('')}
        </tbody>
      </table>
      <div class="hint" style="margin-top:8px;">Agendadas = ainda válidas no calendário (não desmarcadas/canceladas) · Não realizadas = contatos que nunca chegaram a marcar · Desmarcadas = tinham data marcada e foram desmarcadas/canceladas</div>
    </div>
  </div>` : `<div class="card"><div class="pad">${emptyState('Nenhum dado para '+ano, 'O comparativo aparece automaticamente conforme agendamentos e contatos forem registrados nesse ano.')}</div></div>`}
  `;
}

const FORMAS_PAGAMENTO = ['Dinheiro','Cartão de Crédito','Cartão de Débito','Pix','Transferência','Outro'];
let notasFiscaisTab = 'notas';

function nfAlertas(){
  const hoje = todayISO();
  const mesAtual = monthKey(hoje);
  const alertas = [];
  const pendentesForaDoMes = (DB.notasFiscais||[]).filter(nf=>nf.status==='Pendente' && monthKey(nf.data) < mesAtual);
  if(pendentesForaDoMes.length){
    const porMes = {};
    pendentesForaDoMes.forEach(nf=>{ porMes[monthKey(nf.data)] = (porMes[monthKey(nf.data)]||0)+1; });
    Object.entries(porMes).sort().forEach(([mk,n])=>{
      const dt = new Date(mk+'-01T00:00:00');
      const label = dt.toLocaleDateString('pt-BR',{month:'long',year:'numeric'});
      alertas.push(`<strong>${n}</strong> nota${n===1?'':'s'} pendente${n===1?'':'s'} de <strong>${label}</strong>, o mês já fechou: regularize o quanto antes.`);
    });
  }
  const dt = new Date(hoje+'T00:00:00');
  const ultimoDiaMes = new Date(dt.getFullYear(), dt.getMonth()+1, 0).getDate();
  const diasRestantes = ultimoDiaMes - dt.getDate();
  if(diasRestantes<=5){
    const pendentesMesAtual = (DB.notasFiscais||[]).filter(nf=>nf.status==='Pendente' && monthKey(nf.data)===mesAtual).length;
    if(pendentesMesAtual>0){
      alertas.push(`O mês está terminando em ${diasRestantes} dia${diasRestantes===1?'':'s'}: <strong>${pendentesMesAtual}</strong> nota${pendentesMesAtual===1?'':'s'} deste mês ainda ${pendentesMesAtual===1?'está':'estão'} pendente${pendentesMesAtual===1?'':'s'}.`);
    }
  }
  return alertas;
}

    <button class="tab ${notasFiscaisTab==='notas'?'active':''}" data-nftab="notas">Notas</button>

  </div>

function copiarFallback(txt){
  const ta=document.createElement('textarea'); ta.value=txt; ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); }catch(e){} ta.remove();
}
function nfChave(nf){
  return nf.usarDadosTutor===false ? 'alt:'+((nf.cpfAlternativo||nf.nomeAlternativo||'').toLowerCase().replace(/\W/g,'')) : 'tut:'+(nf.tutorId||'');
}
function nfPendentesDuplicadas(nf){
  if(nf.status!=='Pendente') return [];
  const k = nfChave(nf);
  if(k==='tut:'||k==='alt:') return [];
  return (DB.notasFiscais||[]).filter(o=>o.id!==nf.id && o.status==='Pendente' && nfChave(o)===k);
}
function unirNotasFiscais(nf){
  const outras = nfPendentesDuplicadas(nf);
  if(!outras.length) return;
  const total = [nf].concat(outras).reduce((s,x)=>s+(x.valorTotal||0),0);
  const fmt = v=>'R$ '+v.toFixed(2).replace('.',',');
  confirmDialog('Unir notas pendentes?', `Vai juntar ${outras.length+1} notas pendentes deste cliente numa só, somando os serviços: ${[nf].concat(outras).map(x=>fmt(x.valorTotal||0)).join(' + ')} = ${fmt(total)}. As outras vão para a Lixeira.`, ()=>{
    closeModal();
    nf.itens = (nf.itens||[]).concat(...outras.map(o=>o.itens||[]));
    nf.valorTotal = total;
    nf.cobrado = [nf].concat(outras).reduce((s,x)=>s+(x.cobrado!=null?x.cobrado:(x.valorTotal||0)),0);
    nf.splits = [nf].concat(outras).reduce((s,x)=>s+(x.splits||0),0);
    outras.forEach(o=>{ DB.notasFiscais = DB.notasFiscais.filter(x=>x.id!==o.id); moveToTrash('nf', o); });
    logAction(`uniu ${outras.length+1} notas fiscais pendentes numa só (${fmt(total)})`);
    saveDB(); render(); toast('Notas unidas');
  });
}

document.addEventListener('click', e=>{
  const b = e.target.closest('[data-copy-target]'); if(!b) return;
  const el = document.getElementById(b.dataset.copyTarget); if(!el) return;
  const txt = (el.value!==undefined && el.tagName!=='DIV') ? el.value : el.textContent;
  const ok = ()=>{ toast('Copiado'); b.classList.add('copiado'); setTimeout(()=>b.classList.remove('copiado'),900); };
  if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(ok).catch(()=>{ copiarFallback(txt); ok(); });
  else { copiarFallback(txt); ok(); }
});
