      ref:{type:'contato', id:c.id}});
  });
  DB.lembretes.filter(l=>l.animalId===animalId).forEach(l=>{
    items.push({data:l.data, dot:'var(--st-aguardando)', kind:'Lembrete',
      title:l.titulo + (l.concluido?' (concluído)':''),
      detail:l.observacao||'', ref:{type:'lembrete', id:l.id}});
  });
  return items.sort((x,y)=>y.data.localeCompare(x.data));
}

function animalTabLinha(timeline){

  return `<div class="timeline">${timeline.map(it=>`
    <div class="tl-item ${it.ref.type==='ag'?'rowlink':''} ${it.ref.type==='contato'?'rowlink':''}" ${it.ref.type==='ag'?`data-open-ag="${it.ref.id}"`:''} ${it.ref.type==='contato'?`data-open-contato="${it.ref.id}"`:''}>

function ativarTabelasInteligentes(){
  document.querySelectorAll('.view table').forEach(t=>{
    const tb=t.tBodies[0]; if(!tb || t.dataset.sortOk) return; t.dataset.sortOk='1';
    t.querySelectorAll('thead th').forEach((th,i)=>{
      if(!th.textContent.trim() || /^(ações|acoes)$/i.test(th.textContent.trim())) return;
      th.classList.add('sortavel');
      th.addEventListener('click', ()=>{
        const dir = th.dataset.dir==='asc' ? 'desc' : 'asc';
        t.querySelectorAll('thead th').forEach(x=>{ delete x.dataset.dir; });
        th.dataset.dir=dir;
        const rows=[...tb.rows].filter(r=>r.cells.length>i && r.cells.length>1);
        const val=r=>{ const x=(r.cells[i].textContent||'').trim(); const m=x.match(/^(\d{2})\/(\d{2})(?:\/(\d{4}))?/); if(m) return (m[3]||'0000')+m[2]+m[1]; const n=parseFloat(x.replace(/[^\d,.-]/g,'').replace('.','').replace(',','.')); return (/^[\sR$\d.,-]+$/.test(x) && !isNaN(n)) ? n : x.toLowerCase(); };
        rows.sort((a,b)=>{ const va=val(a), vb=val(b); const r = (typeof va==='number'&&typeof vb==='number') ? va-vb : String(va).localeCompare(String(vb),'pt-BR',{numeric:true}); return dir==='asc'?r:-r; });
        rows.forEach(r=>tb.appendChild(r));
      });
    });
  });
  document.querySelectorAll('.view .table-wrap').forEach(w=>{
    if(w.dataset.drag) return; w.dataset.drag='1';
    let down=false, sx=0, sl=0, moved=false;
    w.addEventListener('mousedown', e=>{ if(e.button!==0 || e.target.closest('button,a,input,select,textarea')) return; down=true; moved=false; sx=e.pageX; sl=w.scrollLeft; });
    window.addEventListener('mousemove', e=>{ if(!down) return; const dx=e.pageX-sx; if(Math.abs(dx)>4){ moved=true; w.classList.add('arrastando'); } if(moved) w.scrollLeft=sl-dx; });
    window.addEventListener('mouseup', ()=>{ down=false; w.classList.remove('arrastando'); });
    w.addEventListener('click', e=>{ if(moved){ e.stopPropagation(); e.preventDefault(); moved=false; } }, true);
  });
}
function attachViewHandlers(){
  setTimeout(ativarTabelasInteligentes,0);
  document.querySelectorAll('[data-open-lembrete-pend]').forEach(el=>el.addEventListener('click', e=>{ e.stopPropagation(); formLembrete(DB.lembretes.find(l=>l.id===el.dataset.openLembretePend)); }));

    logAction(`adicionou o perfil "${nome}"`);
    saveDB(); render(); renderUserSelect(); toast('Perfil adicionado');
  });
  document.querySelectorAll('[data-del-usuario]').forEach(el=>el.addEventListener('click', ()=>{
    const u = DB.usuarios.find(x=>x.id===el.dataset.delUsuario); if(!u) return;
    if(DB.usuarios.length<=1){ toast('Precisa existir ao menos um perfil'); return; }
    confirmDialog('Remover perfil?', `"${u.nome}" será removido da lista de perfis desta conta.`, ()=>{
      DB.usuarios = DB.usuarios.filter(x=>x.id!==u.id);
      if(getCurrentUserObj().id===u.id) setCurrentUser(DB.usuarios[0].id);
      logAction(`removeu o perfil "${u.nome}"`);
      saveDB(); closeModal(); render(); renderUserSelect(); toast('Perfil removido');
    });
  }));
  document.querySelectorAll('[data-edit-usuario]').forEach(el=>el.addEventListener('click', ()=>{
    const u = DB.usuarios.find(x=>x.id===el.dataset.editUsuario); if(!u) return;
    formUsuario(u);
  }));
  document.querySelectorAll('[data-foto-usuario]').forEach(el=>el.addEventListener('change', e=>{
    const file = e.target.files[0]; if(!file) return;
    const u = DB.usuarios.find(x=>x.id===el.dataset.fotoUsuario); if(!u) return;
    const reader = new FileReader();
    reader.onload = ev=>{
      const img = new Image();
      img.onload = ()=>{
        const size=120, canvas=document.createElement('canvas'); canvas.width=size; canvas.height=size;
        const ctx = canvas.getContext('2d');
        const scale = Math.max(size/img.width, size/img.height);
        const w=img.width*scale, h=img.height*scale;
        ctx.drawImage(img, (size-w)/2, (size-h)/2, w, h);
        u.foto = canvas.toDataURL('image/jpeg', 0.85);
        logAction(`atualizou a foto do usuário "${u.nome}"`);
        saveDB(); render(); renderUserSelect(); toast('Foto atualizada');
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  }));
  document.querySelectorAll('[data-restore]').forEach(el=>el.addEventListener('click', e=>{
    e.stopPropagation();
    const item = (DB.lixeira||[]).find(x=>x.id===el.dataset.restore);
    const grupoLen = item?.loteId ? (DB.lixeira||[]).filter(x=>x.loteId===item.loteId).length : 1;
    restoreFromTrash(el.dataset.restore); render();
    toast(grupoLen>1 ? 'Registros restaurados' : 'Registro restaurado');
  }));
  document.querySelectorAll('[data-purge]').forEach(el=>el.addEventListener('click', e=>{
    e.stopPropagation();
    confirmDialog('Excluir definitivamente?','Esta ação não pode ser desfeita, o registro sairá da Lixeira para sempre.', ()=>{
      purgeFromTrash(el.dataset.purge); saveDB(); closeModal(); render(); toast('Excluído definitivamente');
    });
  }));
  document.getElementById('emptyTrashBtn')?.addEventListener('click', ()=>{
    confirmDialog('Esvaziar lixeira?','Todos os registros da lixeira serão excluídos definitivamente. Esta ação não pode ser desfeita.', ()=>{
      DB.lixeira = []; saveDB(); closeModal(); render(); toast('Lixeira esvaziada');
    });
  });
}

/* ---------- Exportações ---------- */
function importBackup(e){
  const file = e.target.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = ev=>{
    try{
      const data = JSON.parse(ev.target.result);
      confirmDialog('Importar backup?','Isso substituirá todos os dados atuais deste navegador pelos dados do arquivo importado.', ()=>{
        DB = Object.assign(blankDB(), data); saveDB(); closeModal(); render(); toast('Backup importado com sucesso');
      });
    }catch(err){ toast('Arquivo inválido'); }
  };
  reader.readAsText(file);
}
function exportICS(ag){
  const t=tutorById(ag.tutorId), an=animalById(ag.animalId);
  const dt = ag.data.replace(/-/g,'') + 'T' + ag.horario.replace(':','') + '00';
  const ics = `BEGIN:VCALENDAR\nVERSION:2.0\nBEGIN:VEVENT\nUID:${ag.id}@olhatta\nDTSTAMP:${dt}\nDTSTART:${dt}\nSUMMARY:${ag.tipo} - ${an?.nome||''} (${t?.nome||''})\nDESCRIPTION:${(ag.observacoes||'').replace(/\n/g,' ')}\nEND:VEVENT\nEND:VCALENDAR`;
  const blob = new Blob([ics], {type:'text/calendar'});
  const url = URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url; a.download=`agendamento-${an?.nome||'evento'}-${ag.data}.ics`; a.click();
  URL.revokeObjectURL(url); toast('Arquivo .ics exportado');
}

async function doLogout(){

function showLoginError(msg){
  const el = document.getElementById('loginError');
  if(el){ el.textContent = msg; el.style.display='block'; }
  else toast(msg);
}
function traduzErroFirebase(e){
  const map = {
    'auth/wrong-password':'Senha incorreta.',
    'auth/invalid-credential':'E-mail ou senha incorretos.',
    'auth/user-not-found':'Não existe conta com esse e-mail.',
    'auth/email-already-in-use':'Já existe uma conta com esse e-mail. Tente entrar em vez de criar uma nova.',
    'auth/invalid-email':'E-mail inválido.',
    'auth/weak-password':'Senha muito fraca (mínimo 6 caracteres).',
    'auth/popup-closed-by-user':'Login cancelado.',
    'auth/network-request-failed':'Falha de conexão. Verifique a internet.',
    'auth/unauthorized-domain':'Este endereço não está autorizado no Firebase (Authentication → Settings → Authorized domains).',
    'auth/operation-not-allowed':'Esse método de login não está ativado no Firebase (Authentication → Sign-in method).',
    'auth/requires-recent-login':'Por segurança, você precisa confirmar sua senha/login de novo antes de excluir a conta.',
  };
  return map[e.code] || ('Erro ao entrar: '+(e.message||e.code||'desconhecido'));
}

/* ---------- Exclusão de conta ---------- */
function openDeleteAccountFlow(){
  const user = auth.currentUser;
  if(!user) return;
  const html = modalShell('Excluir conta', `
    <p style="font-size:13.5px; color:var(--ink-soft); margin-bottom:12px;">Isso apaga <strong>todos os dados</strong> e encerra para sempre o acesso com <strong>${user.email||'esta conta'}</strong>. Não pode ser desfeito.</p>
    <div class="field"><label>Digite o e-mail da conta para confirmar</label><input id="delAccountEmail" placeholder="${user.email||''}"></div>
  `, `<button class="btn btn-secondary" id="modalCancel">Cancelar</button><button class="btn btn-danger" id="btnConfirmDelAccount">Excluir permanentemente</button>`);
  openModal(html);
  document.getElementById('modalClose').addEventListener('click', closeModal);
  document.getElementById('modalCancel').addEventListener('click', closeModal);
  document.getElementById('btnConfirmDelAccount').addEventListener('click', ()=>{
    const typed = document.getElementById('delAccountEmail').value.trim().toLowerCase();
    if(!user.email || typed!==user.email.toLowerCase()){ toast('O e-mail digitado não confere'); return; }
    closeModal();
    reauthenticateAndDelete(user);
  });
}
function reauthenticateAndDelete(user){
  const providerId = user.providerData[0]?.providerId;
  if(providerId==='google.com'){
    const provider = new firebase.auth.GoogleAuthProvider();
    user.reauthenticateWithPopup(provider).then(()=>finalizarExclusaoConta(user)).catch(e=>toast(traduzErroFirebase(e)));
  } else {
    const html = modalShell('Confirme sua senha', `
      <p class="hint" style="margin-bottom:10px;">Por segurança, digite sua senha novamente antes de excluir a conta.</p>
      <div class="field"><label>Senha</label><input type="password" id="reauthSenha"></div>
    `, `<button class="btn btn-secondary" id="modalCancel">Cancelar</button><button class="btn btn-danger" id="btnReauthConfirm">Confirmar e excluir</button>`);
    openModal(html, {narrow:true});
    document.getElementById('modalClose').addEventListener('click', closeModal);
    document.getElementById('modalCancel').addEventListener('click', closeModal);
    document.getElementById('btnReauthConfirm').addEventListener('click', ()=>{
      const senha = document.getElementById('reauthSenha').value;
      if(!senha) return;
      const cred = firebase.auth.EmailAuthProvider.credential(user.email, senha);
      user.reauthenticateWithCredential(cred).then(()=>{ closeModal(); finalizarExclusaoConta(user); }).catch(e=>toast(traduzErroFirebase(e)));
    });
  }
}
function finalizarExclusaoConta(user){
  toast('Apagando dados…');
  detachFirestoreListener();
  DB = blankDB();
  FIRESTORE_DOC.set(DB).then(()=>user.delete()).then(()=>{
    toast('Conta excluída');
    showLogin();
  }).catch(e=>{
    console.error(e);
    toast('Erro ao excluir conta: '+(traduzErroFirebase(e)||e.message||e.code||''));
    attachFirestoreListener(user);
  });
}

/* =========================================================
   BOTÃO "VOLTAR" DO CELULAR (histórico de telas, janelas e gavetas)
========================================================= */
const __camadas = [];   // pilha de janelas/gavetas abertas
let __navSkip = 0;
function iniciarHistorico(){
  if(window.__histPronto) return;
  window.__histPronto = true;
  try{ history.replaceState({olh:1}, '', rotaAtual()); }catch(e){}
}
function observarCamada(id, tag){
  const el = document.getElementById(id); if(!el) return;
  let aberto = false;
  new MutationObserver(()=>{
    const agora = el.childElementCount>0;
    if(agora===aberto) return;
    aberto = agora;
    if(!window.__histPronto) return;
    if(agora){ __camadas.push(tag); try{ history.pushState({olh:1, camada:tag}, ''); }catch(e){} }
    else{
      const i = __camadas.lastIndexOf(tag);
      if(i===-1) return;               // fechado pelo botão voltar
      if(i===__camadas.length-1){ __camadas.pop(); __navSkip++; try{ history.back(); }catch(e){ __navSkip=0; } }
      else __camadas.splice(i,1);
    }
  }).observe(el, {childList:true});
}
observarCamada('modalRoot','modal');
observarCamada('drawerRoot','drawer');
window.addEventListener('popstate', ev=>{
  if(__navSkip>0){ __navSkip--; return; }
  if(__camadas.length){
    const tag = __camadas.pop();
    if(tag==='modal') document.getElementById('modalRoot').innerHTML='';
    else document.getElementById('drawerRoot').innerHTML='';
    return;
  }
  if(!aplicarRota(location.hash)){ try{ history.replaceState({olh:1}, '', rotaAtual()); }catch(e){} }
});
let __scrollT; window.addEventListener('scroll', ()=>{ clearTimeout(__scrollT); __scrollT=setTimeout(()=>{ scrollPorTela[state.view]=window.scrollY; },120); }, {passive:true});

/* =========================================================
   BUSCAS: apagam o texto ao clicar fora
========================================================= */
const SEL_BUSCA = 'input[placeholder^="Buscar"], input[type="search"], #globalSearch';
document.addEventListener('focusout', ev=>{
  const el = ev.target;
  if(!el.matches || !el.matches(SEL_BUSCA) || el.closest('#modalRoot')) return;
  setTimeout(()=>{
    if(!el.isConnected || document.activeElement===el || !el.value) return;
    if(el.closest('.search-global') && document.querySelector('#globalSearchResults:hover')) return;
    el.value='';
    el.dispatchEvent(new Event('input', {bubbles:true}));
    setTimeout(()=>{ const a=document.activeElement; if(a && a.matches && a.matches(SEL_BUSCA) && !a.value) a.blur(); }, 40);
  }, 180);
});

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('service-worker.js').catch(()=>{});
  });
}
