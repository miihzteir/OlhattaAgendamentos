<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Olhatta</title>
<link rel="icon" type="image/png" href="favicon-32.png">
<link rel="apple-touch-icon" href="olhatta-logo-180.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#5C7355">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Olhatta">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --sage:#7C9473; --sage-dark:#5C7355; --sage-light:#E7EEE2; --sage-pale:#F3F6F0;
  --brown:#A9805F; --brown-dark:#8A6647; --brown-light:#F1E6D8; --brown-pale:#FAF5EE;
  --cream:#FBF8F3; --ink:#33362F; --ink-soft:#6B6E63; --ink-faint:#9A9C90;
  --line:#E6E0D2; --white:#FFFFFF;
  --st-agendado:#5C8A52; --st-agendado-bg:#E5EEE0;
  --st-realizado:#1F8A6E; --st-realizado-bg:#D9EFE8;
  --st-cancelado:#B03B3B; --st-cancelado-bg:#F3DCDC;
  --st-desmarcado:#C9682A; --st-desmarcado-bg:#F6E3D2;
  --st-reagendado:#6B4FA0; --st-reagendado-bg:#E7E1F1;
  --st-falta:#7A3B52; --st-falta-bg:#EEDCE4;
  --st-confirmado:#2F6690; --st-confirmado-bg:#DCE8F0;
  --st-aguardando:#B8901E; --st-aguardando-bg:#F5EBD3;
  --radius:14px; --radius-sm:9px;
  --shadow:0 1px 2px rgba(51,54,47,.05), 0 6px 20px -8px rgba(51,54,47,.12);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent; -webkit-touch-callout:none;}
button, a, input, select, textarea, .rowlink, .chip, .pend-row, .insight{ -webkit-tap-highlight-color:transparent; outline:none; }
button:focus, .icon-btn:focus, .btn:focus{ outline:none; box-shadow:none; }
html,body{margin:0;padding:0; overflow-x:clip; max-width:100%;}
body{
  font-family:'Manrope',sans-serif; background:var(--cream); color:var(--ink);
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,.display{font-family:'Fraunces',serif;}
button{font-family:inherit;}
::selection{background:var(--sage-light);}
a{color:inherit;}
svg{width:16px; height:16px; flex-shrink:0; display:inline-block; vertical-align:-3px;}

/* ---------- Layout ---------- */
#app{display:flex; min-height:100vh; max-width:100vw;}
.sidebar{
  width:230px; flex-shrink:0; background:linear-gradient(180deg,#4E5D46,#3F4B38);
  color:#EFEFE6; display:flex; flex-direction:column;
  position:fixed; top:0; left:0; bottom:0; height:auto; z-index:60; overflow-y:auto;
}
.brand{display:flex; align-items:center; gap:10px; padding:24px 20px 18px;}
.brand-mark{width:34px;height:34px;flex-shrink:0;}
.brand-text{font-family:'Fraunces',serif; font-size:19px; font-weight:600; letter-spacing:.02em; color:#F6F4EC;}
.brand-sub{font-size:10.5px; color:#C7CDBB; letter-spacing:.08em; text-transform:uppercase; margin-top:1px;}
nav.navlist{padding:6px 12px; display:flex; flex-direction:column; gap:2px; flex:1;}
.navlink{
  display:flex; align-items:center; gap:11px; padding:10px 12px; border-radius:10px;
  color:#D9DECB; text-decoration:none; font-size:14px; font-weight:600; cursor:pointer;
  border:none; background:none; text-align:left; width:100%;
}
.navlink svg{width:17px;height:17px;flex-shrink:0; opacity:.85;}
.navlink:hover{background:rgba(255,255,255,.07); color:#fff;}
.navlink.active{background:#EFEFE6; color:#3F4B38;}
.navlink.active svg{opacity:1;}
.sidebar-foot{padding:16px 20px; font-size:11px; color:#9DA593; border-top:1px solid rgba(255,255,255,.08);}

main{flex:1; min-width:0; display:flex; flex-direction:column; margin-left:230px;}
.topbar{
  position:sticky; top:0; z-index:20; background:rgba(251,248,243,.92); backdrop-filter:blur(6px);
  border-bottom:1px solid var(--line); padding:18px 30px; display:flex; align-items:center; justify-content:space-between; gap:16px;
}
.topbar h1{font-size:22px; margin:0; font-weight:600; color:var(--ink);}
.topbar .sub{font-size:12.5px; color:var(--ink-soft); margin-top:2px; font-family:'Manrope',sans-serif; font-weight:500;}
.quicklink-pill{display:inline-flex; align-items:center; padding:6px 12px; border-radius:20px; background:var(--sage-pale); color:var(--sage-dark); font-size:12px; font-weight:700; text-decoration:none; border:1px solid var(--line); white-space:nowrap; max-width:140px; overflow:hidden; text-overflow:ellipsis;}
.quicklink-pill:hover{background:var(--sage-light);}
.search-global{
  display:flex; align-items:center; gap:8px; background:#fff; border:1px solid var(--line); border-radius:10px;
  padding:8px 12px; min-width:260px;
}
.search-global input{border:none;outline:none;font-size:13.5px;width:100%;background:transparent;font-family:'Manrope',sans-serif;}
.search-global svg{width:15px;height:15px;color:var(--ink-faint);flex-shrink:0;}
.view{padding:26px 30px 60px;}
.view-head{display:flex; align-items:center; justify-content:space-between; gap:14px; margin-bottom:20px; flex-wrap:wrap;}

/* ---------- Buttons ---------- */
.btn{
  display:inline-flex; align-items:center; gap:7px; border-radius:10px; padding:9px 16px; font-size:13.5px;
  font-weight:700; border:1px solid transparent; cursor:pointer; white-space:nowrap; font-family:'Manrope',sans-serif;
  transition:transform .08s ease;
}
.btn:active{transform:scale(.97);}
.btn svg{width:15px;height:15px;}
.btn-primary{background:var(--sage-dark); color:#fff;}
.btn-primary:hover{background:#4d5f46;}
.btn-secondary{background:#fff; color:var(--ink); border-color:var(--line);}
.btn-secondary:hover{border-color:var(--brown);}
.btn-ghost{background:transparent; color:var(--ink-soft); border-color:transparent; padding:8px 10px;}
.btn-ghost:hover{background:var(--sage-pale); color:var(--ink);}
.btn-danger{background:#fff; color:var(--st-cancelado); border-color:var(--st-cancelado-bg);}
.btn-danger:hover{background:var(--st-cancelado-bg);}
.btn-sm{padding:6px 11px; font-size:12.5px; border-radius:8px;}
.icon-btn{background:none;border:none;cursor:pointer;padding:6px;border-radius:8px;color:var(--ink-soft);display:flex;}
.icon-btn:hover{background:var(--sage-pale); color:var(--ink);}
.icon-btn svg{width:16px;height:16px;}

/* ---------- Cards / grid ---------- */
.card{background:#fff; border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow);}
.pad{padding:20px;}
.grid{display:grid; gap:16px;}
.g4{grid-template-columns:repeat(4,1fr);}
.g3{grid-template-columns:repeat(3,1fr);}
.g2{grid-template-columns:repeat(2,1fr);}
@media (max-width:1100px){.g4{grid-template-columns:repeat(2,1fr);} .g3{grid-template-columns:repeat(2,1fr);}}
@media (max-width:640px){.g4,.g3,.g2{grid-template-columns:1fr;}}

.stat-card{padding:18px 20px; border-radius:var(--radius); border:1px solid var(--line); background:#fff; position:relative; overflow:hidden;}
.stat-card .label{font-size:12px; font-weight:700; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.05em;}
.stat-card .value{font-family:'Fraunces',serif; font-size:32px; font-weight:600; margin-top:6px; color:var(--ink);}
.stat-card .delta{font-size:12px; margin-top:4px; font-weight:700;}
.stat-card .delta.up{color:var(--st-realizado);}
.stat-card .delta.down{color:var(--st-cancelado);}
.stat-card .stripe{position:absolute; left:0; top:0; bottom:0; width:4px;}

.section-title{font-family:'Fraunces',serif; font-size:16px; font-weight:600; margin:0 0 14px; color:var(--ink); display:flex; align-items:center; gap:8px;}
.section-title .tag{font-family:'Manrope',sans-serif; font-size:11px; font-weight:700; background:var(--brown-light); color:var(--brown-dark); padding:2px 8px; border-radius:20px;}

/* ---------- Table ---------- */
table{width:100%; border-collapse:collapse; font-size:13.5px;}
th{text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-soft); font-weight:700; padding:8px 12px; border-bottom:1px solid var(--line);}
td{padding:11px 12px; border-bottom:1px solid #F1EEE4; vertical-align:middle;}
tr.rowlink{cursor:pointer;}
tr.rowlink:hover td{background:var(--sage-pale);}
.table-wrap{overflow-x:auto;}

/* ---------- Badges/status ---------- */
.badge{display:inline-flex; align-items:center; gap:5px; font-size:11.5px; font-weight:700; padding:4px 10px; border-radius:20px;}
.badge::before{content:''; width:6px;height:6px;border-radius:50%;background:currentColor;}
.st-Agendado{background:var(--st-agendado-bg); color:var(--st-agendado-dark, var(--st-agendado));}
.st-Agendado{color:#5C7355;}
.st-Realizado{background:var(--st-realizado-bg); color:var(--st-realizado);}
.st-Cancelado{background:var(--st-cancelado-bg); color:var(--st-cancelado);}
.st-Desmarcado{background:var(--st-desmarcado-bg); color:var(--st-desmarcado);}
.st-Reagendado{background:var(--st-reagendado-bg); color:var(--st-reagendado);}
.st-Falta{background:var(--st-falta-bg); color:var(--st-falta);}
.st-Confirmado{background:var(--st-confirmado-bg); color:var(--st-confirmado);}
.st-AguardandoConfirmacao{background:var(--st-aguardando-bg); color:var(--st-aguardando);}
.pill{background:var(--brown-pale); color:var(--brown-dark); font-size:11.5px; font-weight:700; padding:3px 9px; border-radius:20px;}
.pill-muted{background:#F1EEE4; color:var(--ink-soft); font-size:11.5px; font-weight:700; padding:3px 9px; border-radius:20px;}
.pill-link{background:var(--sage-pale); color:var(--sage-dark); font-size:11.5px; font-weight:700; padding:3px 9px; border-radius:20px; cursor:pointer; border:none; display:inline-flex; align-items:center; gap:4px;}
.pill-link:hover{background:var(--sage-light);}
.timeline{display:flex; flex-direction:column;}
.tl-item{display:flex; gap:12px; padding:12px 0; border-bottom:1px solid #F1EEE4;}
.tl-item:last-child{border-bottom:none;}
.tl-dot{width:9px;height:9px;border-radius:50%; margin-top:5px; flex-shrink:0;}
.tl-date{font-size:11px; color:var(--ink-faint); font-weight:700; white-space:nowrap; width:74px; flex-shrink:0; margin-top:3px;}
.tl-content{flex:1; font-size:13px;}
.tl-content .tl-title{font-weight:700; color:var(--ink);}
.user-select-wrap{padding:12px 20px; border-top:1px solid rgba(255,255,255,.08);}
.user-select-wrap label{color:#B9C0A9; font-size:10px; margin-bottom:5px;}
.user-select-wrap select{background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.15); color:#F6F4EC; font-size:12.5px; padding:7px 9px;}
.user-select-wrap select option{color:#222;}
.mini-stat{background:var(--sage-pale); border-radius:10px; padding:10px 12px;}
.mini-stat .n{font-family:'Fraunces',serif; font-size:20px; font-weight:600; color:var(--ink);}
.mini-stat .l{font-size:11px; color:var(--ink-soft); font-weight:700; text-transform:uppercase; letter-spacing:.03em;}

/* ---------- Forms ---------- */
label{display:block; font-size:12.5px; font-weight:700; color:var(--ink-soft); margin-bottom:6px;}
input,select,textarea{
  width:100%; border:1px solid var(--line); border-radius:9px; padding:10px 12px; font-size:13.5px;
  font-family:'Manrope',sans-serif; background:#fff; color:var(--ink); outline:none;
}
input:focus,select:focus,textarea:focus{border-color:var(--sage);}
textarea{resize:vertical; min-height:70px;}
[contenteditable][data-placeholder]:empty::before{content:attr(data-placeholder); color:var(--ink-faint);}
input[type="date"],input[type="time"]{color-scheme:light; min-height:38px;}
.filters input[type="date"]{min-width:130px;}
.field{margin-bottom:14px;}
.field-row{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
@media (max-width:560px){.field-row{grid-template-columns:1fr;}}
.hint{font-size:11.5px; color:var(--ink-faint); margin-top:5px;}
.chip-list{display:flex; flex-wrap:wrap; gap:6px; margin-top:8px;}
.chip{display:inline-flex; align-items:center; gap:6px; background:var(--sage-pale); color:var(--sage-dark); padding:5px 6px 5px 11px; border-radius:20px; font-size:12.5px; font-weight:700;}
.chip button{background:none;border:none;cursor:pointer;color:var(--sage-dark);display:flex;padding:2px;border-radius:50%;}
.chip button:hover{background:rgba(0,0,0,.08);}

/* ---------- Filters bar ---------- */
.filters{display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:16px;}
.filters select,.filters input{width:auto; min-width:140px; font-size:13px; padding:8px 11px;}
.search-input{position:relative; flex:1; min-width:200px;}
.search-input svg{position:absolute; left:11px; top:50%; transform:translateY(-50%); width:14px;height:14px;color:var(--ink-faint);}
.search-input input{padding-left:32px;}

/* ---------- Empty state ---------- */
.empty{text-align:center; padding:26px 20px; color:var(--ink-soft);}
.empty svg{width:26px;height:26px; color:var(--brown); margin-bottom:8px; opacity:.55;}
.empty .t{font-family:'Fraunces',serif; font-size:14.5px; color:var(--ink); margin-bottom:3px;}
.empty .d{font-size:12.5px; max-width:320px; margin:0 auto; line-height:1.4;}

/* ---------- Modal ---------- */
.modal-backdrop{position:fixed; inset:0; background:rgba(51,54,47,.45); display:flex; align-items:flex-start; justify-content:center; padding:5vh 16px; z-index:100; overflow-y:auto;}
.modal{background:#fff; border-radius:16px; width:100%; max-width:520px; box-shadow:0 20px 60px rgba(0,0,0,.25); animation:pop .15s ease;}
@keyframes pop{from{opacity:0; transform:translateY(6px) scale(.98);} to{opacity:1; transform:none;}}
.modal-head{display:flex; align-items:center; justify-content:space-between; padding:20px 22px 0;}
.modal-head h3{margin:0; font-size:18px; font-weight:600;}
.modal-body{padding:16px 22px 22px;}
.modal-foot{display:flex; justify-content:flex-end; gap:10px; padding:0 22px 22px;}
.modal.narrow{max-width:400px;}

/* ---------- Alerts / reminders ---------- */
.alert{display:flex; gap:12px; padding:13px 15px; border-radius:12px; align-items:flex-start; font-size:13px;}
.alert svg{width:18px;height:18px;flex-shrink:0; margin-top:1px;}
.alert-brown{background:var(--brown-light); color:var(--brown-dark);}
.alert-sage{background:var(--sage-light); color:var(--sage-dark);}
.alert-warn{background:var(--st-aguardando-bg); color:var(--st-aguardando);}
.alert-danger{background:var(--st-cancelado-bg); color:var(--st-cancelado);}
.alert-hoje{background:var(--st-confirmado-bg); color:var(--st-confirmado); border:1.5px solid var(--st-confirmado);}
.alert .t1{font-weight:700; margin-bottom:2px;}

/* insight list */
.insight{display:flex; gap:10px; padding:11px 0; border-bottom:1px solid #F1EEE4; font-size:13.5px; align-items:flex-start;}
.insight:last-child{border-bottom:none;}
.insight .dot{width:7px;height:7px;border-radius:50%; background:var(--brown); margin-top:6px; flex-shrink:0;}

/* mini bar chart */
.bars{display:flex; flex-direction:column; gap:10px;}
.bar-row{display:grid; grid-template-columns:120px 1fr 34px; gap:10px; align-items:center; font-size:12.5px;}
.bar-track{background:var(--sage-pale); border-radius:6px; height:10px; overflow:hidden;}
.bar-fill{height:100%; background:var(--brown); border-radius:6px;}

/* Detail drawer */
.drawer-backdrop{position:fixed; inset:0; background:rgba(51,54,47,.4); z-index:90;}
.drawer{position:fixed; top:0; right:0; bottom:0; width:420px; max-width:92vw; background:#fff; z-index:91; box-shadow:-10px 0 40px rgba(0,0,0,.15); overflow-y:auto; animation:slidein .18s ease;}
@keyframes slidein{from{transform:translateX(16px); opacity:.6;} to{transform:none; opacity:1;}}
.drawer-head{padding:22px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:flex-start; background:var(--sage-pale);}
.drawer-head h2{margin:0 0 4px; font-size:20px;}
.drawer-body{padding:22px;}
.drawer-sub{color:var(--ink-soft); font-size:13px;}

.tabs{display:flex; gap:4px; border-bottom:1px solid var(--line); margin-bottom:16px;}
.cal-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:3px; background:transparent; border:none; border-radius:12px;}
.cal-head{text-align:center; font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-soft); padding:10px 0; background:var(--sage-pale); border-radius:8px;}
.cal-cell{background:#fff; border:1px solid var(--line); border-radius:9px; min-height:150px; padding:7px 6px; cursor:pointer; transition:background .12s; display:flex; flex-direction:column;}
.cal-cell:hover{background:var(--sage-pale);}
.cal-cell.cal-empty{background:transparent; border:none; cursor:default;}
.cal-cell.cal-hoje{background:#F3F8F1; border-color:var(--sage-dark);}
.cal-daynum{font-size:12px; font-weight:800; color:var(--ink-soft); margin-bottom:5px; width:22px; height:22px; display:flex; align-items:center; justify-content:center; border-radius:50%;}
.cal-cell.cal-hoje .cal-daynum{background:var(--sage-dark); color:#fff;}
.cal-events{display:flex; flex-direction:column; gap:3px; flex:1;}
.cal-event{font-size:10px; padding:4px 7px; border-radius:7px; overflow:hidden; font-weight:700; color:#fff !important; line-height:1.35; margin-bottom:2px;}
.cal-event-l3{overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-weight:500; opacity:.85; font-size:8.5px;}
.cal-event-l1{overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.cal-event-l2{overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-weight:500; opacity:.9; font-size:9px;}
.cal-more{font-size:10px; color:var(--ink-soft); font-weight:700; padding-left:3px; margin-top:1px;}
.cal-dots{display:none; gap:3px; flex-wrap:wrap; margin-top:2px;}
.cal-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;}
@media (max-width:760px){
  .cal-grid{border-radius:8px; gap:1px;}
  .cal-cell{min-height:52px; padding:4px;}
  .cal-daynum{width:19px;height:19px; font-size:11px;}
  .cal-event{display:none;}
  .cal-dots{display:flex;}
  .cal-daynum{margin-bottom:2px;}
}
.tab{padding:9px 14px; font-size:13px; font-weight:700; color:var(--ink-soft); cursor:pointer; border-bottom:2px solid transparent; background:none; border-top:none; border-left:none; border-right:none;}
.tab.active{color:var(--sage-dark); border-bottom-color:var(--sage-dark);}

.toast-wrap{position:fixed; bottom:20px; right:20px; z-index:200; display:flex; flex-direction:column; gap:8px;}
.toast{background:var(--ink); color:#fff; padding:11px 16px; border-radius:10px; font-size:13px; font-weight:600; box-shadow:0 8px 24px rgba(0,0,0,.25); animation:toastin .18s ease;}
@keyframes toastin{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;}}

.mobile-toggle{display:none;}
.gsr-panel{position:absolute; top:calc(100% + 8px); left:0; right:0; background:#fff; border:1px solid var(--line); border-radius:12px; box-shadow:0 16px 40px rgba(0,0,0,.14); max-height:420px; overflow-y:auto; z-index:50; display:none;}
.gsr-panel.show{display:block;}
.gsr-item{padding:12px 16px; border-bottom:1px solid #F1EEE4; cursor:pointer;}
.gsr-item:last-child{border-bottom:none;}
.gsr-item:hover{background:var(--sage-pale);}
.gsr-name{font-weight:700; font-size:13.5px; color:var(--ink); display:flex; align-items:center; gap:8px;}
.gsr-meta{font-size:12px; color:var(--ink-soft); margin-top:3px; display:flex; flex-wrap:wrap; gap:10px;}
.gsr-empty{padding:18px 16px; font-size:13px; color:var(--ink-soft); text-align:center;}
.dash-nav{display:flex; align-items:center; justify-content:space-between; gap:12px; background:#fff; border:1px solid var(--line); border-radius:12px; padding:8px 10px; margin-bottom:18px; flex-wrap:wrap;}
.dash-nav-gran{display:flex; background:var(--sage-pale); border-radius:9px; padding:3px; gap:2px;}
.dgran{border:none; background:none; padding:6px 13px; border-radius:7px; font-size:12.5px; font-weight:700; color:var(--ink-soft); cursor:pointer; font-family:'Manrope',sans-serif;}
.dgran.active{background:#fff; color:var(--sage-dark); box-shadow:0 1px 3px rgba(0,0,0,.08);}
.dash-nav-ctrl{display:flex; align-items:center; gap:4px; position:relative;}
.dash-nav-label{border:none; background:none; font-family:'Fraunces',serif; font-size:14.5px; font-weight:600; color:var(--ink); padding:6px 8px; cursor:pointer; border-radius:8px;}
.dash-nav-label:hover{background:var(--sage-pale);}
.dash-greeting{margin-bottom:16px;}
.dash-greeting-title{font-family:'Fraunces',serif; font-size:24px; font-weight:600; color:var(--ink);}

/* ---------- Persistência ---------- */
const DB_KEY = 'olhatta_db_v1';
function blankDB(){
  return { tutores:[], animais:[], vinculos:[], agendamentos:[], contatos:[], lembretes:[],
    usuarios:[{id:'u_default', nome:'Recepção', foto:null}], auditLog:[], lixeira:[], metas:[],
    notasFiscais:[], categoriasNF:['Consulta','Cirurgia','Medicamento','Colírio','Material cirúrgico','Outro'],
    relatorios:[], avaliacoes:[], profissionais:[], linksRapidos:[], pendencias:[],
    tiposAtendimento:[
      {nome:'Consulta', cor:'#3F7FBF'}, {nome:'Acompanhamento', cor:'#3F7FBF'},
      {nome:'Retorno', cor:'#D9679B'}, {nome:'Segmento', cor:'#E08A2E'},
      {nome:'Cirurgia', cor:'#E0B929'}, {nome:'Exame', cor:'#EDD888'},
      {nome:'Retirada de pontos', cor:'#8A6647'}
    ],
    cidadesClinicas:{'Sinop':['Olhatta','Volante','Equibem','Outro'], 'Lucas':['Pet Center','Espaço Pet','Outro']},
    meta:{criadoEm:Date.now()} };
}
let DB = loadDB();
function loadDB(){
  try{
    const raw = localStorage.getItem(DB_KEY);
    if(!raw) return blankDB();
    const parsed = JSON.parse(raw);
    const db = Object.assign(blankDB(), parsed);
    // migração: versões antigas guardavam usuarios como lista de nomes (strings)
    if(db.usuarios && db.usuarios.length && typeof db.usuarios[0]==='string'){
      db.usuarios = db.usuarios.map(nome=>({id:uid(), nome, foto:null}));
    }
    if(!db.usuarios || !db.usuarios.length) db.usuarios=[{id:'u_default', nome:'Recepção', foto:null}];
    return db;
  }catch(e){ console.error('Erro ao carregar dados', e); return blankDB(); }
}
function saveDB(){
  localStorage.setItem(DB_KEY, JSON.stringify(DB));
  pushToFirestore();
}
function pushToFirestore(){
  if(!auth.currentUser) return;
  clearTimeout(firestoreSyncTimer);
  firestoreSyncTimer = setTimeout(()=>{
    FIRESTORE_DOC.set(DB).catch(e=>{ console.error('Erro ao sincronizar', e); toast('Não foi possível sincronizar com a nuvem'); });
  }, 500);
}
function pushToFirestoreImmediate(){
  if(!auth.currentUser) return Promise.resolve();
  return FIRESTORE_DOC.set(DB).catch(e=>console.error('Erro ao sincronizar', e));
}
function uid(){ return 'id' + Date.now().toString(36) + Math.random().toString(36).slice(2,8); }

/* ---------- Usuário atual ---------- */
const CURRENT_USER_KEY = 'olhatta_current_user_id';
function getCurrentUserObj(){
  if(!DB.usuarios || !DB.usuarios.length) DB.usuarios=[{id:'u_default', nome:'Recepção', foto:null}];
  const savedId = localStorage.getItem(CURRENT_USER_KEY);
  let u = DB.usuarios.find(x=>x.id===savedId);
  if(!u) u = DB.usuarios.find(x=>x.nome===savedId); // compatibilidade com versão antiga (guardava o nome)
  if(!u) u = DB.usuarios[0];
  return u;
}
function getCurrentUser(){ return getCurrentUserObj().nome; }
function setCurrentUser(id){ localStorage.setItem(CURRENT_USER_KEY, id); }

/* ---------- Vínculo do perfil local com a conta Firebase ---------- */
function ensureLocalProfile(fbUser){
  DB.usuarios = DB.usuarios||[];
  if(DB.usuarios.length===0){
    const u = {id:uid(), nome:fbUser.displayName || (fbUser.email?fbUser.email.split('@')[0]:'Usuário'), foto:fbUser.photoURL||null};
    DB.usuarios.push(u);
    setCurrentUser(u.id);
    return true;
  }
  const current = getCurrentUserObj();
  if(!current || !DB.usuarios.some(x=>x.id===current.id)){
    setCurrentUser(DB.usuarios[0].id);
  }
  return false;
}

/* ---------- Sincronização em tempo real com o Firestore ---------- */
function showProfilePicker(){
  hideInitialLoader();
  document.getElementById('app').classList.add('app-hidden');
  document.getElementById('loginScreen').classList.remove('hide');
  const body = document.getElementById('loginBody');
  if(!DB.usuarios || !DB.usuarios.length) DB.usuarios=[{id:'u_default', nome:'Recepção', foto:null}];
  body.innerHTML = `
    <div class="login-title">Quem está usando o sistema?</div>
    <div class="login-sub">Escolha seu perfil para continuar.</div>
    <div class="profile-grid">
      ${DB.usuarios.map(u=>`<button type="button" class="profile-card" data-pick-profile="${u.id}">${avatarHtml(u,52)}<span class="name">${u.nome}</span></button>`).join('')}
    </div>`;
  body.querySelectorAll('[data-pick-profile]').forEach(el=>el.addEventListener('click', ()=>{
    const u = DB.usuarios.find(x=>x.id===el.dataset.pickProfile);
    setCurrentUser(el.dataset.pickProfile);
    logAction(`entrou no sistema (${u?u.nome:'usuário'})`);
    saveDB();
    showApp();
  }));
}
function attachFirestoreListener(fbUser){
  unsubscribeSnapshot = FIRESTORE_DOC.onSnapshot(doc=>{
    const existed = doc.exists;
    if(existed){ DB = Object.assign(blankDB(), doc.data()); }
    const profileChanged = ensureLocalProfile(fbUser);
    localStorage.setItem(DB_KEY, JSON.stringify(DB));
    if(!existed || profileChanged){ pushToFirestoreImmediate(); }
    if(!state.__appShown){ state.__appShown = true; showProfilePicker(); }
    else { render(); renderUserSelect(); }
  }, err=>{
    console.error(err);
    showLoginError('Não foi possível conectar ao banco de dados na nuvem. Verifique se o Firestore foi criado e as regras permitem acesso.');
  });
}
function detachFirestoreListener(){
  if(unsubscribeSnapshot){ unsubscribeSnapshot(); unsubscribeSnapshot=null; }
  state.__appShown = false;
}

/* ---------- Histórico de alterações ---------- */
function logAction(acao){
  DB.auditLog = DB.auditLog||[];
  DB.auditLog.push({id:uid(), usuario:getCurrentUser(), dataHora:new Date().toISOString(), acao});
  if(DB.auditLog.length>500) DB.auditLog = DB.auditLog.slice(-500);
}
function fmtDateTime(iso){
  if(!iso) return '—';
  return new Date(iso).toLocaleString('pt-BR', {day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});
}

/* ---------- Lixeira (exclusão reversível) ---------- */
function moveToTrash(tipo, dados, extra){
  DB.lixeira = DB.lixeira||[];
  DB.lixeira.unshift({id:uid(), tipo, dados, extra:extra||null, excluidoEm:new Date().toISOString(), excluidoPor:getCurrentUser()});
}
function restoreFromTrash(id){
  const item = (DB.lixeira||[]).find(x=>x.id===id); if(!item) return;
  if(item.tipo==='tutor'){ DB.tutores.push(item.dados); (item.extra||[]).forEach(v=>DB.vinculos.push(v)); }
  else if(item.tipo==='animal'){ DB.animais.push(item.dados); (item.extra||[]).forEach(v=>DB.vinculos.push(v)); }
  else if(item.tipo==='agendamento'){ DB.agendamentos.push(item.dados); }
  else if(item.tipo==='contato'){ DB.contatos.push(item.dados); }
  else if(item.tipo==='lembrete'){ DB.lembretes.push(item.dados); }
  DB.lixeira = DB.lixeira.filter(x=>x.id!==id);
  logAction(`restaurou "${trashLabel(item)}" da lixeira`);
  saveDB();
}
function trashLabel(item){
  if(item.tipo==='tutor') return item.dados.nome;
  if(item.tipo==='animal') return item.dados.nome;
  if(item.tipo==='agendamento') return `${item.dados.tipo} — ${fmtDate(item.dados.data)}`;
  if(item.tipo==='contato') return `Contato — ${fmtDate(item.dados.dataContato)}`;
  if(item.tipo==='lembrete') return item.dados.titulo;
  return item.tipo;
}

/* ---------- CSV ---------- */
function toCSV(rows, headers){
  const esc = v => `"${String(v??'').replace(/"/g,'""')}"`;
  const lines = [headers.map(h=>esc(h.label)).join(',')];
  rows.forEach(r=> lines.push(headers.map(h=>esc(h.get(r))).join(',')));
  return lines.join('\r\n');
}
function downloadCSV(filename, content){
  const blob = new Blob(['\uFEFF'+content], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url; a.download=filename; a.click();
  URL.revokeObjectURL(url);
}
function exportCSV(tipo){
  let headers, rows, filename;
  if(tipo==='tutores'){ headers=[{label:'Nome',get:r=>r.nome},{label:'Telefone',get:r=>r.telefone},{label:'Cidade',get:r=>r.cidade||''},{label:'Clínica',get:r=>r.clinica||''},{label:'Observações',get:r=>r.obs||''}]; rows=DB.tutores; filename='olhatta-tutores.csv'; }
  else if(tipo==='animais'){ headers=[{label:'Nome',get:r=>r.nome},{label:'Espécie',get:r=>r.especie||''},{label:'Sexo',get:r=>r.sexo||''},{label:'Óbito',get:r=>r.obito?'Sim':'Não'},{label:'Tutor(es)',get:r=>tutoresDoAnimal(r.id).map(t=>t.nome).join('; ')},{label:'Observações',get:r=>r.obs||''}]; rows=DB.animais; filename='olhatta-animais.csv'; }
  else if(tipo==='agendamentos'){ headers=[{label:'Data',get:r=>r.data},{label:'Horário',get:r=>r.horario},{label:'Tutor',get:r=>tutorById(r.tutorId)?.nome||''},{label:'Animal',get:r=>animalById(r.animalId)?.nome||''},{label:'Tipo',get:r=>r.tipo},{label:'Status',get:r=>STATUS_LABELS[r.status]||r.status},{label:'Cidade',get:r=>r.cidade||''},{label:'Clínica',get:r=>r.clinica||''},{label:'Indicação',get:r=>indicacaoLabel(r)||''},{label:'Agendado por',get:r=>r.usuarioResponsavel||''},{label:'Data do contato',get:r=>r.dataContato||''},{label:'Retorno previsto',get:r=>r.retornoPrevisto||''},{label:'Motivo status',get:r=>r.motivoStatus||''},{label:'Observações',get:r=>r.observacoes||''}]; rows=DB.agendamentos; filename='olhatta-agendamentos.csv'; }
  else if(tipo==='contatos'){ headers=[{label:'Data',get:r=>r.dataContato},{label:'Origem',get:r=>r.origem||'Recebido'},{label:'Tipo de atendimento',get:r=>r.tipoAtendimento||''},{label:'Tutor',get:r=>r.tutorId?(tutorById(r.tutorId)?.nome||''):(r.nomeAvulso||'')},{label:'Animal',get:r=>r.animalId?(animalById(r.animalId)?.nome||''):(r.animalAvulso||'')},{label:'Telefone',get:r=>r.telefone||''},{label:'Cidade',get:r=>r.cidade||''},{label:'Clínica',get:r=>r.clinica||''},{label:'Status',get:r=>r.status},{label:'Motivo',get:r=>r.motivoNaoAgendamento||''},{label:'Indicação',get:r=>indicacaoLabel(r)||''},{label:'Tentativas',get:r=>1+(r.tentativas?.length||0)}]; rows=DB.contatos; filename='olhatta-contatos.csv'; }
  else if(tipo==='lembretes'){ headers=[{label:'Título',get:r=>r.titulo},{label:'Data',get:r=>r.data},{label:'Horário',get:r=>r.horario||''},{label:'Vinculado a (tutor)',get:r=>r.tutorId?(tutorById(r.tutorId)?.nome||''):''},{label:'Vinculado a (animal)',get:r=>r.animalId?(animalById(r.animalId)?.nome||''):''},{label:'Observação',get:r=>r.observacao||''},{label:'Concluído',get:r=>r.concluido?'Sim':'Não'}]; rows=DB.lembretes; filename='olhatta-lembretes.csv'; }
  else if(tipo==='alteracoes'){ headers=[{label:'Data/Hora',get:r=>fmtDateTime(r.dataHora)},{label:'Usuário',get:r=>r.usuario},{label:'Ação',get:r=>r.acao}]; rows=(DB.auditLog||[]).slice().reverse(); filename='olhatta-historico-alteracoes.csv'; }
  else return;
  downloadCSV(filename, toCSV(rows, headers));
  toast('CSV exportado');
}

/* ---------- Helpers de data ---------- */
function todayISO(){ return new Date().toISOString().slice(0,10); }
function stripHtml(html){ const d = document.createElement('div'); d.innerHTML = html||''; return d.textContent||''; }
function fmtDate(iso){
  if(!iso) return '—';
  const [y,m,d]=iso.split('-'); return `${d}/${m}/${y}`;
}
function fmtDateLong(iso){
  if(!iso) return '—';
  const d = new Date(iso+'T00:00:00');
  return d.toLocaleDateString('pt-BR',{weekday:'long', day:'2-digit', month:'long'});
}
function daysBetween(a,b){ return Math.round((new Date(b)-new Date(a))/86400000); }
function addDays(iso,n){ const d=new Date(iso+'T00:00:00'); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); }
function monthKey(iso){ return iso.slice(0,7); }
function isThisMonth(iso){ return monthKey(iso)===monthKey(todayISO()); }
function prevMonthKey(){ const d=new Date(); d.setMonth(d.getMonth()-1); return d.toISOString().slice(0,7); }

/* ---------- Toast ---------- */
function toast(msg){
  const wrap=document.getElementById('toastWrap');
  const el=document.createElement('div'); el.className='toast'; el.textContent=msg;
  wrap.appendChild(el);
  setTimeout(()=>{ el.style.transition='opacity .3s'; el.style.opacity='0'; setTimeout(()=>el.remove(),300); },2600);
}

/* ---------- Navegador de datas do Dashboard ---------- */
function dashStep(dir){
  const g = state.dash.granularity, d = state.dash.refDate;
  if(g==='dia') return addDays(d, dir);
  if(g==='mes'){ const dt=new Date(d+'T00:00:00'); dt.setMonth(dt.getMonth()+dir); return dt.toISOString().slice(0,10); }
  const dt=new Date(d+'T00:00:00'); dt.setFullYear(dt.getFullYear()+dir); return dt.toISOString().slice(0,10);
}
function inRefPeriod(iso){
  if(!iso) return false;
  const g = state.dash.granularity, d = state.dash.refDate;
  if(g==='dia') return iso===d;
  if(g==='mes') return monthKey(iso)===monthKey(d);
  return iso.slice(0,4)===d.slice(0,4);
}
function inPrevRefPeriod(iso){
  if(!iso) return false;
  const g = state.dash.granularity, d = state.dash.refDate;
  if(g==='dia') return iso===addDays(d,-1);
  if(g==='mes'){ const dt=new Date(d+'T00:00:00'); dt.setMonth(dt.getMonth()-1); return monthKey(iso)===dt.toISOString().slice(0,7); }
  return iso.slice(0,4)===String(Number(d.slice(0,4))-1);
}
function dashPeriodLabel(){
  const g = state.dash.granularity, d = state.dash.refDate;
  if(g==='dia') return fmtDateLong(d).replace(/^\w/,c=>c.toUpperCase());
  if(g==='mes'){ const dt=new Date(d+'T00:00:00'); const l=dt.toLocaleDateString('pt-BR',{month:'long',year:'numeric'}); return l.replace(/^\w/,c=>c.toUpperCase()); }
  return d.slice(0,4);
}
function dashPeriodTag(){
  const g = state.dash.granularity, d = state.dash.refDate, real = todayISO();
  if(g==='dia') return d===real?'hoje':fmtDate(d);
  if(g==='mes') return monthKey(d)===monthKey(real)?'este mês':dashPeriodLabel();
  return d.slice(0,4)===real.slice(0,4)?'este ano':d.slice(0,4);
}

  return `${periodo}${primeiroNome?', '+primeiroNome:''}`;

let pendenciasDirty = false;
function salvarAnotacaoAtual(mostrarToast){
  const el = document.getElementById('pendenciasTextarea');
  if(!el) return;
  const html = el.innerHTML;
  const dataRef = state.dash.refDate;
  DB.pendencias = DB.pendencias||[];

  entrada.texto = html;
  entrada.alteradoEm = new Date().toISOString();
  saveDB();
  pendenciasDirty = false;
  const indicador = document.getElementById('pendenciasSalvoIndicador');

  const ir = ()=>{ state.dash.granularity='dia'; state.dash.refDate=dataStr; render(); };

}
function confirmarSairSemSalvarAnotacao(depois){
  const html = modalShell('Alterações não salvas', `<p style="font-size:14px;">Suas alterações na anotação de hoje não foram salvas. Deseja salvar?</p>`,
    `<button class="btn btn-secondary" id="btnNaoSalvarSair">Não</button><button class="btn btn-primary" id="btnSimSalvarSair">Sim</button>`);

  document.getElementById('btnNaoSalvarSair').addEventListener('click', ()=>{ pendenciasDirty=false; closeModal(); depois(); });

}
function globalSearchResults(q){
  q = q.trim().toLowerCase();
  if(q.length<2) return [];
  const results = [];
  DB.tutores.forEach(t=>{
    const anims = animaisDoTutor(t.id);
    if(t.nome.toLowerCase().includes(q) || (t.telefone||'').includes(q) || anims.some(a=>a.nome.toLowerCase().includes(q))){
      results.push({tutor:t, animais:anims});
    }
  });
  DB.animais.forEach(a=>{
    if(a.nome.toLowerCase().includes(q) && !results.some(r=>r.animais.some(x=>x.id===a.id))){
      const tuts = tutoresDoAnimal(a.id);
      if(tuts.length) tuts.forEach(t=>{ if(!results.some(r=>r.tutor.id===t.id)) results.push({tutor:t, animais:animaisDoTutor(t.id)}); });
      else results.push({tutor:null, animalSemTutor:a});
    }
  });
  const nfResults = (DB.notasFiscais||[]).filter(nf=>{
    const nome = nf.usarDadosTutor===false ? (nf.nomeAlternativo||'') : (tutorById(nf.tutorId)?.nome||'');
    return nome.toLowerCase().includes(q);
  }).slice(0,5).map(nf=>({nf}));
  return results.slice(0,8).concat(nfResults);
}
function renderGlobalSearchPanel(q){
  const panel = document.getElementById('globalSearchResults');
  const results = globalSearchResults(q);
  if(!q || q.trim().length<2){ panel.classList.remove('show'); panel.innerHTML=''; return; }
  if(!results.length){ panel.innerHTML = `<div class="gsr-empty">Nenhum resultado para "${q}"</div>`; panel.classList.add('show'); return; }
  panel.innerHTML = results.map(r=>{
    if(r.nf){
      const nf = r.nf;
      const nome = nf.usarDadosTutor===false ? (nf.nomeAlternativo||'—') : (tutorById(nf.tutorId)?.nome||'—');
      return `<div class="gsr-item" data-gsr-nf="${nf.id}">
        <div class="gsr-name">${ICONS.receipt} ${nome} <span class="pill-muted">Nota Fiscal</span></div>
        <div class="gsr-meta">
          <span>${fmtDate(nf.data)}</span>
          <span>R$ ${(nf.valorTotal||0).toFixed(2).replace('.',',')}</span>
          <span>${nf.status}</span>
        </div>
      </div>`;
    }
    if(!r.tutor){
      const a = r.animalSemTutor;
      return `<div class="gsr-item" data-gsr-animal="${a.id}"><div class="gsr-name">${ICONS.paw}${a.nome} <span class="pill-muted">sem tutor vinculado</span></div></div>`;
    }
    const t=r.tutor;
    const ultimoAt = agendamentosDoTutor(t.id).find(a=>a.status==='Realizado');
    const proximoAt = agendamentosDoTutor(t.id).filter(a=>a.data>=todayISO() && ['Agendado','Confirmado','AguardandoConfirmacao'].includes(a.status)).sort((a,b)=>a.data.localeCompare(b.data))[0];
    const proximoLemb = DB.lembretes.filter(l=>!l.concluido && (l.tutorId===t.id || r.animais.some(a=>a.id===l.animalId))).sort((a,b)=>a.data.localeCompare(b.data))[0];
    const ui = getUltimaInteracao(t.id);
    return `<div class="gsr-item" data-gsr-tutor="${t.id}">
      <div class="gsr-name">${t.nome} ${t.telefone?`<span class="pill-muted">${t.telefone}</span>`:''}</div>
      <div class="gsr-meta">
        <span>Animais: ${r.animais.map(a=>a.nome).join(', ')||'—'}</span>
        <span>Último atendimento: ${ultimoAt?fmtDate(ultimoAt.data):'—'}</span>
        <span>Próximo: ${proximoAt?fmtDate(proximoAt.data):'—'}</span>
        <span>Lembrete: ${proximoLemb?fmtDate(proximoLemb.data):'—'}</span>
        <span>Últ. interação: ${ui?fmtDate(ui.data):'—'}</span>
      </div>
    </div>`;
  }).join('');
  panel.classList.add('show');
}

/* ---------- Dados derivados ---------- */
function tutorById(id){ return DB.tutores.find(t=>t.id===id); }
function animalById(id){ return DB.animais.find(a=>a.id===id); }
function agTutorNome(a){ return a.tutorId ? (tutorById(a.tutorId)?.nome||'—') : (a.tutorAvulso||'—'); }
function agAnimalNome(a){ return a.animalId ? (animalById(a.animalId)?.nome||'—') : (a.animalAvulso||'—'); }
function agSemCadastro(a){ return !a.tutorId && !!a.tutorAvulso; }
function animaisDoTutor(tutorId){
  return DB.vinculos.filter(v=>v.tutorId===tutorId).map(v=>animalById(v.animalId)).filter(Boolean);
}
function tutoresDoAnimal(animalId){
  return DB.vinculos.filter(v=>v.animalId===animalId).map(v=>tutorById(v.tutorId)).filter(Boolean);
}
function agendamentosDoAnimal(animalId){ return DB.agendamentos.filter(a=>a.animalId===animalId).sort((a,b)=>b.data.localeCompare(a.data)); }
function agendamentosDoTutor(tutorId){ return DB.agendamentos.filter(a=>a.tutorId===tutorId).sort((a,b)=>b.data.localeCompare(a.data)); }
function contatosDoTutor(tutorId){ return DB.contatos.filter(c=>c.tutorId===tutorId).sort((a,b)=>b.dataContato.localeCompare(a.dataContato)); }

/* ---------- Última interação (agendamento OU contato mais recente) ---------- */
function getUltimaInteracao(tutorId){
  const ags = agendamentosDoTutor(tutorId).map(a=>({data:a.alteradoEm?a.alteradoEm.slice(0,10):a.data, tipo:'agendamento', ref:a}));
  const contatos = contatosDoTutor(tutorId).map(c=>({data:c.dataContato, tipo:'contato', ref:c}));
  const all = [...ags, ...contatos].sort((a,b)=>b.data.localeCompare(a.data));
  if(!all.length) return null;
  const it = all[0];
  if(it.tipo==='agendamento'){
    const ag = it.ref;
    return {data:ag.data, tipoLabel:`Agendamento — ${ag.tipo}`, resultado:statusLabel(ag.status), motivo:ag.motivoStatus||''};
  } else {
    const c = it.ref;
    return {data:c.dataContato, tipoLabel: c.origem==='Realizado'?'Contato realizado pela clínica':'Contato recebido do tutor',
      resultado: c.status==='Agendado'?'Agendamento realizado':(c.status==='Não agendado'?'Não agendou':'Aguardando retorno'),
      motivo: c.motivoNaoAgendamento||''};
  }
}
function ultimaInteracaoHtml(tutorId){
  const ui = getUltimaInteracao(tutorId);
  if(!ui) return `<div class="hint">Nenhuma interação registrada ainda.</div>`;
  return `<div class="alert alert-sage" style="flex-direction:column; align-items:flex-start; gap:2px;">
    <div style="font-weight:700;">Última interação: ${fmtDate(ui.data)}</div>
    <div>Tipo: ${ui.tipoLabel}</div>
    <div>Resultado: ${ui.resultado}</div>
    ${ui.motivo?`<div>Motivo: ${ui.motivo}</div>`:''}
  </div>`;
}

const STATUS_LABELS = {
  Agendado:'Agendado', AguardandoConfirmacao:'Aguardando confirmação', Confirmado:'Confirmado',
  Realizado:'Realizado', Falta:'Faltou', Cancelado:'Cancelado', Desmarcado:'Desmarcado', Reagendado:'Reagendado'
};
const STATUS_ORDER = ['Agendado','AguardandoConfirmacao','Confirmado','Realizado','Falta','Cancelado','Desmarcado'];
function statusLabel(s){ return STATUS_LABELS[s]||s; }
function badge(status){
  return `<span class="badge st-${status}">${statusLabel(status)}</span>`;
}
function tipoPill(tipo){ return `<span class="pill">${tipo}</span>`; }
function tiposNomes(){ return (DB.tiposAtendimento||[]).map(t=>t.nome); }
function tipoColor(tipo){
  const t = (DB.tiposAtendimento||[]).find(x=>x.nome===tipo);
  return t?.cor || '#9A9A9A';
}
function agColor(a){
  if(a.tipo==='Outro' && a.corPersonalizada) return a.corPersonalizada;
  return tipoColor(a.tipo);
}

/* =========================================================
   DASHBOARD
========================================================= */
function renderDashboard(){
  const today = todayISO();
  const refDay = state.dash.granularity==='dia' ? state.dash.refDate : today;
  const ags = DB.agendamentos;
  const agsDoDia = state.dash.granularity==='dia'
    ? ags.filter(a=>a.data===refDay && !['Cancelado','Desmarcado'].includes(a.status))
    : ags.filter(a=>inRefPeriod(a.data) && !['Cancelado','Desmarcado'].includes(a.status));
  const proximos = ags.filter(a=>a.data>=today && a.status==='Confirmado').sort((a,b)=>a.data.localeCompare(b.data)).slice(0,6);
  const realizadosMes = ags.filter(a=>a.status==='Realizado' && inRefPeriod(a.data));
  const canceladosMes = ags.filter(a=>a.status==='Cancelado' && inRefPeriod(a.data));
  const desmarcadosMes = ags.filter(a=>a.status==='Desmarcado' && inRefPeriod(a.data));
  const reagendadosMes = ags.filter(a=>a.reagendadoDe && inRefPeriod(a.data));
  const contatosMes = DB.contatos.filter(c=>inRefPeriod(c.dataContato));
  const naoAgendadosMes = DB.contatos.filter(c=>c.status==='Não agendado' && inRefPeriod(c.dataContato));
  const agendadosViaContatoMes = DB.contatos.filter(c=>c.status==='Agendado' && inRefPeriod(c.dataContato));

  // período anterior p/ comparação
  const realizadosPM = ags.filter(a=>a.status==='Realizado' && inPrevRefPeriod(a.data)).length;
  const desmarcadosPM = ags.filter(a=>a.status==='Desmarcado' && inPrevRefPeriod(a.data)).length;

  // lembretes próximos (7 dias)
  const lembretesProx = DB.lembretes.filter(l=>!l.concluido && l.data<=addDays(today,7) && l.data>=addDays(today,-1))
    .sort((a,b)=>a.data.localeCompare(b.data));

  // motivos de não agendamento
  function addMotivo(map, texto, tutorId){
    if(!texto || !texto.trim()) return;
    const norm = texto.trim().toLowerCase();
    if(!map[norm]) map[norm] = {label: texto.trim(), count:0, tutores:new Set()};
    map[norm].count++;
    const t = tutorId?tutorById(tutorId):null;
    if(t) map[norm].tutores.add(t.nome);
  }
  const motivosMap = {};
  DB.contatos.forEach(c=>{ addMotivo(motivosMap, c.motivoNaoAgendamento, c.tutorId); });
  const motivosArr = Object.values(motivosMap).sort((a,b)=>b.count-a.count).map(m=>[m.label, m.count, [...m.tutores]]);
  const motivosDesmMap = {};
  DB.agendamentos.forEach(a=>{ if(a.motivoStatus && ['Desmarcado','Cancelado'].includes(a.status)) addMotivo(motivosDesmMap, a.motivoStatus, a.tutorId); });
  const motivosDesmArr = Object.values(motivosDesmMap).sort((a,b)=>b.count-a.count).map(m=>[m.label, m.count, [...m.tutores]]);

  // ---- Indicações (quem indicou) ----
  const indicacoesPorTutor = {};
  DB.contatos.forEach(c=>{ if(c.tutorId && c.indicacaoTipo && c.indicacaoTipo!=='Sem indicação') indicacoesPorTutor[c.tutorId]=c; });
  DB.agendamentos.forEach(a=>{ if(a.tutorId && a.indicacaoTipo && a.indicacaoTipo!=='Sem indicação') indicacoesPorTutor[a.tutorId]=a; });
  const indicacoesList = Object.values(indicacoesPorTutor);
  const fontesIndicacao = {};
  indicacoesList.forEach(i=>{ fontesIndicacao[i.indicacaoTipo]=(fontesIndicacao[i.indicacaoTipo]||0)+1; });
  const fontesArr = Object.entries(fontesIndicacao).sort((a,b)=>b[1]-a[1]);
  const vetsRanking = {}, clinicasRanking = {};
  indicacoesList.forEach(i=>{
    if(i.indicacaoVet) vetsRanking[i.indicacaoVet]=(vetsRanking[i.indicacaoVet]||0)+1;
    if(i.indicacaoClinica) clinicasRanking[i.indicacaoClinica]=(clinicasRanking[i.indicacaoClinica]||0)+1;
  });
  const vetsArr = Object.entries(vetsRanking).sort((a,b)=>b[1]-a[1]).slice(0,5);

  // ---- Origem dos agendamentos (contato deste período vs. anterior) ----
  const origemAg = {desteperiodo:0, anterior:0, semDado:0};
  realizadosMes.forEach(a=>{
    let dataContatoRef = null;
    if(a.contatoOrigemId){
      const c = DB.contatos.find(x=>x.id===a.contatoOrigemId);
      if(c) dataContatoRef = c.dataContato;
    }
    if(!dataContatoRef && a.dataContato) dataContatoRef = a.dataContato;
    if(!dataContatoRef){ origemAg.semDado++; return; }
    if(inRefPeriod(dataContatoRef)) origemAg.desteperiodo++;
    else origemAg.anterior++;
  });
  const clinicasArr = Object.entries(clinicasRanking).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const maxMotivo = motivosArr.length? motivosArr[0][1] : 0;

  // clientes com mais desmarcações
  const desmPorTutor = {};
  ags.filter(a=>a.status==='Desmarcado'||a.status==='Cancelado').forEach(a=>{
    (desmPorTutor[a.tutorId]=desmPorTutor[a.tutorId]||[]).push(a);
  });
  const clientesDesmarcam = Object.entries(desmPorTutor).filter(([,list])=>list.length>=2)
    .map(([tid,list])=>({tutor:tutorById(tid), n:list.length, list})).filter(x=>x.tutor).sort((a,b)=>b.n-a.n).slice(0,4);

  // insights automáticos — só aparecem com dados suficientes
  const insights = [];
  if(contatosMes.length>=5){
    insights.push(`Você recebeu <strong>${contatosMes.length}</strong> contato${contatosMes.length===1?'':'s'} este mês e <strong>${agendadosViaContatoMes.length}</strong> resultaram em agendamento.`);
  }
  if(motivosArr.length>=3){
    insights.push(`O principal motivo de não agendamento é <strong>"${motivosArr[0][0]}"</strong>, com ${motivosArr[0][1]} ocorrências no total.`);
  }
  if(motivosDesmArr.length>=2){
    insights.push(`O principal motivo de desmarcação/cancelamento é <strong>"${motivosDesmArr[0][0]}"</strong>, com ${motivosDesmArr[0][1]} ocorrências no total.`);
  }
  if(desmarcadosPM>0 && desmarcadosMes.length>desmarcadosPM){
    insights.push(`As desmarcações aumentaram em relação ao mês anterior (${desmarcadosMes.length} vs ${desmarcadosPM}).`);
  }
  clientesDesmarcam.slice(0,2).forEach(c=>{
    insights.push(`${c.tutor.nome} já desmarcou/cancelou <strong>${c.n}</strong> vezes.`);
  });
  if(realizadosPM>0){
    const delta = realizadosMes.length-realizadosPM;
    if(delta>0) insights.push(`Os atendimentos realizados aumentaram em relação ao mês anterior (${realizadosMes.length} vs ${realizadosPM}).`);
  }
  if(naoAgendadosMes.length>=3){
    insights.push(`<strong>${naoAgendadosMes.length}</strong> pessoas entraram em contato este mês, mas ainda não agendaram.`);
  }

  // ---- O que preciso fazer? (baseado no período selecionado no navegador) ----
  const pendencias = [];
  DB.lembretes.filter(l=>!l.concluido && (state.dash.granularity==='dia'? l.data===refDay : inRefPeriod(l.data))).forEach(l=>{
    pendencias.push({tipo:'Lembrete', texto:l.titulo, ref:{type:'lembrete', id:l.id}});
  });
  DB.contatos.filter(c=>c.status==='Aguardando').forEach(c=>{
    const nome = c.tutorId? (tutorById(c.tutorId)?.nome||'') : (c.nomeAvulso||'contato');
    const dias = daysBetween(c.dataContato,today);
    pendencias.push({tipo:'Contato', texto:`${nome}${dias>0?' — contato há '+dias+' dia'+(dias===1?'':'s'):' — contato de hoje'}`, ref:{type:'contato', id:c.id}});
  });
  ags.filter(a=>a.status==='AguardandoConfirmacao' && a.data<=addDays(today,2)).forEach(a=>{
    pendencias.push({tipo:'Confirmação', texto:`Confirmar ${animalById(a.animalId)?.nome||'—'} — ${fmtDate(a.data)} ${a.horario}`, ref:{type:'ag', id:a.id}});
  });

  // ---- Conversão de contatos ----
  const totalContatosMes = contatosMes.length;
  const agendadosConv = contatosMes.filter(c=>c.status==='Agendado').length;
  const naoAgendadosConv = contatosMes.filter(c=>c.status==='Não agendado').length;
  const desmarcaramConv = ags.filter(a=>a.status==='Desmarcado' && inRefPeriod(a.data)).length;
  const pendentesConv = contatosMes.filter(c=>c.status==='Aguardando').length;
  const taxaConversao = totalContatosMes? Math.round((agendadosConv/totalContatosMes)*100) : null;
  const convPorTipo = ['Consulta','Acompanhamento','Cirurgia'].map(tp=>{
    const doTipo = contatosMes.filter(c=>c.tipoAtendimento===tp);
    const agTipo = doTipo.filter(c=>c.status==='Agendado').length;
    return {tipo:tp, total:doTipo.length, agendados:agTipo};
  }).filter(x=>x.total>0);


  // ---- Alertas de inconsistência ----
  const alertas = [];
  const agsSemTutor = DB.agendamentos.filter(a=>!a.tutorId || !tutorById(a.tutorId));
  if(agsSemTutor.length) alertas.push(`Existem <strong>${agsSemTutor.length}</strong> agendamento(s) sem tutor vinculado.`);
  const agsSemAnimal = DB.agendamentos.filter(a=>!a.animalId || !animalById(a.animalId));
  if(agsSemAnimal.length) alertas.push(`Existem <strong>${agsSemAnimal.length}</strong> agendamento(s) sem animal vinculado.`);
  const contatosSemResultado = DB.contatos.filter(c=>c.status==='Aguardando' && daysBetween(c.dataContato,today)>=14);
  if(contatosSemResultado.length) alertas.push(`Existem <strong>${contatosSemResultado.length}</strong> contato(s) aguardando retorno há mais de 14 dias.`);
  const agsAntigosAguardando = DB.agendamentos.filter(a=>a.status==='AguardandoConfirmacao' && a.data<today);
  if(agsAntigosAguardando.length) alertas.push(`Existem <strong>${agsAntigosAguardando.length}</strong> agendamento(s) antigo(s) ainda aguardando confirmação.`);
  const tutoresSemTelefone = DB.tutores.filter(t=>!t.telefone);
  if(tutoresSemTelefone.length) alertas.push(`Existem <strong>${tutoresSemTelefone.length}</strong> tutor(es) sem telefone cadastrado.`);
  const animaisSemTutor = DB.animais.filter(a=>!tutoresDoAnimal(a.id).length);
  if(animaisSemTutor.length) alertas.push(`Existem <strong>${animaisSemTutor.length}</strong> animal(is) sem tutor vinculado.`);

  const periodoTag = dashPeriodTag();
  const contatosAguardando = DB.contatos.filter(c=>c.status==='Aguardando').sort((a,b)=>a.dataContato.localeCompare(b.dataContato));
  const pendGroups = {};
  pendencias.forEach(p=>{ (pendGroups[p.tipo]=pendGroups[p.tipo]||[]).push(p); });

  return `
  <div class="dash-greeting">
    <div class="dash-greeting-title">${greetingText()}</div>
    <div class="dash-greeting-sub">Aqui está o resumo da rotina da Olhatta.</div>
  </div>
  ${renderDashNav()}

  <div class="grid g4" style="margin-bottom:20px;">

    ${statCard('Desmarcados/Cancelados', desmarcadosMes.length+canceladosMes.length, 'var(--st-desmarcado)', tipoBreakdown([...desmarcadosMes, ...canceladosMes]))}
    ${statCard('Reagendados', reagendadosMes.length, 'var(--st-reagendado)', tipoBreakdown(reagendadosMes))}

  <div class="card pad" style="margin-bottom:20px; border-color:var(--st-aguardando);">

        const animalNome = c.animalId? (animalById(c.animalId)?.nome||'') : (c.animalAvulso||'');
        const dias = daysBetween(c.dataContato, today);
        return `<div style="display:flex; align-items:center; gap:10px; flex-wrap:wrap; background:var(--sage-pale); border-radius:10px; padding:10px 12px;">
          <div style="flex:1; min-width:160px; font-size:13px;">
            <strong>${nome}</strong>${animalNome?' · '+animalNome:''}
            <div style="color:var(--ink-soft); font-size:11.5px; margin-top:2px;">${dias>0?'Contato há '+dias+' dia'+(dias===1?'':'s'):'Contato de hoje'} · ${fmtDate(c.dataContato)}</div>

              ${['Agendado','Não agendado','Desmarcado'].map(rotulo=>{

                const mesList = rotulo==='Desmarcado'? ags.filter(a=>a.status==='Desmarcado' && isThisMonth(a.data)) : DB.contatos.filter(c=>c.status===rotulo && isThisMonth(c.dataContato));
                const cell = (list)=> `<div style="font-weight:700; font-size:13px;">${list.length}</div>${list.length?`<div style="font-size:9.5px; color:var(--ink-soft); font-weight:600; line-height:1.3;">${tipoBreakdownAbrev(list, field)}</div>`:''}`;

            </tbody>
          </table>
        </div>
        <div style="display:flex; justify-content:space-between; font-size:13.5px; margin-top:10px; padding-top:10px; border-top:1px solid var(--line);"><span>Reagendamentos (${periodoTag})</span><strong>${reagendadosMes.length}</strong></div>
      </div>

      ${clientesDesmarcam.length? `
      <div class="card pad">
        <div class="section-title">Clientes que mais desmarcam</div>
        ${clientesDesmarcam.map(c=>`
          <div class="insight rowlink" data-open-tutor="${c.tutor.id}" style="cursor:pointer; align-items:flex-start;">

              <div style="font-size:11px; color:var(--ink-soft); margin-top:2px;">${tipoBreakdownAbrev(c.list, 'tipo')}</div>

}
function statCard(label,value,color,sub){
  const isLongText = typeof value==='string' && value.length>6;
  return `<div class="stat-card"><div class="stripe" style="background:${color}"></div><div class="label">${label}</div><div class="value" style="${isLongText?'font-size:19px; line-height:1.25; word-break:break-word;':''}">${value}</div>${sub?`<div style="font-size:11px; color:var(--ink-soft); margin-top:5px; line-height:1.5;">${sub}</div>`:''}</div>`;
}
function tipoBreakdown(list){
  const porTipo = {Consulta:0, Acompanhamento:0, Cirurgia:0};
  list.forEach(a=>{ if(porTipo[a.tipo]!==undefined) porTipo[a.tipo]++; });
  return Object.entries(porTipo).filter(([,n])=>n>0).map(([t,n])=>`${t}: <strong>${n}</strong>`).join(' · ') || 'Sem registros';
}
function tipoBreakdownAbrev(list, field){
  const ABREV = {Consulta:'Cons', Acompanhamento:'Acomp', Cirurgia:'Cir'};
  const porTipo = {Consulta:0, Acompanhamento:0, Cirurgia:0};
  let semTipo = 0;
  list.forEach(item=>{ const v=item[field]; if(porTipo[v]!==undefined) porTipo[v]++; else semTipo++; });
  const partes = Object.entries(porTipo).filter(([,n])=>n>0).map(([t,n])=>`${ABREV[t]} ${n}`);
  if(semTipo) partes.push(`Outro ${semTipo}`);
  return partes.join(' · ');
}
function donutChartHtml(segments, total){
  if(!total) return '';
  let acc = 0;
  const stops = segments.filter(s=>s.value>0).map(s=>{
    const start = (acc/total)*360; acc += s.value;
    const end = (acc/total)*360;
    return `${s.color} ${start}deg ${end}deg`;
  }).join(', ');
  return `<div style="width:110px;height:110px;border-radius:50%;background:conic-gradient(${stops||'var(--line) 0deg 360deg'}); flex-shrink:0; display:flex; align-items:center; justify-content:center;">
    <div style="width:66px;height:66px;border-radius:50%;background:#fff; display:flex; align-items:center; justify-content:center; flex-direction:column;">
      <div style="font-family:'Fraunces',serif; font-size:18px; font-weight:600; color:var(--ink);">${total}</div>
      <div style="font-size:9px; color:var(--ink-soft); font-weight:700; text-transform:uppercase;">contatos</div>
    </div>
  </div>`;
}
function emptyState(title,desc){
  return `<div class="empty">${ICONS.inbox}<div class="t">${title}</div><div class="d">${desc}</div></div>`;
}

let agendaFilters = {tutor:'', animal:'', data:'', status:'', tipo:'', cidade:'', modoData:'agendamento', todos:false};
let agendaViewMode = 'lista';
function renderCalendarioMes(refDateStr){
  const [y,m] = refDateStr.split('-').map(Number);
  const primeiroDia = new Date(y, m-1, 1);
  const diasNoMes = new Date(y, m, 0).getDate();
  const diaSemanaInicio = primeiroDia.getDay();
  const hoje = todayISO();
  const agsPorDia = {};
  DB.agendamentos.forEach(a=>{
    if(['Cancelado','Desmarcado'].includes(a.status)) return;
    if(a.data && a.data.slice(0,7)===`${y}-${String(m).padStart(2,'0')}`){
      (agsPorDia[a.data] = agsPorDia[a.data]||[]).push(a);
    }
  });
  const celulas = [];
  for(let i=0;i<diaSemanaInicio;i++) celulas.push(null);
  for(let d=1; d<=diasNoMes; d++) celulas.push(`${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`);
  while(celulas.length % 7 !== 0) celulas.push(null);
  const diasSemana = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
  return `
  <div class="card pad">
    <div class="cal-grid">
      ${diasSemana.map(d=>`<div class="cal-head">${d}</div>`).join('')}
      ${celulas.map(dataStr=>{
        if(!dataStr) return `<div class="cal-cell cal-empty"></div>`;
        const ags = (agsPorDia[dataStr]||[]).sort((a,b)=>a.horario.localeCompare(b.horario));
        const diaNum = Number(dataStr.slice(-2));
        const ehHoje = dataStr===hoje;
        return `<div class="cal-cell ${ehHoje?'cal-hoje':''}" data-cal-dia="${dataStr}">
          <div class="cal-daynum">${diaNum}</div>
          <div class="cal-events">
            ${ags.slice(0,2).map(a=>{
              const horarioTxt = a.horarioFim ? `${a.horario} até ${a.horarioFim}` : a.horario;
              const tutorAnimal = [agTutorNome(a), agAnimalNome(a)].filter(x=>x && x!=='—').join(' · ');
              const profs = (a.profissionais||[]).length ? ' com '+a.profissionais.join(', ') : '';
              const linha3 = [a.tipo, a.clinica].filter(Boolean).join(' - ') + profs;
              const tooltip = [horarioTxt, tutorAnimal, linha3].filter(Boolean).join(' · ');
              return `<div class="cal-event" style="background:${agColor(a)};" title="${tooltip}">
                <div class="cal-event-l1">${horarioTxt}</div>
                <div class="cal-event-l2">${tutorAnimal}</div>
                <div class="cal-event-l3">${linha3}</div>
              </div>`;
            }).join('')}
            ${ags.length>2?`<div class="cal-more">+${ags.length-2} mais</div>`:''}
          </div>
          <div class="cal-dots">${ags.slice(0,5).map(a=>`<span class="cal-dot" style="background:${agColor(a)};"></span>`).join('')}</div>
        </div>`;
      }).join('')}
    </div>
    <div style="display:flex; gap:12px; flex-wrap:wrap; margin-top:14px; padding-top:12px; border-top:1px solid var(--line);">
      ${tiposNomes().map(t=>`<span style="display:inline-flex; align-items:center; gap:5px; font-size:11px; color:var(--ink-soft); font-weight:600;"><span style="width:9px;height:9px;border-radius:3px;background:${tipoColor(t)}; display:inline-block;"></span>${t}</span>`).join('')}
    </div>
  </div>`;
}
function abrirDiaCalendario(dataStr){
  const ags = DB.agendamentos.filter(a=>a.data===dataStr && !['Cancelado','Desmarcado'].includes(a.status)).sort((a,b)=>a.horario.localeCompare(b.horario));
  const html = modalShell(fmtDateLong(dataStr), `
    ${ags.length? `<div style="display:flex; flex-direction:column; gap:8px; margin-bottom:14px;">
      ${ags.map(a=>`
        <div class="pend-row rowlink" data-open-ag-modal="${a.id}">
          <span class="pend-dot" style="background:${agColor(a)};"></span>
          <span><strong>${a.horario}${a.horarioFim?' até '+a.horarioFim:''}</strong> ${agTutorNome(a)} · ${agAnimalNome(a)}${agSemCadastro(a)?' ⚠':''} — ${a.tipo}${a.clinica?' - '+a.clinica:''}${(a.profissionais||[]).length?' com '+a.profissionais.join(', '):''} · ${badge(a.status)}</span>
        </div>`).join('')}
    </div>` : `<div class="hint" style="margin-bottom:14px;">Nenhum atendimento nesse dia ainda.</div>`}
  `, `<button class="btn btn-secondary" id="modalCancel">Fechar</button><button class="btn btn-primary" id="btnNovoAgDia">${ICONS.plus} Novo agendamento nesse dia</button>`);
  openModal(html);
  document.getElementById('modalClose').addEventListener('click', closeModal);
  document.getElementById('modalCancel').addEventListener('click', closeModal);
  document.querySelectorAll('[data-open-ag-modal]').forEach(el=>el.addEventListener('click', ()=>{
    closeModal(); openAgendamentoDrawer(el.dataset.openAgModal);
  }));
  document.getElementById('btnNovoAgDia').addEventListener('click', ()=>{
    closeModal(); formAgendamento(null, {data:dataStr});
  });
}

let desmarcacoesFilters = {todos:false};
function renderDesmarcacoes(){
  let list = DB.agendamentos.filter(a=>['Cancelado','Desmarcado'].includes(a.status) || a.reagendadoDe)
    .sort((a,b)=>(b.alteradoEm||'').localeCompare(a.alteradoEm||''));
  if(!desmarcacoesFilters.todos) list = list.filter(a=>inRefPeriod(a.dataOriginal||a.data));

  // ranking de clientes por desmarcação
  const desmarcacoesPorTutor = {};
  DB.agendamentos.filter(a=>['Cancelado','Desmarcado'].includes(a.status)).forEach(a=>{
    (desmarcacoesPorTutor[a.tutorId]=desmarcacoesPorTutor[a.tutorId]||[]).push(a);
  });
  const ranking = Object.entries(desmarcacoesPorTutor).map(([tid,list])=>({tutor:tutorById(tid), n:list.length, list})).filter(x=>x.tutor).sort((a,b)=>b.n-a.n).slice(0,6);

  return `
  ${renderDashNav()}

      <div class="pad" style="padding-bottom:0;"><div class="section-title">Registro de desmarcações, cancelamentos e reagendamentos</div></div>
      ${list.length? `<div class="table-wrap"><table><thead><tr><th>Tutor</th><th>Animal</th><th>Tipo</th><th>Data original</th><th>Status</th><th>Motivo</th><th>Reagendado?</th></tr></thead><tbody>
        ${list.map(a=>`
          <tr class="rowlink" data-open-ag="${a.id}">
            <td>${tutorById(a.tutorId)?.nome||'—'}</td>
            <td>${animalById(a.animalId)?.nome||'—'}</td>
            <td>${tipoPill(a.tipo)}</td>
            <td>${fmtDate(a.dataOriginal||a.data)}</td>
            <td>${badge(a.status)}</td>
            <td>${a.motivoStatus||'—'}</td>
            <td>${a.reagendadoPara? `<span class="pill">Sim → ${fmtDate(a.reagendadoPara)}</span>` : (a.status==='Desmarcado'||a.status==='Cancelado' ? '<span class="pill-muted">Não</span>' : (a.reagendadoDe? `<span class="pill">De ${fmtDate(a.reagendadoDe)}</span>`:'—'))}</td>
          </tr>`).join('')}
      </tbody></table></div>` : `<div class="pad">${emptyState('Nenhum registro ainda','Cancelamentos, desmarques e reagendamentos aparecem aqui automaticamente.')}</div>`}
    </div>
    <div class="card pad">
      <div class="section-title">Clientes que mais desmarcam/cancelam</div>
      ${ranking.length? ranking.map(r=>`
        <div class="insight rowlink" data-open-tutor="${r.tutor.id}" style="cursor:pointer; align-items:flex-start;">
          <div class="dot" style="background:var(--st-desmarcado); margin-top:6px;"></div>
          <div style="flex:1;">
            <div>${r.tutor.nome}</div>
            <div style="font-size:11px; color:var(--ink-soft); margin-top:2px;">${tipoBreakdownAbrev(r.list, 'tipo')}</div>
          </div>
          <span class="pill-muted">${r.n}x</span>

}

let historicoFilters = {todos:false};
function renderHistoricoRegistros(){
  const q = (document.getElementById('histSearch')?.value ?? state.globalQuery ?? '').toLowerCase();
  const results = [];
  DB.agendamentos.forEach(a=>{
    const t=tutorById(a.tutorId), an=animalById(a.animalId);
    const text = `${t?.nome||''} ${an?.nome||''} ${a.tipo} ${statusLabel(a.status)}`.toLowerCase();
    if(!q || text.includes(q)) results.push({kind:'Agendamento', date:a.data, tutor:t, animal:an, detail:`${a.tipo} — ${statusLabel(a.status)}${a.motivoStatus?' ('+a.motivoStatus+')':''}`, id:a.id});
  });
  DB.contatos.forEach(c=>{
    const t=c.tutorId?tutorById(c.tutorId):null, an=c.animalId?animalById(c.animalId):null;
    const text = `${t?.nome||c.nomeAvulso||''} ${an?.nome||c.animalAvulso||''} ${c.motivoNaoAgendamento||''} contato`.toLowerCase();
    if(!q || text.includes(q)) results.push({kind:'Contato', date:c.dataContato, tutor:t, animal:an, tutorNome:c.nomeAvulso, animalNome:c.animalAvulso, detail:`Contato — ${c.status}${c.motivoNaoAgendamento?' ('+c.motivoNaoAgendamento+')':''}`, id:c.id, contato:true});
  });
  const filtrados = historicoFilters.todos? results : results.filter(r=>inRefPeriod(r.date));
  filtrados.sort((a,b)=>(b.date||'').localeCompare(a.date||''));

  return `
  ${renderDashNav()}
  <div style="margin:-10px 0 16px;"><label style="display:inline-flex; align-items:center; gap:6px; font-weight:600; cursor:pointer;"><input type="checkbox" id="historicoTodosPeriodos" style="width:auto;" ${historicoFilters.todos?'checked':''}> Ignorar período e mostrar todo o histórico</label></div>
  <div class="view-head">
    <div class="filters search-input" style="margin-bottom:0; max-width:400px;">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input id="histSearch" placeholder="Buscar por tutor, animal, status ou motivo…" value="${q}">
    </div>
  </div>
  <div class="card">
    ${filtrados.length? `<div class="table-wrap"><table><thead><tr><th>Data</th><th>Tipo</th><th>Tutor</th><th>Animal</th><th>Detalhe</th></tr></thead><tbody>
      ${filtrados.slice(0,300).map(r=>`
        <tr class="rowlink" ${r.contato?`data-open-contato="${r.id}"`:`data-open-ag="${r.id}"`}>
          <td>${fmtDate(r.date)}</td>
          <td><span class="pill-muted">${r.kind}</span></td>
          <td>${r.tutor?.nome || r.tutorNome || '—'}</td>
          <td>${r.animal?.nome || r.animalNome || '—'}</td>
          <td>${r.detail}</td>
        </tr>`).join('')}
    </tbody></table></div>` : `<div class="pad">${emptyState('Nenhum resultado encontrado','Tente buscar por outro nome, telefone ou status.')}</div>`}
  </div>`;
}

  const log = (DB.auditLog||[]).slice().reverse();

/* =========================================================
   METAS E SUPERMETAS
========================================================= */
const METAS_CATEGORIAS = [
  {key:'Consultas', label:'Consultas', manual:false,
    calcPrevisto:(mesAno)=> DB.agendamentos.filter(a=>['Consulta','Acompanhamento'].includes(a.tipo) && !['Cancelado','Desmarcado'].includes(a.status) && monthKey(a.data)===mesAno).length,
    calc:(mesAno)=> DB.agendamentos.filter(a=>['Consulta','Acompanhamento'].includes(a.tipo) && a.status==='Realizado' && monthKey(a.data)===mesAno).length},
  {key:'Cirurgias', label:'Cirurgias', manual:false,
    calcPrevisto:(mesAno)=> DB.agendamentos.filter(a=>a.tipo==='Cirurgia' && !['Cancelado','Desmarcado'].includes(a.status) && monthKey(a.data)===mesAno).length,
    calc:(mesAno)=> DB.agendamentos.filter(a=>a.tipo==='Cirurgia' && a.status==='Realizado' && monthKey(a.data)===mesAno).length},
  {key:'Produtos', label:'Produtos', manual:true},
];
let metasMesAno = todayISO().slice(0,7);
function metaFor(mesAno, categoria){ return (DB.metas||[]).find(m=>m.mesAno===mesAno && m.categoria===categoria); }
function metaMesLabel(mesAno){
  const dt = new Date(mesAno+'-01T00:00:00');
  const l = dt.toLocaleDateString('pt-BR',{month:'long', year:'numeric'});
  return l.replace(/^\w/,c=>c.toUpperCase());
}
function metaStepMonth(mesAno, dir){
  const dt = new Date(mesAno+'-01T00:00:00'); dt.setMonth(dt.getMonth()+dir);
  return dt.toISOString().slice(0,7);
}
function renderMetas(){
  const mesAno = metasMesAno;
  return `
  <div class="view-head">
    <div class="dash-nav-ctrl" style="background:#fff; border:1px solid var(--line); border-radius:12px; padding:8px 10px;">
      <button class="icon-btn" id="metaPrevMes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M15 18l-6-6 6-6"/></svg></button>
      <span class="dash-nav-label" style="cursor:default;">${metaMesLabel(mesAno)}</span>
      <button class="icon-btn" id="metaNextMes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M9 18l6-6-6-6"/></svg></button>
      ${mesAno!==todayISO().slice(0,7)?`<button class="btn btn-secondary btn-sm" id="metaHoje">Mês atual</button>`:''}
    </div>
  </div>
  <div class="grid g2">
    ${METAS_CATEGORIAS.map(cat=>{
      const m = metaFor(mesAno, cat.key);
      const real = cat.manual ? (m?.valorManual||0) : cat.calc(mesAno);
      const previsto = cat.manual ? null : cat.calcPrevisto(mesAno);
      const meta = m?.meta||0, supermeta = m?.supermeta||0;
      const pctReal = meta? Math.min(100, Math.round((real/meta)*100)) : 0;
      const pctPrevisto = (meta && previsto!==null)? Math.min(100, Math.round((previsto/meta)*100)) : 0;
      let status = 'Sem meta definida para este mês';
      let statusColor = 'var(--ink-faint)';
      if(meta){
        if(supermeta && real>=supermeta){ status='Supermeta batida! 🎉'; statusColor='var(--st-realizado)'; }
        else if(real>=meta){ status='Meta batida!'; statusColor='var(--st-realizado)'; }
        else { status='Meta em andamento…'; statusColor='var(--brown-dark)'; }
      }
      return `
      <div class="card pad">
        <div class="section-title" style="justify-content:space-between;">
          <span>${cat.label}</span>
          <button class="icon-btn" data-edit-meta="${cat.key}" title="Definir meta">${ICONS.edit}</button>
        </div>
        ${cat.manual?`
        <div style="margin-bottom:10px;">
          <div class="value" style="font-family:'Fraunces',serif; font-size:26px; font-weight:600; color:var(--brown-dark);">${real}</div>
          <div style="font-size:11px; color:var(--ink-soft); font-weight:700;">REALIZADO (lançado manualmente)</div>
          ${meta?`<div style="color:var(--ink-soft); font-size:12.5px; margin-top:4px;">meta ${meta}${supermeta?' · super '+supermeta:''}</div>`:''}
        </div>
        ${meta?`<div class="bar-track"><div class="bar-fill" style="width:${pctReal}%; background:var(--brown);"></div></div>`:''}
        `:`
        <div style="display:flex; gap:16px; margin-bottom:10px;">
          <div><div class="value" style="font-family:'Fraunces',serif; font-size:26px; font-weight:600; color:var(--sage-dark);">${previsto}</div><div style="font-size:11px; color:var(--ink-soft); font-weight:700;">PREVISTO (agendado)</div></div>
          <div><div class="value" style="font-family:'Fraunces',serif; font-size:26px; font-weight:600; color:var(--brown-dark);">${real}</div><div style="font-size:11px; color:var(--ink-soft); font-weight:700;">REAL (realizado)</div></div>
          ${meta?`<div style="align-self:center; color:var(--ink-soft); font-size:12.5px;">meta ${meta}${supermeta?' · super '+supermeta:''}</div>`:''}
        </div>
        ${meta?`
          <div class="hint" style="margin-bottom:3px;">Previsto</div>
          <div class="bar-track" style="margin-bottom:8px;"><div class="bar-fill" style="width:${pctPrevisto}%; background:var(--sage);"></div></div>
          <div class="hint" style="margin-bottom:3px;">Real</div>
          <div class="bar-track"><div class="bar-fill" style="width:${pctReal}%; background:var(--brown);"></div></div>
        `:''}
        `}
        <div style="margin-top:10px; font-size:12.5px; font-weight:700; color:${statusColor};">${status}</div>
      </div>`;
    }).join('')}
  </div>`;
}
function formMeta(categoria){
  const mesAno = metasMesAno;
  const m = metaFor(mesAno, categoria);
  const cat = METAS_CATEGORIAS.find(c=>c.key===categoria);
  const html = modalShell(`Meta — ${cat.label}`, `
    <form id="formMeta">
      <div class="hint" style="margin-bottom:12px;">${metaMesLabel(mesAno)}</div>
      <div class="field-row">
        <div class="field"><label>Meta</label><input type="number" min="0" name="meta" value="${m?.meta||''}"></div>
        <div class="field"><label>Supermeta</label><input type="number" min="0" name="supermeta" value="${m?.supermeta||''}"></div>
      </div>
      ${cat.manual?`<div class="field"><label>Valor realizado neste mês</label><input type="number" min="0" name="valorManual" value="${m?.valorManual||''}"><div class="hint">Como Produtos não é lançado automaticamente no sistema, digite aqui o valor do mês.</div></div>`:''}
    </form>`,
    `<button class="btn btn-secondary" id="modalCancel">Cancelar</button><button class="btn btn-primary" id="modalSave">Salvar</button>`);
  openModal(html, {narrow:true});
  bindModalClose();
  document.getElementById('modalSave').addEventListener('click', ()=>{
    const f = document.getElementById('formMeta');
    const data = Object.fromEntries(new FormData(f));
    const meta = Number(data.meta)||0, supermeta = Number(data.supermeta)||0;
    const valorManual = cat.manual ? (Number(data.valorManual)||0) : undefined;
    if(m){ m.meta=meta; m.supermeta=supermeta; if(cat.manual) m.valorManual=valorManual; }
    else DB.metas.push({id:uid(), mesAno, categoria, meta, supermeta, ...(cat.manual?{valorManual}:{})});
    logAction(`definiu meta de ${cat.label} para ${metaMesLabel(mesAno)} (meta ${meta}, supermeta ${supermeta}${cat.manual?', realizado '+valorManual:''})`);
    saveDB(); closeModal(); render(); toast('Meta salva');
  });
}

/* =========================================================
   VISÃO ANUAL
========================================================= */
let visaoAnualAno = new Date().getFullYear();
const MESES_ABREV = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
function renderVisaoAnual(){
  const ano = visaoAnualAno;
  const tiposLista = tiposNomes();
  const coresPorTipo = ['var(--sage-dark)','var(--st-confirmado)','var(--st-reagendado)','var(--st-aguardando)','var(--brown)','#D9679B','#8A6647','#3F7FBF'];
  const meses = MESES_ABREV.map((label,i)=>{
    const mk = `${ano}-${String(i+1).padStart(2,'0')}`;
    const porTipo = tipo => ({
      agendadas: DB.agendamentos.filter(a=>a.tipo===tipo && !['Cancelado','Desmarcado'].includes(a.status) && monthKey(a.data)===mk).length,
      naoRealizadas: DB.contatos.filter(c=>c.tipoAtendimento===tipo && c.status==='Não agendado' && monthKey(c.dataContato)===mk).length,
      desmarcadas: DB.agendamentos.filter(a=>a.tipo===tipo && ['Cancelado','Desmarcado'].includes(a.status) && monthKey(a.data)===mk).length,
      realizadas: DB.agendamentos.filter(a=>a.tipo===tipo && a.status==='Realizado' && monthKey(a.data)===mk).length,
    });
    const porTipoMes = {};
    tiposLista.forEach(t=>{ porTipoMes[t] = porTipo(t); });
    return {
      label, mk,
      contatos: DB.contatos.filter(c=>monthKey(c.dataContato)===mk).length,
      ...porTipoMes,
    };
  });
  const linhas = [{label:'Contatos', key:'contatos', color:'var(--brown)', top:true}];
  tiposLista.forEach((tipo,i)=>{
    const cor = coresPorTipo[i%coresPorTipo.length];
    linhas.push({label:`${tipo} — agendados`, tipo, sub:'agendadas', color:cor});
    linhas.push({label:`${tipo} — não realizados (contatos que não marcaram)`, tipo, sub:'naoRealizadas', color:'var(--st-cancelado)'});
    linhas.push({label:`${tipo} — desmarcados/cancelados`, tipo, sub:'desmarcadas', color:'var(--st-desmarcado)'});
  });
  const getVal = (m,l) => l.top ? m[l.key] : m[l.tipo][l.sub];
  const anoTemDados = meses.some(m=>linhas.some(l=>getVal(m,l)>0));
  const destaque = (tipo, sub)=>{
    const comDados = meses.filter(m=>m[tipo] && m[tipo][sub]>0);
    if(!comDados.length) return {maisLabel:'—', menosLabel:'—'};
    const mais = comDados.reduce((a,b)=>b[tipo][sub]>a[tipo][sub]?b:a);
    const menos = comDados.reduce((a,b)=>b[tipo][sub]<a[tipo][sub]?b:a);
    return {maisLabel:`${mais.label} (${mais[tipo][sub]})`, menosLabel:`${menos.label} (${menos[tipo][sub]})`};
  };
  const destaqueContatos = (()=>{
    const comDados = meses.filter(m=>m.contatos>0);
    if(!comDados.length) return {maisLabel:'—'};
    const mais = comDados.reduce((a,b)=>b.contatos>a.contatos?b:a);
    return {maisLabel:`${mais.label} (${mais.contatos})`};
  })();
  const destaquesPorTipo = tiposLista.map(tipo=>({tipo, ...destaque(tipo,'realizadas')}));

  return `
  <div class="view-head">
    <div class="dash-nav-ctrl" style="background:#fff; border:1px solid var(--line); border-radius:12px; padding:8px 10px;">
      <button class="icon-btn" id="anoPrev"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M15 18l-6-6 6-6"/></svg></button>
      <span class="dash-nav-label" style="cursor:default;">${ano}</span>
      <button class="icon-btn" id="anoNext"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M9 18l6-6-6-6"/></svg></button>
      ${ano!==new Date().getFullYear()?`<button class="btn btn-secondary btn-sm" id="anoAtual">Ano atual</button>`:''}
    </div>
  </div>

  ${anoTemDados? `
  <div class="grid g4" style="margin-bottom:16px;">
    ${statCard('Mês com mais contatos', destaqueContatos.maisLabel, 'var(--brown)')}
    ${destaquesPorTipo.map((d,i)=>statCard(`Mês com mais "${d.tipo}" realizados`, d.maisLabel, coresPorTipo[i%coresPorTipo.length])).join('')}
  </div>

  <div class="card pad">
    <div class="section-title">Comparativo ${ano}</div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>Indicador</th>${MESES_ABREV.map(m=>`<th style="text-align:center;">${m}</th>`).join('')}<th style="text-align:center;">Total</th></tr></thead>
        <tbody>
          ${linhas.map(l=>{
            const total = meses.reduce((s,m)=>s+getVal(m,l),0);
            return `<tr ${l.top?'style="background:var(--sage-pale);"':''}><td><span style="display:inline-flex; align-items:center; gap:6px;"><span style="width:8px;height:8px;border-radius:50%;background:${l.color};display:inline-block;"></span>${l.label}</span></td>
              ${meses.map(m=>`<td style="text-align:center; ${getVal(m,l)>0?'font-weight:700;':'color:var(--ink-faint);'}">${getVal(m,l)}</td>`).join('')}
              <td style="text-align:center; font-weight:800;">${total}</td></tr>`;
          }).join('')}
        </tbody>
      </table>
      <div class="hint" style="margin-top:8px;">Agendadas = ainda válidas no calendário (não desmarcadas/canceladas) · Não realizadas = contatos que nunca chegaram a marcar · Desmarcadas = tinham data marcada e foram desmarcadas/canceladas</div>
    </div>
  </div>` : `<div class="card"><div class="pad">${emptyState('Nenhum dado para '+ano, 'O comparativo aparece automaticamente conforme agendamentos e contatos forem registrados nesse ano.')}</div></div>`}
  `;
}
