const FORMAS_PAGAMENTO = ['Dinheiro','Cartão de Crédito','Cartão de Débito','Pix','Transferência','Outro'];
let notasFiscaisTab = 'notas';
let nfFilters = {status:'', todos:false};

function nfAlertas(){
  const hoje = todayISO();
  const mesAtual = monthKey(hoje);
  const alertas = [];
  const pendentesForaDoMes = (DB.notasFiscais||[]).filter(nf=>nf.status==='Pendente' && monthKey(nf.data) < mesAtual);
  if(pendentesForaDoMes.length){
    const porMes = {};
    pendentesForaDoMes.forEach(nf=>{ porMes[monthKey(nf.data)] = (porMes[monthKey(nf.data)]||0)+1; });
    Object.entries(porMes).sort().forEach(([mk,n])=>{
      const dt = new Date(mk+'-01T00:00:00');
      const label = dt.toLocaleDateString('pt-BR',{month:'long',year:'numeric'});
      alertas.push(`<strong>${n}</strong> nota${n===1?'':'s'} pendente${n===1?'':'s'} de <strong>${label}</strong> — o mês já fechou, regularize o quanto antes.`);
    });
  }
  const dt = new Date(hoje+'T00:00:00');
  const ultimoDiaMes = new Date(dt.getFullYear(), dt.getMonth()+1, 0).getDate();
  const diasRestantes = ultimoDiaMes - dt.getDate();
  if(diasRestantes<=5){
    const pendentesMesAtual = (DB.notasFiscais||[]).filter(nf=>nf.status==='Pendente' && monthKey(nf.data)===mesAtual).length;
    if(pendentesMesAtual>0){
      alertas.push(`O mês está terminando em ${diasRestantes} dia${diasRestantes===1?'':'s'} — <strong>${pendentesMesAtual}</strong> nota${pendentesMesAtual===1?'':'s'} deste mês ainda ${pendentesMesAtual===1?'está':'estão'} pendente${pendentesMesAtual===1?'':'s'}.`);
    }
  }
  return alertas;
}

function renderNotasFiscais(){
  return `
  <div class="tabs">
    <button class="tab ${notasFiscaisTab==='notas'?'active':''}" data-nftab="notas">Notas</button>
    <button class="tab ${notasFiscaisTab==='categorias'?'active':''}" data-nftab="categorias">Categorias</button>
  </div>
  ${notasFiscaisTab==='notas'? renderNFListaTab() : renderNFCategoriasTab()}`;
}

function renderNFListaTab(){
  let list = (DB.notasFiscais||[]).slice();
  if(!nfFilters.todos) list = list.filter(nf=>inRefPeriod(nf.data));
  if(nfFilters.status) list = list.filter(nf=>nf.status===nfFilters.status);
  if(nfFilters.nome) list = list.filter(nf=>{
    const nome = nf.usarDadosTutor===false ? (nf.nomeAlternativo||'') : (tutorById(nf.tutorId)?.nome||'');
    return nome.toLowerCase().includes(nfFilters.nome.toLowerCase());
  });
  if(nfFilters.dataDe) list = list.filter(nf=>nf.data>=nfFilters.dataDe);
  if(nfFilters.dataAte) list = list.filter(nf=>nf.data<=nfFilters.dataAte);
  list.sort((a,b)=>b.data.localeCompare(a.data));
  const alertas = nfAlertas();
  const totalPeriodo = list.reduce((s,nf)=>s+(nf.valorTotal||0),0);
  const pendentesCount = list.filter(nf=>nf.status==='Pendente').length;

  return `
  ${alertas.length? `<div class="card pad" style="margin-bottom:16px; border-color:var(--st-cancelado);">
    <div class="section-title" style="color:var(--st-cancelado);">${ICONS.bell} Alertas de Notas Fiscais</div>
    ${alertas.map(a=>`<div class="alert alert-danger" style="margin-bottom:8px;"><div>${a}</div></div>`).join('')}
  </div>`:''}

  ${renderDashNav()}
  <div style="margin:-10px 0 16px;"><label style="display:inline-flex; align-items:center; gap:6px; font-weight:600; cursor:pointer;"><input type="checkbox" id="nfTodosPeriodos" style="width:auto;" ${nfFilters.todos?'checked':''}> Ignorar período e mostrar todas as notas</label></div>

  <div class="grid g3" style="margin-bottom:16px;">
    ${statCard('Notas no período', list.length, 'var(--brown)')}
    ${statCard('Valor total', 'R$ '+totalPeriodo.toFixed(2).replace('.',','), 'var(--st-realizado)')}
    ${statCard('Pendentes', pendentesCount, 'var(--st-aguardando)')}
  </div>

  <div class="view-head">
    <div class="filters" style="margin-bottom:0;">
      <input type="text" placeholder="Nome do cliente" value="${nfFilters.nome||''}" data-nffx-text="nome" style="min-width:160px;">
      <select data-nffx="status">
        <option value="">Todos status</option>
        <option ${nfFilters.status==='Pendente'?'selected':''}>Pendente</option>
        <option ${nfFilters.status==='Feita'?'selected':''}>Feita</option>
      </select>
      <input type="date" data-nffx-text="dataDe" value="${nfFilters.dataDe||''}" title="De">
      <input type="date" data-nffx-text="dataAte" value="${nfFilters.dataAte||''}" title="Até">
      ${(nfFilters.nome||nfFilters.status||nfFilters.dataDe||nfFilters.dataAte)?`<button class="btn btn-ghost btn-sm" id="clearNfFx">Limpar filtros</button>`:''}
    </div>
    <button class="btn btn-primary" id="novaNF">${ICONS.plus} Nova nota fiscal</button>
  </div>

  <div class="card">
    ${list.length? `<div class="table-wrap"><table><thead><tr><th>Data</th><th>Cliente</th><th>Animal</th><th>Valor</th><th>Pagamento</th><th>Status</th><th>Envio</th></tr></thead><tbody>
      ${list.map(nf=>{
        const nome = nf.usarDadosTutor===false ? (nf.nomeAlternativo||'—') : (tutorById(nf.tutorId)?.nome||'—');
        return `
        <tr class="rowlink" data-open-nf="${nf.id}">
          <td>${fmtDate(nf.data)}</td>
          <td>${nome}${nf.usarDadosTutor===false?' <span class="pill-muted">outro nome</span>':''}</td>
          <td>${nf.animalId?(animalById(nf.animalId)?.nome||'—'):'—'}</td>
          <td>R$ ${(nf.valorTotal||0).toFixed(2).replace('.',',')}</td>
          <td>${nf.formaPagamento||'—'}</td>
          <td onclick="event.stopPropagation()"><span class="badge ${nf.status==='Feita'?'st-Realizado':'st-AguardandoConfirmacao'}" style="cursor:pointer;" data-toggle-nf-status="${nf.id}" title="Clique para alternar">${nf.status}</span></td>
          <td onclick="event.stopPropagation()">${nf.enviarCliente?`<button class="btn btn-sm ${nf.enviado?'btn-secondary':'btn-primary'}" data-toggle-nf-enviado="${nf.id}">${nf.enviado?'✓ Enviada':'Marcar enviada'}</button>`:'<span class="hint">—</span>'}</td>
        </tr>`;
      }).join('')}
    </tbody></table></div>` : `<div class="pad">${emptyState('Nenhuma nota fiscal neste período','Crie uma nova nota fiscal, ou marque um atendimento como realizado para ser convidada a emitir uma.')}</div>`}
  </div>`;
}

          <div class="field"><label>Nome</label><input name="nomeTutorNF" id="nfNomeTutorInput"></div>
          <div class="field-row">
            <div class="field"><label>CPF</label><input name="cpfTutorNF" id="nfCpfTutorInput" placeholder="000.000.000-00"></div>
            <div class="field"><label>E-mail</label><input type="email" name="email" id="nfEmailInput" placeholder="cliente@email.com"></div>

          <div class="field-row">
            <div class="field"><label>CEP</label><input name="cepTutorNF" id="nfCepTutorInput"></div>
            <div class="field"><label>Cidade</label><input name="enderecoCidadeTutorNF" id="nfEnderecoCidadeInput"></div>
          </div>

    document.getElementById('nfCepTutorInput').value = t?.cep||'';
    document.getElementById('nfEnderecoCidadeInput').value = t?.enderecoCidade||'';
    document.getElementById('nfRuaInput').value = t?.rua||'';
    document.getElementById('nfBairroInput').value = t?.bairro||'';
    document.getElementById('nfNumeroInput').value = t?.numero||'';
  }
  function renderItens(){
    const cont = document.getElementById('nfItensList');

      <div style="display:flex; gap:6px; margin-bottom:6px; align-items:center;">
        <select data-item-cat="${it.id}" style="flex:1;">

        <input data-item-desc="${it.id}" placeholder="Descrição (opcional)" value="${it.descricao||''}" style="flex:2;">
        <input data-item-valor="${it.id}" type="number" step="0.01" min="0" placeholder="0,00" value="${it.valor||''}" style="width:100px;">
        ${itens.length>1?`<button type="button" class="icon-btn" data-item-del="${it.id}">${ICONS.x}</button>`:''}
      </div>`).join('');
    cont.querySelectorAll('[data-item-cat]').forEach(el=>el.addEventListener('change', e=>{
      const it = itens.find(x=>x.id===el.dataset.itemCat); if(it) it.categoria=e.target.value;
    }));
    cont.querySelectorAll('[data-item-desc]').forEach(el=>el.addEventListener('input', e=>{
      const it = itens.find(x=>x.id===el.dataset.itemDesc); if(it) it.descricao=e.target.value;
    }));
    cont.querySelectorAll('[data-item-valor]').forEach(el=>el.addEventListener('input', e=>{
      const it = itens.find(x=>x.id===el.dataset.itemValor); if(it) it.valor=Number(e.target.value)||0;
      atualizarTotal();
    }));
    cont.querySelectorAll('[data-item-del]').forEach(el=>el.addEventListener('click', ()=>{
      itens = itens.filter(x=>x.id!==el.dataset.itemDel);
      renderItens(); atualizarTotal();

    const total = itens.reduce((s,it)=>s+(Number(it.valor)||0),0);

    const f = document.getElementById('formNF');
    if(!f.reportValidity()) return;
    const itensValidos = itens.filter(it=>it.valor && Number(it.valor)>0);
    if(!itensValidos.length){ toast('Adicione pelo menos um item com valor'); return; }
    const data = Object.fromEntries(new FormData(f));
    const usaTutor = data.usarDadosTutor==='sim';
    if(usaTutor){
      if(!data.nomeTutorNF || !data.cpfTutorNF){ toast('Preencha nome e CPF para emitir a nota'); return; }
      const t = tutorById(data.tutorId);
      if(t){
        t.nome = data.nomeTutorNF;
        if(data.cpfTutorNF) t.cpf = data.cpfTutorNF;
        if(data.email) t.email = data.email;
        if(data.cepTutorNF) t.cep = data.cepTutorNF;
        if(data.enderecoCidadeTutorNF) t.enderecoCidade = data.enderecoCidadeTutorNF;
        if(data.ruaTutorNF) t.rua = data.ruaTutorNF;
        if(data.bairroTutorNF) t.bairro = data.bairroTutorNF;
        if(data.numeroTutorNF) t.numero = data.numeroTutorNF;
      }
      delete data.nomeTutorNF; delete data.cpfTutorNF; delete data.cepTutorNF; delete data.enderecoCidadeTutorNF; delete data.ruaTutorNF; delete data.bairroTutorNF; delete data.numeroTutorNF;
      delete data.nomeAlternativo; delete data.cpfAlternativo; delete data.telefoneAlternativo; delete data.emailAlternativo;
    } else {
      if(!data.nomeAlternativo || !data.cpfAlternativo){ toast('Preencha nome e CPF de quem vai receber a nota'); return; }
      if(data.emailAlternativo) data.email = data.emailAlternativo;
      delete data.emailAlternativo;
    }
    data.usarDadosTutor = usaTutor;
    if(data.enviarCliente==='sim') data.enviarCliente=true; else if(data.enviarCliente==='nao') data.enviarCliente=false; else delete data.enviarCliente;
    if(!data.animalId) delete data.animalId;
    if(!data.agendamentoId) delete data.agendamentoId;
    if(data.status!=='Feita') delete data.dataFeita;
    const valorTotal = itensValidos.reduce((s,it)=>s+(Number(it.valor)||0),0);
    const tutorNome = tutorById(data.tutorId)?.nome||'—';
    if(editing){
      Object.assign(nf, data, {itens:itensValidos, valorTotal});
      logAction(`editou a nota fiscal de ${tutorNome}`);
      toast('Nota fiscal atualizada');
    } else {
      const novaNF = {id:uid(), ...data, itens:itensValidos, valorTotal, anexos:[], enviado:false, criadoPor:getCurrentUser(), criadoEm:new Date().toISOString()};
      DB.notasFiscais.push(novaNF);
      logAction(`criou uma nota fiscal de ${tutorNome} (R$ ${valorTotal.toFixed(2)})`);
      toast('Nota fiscal criada');
      saveDB(); closeModal(); closeDrawer(); render();
      perguntarAvaliacao(novaNF);
      return;
    }
    saveDB(); closeModal(); closeDrawer(); render();
  });
  if(editing){
    document.getElementById('delNF').addEventListener('click', ()=>{
      confirmDialog('Excluir nota fiscal?','Esta ação não pode ser desfeita.', ()=>{
        DB.notasFiscais = DB.notasFiscais.filter(x=>x.id!==nf.id);
        logAction(`excluiu uma nota fiscal de ${tutorById(nf.tutorId)?.nome||'—'}`);
        saveDB(); closeModal(); closeDrawer(); render(); toast('Nota fiscal excluída');
      });
    });
  }
}

function openNFDrawer(nfId){
  const nf = (DB.notasFiscais||[]).find(x=>x.id===nfId); if(!nf) return;
  const t = tutorById(nf.tutorId), an = nf.animalId?animalById(nf.animalId):null;
  const usaTutor = nf.usarDadosTutor!==false;
  const nome = usaTutor ? (t?.nome||'—') : (nf.nomeAlternativo||'—');
  const cpf = usaTutor ? (t?.cpf||'') : (nf.cpfAlternativo||'');
  const telefone = usaTutor ? (t?.telefone||'') : (nf.telefoneAlternativo||'');
  const enderecoPartes = (usaTutor && t) ? [t.rua && (t.rua+(t.numero?', '+t.numero:'')), t.bairro, t.enderecoCidade, t.cep].filter(Boolean) : [];
  const boxPartes = [
    telefone,
    cpf?('CPF: '+cpf):null,
    nf.email?('E-mail: '+nf.email):null,
    ...enderecoPartes,
  ].filter(Boolean);
  openDrawer(`
    <div class="drawer-head">
      <div><h2>Nota — ${nome}</h2><div class="drawer-sub">${fmtDate(nf.data)} · R$ ${(nf.valorTotal||0).toFixed(2).replace('.',',')}</div></div>
      <button class="icon-btn" id="drawerClose">${ICONS.x}</button>
    </div>
    <div class="drawer-body">
      <div style="display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap;">
        <span class="badge ${nf.status==='Feita'?'st-Realizado':'st-AguardandoConfirmacao'}">${nf.status}</span>
        ${nf.formaPagamento?`<span class="pill-muted">${nf.formaPagamento}</span>`:''}
        ${an?`<span class="pill-muted">${an.nome}</span>`:''}
        ${!usaTutor?`<span class="pill-muted">nome diferente do tutor</span>`:''}
      </div>
      ${boxPartes.length?`<div class="alert alert-brown" style="margin-bottom:12px; flex-direction:column; align-items:flex-start; gap:3px;">${boxPartes.map(p=>`<div>${p}</div>`).join('')}</div>`:''}
      ${nf.observacoes?`<div class="alert alert-sage" style="margin-bottom:16px;"><div>${nf.observacoes}</div></div>`:''}
      <div class="section-title">Itens</div>
      <div class="table-wrap" style="margin-bottom:16px;"><table><tbody>
        ${(nf.itens||[]).map(it=>`<tr><td>${it.categoria||'—'}</td><td>${it.descricao||'—'}</td><td style="text-align:right;">R$ ${(Number(it.valor)||0).toFixed(2).replace('.',',')}</td></tr>`).join('')}
      </tbody></table></div>

      <div class="section-title">Nota emitida (PDF)</div>
      <div id="nfAnexosList" style="margin-bottom:10px;">${nfAnexosListHtml(nf)}</div>
      <label class="btn btn-secondary btn-sm" style="cursor:pointer; margin-bottom:16px;">${ICONS.plus} Anexar PDF
        <input type="file" id="nfAnexoUpload" accept="application/pdf" style="display:none;">
      </label>

      <div style="display:flex; gap:8px; flex-wrap:wrap;">
        <button class="btn btn-primary btn-sm" data-edit-nf="${nf.id}">${ICONS.edit} Editar</button>
        <button class="btn btn-danger btn-sm" data-del-nf="${nf.id}">${ICONS.trash} Excluir nota</button>
      </div>
    </div>`);
  document.getElementById('drawerClose').addEventListener('click', closeDrawer);
  document.getElementById('nfAnexoUpload').addEventListener('change', e=>{
    const file = e.target.files[0]; if(!file) return;
    if(file.type!=='application/pdf'){ toast('Apenas arquivos PDF'); return; }
    const reader = new FileReader();
    reader.onload = ev=>{
      nf.anexos = nf.anexos||[];
      nf.anexos.push({id:uid(), nome:file.name, dataUrl:ev.target.result});
      logAction(`anexou um PDF à nota fiscal de ${nome}`);
      saveDB(); toast('Anexo adicionado');
      document.getElementById('nfAnexosList').innerHTML = nfAnexosListHtml(nf);
      attachViewHandlers();
    };
    reader.readAsDataURL(file);
  });
}
function nfAnexosListHtml(nf){
  if(!nf.anexos || !nf.anexos.length) return `<div class="hint">Nenhum PDF anexado ainda.</div>`;
  return nf.anexos.map(a=>`
    <div style="display:flex; align-items:center; gap:8px; background:var(--sage-pale); border-radius:9px; padding:8px 10px; margin-bottom:6px;">
      <span style="flex:1; font-size:12.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${a.nome}</span>
      <a href="${a.dataUrl}" download="${a.nome}" class="icon-btn" title="Baixar">${ICONS.download}</a>
      <button class="icon-btn" data-del-anexo-nf="${nf.id}" data-anexo-id="${a.id}" title="Excluir anexo">${ICONS.x}</button>
    </div>`).join('');
}

    ${list.map(r=>`

      </div>`).join('')}
  </div>` : `<div class="card"><div class="pad">${emptyState('Nenhum relatório ainda','Registre suas anotações semanais ou mensais das reuniões — é tudo manual, ninguém escreve por você.')}</div></div>`}`;
}
function formRelatorio(rel){
  const editing = !!rel;
  let links = editing ? JSON.parse(JSON.stringify(rel.links||[])) : [];
  const html = modalShell(editing?'Editar relatório':'Novo relatório', `
    <form id="formRelatorio">
      <div class="field"><label>Título *</label><input name="titulo" required value="${rel?.titulo||''}"></div>
      <div class="field-row">
        <div class="field"><label>Tipo</label><select name="tipo">
          <option ${(!rel||rel.tipo==='Semanal')?'selected':''}>Semanal</option>
          <option ${rel?.tipo==='Mensal'?'selected':''}>Mensal</option>
        </select></div>
        <div class="field"><label>Data de referência</label><input type="date" name="data" value="${rel?.data||todayISO()}"></div>
      </div>
      <div class="field"><label>Anotações *</label><textarea name="texto" required style="min-height:220px;">${rel?.texto||''}</textarea></div>
      <div class="field">
        <label>Links úteis (opcional)</label>
        <div id="relLinksList"></div>
        <button type="button" class="btn btn-secondary btn-sm" id="relAddLinkBtn" style="margin-top:8px;">${ICONS.plus} Adicionar link</button>
      </div>
    </form>`,
    `<div style="display:flex; gap:10px; width:100%; justify-content:space-between;">
      <div>${editing?`<button type="button" class="btn btn-danger" id="delRelatorio">${ICONS.trash} Excluir</button>`:''}</div>
      <div style="display:flex; gap:10px;"><button class="btn btn-secondary" id="modalCancel">Cancelar</button><button class="btn btn-primary" id="modalSave">${editing?'Salvar':'Criar'}</button></div>
    </div>`);
  openModal(html);
  bindModalClose();
  function renderLinks(){
    const cont = document.getElementById('relLinksList');
    cont.innerHTML = links.map(l=>`
      <div style="display:flex; gap:6px; margin-bottom:6px; align-items:center;">
        <input data-link-nome="${l.id}" placeholder="Nome do botão (ex: Site da faculdade)" value="${l.nome||''}" style="flex:1;">
        <input data-link-url="${l.id}" placeholder="https://..." value="${l.url||''}" style="flex:2;">
        <button type="button" class="icon-btn" data-link-del="${l.id}">${ICONS.x}</button>
      </div>`).join('') || `<div class="hint">Nenhum link adicionado ainda.</div>`;
    cont.querySelectorAll('[data-link-nome]').forEach(el=>el.addEventListener('input', e=>{
      const l = links.find(x=>x.id===el.dataset.linkNome); if(l) l.nome=e.target.value;
    }));
    cont.querySelectorAll('[data-link-url]').forEach(el=>el.addEventListener('input', e=>{
      const l = links.find(x=>x.id===el.dataset.linkUrl); if(l) l.url=e.target.value;
    }));
    cont.querySelectorAll('[data-link-del]').forEach(el=>el.addEventListener('click', ()=>{
      links = links.filter(x=>x.id!==el.dataset.linkDel); renderLinks();
    }));
  }
  renderLinks();
  document.getElementById('relAddLinkBtn').addEventListener('click', ()=>{
    links.push({id:uid(), nome:'', url:''}); renderLinks();
  });
  document.getElementById('modalSave').addEventListener('click', ()=>{
    const f = document.getElementById('formRelatorio');
    if(!f.reportValidity()) return;
    const data = Object.fromEntries(new FormData(f));
    const linksValidos = links.filter(l=>l.nome && l.nome.trim() && l.url && l.url.trim()).map(l=>({...l, url: /^https?:\/\//i.test(l.url.trim()) ? l.url.trim() : 'https://'+l.url.trim()}));
    data.links = linksValidos;
    if(editing){
      Object.assign(rel, data);
      logAction(`editou o relatório "${rel.titulo}"`);
      toast('Relatório atualizado');
    } else {
      DB.relatorios = DB.relatorios||[];
      DB.relatorios.push({id:uid(), ...data, criadoPor:getCurrentUser(), criadoEm:new Date().toISOString()});
      logAction(`criou o relatório "${data.titulo}"`);
      toast('Relatório criado');
    }
    saveDB(); closeModal(); closeDrawer(); render();
  });
  if(editing){
    document.getElementById('delRelatorio').addEventListener('click', ()=>{
      confirmDialog('Excluir relatório?','Esta ação não pode ser desfeita.', ()=>{
        DB.relatorios = (DB.relatorios||[]).filter(x=>x.id!==rel.id);
        logAction(`excluiu o relatório "${rel.titulo}"`);
        saveDB(); closeModal(); closeDrawer(); render(); toast('Relatório excluído');
      });
    });
  }
}
function openRelatorioDrawer(relId){

  openDrawer(`

let avaliacoesFiltro = '';
function perguntarAvaliacao(nf){
  const t = tutorById(nf.tutorId);
  const nome = nf.usarDadosTutor===false ? (nf.nomeAlternativo||'cliente') : (t?.nome||'cliente');
  const html = modalShell('Avaliação no Google', `<p style="font-size:14px;">Pedir para ${nome} avaliar a clínica no Google?</p>`,
    `<button class="btn btn-secondary" id="btnAvalNao">Não</button><button class="btn btn-primary" id="btnAvalSim">Sim</button>`);
  openModal(html, {narrow:true});
  document.getElementById('modalClose').addEventListener('click', closeModal);
  document.getElementById('btnAvalNao').addEventListener('click', closeModal);
  document.getElementById('btnAvalSim').addEventListener('click', ()=>{
    perguntarStatusPedido(nf.tutorId, nf.animalId, nf.id);
  });
}
function perguntarStatusPedido(tutorId, animalId, nfId){
  const html = modalShell('Avaliação no Google', `<p style="font-size:14px;">Você já pediu, ou vai pedir depois?</p>`,
    `<button class="btn btn-secondary" id="btnVouPedir">Vou pedir</button><button class="btn btn-primary" id="btnJaPedi">Já pedi</button>`);
  openModal(html, {narrow:true});
  document.getElementById('modalClose').addEventListener('click', closeModal);
  document.getElementById('btnVouPedir').addEventListener('click', ()=>{
    salvarAvaliacao({tutorId, animalId, nfId, status:'Vou pedir', avaliou:null});
    closeModal(); toast('Anotado — você pode atualizar depois em Avaliações');
  });
  document.getElementById('btnJaPedi').addEventListener('click', ()=>{
    closeModal();
    perguntarSeAvaliou(tutorId, animalId, nfId);
  });
}
function perguntarSeAvaliou(tutorId, animalId, nfId, avaliacaoId){
  const html = modalShell('Avaliação no Google', `<p style="font-size:14px;">O cliente já avaliou?</p>`,
    `<button class="btn btn-secondary" id="btnNaoAvaliou">Ainda não</button><button class="btn btn-primary" id="btnSimAvaliou">Sim, avaliou</button>`);
  openModal(html, {narrow:true});
  document.getElementById('modalClose').addEventListener('click', closeModal);
  document.getElementById('btnNaoAvaliou').addEventListener('click', ()=>{
    salvarAvaliacao({id:avaliacaoId, tutorId, animalId, nfId, status:'Já pedi', avaliou:false});
    closeModal(); toast('Anotado'); render();
  });
  document.getElementById('btnSimAvaliou').addEventListener('click', ()=>{
    salvarAvaliacao({id:avaliacaoId, tutorId, animalId, nfId, status:'Já pedi', avaliou:true});
    closeModal(); toast('Que ótimo! Anotado'); render();
  });
}
function salvarAvaliacao(dadosNovos){
  DB.avaliacoes = DB.avaliacoes||[];
  if(dadosNovos.id){
    const existente = DB.avaliacoes.find(x=>x.id===dadosNovos.id);
    if(existente){ Object.assign(existente, dadosNovos, {alteradoEm:new Date().toISOString()}); saveDB(); return; }
  }
  DB.avaliacoes.push({id:uid(), data:todayISO(), criadoPor:getCurrentUser(), criadoEm:new Date().toISOString(), ...dadosNovos});
  logAction(`registrou pedido de avaliação (${dadosNovos.status})`);
  saveDB();
}
function renderAvaliacoes(){
  let list = (DB.avaliacoes||[]).slice();
  if(avaliacoesFiltro==='vouPedir') list = list.filter(a=>a.status==='Vou pedir');
  if(avaliacoesFiltro==='aguardando') list = list.filter(a=>a.status==='Já pedi' && a.avaliou===null);
  if(avaliacoesFiltro==='avaliou') list = list.filter(a=>a.avaliou===true);
  if(avaliacoesFiltro==='naoAvaliou') list = list.filter(a=>a.avaliou===false);
  list.sort((a,b)=>(b.criadoEm||'').localeCompare(a.criadoEm||''));
  const total = (DB.avaliacoes||[]).length;
  const avaliaram = (DB.avaliacoes||[]).filter(a=>a.avaliou===true).length;
  const pendentes = (DB.avaliacoes||[]).filter(a=>a.status==='Já pedi' && a.avaliou===null).length;
  return `
  <div class="grid g3" style="margin-bottom:16px;">
    ${statCard('Total de pedidos', total, 'var(--brown)')}
    ${statCard('Avaliaram', avaliaram, 'var(--st-realizado)')}
    ${statCard('Aguardando resposta', pendentes, 'var(--st-aguardando)')}
  </div>
  <div class="view-head">
    <div class="filters" style="margin-bottom:0;">
      <select data-avalfx="">
        <option value="">Todos</option>
        <option value="vouPedir" ${avaliacoesFiltro==='vouPedir'?'selected':''}>Vou pedir</option>
        <option value="aguardando" ${avaliacoesFiltro==='aguardando'?'selected':''}>Já pedi, aguardando</option>
        <option value="avaliou" ${avaliacoesFiltro==='avaliou'?'selected':''}>Avaliou</option>
        <option value="naoAvaliou" ${avaliacoesFiltro==='naoAvaliou'?'selected':''}>Não avaliou</option>
      </select>
    </div>
    <button class="btn btn-primary" id="novaAvaliacao">${ICONS.plus} Nova avaliação</button>
  </div>
  <div class="card">
    ${list.length? `<div class="table-wrap"><table><thead><tr><th>Data</th><th>Tutor</th><th>Animal</th><th>Status</th><th>Avaliou?</th></tr></thead><tbody>
      ${list.map(a=>`
        <tr>
          <td>${fmtDate(a.data)}</td>
          <td>${tutorById(a.tutorId)?.nome||'—'}</td>
          <td>${a.animalId?(animalById(a.animalId)?.nome||'—'):'—'}</td>
          <td><span class="pill-muted">${a.status}</span></td>
          <td>
            ${a.status==='Vou pedir'?`<button class="btn btn-secondary btn-sm" data-marcar-ja-pedi="${a.id}">Marcar "Já pedi"</button>`
              : a.avaliou===null?`<div style="display:flex; gap:6px;"><button class="btn btn-secondary btn-sm" data-marcar-avaliou="${a.id}" data-valor="nao">Ainda não</button><button class="btn btn-primary btn-sm" data-marcar-avaliou="${a.id}" data-valor="sim">Avaliou</button></div>`
              : a.avaliou? `<span class="badge st-Realizado">Sim ⭐</span>` : `<span class="badge st-Cancelado">Não</span>`}
          </td>
        </tr>`).join('')}
    </tbody></table></div>` : `<div class="pad">${emptyState('Nenhum pedido de avaliação ainda','Depois de criar uma nota fiscal, o sistema pergunta se quer pedir avaliação — ou clique em "Nova avaliação" aqui.')}</div>`}
  </div>`;
}

    const tid = e.target.value;
    document.getElementById('avalAnimalSel').innerHTML = `<option value="">—</option>` + (tid?animaisDoTutor(tid):[]).map(a=>`<option value="${a.id}">${a.nome}</option>`).join('');
    document.getElementById('avalNfSel').innerHTML = `<option value="">— nenhuma —</option>` + (DB.notasFiscais||[]).filter(nf=>nf.tutorId===tid).map(nf=>`<option value="${nf.id}">${fmtDate(nf.data)} — R$ ${(nf.valorTotal||0).toFixed(2).replace('.',',')}</option>`).join('');
  });
  document.getElementById('modalSave').addEventListener('click', ()=>{
    const f = document.getElementById('formAvaliacao');
    if(!f.reportValidity()) return;
    const data = Object.fromEntries(new FormData(f));
    if(!data.animalId) delete data.animalId;
    if(!data.nfId) delete data.nfId;
    closeModal();
    perguntarStatusPedido(data.tutorId, data.animalId, data.nfId);
  });
}

function openModal(html, {narrow=false}={}){
  const root = document.getElementById('modalRoot');
  root.innerHTML = `<div class="modal-backdrop" id="modalBackdrop"><div class="modal ${narrow?'narrow':''}">${html}</div></div>`;
  document.getElementById('modalBackdrop').addEventListener('mousedown', e=>{ if(e.target.id==='modalBackdrop') closeModal(); });
}
function closeModal(){ document.getElementById('modalRoot').innerHTML=''; }

function modalShell(title, bodyHtml, footHtml){
  return `
    <div class="modal-head"><h3>${title}</h3><button class="icon-btn" id="modalClose">${ICONS.x}</button></div>
    <div class="modal-body">${bodyHtml}</div>
    <div class="modal-foot">${footHtml}</div>`;
}

function normalizePhone(p){ return (p||'').replace(/\D/g,''); }
function findPossibleDuplicateTutor(nome, telefone){

  return DB.tutores.filter(t=> (n && t.nome.trim().toLowerCase()===n) || (ph && ph.length>=8 && normalizePhone(t.telefone)===ph));

  const html = modalShell('Já existe um cadastro parecido', `

function criarTutorEAnimal(data){
  const {animalNome, animalEspecie, animalSexo, ...tutorData} = data;
  const t={id:uid(), ...tutorData, criadoPor:getCurrentUser()}; DB.tutores.push(t);
  const a={id:uid(), nome:animalNome, especie:animalEspecie, sexo:animalSexo, obito:false};
  DB.animais.push(a);
  DB.vinculos.push({id:uid(), tutorId:t.id, animalId:a.id});
  logAction(`cadastrou o tutor ${t.nome} com o animal ${a.nome}`);
  toast('Tutor e animal cadastrados');
  saveDB(); closeModal(); render();
}
function cascadeDeleteAnimal(animal){
  const vinc = DB.vinculos.filter(v=>v.animalId===animal.id);
  const agsAnimal = DB.agendamentos.filter(a=>a.animalId===animal.id);
  agsAnimal.forEach(a=>moveToTrash('agendamento', a));
  DB.agendamentos = DB.agendamentos.filter(a=>a.animalId!==animal.id);
  DB.vinculos = DB.vinculos.filter(v=>v.animalId!==animal.id);
  DB.animais = DB.animais.filter(x=>x.id!==animal.id);
  moveToTrash('animal', animal, vinc);
}
function cascadeDeleteTutor(tutor){
  const vinc = DB.vinculos.filter(v=>v.tutorId===tutor.id);
  const animalIds = vinc.map(v=>v.animalId);
  const agsDoTutor = DB.agendamentos.filter(a=>a.tutorId===tutor.id);
  agsDoTutor.forEach(a=>moveToTrash('agendamento', a));
  DB.agendamentos = DB.agendamentos.filter(a=>a.tutorId!==tutor.id);
  const contatosDoTutorArr = DB.contatos.filter(c=>c.tutorId===tutor.id);
  contatosDoTutorArr.forEach(c=>moveToTrash('contato', c));
  DB.contatos = DB.contatos.filter(c=>c.tutorId!==tutor.id);
  animalIds.forEach(aid=>{
    const outrosTutores = DB.vinculos.filter(v=>v.animalId===aid && v.tutorId!==tutor.id);
    if(!outrosTutores.length){
      const animal = animalById(aid);
      if(animal){
        const agsAnimal = DB.agendamentos.filter(a=>a.animalId===aid);
        agsAnimal.forEach(a=>moveToTrash('agendamento', a));
        DB.agendamentos = DB.agendamentos.filter(a=>a.animalId!==aid);
        const vincAnimal = DB.vinculos.filter(v=>v.animalId===aid);
        moveToTrash('animal', animal, vincAnimal);
        DB.animais = DB.animais.filter(x=>x.id!==aid);
      }
    }
  });
  DB.vinculos = DB.vinculos.filter(v=>v.tutorId!==tutor.id);
  DB.tutores = DB.tutores.filter(t=>t.id!==tutor.id);
  moveToTrash('tutor', tutor, vinc);
}

    `<div style="display:flex; gap:10px; width:100%; justify-content:space-between;">
      <div>${editing?`<button type="button" class="btn btn-danger" id="delTutor">${ICONS.trash} Excluir</button>`:''}</div>
      <div style="display:flex; gap:10px;"><button class="btn btn-secondary" id="modalCancel">Cancelar</button><button class="btn btn-primary" id="modalSave">${editing?'Salvar':'Cadastrar'}</button></div>
    </div>`);
  openModal(html);

  document.getElementById('modalSave').addEventListener('click', ()=>{

    const dups = findPossibleDuplicateTutor(data.nome, data.telefone);
    if(dups.length){ showDuplicateTutorWarning(dups, data); return; }
    criarTutorEAnimal(data);
  });
  if(editing){
    document.getElementById('linkAnimalBtn')?.addEventListener('click', ()=>openLinkAnimalPicker(tutor.id));

      DB.vinculos = DB.vinculos.filter(v=>!(v.tutorId===tutor.id && v.animalId===b.dataset.unlinkAnimal));
      saveDB(); formTutor(tutor);
    }));
    document.getElementById('delTutor')?.addEventListener('click', ()=>{
      const animCount = animaisDoTutor(tutor.id).length;
      confirmDialog('Excluir tutor?', `O tutor, seus agendamentos e contatos vão para a Lixeira.${animCount?` Os animais vinculados exclusivamente a ele (${animCount}) também serão excluídos.`:''}`, ()=>{
        cascadeDeleteTutor(tutor);
        logAction(`excluiu o tutor ${tutor.nome} com agendamentos, contatos e animais vinculados`);
        saveDB(); closeModal(); closeDrawer(); render(); toast('Tutor e dados vinculados movidos para a Lixeira');
      });
    });
  }
}
function openLinkAnimalPicker(tutorId){
  const disponiveis = DB.animais.filter(a=>!DB.vinculos.some(v=>v.tutorId===tutorId && v.animalId===a.id));
  const html = modalShell('Vincular animal', `
    <div class="field"><label>Selecionar animal existente</label>
      <select id="pickAnimal"><option value="">— selecione —</option>${disponiveis.map(a=>{
        const tutoresAtuais = tutoresDoAnimal(a.id).map(t=>t.nome);
        const detalhe = [a.especie, tutoresAtuais.length? 'tutor(es): '+tutoresAtuais.join(', ') : 'sem tutor vinculado ainda'].filter(Boolean).join(' · ');
        return `<option value="${a.id}">${a.nome} — ${detalhe}</option>`;
      }).join('')}</select>
    </div>
    <div class="hint">Cuidado: animais costumam repetir nome (ex: "Thor", "Mel"). Confira a espécie e o tutor atual mostrados ao lado antes de vincular.</div>
    <div class="hint" style="margin-top:10px;">Ou cadastre um novo animal já vinculado a este tutor:</div>
    <button class="btn btn-secondary btn-sm" style="margin-top:8px;" id="newAnimalInline">${ICONS.plus} Novo animal</button>
  `, `<button class="btn btn-secondary" id="modalCancel">Cancelar</button><button class="btn btn-primary" id="modalSave">Vincular</button>`);
  openModal(html, {narrow:true});
  bindModalClose(()=>formTutor(tutorById(tutorId)));
  document.getElementById('modalSave').addEventListener('click', ()=>{
    const id = document.getElementById('pickAnimal').value;
    if(!id) return toast('Selecione um animal');
    DB.vinculos.push({id:uid(), tutorId, animalId:id}); saveDB(); toast('Animal vinculado');
    formTutor(tutorById(tutorId));
  });
  document.getElementById('newAnimalInline').addEventListener('click', ()=> formAnimal(null, tutorId));
}

/* ---- Form Animal ---- */
function formAnimal(animal, presetTutorId){
  const editing = !!animal;
  const tutoresAtuais = editing ? tutoresDoAnimal(animal.id) : (presetTutorId?[tutorById(presetTutorId)]:[]);
  const precisaEscolherTutor = !editing && !presetTutorId;
  const html = modalShell(editing?'Editar animal':'Novo animal', `
    <form id="formAnimal">
      <div class="field"><label>Nome do animal *</label><input name="nome" required value="${animal?.nome||''}"></div>
      <div class="field-row">
        <div class="field"><label>Espécie *</label><select name="especie" required>
          <option value="">— selecione —</option>
          <option value="Canina" ${animal?.especie==='Canina'?'selected':''}>Canina</option>
          <option value="Felina" ${animal?.especie==='Felina'?'selected':''}>Felina</option>
          <option value="Equina" ${animal?.especie==='Equina'?'selected':''}>Equina</option>
        </select></div>
        <div class="field"><label>Sexo *</label><select name="sexo" required>
          <option value="">— selecione —</option>
          <option value="Macho" ${animal?.sexo==='Macho'?'selected':''}>Macho</option>
          <option value="Fêmea" ${animal?.sexo==='Fêmea'?'selected':''}>Fêmea</option>
        </select></div>
      </div>
      ${editing?`<div class="field"><label style="display:flex; align-items:center; gap:8px; margin-bottom:0;"><input type="checkbox" name="obito" style="width:auto;" ${animal?.obito?'checked':''}> Animal foi a óbito</label></div>`:''}
      ${precisaEscolherTutor?`<div class="field"><label>Tutor *</label>
        <select name="tutorIdNovo" id="animalTutorNovo" required>
          <option value="">— selecione um tutor —</option>
          ${DB.tutores.map(t=>`<option value="${t.id}">${t.nome}</option>`).join('')}
        </select>
        <div class="hint">Todo animal precisa estar vinculado a um tutor. Se o tutor ainda não existe, ${DB.tutores.length?'':'cadastre-o primeiro em "+ Tutor" — '}<button type="button" class="btn btn-ghost btn-sm" id="novoTutorInline" style="padding:2px 4px; text-decoration:underline;">cadastre um tutor novo</button>.</div>
      </div>`:''}
      <div class="field"><label>Observações</label><textarea name="obs">${animal?.obs||''}</textarea></div>
      ${editing?`<div class="field"><label>Tutor(es)</label>
        <div class="chip-list" id="animalTutoresChips">${tutoresAtuais.filter(Boolean).map(t=>`<span class="chip">${t.nome}<button type="button" data-unlink-tutor="${t.id}">${ICONS.x}</button></span>`).join('')||'<span class="hint">Nenhum tutor vinculado ainda.</span>'}</div>
        <button type="button" class="btn btn-secondary btn-sm" id="linkTutorBtn" style="margin-top:10px;">${ICONS.plus} Vincular tutor existente</button>
      </div>`:''}
    </form>`,
    `<div style="display:flex; gap:10px; width:100%; justify-content:space-between;">
      <div>${editing?`<button type="button" class="btn btn-danger" id="delAnimal">${ICONS.trash} Excluir</button>`:''}</div>
      <div style="display:flex; gap:10px;"><button class="btn btn-secondary" id="modalCancel">Cancelar</button><button class="btn btn-primary" id="modalSave">${editing?'Salvar':'Cadastrar'}</button></div>
    </div>`);
  openModal(html);
  bindModalClose();
  document.getElementById('novoTutorInline')?.addEventListener('click', ()=>{ closeModal(); formTutor(); });
  document.getElementById('modalSave').addEventListener('click', ()=>{
    const f = document.getElementById('formAnimal');
    if(!f.reportValidity()) return;
    const data = Object.fromEntries(new FormData(f));
    data.obito = f.querySelector('[name="obito"]') ? f.querySelector('[name="obito"]').checked : (animal?.obito||false);
    const tutorEscolhido = presetTutorId || data.tutorIdNovo;
    if(!editing && !tutorEscolhido){ toast('Selecione o tutor deste animal'); return; }
    delete data.tutorIdNovo;
    let id;
    if(editing){ const eraObito=animal.obito; Object.assign(animal, data); id=animal.id; logAction(`alterou o cadastro do animal ${animal.nome}${(!eraObito&&data.obito)?' (registrado óbito)':''}`); toast('Animal atualizado'); }
    else{ id=uid(); const a={id, ...data}; DB.animais.push(a); DB.vinculos.push({id:uid(), tutorId:tutorEscolhido, animalId:id}); logAction(`cadastrou o animal ${a.nome}`); toast('Animal cadastrado'); }
    saveDB(); closeModal(); render();
  });
  document.getElementById('linkTutorBtn')?.addEventListener('click', ()=>{
    if(!editing){ toast('Salve o animal primeiro para vincular outros tutores'); return; }
    openLinkTutorPicker(animal.id);
  });
  document.querySelectorAll('[data-unlink-tutor]').forEach(b=>b.addEventListener('click', ()=>{
    DB.vinculos = DB.vinculos.filter(v=>!(v.animalId===animal.id && v.tutorId===b.dataset.unlinkTutor));
    saveDB(); formAnimal(animal);
  }));
  if(editing){
    document.getElementById('delAnimal')?.addEventListener('click', ()=>{
      const agCount = agendamentosDoAnimal(animal.id).length;
      confirmDialog('Excluir animal?', `O animal vai para a Lixeira${agCount?`, junto com ${agCount} agendamento(s) vinculado(s)`:''}.`, ()=>{
        cascadeDeleteAnimal(animal);
        logAction(`excluiu o animal ${animal.nome} com agendamentos vinculados`);
        saveDB(); closeModal(); closeDrawer(); render(); toast('Animal movido para a Lixeira');
      });
    });
  }
}
function openLinkTutorPicker(animalId){
  const disponiveis = DB.tutores.filter(t=>!DB.vinculos.some(v=>v.animalId===animalId && v.tutorId===t.id));
  const html = modalShell('Vincular tutor', `
    <div class="field"><label>Selecionar tutor existente</label>
      <select id="pickTutor"><option value="">— selecione —</option>${disponiveis.map(t=>`<option value="${t.id}">${t.nome}${t.telefone?' — '+t.telefone:''}</option>`).join('')}</select>
    </div>
    <div class="hint">Confira o telefone ao lado do nome pra não vincular o tutor errado, caso dois tenham nome parecido.</div>`, `<button class="btn btn-secondary" id="modalCancel">Cancelar</button><button class="btn btn-primary" id="modalSave">Vincular</button>`);
  openModal(html, {narrow:true});
  bindModalClose(()=>formAnimal(animalById(animalId)));
  document.getElementById('modalSave').addEventListener('click', ()=>{
    const id = document.getElementById('pickTutor').value;
    if(!id) return toast('Selecione um tutor');
    DB.vinculos.push({id:uid(), tutorId:id, animalId}); saveDB(); toast('Tutor vinculado');
    formAnimal(animalById(animalId));
  });
}

/* ---- Form Agendamento ---- */
function cidadeClinicaFieldsHtml(idPrefix, obj){
  const cidade = obj?.cidade || '';
  const clinica = obj?.clinica || '';
  return `
    <div class="field-row">
      <div class="field"><label>Cidade</label>
        <select name="cidade" id="${idPrefix}CidadeSel">
          <option value="">— selecione —</option>
          ${Object.keys(DB.cidadesClinicas).map(c=>`<option ${cidade===c?'selected':''}>${c}</option>`).join('')}
        </select>
      </div>
      <div class="field"><label>Clínica</label>
        <select name="clinica" id="${idPrefix}ClinicaSel">
          <option value="">${cidade?'— selecione —':'selecione a cidade primeiro'}</option>
          ${(DB.cidadesClinicas[cidade]||[]).map(c=>`<option ${clinica===c?'selected':''}>${c}</option>`).join('')}
        </select>
      </div>
    </div>`;
}
function wireCidadeClinicaFields(idPrefix){
  const sel = document.getElementById(idPrefix+'CidadeSel');
  if(!sel) return;
  sel.addEventListener('change', ()=>{
    const cidade = sel.value;
    const clinicaSel = document.getElementById(idPrefix+'ClinicaSel');
    clinicaSel.innerHTML = `<option value="">${cidade?'— selecione —':'selecione a cidade primeiro'}</option>` + (DB.cidadesClinicas[cidade]||[]).map(c=>`<option>${c}</option>`).join('');
  });
}
function autoFillCidadeClinica(idPrefix, tutorId){
  const t = tutorById(tutorId);
  if(!t || !t.cidade) return;
  const cidadeSel = document.getElementById(idPrefix+'CidadeSel');
  const clinicaSel = document.getElementById(idPrefix+'ClinicaSel');
  if(!cidadeSel || !clinicaSel) return;
  cidadeSel.value = t.cidade;
  clinicaSel.innerHTML = `<option value="">— selecione —</option>` + (DB.cidadesClinicas[t.cidade]||[]).map(c=>`<option ${t.clinica===c?'selected':''}>${c}</option>`).join('');
}
function formAgendamento(ag, presets){

          ${contatosPendentes.map(c=>{
            const nome = c.tutorId? (tutorById(c.tutorId)?.nome||'') : (c.nomeAvulso||'contato');
            const animalNome = c.animalId? (animalById(c.animalId)?.nome||'') : (c.animalAvulso||'');
            return `<option value="${c.id}">${nome}${animalNome?' · '+animalNome:''} · contato em ${fmtDate(c.dataContato)}</option>`;

        </select>
        <div class="hint">Selecionar preenche tutor, animal e telefone automaticamente.</div>
      </div>`:''}
      <div id="agComCadastroWrap" style="${editing && agSemCadastro(ag) ? 'display:none;' : ''}">
        <div class="field"><label>Tutor *</label>
          <select name="tutorId" id="agTutorSel" ${editing && agSemCadastro(ag) ? '' : 'required'}>
            <option value="">— selecione —</option>
            ${DB.tutores.map(t=>`<option value="${t.id}" ${tutorSel===t.id?'selected':''}>${t.nome}</option>`).join('')}
          </select>
        </div>
        <div class="field"><label>Animal *</label>
          <select name="animalId" id="agAnimalSel" ${editing && agSemCadastro(ag) ? '' : 'required'}>
            <option value="">${tutorSel?'— selecione —':'selecione um tutor primeiro'}</option>
            ${(tutorSel?animaisDoTutor(tutorSel):DB.animais).map(a=>`<option value="${a.id}" ${(ag?.animalId||presetAnimalId)===a.id?'selected':''}>${a.nome}</option>`).join('')}
          </select>
        </div>
      </div>
      <div id="agSemCadastroWrap" style="${editing && agSemCadastro(ag) ? '' : 'display:none;'}">
        <div class="alert alert-warn" style="margin-bottom:10px;"><div>Esse agendamento vai ficar marcado como "sem cadastro" até alguém completar o cadastro do tutor e do animal depois.</div></div>
        <div class="field"><label>Nome do tutor *</label><input name="tutorAvulso" id="agTutorAvulsoInput" placeholder="Nome de quem está agendando" value="${ag?.tutorAvulso||''}" ${editing && agSemCadastro(ag) ? 'required' : ''}></div>
        <div class="field-row">
          <div class="field"><label>Telefone</label><input name="telefoneAvulso" id="agTelefoneAvulsoInput" value="${ag?.telefoneAvulso||''}"></div>
          <div class="field"><label>Nome do animal *</label><input name="animalAvulso" id="agAnimalAvulsoInput" value="${ag?.animalAvulso||''}" ${editing && agSemCadastro(ag) ? 'required' : ''}></div>
        </div>
      </div>
      ${!editing?`<div class="field" id="agOutrosAnimaisWrap" style="display:none;">
        <label>Trouxe outros animais pra avaliar junto, no mesmo horário?</label>
        <div id="agOutrosAnimaisList" class="chip-list"></div>
      </div>`:''}
      <div class="field-row">
        <div class="field"><label>Data *</label><input type="date" name="data" id="agDataInput" required value="${ag?.data||presets?.data||todayISO()}"></div>
        <div class="field"><label>Horário *</label><input type="time" name="horario" required value="${ag?.horario||'09:00'}"></div>
      </div>
      <div class="field"><label>Até que horas? (opcional)</label><input type="time" name="horarioFim" value="${ag?.horarioFim||''}"></div>
      <div class="field-row">
        <div class="field"><label>Tipo *</label>
          <select name="tipo" required id="agTipoSel">${tiposNomes().map(t=>`<option ${ag?.tipo===t?'selected':''}>${t}</option>`).join('')}</select>
        </div>
        <div class="field"><label>Status</label>
          <select name="status">${STATUS_ORDER.map(s=>`<option value="${s}" ${(ag?.status||'Agendado')===s?'selected':''}>${statusLabel(s)}</option>`).join('')}</select>
        </div>
      </div>
      <div class="field" id="agQualExameWrap" style="${ag?.tipo==='Exame'?'':'display:none;'}">
        <label>Qual exame? (opcional)</label>
        <input name="qualExame" id="agQualExameInput" placeholder="Ex: hemograma, ultrassom ocular…" value="${ag?.qualExame||''}">
      </div>
      <div class="field">
        <label>Quem vai atender? (opcional, pode marcar mais de uma)</label>
        <div class="chip-list">
          ${(DB.profissionais||[]).map(p=>`
            <label class="chip" style="cursor:pointer;">
              <input type="checkbox" data-ag-profissional="${p}" style="width:auto; margin:0;" ${(ag?.profissionais||[]).includes(p)?'checked':''}> ${p}

      <div class="field-row">

        <div class="field"><label>Agendado por</label>
          <select name="usuarioResponsavel">${(DB.usuarios||[]).map(u=>`<option ${(ag?.usuarioResponsavel||getCurrentUser())===u.nome?'selected':''}>${u.nome}</option>`).join('')}</select>
        </div>
      </div>
      <div class="field"><label>Observações</label><textarea name="observacoes">${ag?.observacoes||''}</textarea></div>
      ${indicacaoFieldsHtml('ag', ag)}
    </form>`,
    `<div style="display:flex; gap:10px; width:100%; justify-content:space-between;">
      <div>${editing?`<button type="button" class="btn btn-danger" id="delAg">${ICONS.trash} Excluir</button>`:''}</div>
      <div style="display:flex; gap:10px;"><button class="btn btn-secondary" id="modalCancel">Cancelar</button><button class="btn btn-primary" id="modalSave">${editing?'Salvar':'Agendar'}</button></div>
    </div>`);
  openModal(html);
  bindModalClose();
  let contatoOrigemAtivo = presets?.contatoOrigemId || null;
  document.getElementById('agContatoPendenteSel')?.addEventListener('change', e=>{
    const cId = e.target.value;
    if(!cId){ contatoOrigemAtivo = null; return; }
    const c = DB.contatos.find(x=>x.id===cId);
    if(!c) return;
    if(!c.tutorId){
      closeModal();
      toast('Complete o cadastro do tutor e depois selecione o contato de novo em "Novo agendamento"');
      formTutor(null, {nome:c.nomeAvulso, telefone:c.telefone});
      return;
    }
    contatoOrigemAtivo = c.id;
    document.getElementById('agTutorSel').value = c.tutorId;
    const animais = animaisDoTutor(c.tutorId);
    document.getElementById('agAnimalSel').innerHTML = `<option value="">— selecione —</option>` + animais.map(a=>`<option value="${a.id}" ${c.animalId===a.id?'selected':''}>${a.nome}</option>`).join('');
    if(c.tipoAtendimento){ const tipoSel=document.querySelector('#formAg [name="tipo"]'); if(tipoSel) tipoSel.value=c.tipoAtendimento; }
    atualizarOutrosAnimais();
  });
  function atualizarOutrosAnimais(){
    const wrap = document.getElementById('agOutrosAnimaisWrap');
    if(!wrap) return;
    const tid = document.getElementById('agTutorSel').value;
    const animalPrincipal = document.getElementById('agAnimalSel').value;
    const outros = tid ? animaisDoTutor(tid).filter(a=>a.id!==animalPrincipal) : [];
    if(!outros.length){ wrap.style.display='none'; return; }
    wrap.style.display='';
    document.getElementById('agOutrosAnimaisList').innerHTML = outros.map(a=>`
      <label class="chip" style="cursor:pointer;">
        <input type="checkbox" data-outro-animal="${a.id}" style="width:auto; margin:0;"> ${a.nome}
      </label>`).join('');
  }
  document.getElementById('agTutorSel').addEventListener('change', e=>{
    const tid = e.target.value; const animais = tid?animaisDoTutor(tid):DB.animais;
    document.getElementById('agAnimalSel').innerHTML = `<option value="">— selecione —</option>` + animais.map(a=>`<option value="${a.id}">${a.nome}</option>`).join('');
    if(!editing) autoFillCidadeClinica('ag', tid);
    atualizarOutrosAnimais();
  });
  document.getElementById('agAnimalSel').addEventListener('change', atualizarOutrosAnimais);
  atualizarOutrosAnimais();
  if(!editing && tutorSel) autoFillCidadeClinica('ag', tutorSel);
  wireIndicacaoFields('ag');
  wireCidadeClinicaFields('ag');
  document.getElementById('agTipoSel').addEventListener('change', e=>{
    document.getElementById('agQualExameWrap').style.display = e.target.value==='Exame' ? '' : 'none';
  });
  document.getElementById('agSemCadastroToggle')?.addEventListener('change', e=>{
    const semCadastro = e.target.checked;
    document.getElementById('agComCadastroWrap').style.display = semCadastro ? 'none' : '';
    document.getElementById('agSemCadastroWrap').style.display = semCadastro ? '' : 'none';
    document.getElementById('agTutorSel').required = !semCadastro;
    document.getElementById('agAnimalSel').required = !semCadastro;
    document.getElementById('agTutorAvulsoInput').required = semCadastro;
    document.getElementById('agAnimalAvulsoInput').required = semCadastro;
  });
  document.getElementById('modalSave').addEventListener('click', ()=>{
    const f = document.getElementById('formAg');
    if(!f.reportValidity()) return;
    const data = Object.fromEntries(new FormData(f));
    if(!data.indicacaoTutorId) delete data.indicacaoTutorId;
    if(!data.qualExame) delete data.qualExame;
    data.profissionais = Array.from(document.querySelectorAll('[data-ag-profissional]:checked')).map(el=>el.dataset.agProfissional);
    if(!data.horarioFim) delete data.horarioFim;
    const semCadastroAtivo = data.tutorAvulso && data.tutorAvulso.trim();
    if(semCadastroAtivo){
      delete data.tutorId; delete data.animalId;
    } else {
      delete data.tutorAvulso; delete data.telefoneAvulso; delete data.animalAvulso;
      if(!data.tutorId){ toast('Selecione um tutor, ou marque "tutor ainda não tem cadastro"'); return; }
    }
    const an = data.animalId ? animalById(data.animalId) : {nome: data.animalAvulso};
    if(editing){
      const prevStatus = ag.status;
      Object.assign(ag, data, {alteradoEm:new Date().toISOString()});
      if(['Cancelado','Desmarcado'].includes(data.status) && prevStatus!==data.status){ ag.dataOriginal = ag.dataOriginal||ag.data; }
      if(prevStatus!==data.status) logAction(`alterou o status do agendamento de ${an?.nome||'—'} para ${statusLabel(data.status)}`);
      else logAction(`editou o agendamento de ${an?.nome||'—'}`);
      toast('Agendamento atualizado');
    } else {
      const duplicado = !semCadastroAtivo && DB.agendamentos.find(x=>x.tutorId===data.tutorId && x.animalId===data.animalId && x.data===data.data && x.horario===data.horario && !['Cancelado','Desmarcado'].includes(x.status));
      const criarAgendamento = ()=>{
        const a = {id:uid(), ...data, criadoEm:new Date().toISOString(), alteradoEm:new Date().toISOString()};
        if(contatoOrigemAtivo) a.contatoOrigemId = contatoOrigemAtivo;
        DB.agendamentos.push(a); logAction(`criou um agendamento para o animal ${an?.nome||'—'}`);
        if(contatoOrigemAtivo){
          const c = DB.contatos.find(x=>x.id===contatoOrigemAtivo);
          if(c){ c.status='Agendado'; c.agendadoEm=new Date().toISOString(); }
        }
        const outrosMarcados = Array.from(document.querySelectorAll('[data-outro-animal]:checked')).map(el=>el.dataset.outroAnimal);
        let extras = 0;
        outrosMarcados.forEach(animalIdExtra=>{
          const extraData = {...data, animalId: animalIdExtra};
          const aExtra = {id:uid(), ...extraData, criadoEm:new Date().toISOString(), alteradoEm:new Date().toISOString()};
          DB.agendamentos.push(aExtra); extras++;
        });
        if(extras) logAction(`criou mais ${extras} agendamento(s) no mesmo horário para outros animais do mesmo tutor`);
        toast(extras? `Agendamento criado para ${1+extras} animais` : 'Agendamento criado');
        saveDB(); closeModal(); render();
      };
      if(duplicado){
        confirmDialog('Agendamento repetido?', `Já existe um agendamento de ${an?.nome||'—'} em ${fmtDate(data.data)} às ${data.horario} pra esse tutor. Quer criar mesmo assim?`, ()=>{
          closeModal(); criarAgendamento();
        });
        return;
      }
      criarAgendamento();
      return;
    }
    saveDB(); closeModal(); render();
  });
  if(editing){
    document.getElementById('delAg').addEventListener('click', ()=>{
      confirmDialog('Excluir agendamento?','O registro vai para a Lixeira e pode ser restaurado em Configurações.', ()=>{
        DB.agendamentos = DB.agendamentos.filter(x=>x.id!==ag.id);
        moveToTrash('agendamento', ag);
        logAction(`excluiu o agendamento de ${animalById(ag.animalId)?.nome||'—'}`);
        saveDB(); closeModal(); render(); toast('Agendamento movido para a Lixeira');
      });
    });
  }
}

  return `

      <select name="indicacaoTipo" id="${idPrefix}IndTipo">
        ${INDICACAO_OPCOES.map(o=>`<option ${tipo===o?'selected':''}>${o}</option>`).join('')}
      </select>
    </div>
    <div class="field-row" id="${idPrefix}IndDetalheWrap" style="${(precisaVet||precisaClinica)?'':'display:none;'}">
      <div class="field" id="${idPrefix}IndVetWrap" style="${precisaVet?'':'display:none;'}">

        <input name="indicacaoVet" id="${idPrefix}IndVet" value="${c?.indicacaoVet||''}">
      </div>
      <div class="field" id="${idPrefix}IndClinicaWrap" style="${precisaClinica?'':'display:none;'}">

      </div>
    </div>
    <div class="field" id="${idPrefix}IndAmigoWrap" style="${ehAmigo?'':'display:none;'}">
      <label>O amigo é um cliente já cadastrado?</label>
      <select name="indicacaoTutorId" id="${idPrefix}IndTutor">
        <option value="">Não / não sei</option>
        ${DB.tutores.map(t=>`<option value="${t.id}" ${c?.indicacaoTutorId===t.id?'selected':''}>${t.nome}</option>`).join('')}
      </select>
    </div>`;
}
function wireIndicacaoFields(idPrefix){
  const sel = document.getElementById(idPrefix+'IndTipo');
  if(!sel) return;
  sel.addEventListener('change', ()=>{
    const v = sel.value;
    const precisaVet = ['Veterinário','Clínica e Veterinário'].includes(v);
    const precisaClinica = ['Clínica','Clínica e Veterinário'].includes(v);
    document.getElementById(idPrefix+'IndDetalheWrap').style.display = (precisaVet||precisaClinica)?'':'none';
    document.getElementById(idPrefix+'IndVetWrap').style.display = precisaVet?'':'none';
    document.getElementById(idPrefix+'IndClinicaWrap').style.display = precisaClinica?'':'none';
    document.getElementById(idPrefix+'IndAmigoWrap').style.display = v==='Amigo'?'':'none';
  });
}
function indicacaoLabel(obj){
  if(!obj || !obj.indicacaoTipo || obj.indicacaoTipo==='Sem indicação') return null;
  if(obj.indicacaoTipo==='Amigo'){
    const t = obj.indicacaoTutorId? tutorById(obj.indicacaoTutorId) : null;
    return `Amigo${t?' ('+t.nome+')':(obj.indicacaoDetalhe?' ('+obj.indicacaoDetalhe+')':'')}`;
  }
  if(['Veterinário','Clínica','Clínica e Veterinário'].includes(obj.indicacaoTipo)){
    const partes = [];
    if(obj.indicacaoVet) partes.push('Dr(a). '+obj.indicacaoVet);
    if(obj.indicacaoClinica) partes.push(obj.indicacaoClinica);
    if(!partes.length && obj.indicacaoDetalhe) partes.push(obj.indicacaoDetalhe);
    return `${obj.indicacaoTipo}${partes.length?': '+partes.join(' · '):''}`;
  }
  return obj.indicacaoTipo;
}

    const f = document.getElementById('formUsuario');
    if(!f.reportValidity()) return;
    const novoNome = new FormData(f).get('nome').trim();
    if(novoNome!==usuario.nome){
      if(DB.usuarios.some(x=>x.nome===novoNome && x.id!==usuario.id)){ toast('Já existe um usuário com esse nome'); return; }

    saveDB(); closeModal(); render(); renderUserSelect(); toast('Usuário atualizado');

function openQuickAgSearch(){

    <div id="qaSearchResults" style="max-height:320px; overflow-y:auto;"></div>
  `, `<button class="btn btn-secondary" id="modalCancel">Fechar</button>`);
  openModal(html);
  document.getElementById('modalClose').addEventListener('click', closeModal);
  document.getElementById('modalCancel').addEventListener('click', closeModal);
  const renderResults = q=>{
    q = (q||'').trim().toLowerCase();
    let list = DB.agendamentos.filter(a=>!['Realizado','Cancelado','Desmarcado'].includes(a.status));
    if(q) list = list.filter(a=>(tutorById(a.tutorId)?.nome||'').toLowerCase().includes(q) || (animalById(a.animalId)?.nome||'').toLowerCase().includes(q));
    list.sort((a,b)=>a.data.localeCompare(b.data));
    const el = document.getElementById('qaSearchResults');
    if(!list.length){ el.innerHTML = `<div class="hint" style="padding:10px 0;">Nenhum agendamento em aberto encontrado.</div>`; return; }

      <div style="display:flex; align-items:center; gap:10px; padding:9px 4px; border-bottom:1px solid #F1EEE4;">
        <div style="flex:1; font-size:13px;"><strong>${animalById(a.animalId)?.nome||'—'}</strong> · ${tutorById(a.tutorId)?.nome||'—'} — ${fmtDate(a.data)} ${a.horario} ${badge(a.status)}</div>

        <button class="icon-btn" title="Cancelar" data-qa-status="${a.id}" data-status="Cancelado">${ICONS.x}</button>
      </div>`).join('');
    el.querySelectorAll('[data-qa-status]').forEach(btn=>btn.addEventListener('click', ()=>{
      const ag = DB.agendamentos.find(x=>x.id===btn.dataset.qaStatus);
      const status = btn.dataset.status;
      if(['Desmarcado','Cancelado'].includes(status)){
        const motivo = prompt('Motivo (opcional):','');
        ag.dataOriginal = ag.dataOriginal || ag.data;
        ag.motivoStatus = motivo||'';

      ag.status = status; ag.alteradoEm = new Date().toISOString();
      logAction(`alterou o status do agendamento de ${animalById(ag.animalId)?.nome||'—'} para ${statusLabel(status)}`);
      saveDB(); toast('Status atualizado: '+statusLabel(status));
      renderResults(document.getElementById('qaSearchInput').value);
      render();
    }));
  };
  document.getElementById('qaSearchInput').addEventListener('input', e=>renderResults(e.target.value));
  renderResults('');

function openTutorDrawer(tutorId){
  const t = tutorById(tutorId); if(!t) return;
  const today = todayISO();
  const animais = animaisDoTutor(t.id);
  const agsHist = agendamentosDoTutor(t.id);
  const contatosHist = contatosDoTutor(t.id);
  const contatosRecebidos = contatosHist.filter(c=>c.origem!=='Realizado');
  const contatosRealizados = contatosHist.filter(c=>c.origem==='Realizado');
  const ultimoContatoRecebido = contatosRecebidos[0];

function buildAnimalTimeline(animalId){
  const items = [];
  agendamentosDoAnimal(animalId).forEach(ag=>{
    items.push({data:ag.data, dot:'var(--sage)', kind:'Agendamento',
      title:`${ag.tipo} — ${statusLabel(ag.status)}`,
      detail:`${ag.horario||''}${ag.observacoes?' · '+ag.observacoes:''}${ag.motivoStatus?' · Motivo: '+ag.motivoStatus:''}${ag.retornoPrevisto?' · Retorno previsto: '+fmtDate(ag.retornoPrevisto):''}`,
      ref:{type:'ag', id:ag.id}});
  });
  DB.contatos.filter(c=>c.animalId===animalId).forEach(c=>{
    items.push({data:c.dataContato, dot:'var(--brown)', kind:c.origem==='Realizado'?'Contato da clínica':'Contato recebido',
      title:`${c.origem==='Realizado'?'Clínica contatou o tutor':'Tutor entrou em contato'} — ${c.status}`,
      detail:`${c.motivoNaoAgendamento?'Motivo: '+c.motivoNaoAgendamento:''}${c.observacoes?' · '+c.observacoes:''}`,
      ref:{type:'contato', id:c.id}});
  });
  DB.lembretes.filter(l=>l.animalId===animalId).forEach(l=>{
    items.push({data:l.data, dot:'var(--st-aguardando)', kind:'Lembrete',
      title:l.titulo + (l.concluido?' (concluído)':''),
      detail:l.observacao||'', ref:{type:'lembrete', id:l.id}});
  });
  return items.sort((x,y)=>y.data.localeCompare(x.data));
}

function animalTabLinha(timeline){
  if(!timeline.length) return emptyState('Nenhum histórico ainda','Agendamentos, contatos e lembretes deste animal aparecerão aqui em ordem cronológica.');
  return `<div class="timeline">${timeline.map(it=>`
    <div class="tl-item ${it.ref.type==='ag'?'rowlink':''} ${it.ref.type==='contato'?'rowlink':''}" ${it.ref.type==='ag'?`data-open-ag="${it.ref.id}"`:''} ${it.ref.type==='contato'?`data-open-contato="${it.ref.id}"`:''}>
      <div class="tl-dot" style="background:${it.dot}"></div>
      <div class="tl-date">${fmtDate(it.data)}</div>
      <div class="tl-content"><div class="tl-title">${it.title}</div>${it.detail?`<div style="color:var(--ink-soft); margin-top:2px;">${it.detail}</div>`:''}</div>
    </div>`).join('')}</div>`;
}
function animalTabAgendamentos(anteriores, futuros){
  const renderTbl = list => list.length? `<div class="table-wrap"><table><tbody>
      ${list.map(ag=>`<tr class="rowlink" data-open-ag="${ag.id}"><td>${fmtDate(ag.data)}</td><td>${tipoPill(ag.tipo)}</td><td>${badge(ag.status)}</td></tr>`).join('')}
    </tbody></table></div>` : `<div class="hint" style="margin-bottom:14px;">Nenhum registro.</div>`;
  return `<div class="section-title">Agendamentos futuros</div>${renderTbl(futuros)}
    <div class="section-title" style="margin-top:18px;">Agendamentos anteriores</div>${renderTbl(anteriores)}`;
}
function animalTabMotivos(desmarcacoes, naoAgendamentos, motivos){
  return `

    <div class="chip-list" style="margin-bottom:18px;">${motivos.length?motivos.map(m=>`<span class="pill-muted">${m}</span>`).join(''):'<span class="hint">Nenhum motivo registrado ainda.</span>'}</div>

function animalTabLembretes(lembretes){

function attachViewHandlers(){
  document.querySelectorAll('[data-open-lembrete-pend]').forEach(el=>el.addEventListener('click', e=>{ e.stopPropagation(); formLembrete(DB.lembretes.find(l=>l.id===el.dataset.openLembretePend)); }));

  document.querySelectorAll('[data-open-animal]').forEach(el=>el.addEventListener('click', e=>{ e.stopPropagation(); openAnimalDrawer(el.dataset.openAnimal); }));
  document.querySelectorAll('[data-open-ag]').forEach(el=>el.addEventListener('click', e=>{ e.stopPropagation(); openAgendamentoDrawer(el.dataset.openAg); }));
  document.querySelectorAll('[data-open-contato]').forEach(el=>el.addEventListener('click', e=>{ e.stopPropagation(); openContatoDrawer(el.dataset.openContato); }));

  document.querySelectorAll('[data-edit-tutor]').forEach(el=>el.addEventListener('click', e=>{ e.stopPropagation(); formTutor(tutorById(el.dataset.editTutor)); }));
  document.querySelectorAll('[data-edit-animal]').forEach(el=>el.addEventListener('click', e=>{ e.stopPropagation(); formAnimal(animalById(el.dataset.editAnimal)); }));
  document.querySelectorAll('[data-edit-ag]').forEach(el=>el.addEventListener('click', e=>{ e.stopPropagation(); formAgendamento(DB.agendamentos.find(a=>a.id===el.dataset.editAg)); }));
  document.querySelectorAll('[data-edit-contato]').forEach(el=>el.addEventListener('click', e=>{ e.stopPropagation(); formContato(DB.contatos.find(c=>c.id===el.dataset.editContato)); }));
  document.querySelectorAll('[data-edit-lembrete]').forEach(el=>el.addEventListener('click', e=>{ e.stopPropagation(); formLembrete(DB.lembretes.find(l=>l.id===el.dataset.editLembrete)); }));

  document.querySelectorAll('[data-quick-ag-tutor]').forEach(el=>el.addEventListener('click', e=>{ e.stopPropagation(); closeDrawer(); formAgendamento(null,{tutorId:el.dataset.quickAgTutor}); }));
  document.querySelectorAll('[data-novo-animal-tutor]').forEach(el=>el.addEventListener('click', e=>{ e.stopPropagation(); closeDrawer(); formAnimal(null, el.dataset.novoAnimalTutor); }));
  document.querySelectorAll('[data-quick-ag-animal]').forEach(el=>el.addEventListener('click', e=>{ e.stopPropagation(); closeDrawer(); formAgendamento(null,{animalId:el.dataset.quickAgAnimal}); }));

  document.querySelectorAll('[data-done-lembrete]').forEach(el=>el.addEventListener('click', e=>{
    e.stopPropagation(); const l=DB.lembretes.find(x=>x.id===el.dataset.doneLembrete); l.concluido=true; logAction(`concluiu o lembrete "${l.titulo}"`); saveDB(); render(); toast('Lembrete concluído');
  }));

  document.getElementById('clearAgendaFx')?.addEventListener('click', ()=>{ agendaFilters={tutor:'',animal:'',data:'',status:'',tipo:'',cidade:'',modoData:agendaFilters.modoData,todos:agendaFilters.todos}; render(); });
  document.querySelectorAll('[data-agenda-view]').forEach(el=>el.addEventListener('click', ()=>{ agendaViewMode=el.dataset.agendaView; render(); }));
  document.querySelectorAll('[data-cal-dia]').forEach(el=>el.addEventListener('click', ()=>{ abrirDiaCalendario(el.dataset.calDia); }));
  document.getElementById('agendaTodosPeriodos')?.addEventListener('change', e=>{ agendaFilters.todos = e.target.checked; render(); });
  document.getElementById('novoAgendamento')?.addEventListener('click', ()=>formAgendamento());

  // Clientes
  document.getElementById('novoTutorBtn')?.addEventListener('click', ()=>formTutor());
  document.querySelectorAll('[data-quick-del-tutor]').forEach(el=>el.addEventListener('click', ()=>{
    const tutor = tutorById(el.dataset.quickDelTutor); if(!tutor) return;
    const animCount = animaisDoTutor(tutor.id).length;
    confirmDialog('Excluir tutor?', `O tutor, seus agendamentos e contatos vão para a Lixeira.${animCount?` Os animais vinculados exclusivamente a ele (${animCount}) também serão excluídos.`:''}`, ()=>{
      cascadeDeleteTutor(tutor);
      logAction(`excluiu o tutor ${tutor.nome} com agendamentos, contatos e animais vinculados`);
      saveDB(); closeModal(); render(); toast('Tutor e dados vinculados movidos para a Lixeira');
    });
  }));
  document.querySelectorAll('[data-quick-del-animal]').forEach(el=>el.addEventListener('click', ()=>{
    const animal = animalById(el.dataset.quickDelAnimal); if(!animal) return;
    const agCount = agendamentosDoAnimal(animal.id).length;
    confirmDialog('Excluir animal?', `O animal vai para a Lixeira${agCount?`, junto com ${agCount} agendamento(s) vinculado(s)`:''}.`, ()=>{
      cascadeDeleteAnimal(animal);
      logAction(`excluiu o animal ${animal.nome} com agendamentos vinculados`);
      saveDB(); closeModal(); render(); toast('Animal movido para a Lixeira');

  document.getElementById('clientesSearch')?.addEventListener('input', e=>{ clientesQuery=e.target.value; render(); setTimeout(()=>{const f=document.getElementById('clientesSearch'); f.focus(); f.setSelectionRange(f.value.length,f.value.length);},0); });
  document.querySelectorAll('[data-ctab]').forEach(el=>el.addEventListener('click', ()=>{ clientesTab=el.dataset.ctab; render(); }));

  // Contatos
  document.getElementById('novoContato')?.addEventListener('click', ()=>formContato());
  document.querySelectorAll('[data-cfx]').forEach(el=>el.addEventListener('change', e=>{ contatosFilters[el.dataset.cfx]=el.value; render(); }));
  document.getElementById('clearContatosFx')?.addEventListener('click', ()=>{ contatosFilters={status:'',motivo:'',tipo:'',todos:contatosFilters.todos}; render(); });
  document.getElementById('contatosTodosPeriodos')?.addEventListener('change', e=>{ contatosFilters.todos = e.target.checked; render(); });
  document.getElementById('desmarcacoesTodosPeriodos')?.addEventListener('change', e=>{ desmarcacoesFilters.todos = e.target.checked; render(); });
  document.getElementById('historicoTodosPeriodos')?.addEventListener('change', e=>{ historicoFilters.todos = e.target.checked; render(); });

  document.getElementById('novoLembrete')?.addEventListener('click', ()=>formLembrete());

  document.getElementById('btnAtualizarApp')?.addEventListener('click', async ()=>{
    toast('Verificando atualizações…');
    try{
      if('serviceWorker' in navigator){
        const regs = await navigator.serviceWorker.getRegistrations();
        for(const r of regs){ await r.update(); }
      }
      if('caches' in window){
        const keys = await caches.keys();
        await Promise.all(keys.map(k=>caches.delete(k)));
      }
    }catch(e){ console.error(e); }
    location.reload(true);
  });

    saveDB(); render(); renderUserSelect(); toast('Perfil adicionado');
  });
  document.querySelectorAll('[data-del-usuario]').forEach(el=>el.addEventListener('click', ()=>{
    const u = DB.usuarios.find(x=>x.id===el.dataset.delUsuario); if(!u) return;
    if(DB.usuarios.length<=1){ toast('Precisa existir ao menos um perfil'); return; }
    confirmDialog('Remover perfil?', `"${u.nome}" será removido da lista de perfis desta conta.`, ()=>{
      DB.usuarios = DB.usuarios.filter(x=>x.id!==u.id);
      if(getCurrentUserObj().id===u.id) setCurrentUser(DB.usuarios[0].id);
      logAction(`removeu o perfil "${u.nome}"`);
      saveDB(); closeModal(); render(); renderUserSelect(); toast('Perfil removido');
    });
  }));
  document.querySelectorAll('[data-edit-usuario]').forEach(el=>el.addEventListener('click', ()=>{
    const u = DB.usuarios.find(x=>x.id===el.dataset.editUsuario); if(!u) return;
    formUsuario(u);
  }));
  document.querySelectorAll('[data-foto-usuario]').forEach(el=>el.addEventListener('change', e=>{
    const file = e.target.files[0]; if(!file) return;
    const u = DB.usuarios.find(x=>x.id===el.dataset.fotoUsuario); if(!u) return;
    const reader = new FileReader();
    reader.onload = ev=>{
      const img = new Image();
      img.onload = ()=>{
        const size=120, canvas=document.createElement('canvas'); canvas.width=size; canvas.height=size;
        const ctx = canvas.getContext('2d');
        const scale = Math.max(size/img.width, size/img.height);
        const w=img.width*scale, h=img.height*scale;
        ctx.drawImage(img, (size-w)/2, (size-h)/2, w, h);
        u.foto = canvas.toDataURL('image/jpeg', 0.85);
        logAction(`atualizou a foto do usuário "${u.nome}"`);
        saveDB(); render(); renderUserSelect(); toast('Foto atualizada');
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  }));
  document.querySelectorAll('[data-restore]').forEach(el=>el.addEventListener('click', ()=>{
    restoreFromTrash(el.dataset.restore); render(); toast('Registro restaurado');
  }));
  document.querySelectorAll('[data-purge]').forEach(el=>el.addEventListener('click', ()=>{
    confirmDialog('Excluir definitivamente?','Esta ação não pode ser desfeita — o registro sairá da Lixeira para sempre.', ()=>{
      DB.lixeira = DB.lixeira.filter(x=>x.id!==el.dataset.purge); saveDB(); closeModal(); render(); toast('Excluído definitivamente');
    });
  }));
  document.getElementById('emptyTrashBtn')?.addEventListener('click', ()=>{
    confirmDialog('Esvaziar lixeira?','Todos os registros da lixeira serão excluídos definitivamente. Esta ação não pode ser desfeita.', ()=>{
      DB.lixeira = []; saveDB(); closeModal(); render(); toast('Lixeira esvaziada');
    });
  });
}

/* ---------- Exportações ---------- */
function exportBackup(){
  const blob = new Blob([JSON.stringify(DB,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download=`olhatta-backup-${todayISO()}.json`; a.click();
  URL.revokeObjectURL(url); toast('Backup exportado');
}
function importBackup(e){
  const file = e.target.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = ev=>{
    try{
      const data = JSON.parse(ev.target.result);
      confirmDialog('Importar backup?','Isso substituirá todos os dados atuais deste navegador pelos dados do arquivo importado.', ()=>{
        DB = Object.assign(blankDB(), data); saveDB(); closeModal(); render(); toast('Backup importado com sucesso');
      });
    }catch(err){ toast('Arquivo inválido'); }
  };
  reader.readAsText(file);
}
function exportICS(ag){
  const t=tutorById(ag.tutorId), an=animalById(ag.animalId);
  const dt = ag.data.replace(/-/g,'') + 'T' + ag.horario.replace(':','') + '00';
  const ics = `BEGIN:VCALENDAR\nVERSION:2.0\nBEGIN:VEVENT\nUID:${ag.id}@olhatta\nDTSTAMP:${dt}\nDTSTART:${dt}\nSUMMARY:${ag.tipo} - ${an?.nome||''} (${t?.nome||''})\nDESCRIPTION:${(ag.observacoes||'').replace(/\n/g,' ')}\nEND:VEVENT\nEND:VCALENDAR`;
  const blob = new Blob([ics], {type:'text/calendar'});
  const url = URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url; a.download=`agendamento-${an?.nome||'evento'}-${ag.data}.ics`; a.click();
  URL.revokeObjectURL(url); toast('Arquivo .ics exportado');
}

function hideInitialLoader(){ document.getElementById('initialLoader')?.remove(); }
function showApp(){
  hideInitialLoader();
  document.getElementById('loginScreen').classList.add('hide');
  document.getElementById('app').classList.remove('app-hidden');
  renderNav(); render(); renderUserSelect(); renderQuickLinks();
}
function showLogin(){
  hideInitialLoader();
  document.getElementById('app').classList.add('app-hidden');
  document.getElementById('loginScreen').classList.remove('hide');
  renderLoginBody();
}
async function doLogout(){
  const u = getCurrentUserObj();
  logAction(`saiu do sistema (${u?u.nome:'usuário'})`);
  localStorage.setItem(DB_KEY, JSON.stringify(DB));
  toast('Salvando antes de sair…');
  await pushToFirestoreImmediate();
  detachFirestoreListener();
  auth.signOut();
}
function showLoginError(msg){
  const el = document.getElementById('loginError');
  if(el){ el.textContent = msg; el.style.display='block'; }
  else toast(msg);
}
function traduzErroFirebase(e){
  const map = {
    'auth/wrong-password':'Senha incorreta.',
    'auth/invalid-credential':'E-mail ou senha incorretos.',
    'auth/user-not-found':'Não existe conta com esse e-mail.',
    'auth/email-already-in-use':'Já existe uma conta com esse e-mail. Tente entrar em vez de criar uma nova.',
    'auth/invalid-email':'E-mail inválido.',
    'auth/weak-password':'Senha muito fraca (mínimo 6 caracteres).',
    'auth/popup-closed-by-user':'Login cancelado.',
    'auth/network-request-failed':'Falha de conexão. Verifique a internet.',
    'auth/unauthorized-domain':'Este endereço não está autorizado no Firebase (Authentication → Settings → Authorized domains).',
    'auth/operation-not-allowed':'Esse método de login não está ativado no Firebase (Authentication → Sign-in method).',
    'auth/requires-recent-login':'Por segurança, você precisa confirmar sua senha/login de novo antes de excluir a conta.',
  };
  return map[e.code] || ('Erro ao entrar: '+(e.message||e.code||'desconhecido'));
}

/* ---------- Exclusão de conta ---------- */
function openDeleteAccountFlow(){
  const user = auth.currentUser;
  if(!user) return;
  const html = modalShell('Excluir conta', `
    <p style="font-size:13.5px; color:var(--ink-soft); margin-bottom:12px;">Isso apaga <strong>todos os dados</strong> e encerra para sempre o acesso com <strong>${user.email||'esta conta'}</strong>. Não pode ser desfeito.</p>
    <div class="field"><label>Digite o e-mail da conta para confirmar</label><input id="delAccountEmail" placeholder="${user.email||''}"></div>
  `, `<button class="btn btn-secondary" id="modalCancel">Cancelar</button><button class="btn btn-danger" id="btnConfirmDelAccount">Excluir permanentemente</button>`);
  openModal(html);
  document.getElementById('modalClose').addEventListener('click', closeModal);
  document.getElementById('modalCancel').addEventListener('click', closeModal);
  document.getElementById('btnConfirmDelAccount').addEventListener('click', ()=>{
    const typed = document.getElementById('delAccountEmail').value.trim().toLowerCase();
    if(!user.email || typed!==user.email.toLowerCase()){ toast('O e-mail digitado não confere'); return; }
    closeModal();
    reauthenticateAndDelete(user);
  });
}
function reauthenticateAndDelete(user){
  const providerId = user.providerData[0]?.providerId;
  if(providerId==='google.com'){
    const provider = new firebase.auth.GoogleAuthProvider();
    user.reauthenticateWithPopup(provider).then(()=>finalizarExclusaoConta(user)).catch(e=>toast(traduzErroFirebase(e)));
  } else {
    const html = modalShell('Confirme sua senha', `
      <p class="hint" style="margin-bottom:10px;">Por segurança, digite sua senha novamente antes de excluir a conta.</p>
      <div class="field"><label>Senha</label><input type="password" id="reauthSenha"></div>
    `, `<button class="btn btn-secondary" id="modalCancel">Cancelar</button><button class="btn btn-danger" id="btnReauthConfirm">Confirmar e excluir</button>`);
    openModal(html, {narrow:true});
    document.getElementById('modalClose').addEventListener('click', closeModal);
    document.getElementById('modalCancel').addEventListener('click', closeModal);
    document.getElementById('btnReauthConfirm').addEventListener('click', ()=>{
      const senha = document.getElementById('reauthSenha').value;
      if(!senha) return;
      const cred = firebase.auth.EmailAuthProvider.credential(user.email, senha);
      user.reauthenticateWithCredential(cred).then(()=>{ closeModal(); finalizarExclusaoConta(user); }).catch(e=>toast(traduzErroFirebase(e)));
    });
  }
}
function finalizarExclusaoConta(user){
  toast('Apagando dados…');
  detachFirestoreListener();
  DB = blankDB();
  FIRESTORE_DOC.set(DB).then(()=>user.delete()).then(()=>{
    toast('Conta excluída');
    showLogin();
  }).catch(e=>{
    console.error(e);
    toast('Erro ao excluir conta: '+(traduzErroFirebase(e)||e.message||e.code||''));
    attachFirestoreListener(user);
  });
}

          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>

    </div>`;
  document.getElementById('toggleSenhaBtn').addEventListener('click', ()=>{
    const inp = document.getElementById('loginSenha');
    inp.type = inp.type==='password' ? 'text' : 'password';
  });
  document.getElementById('btnGoogleLogin').addEventListener('click', ()=>{
    const provider = new firebase.auth.GoogleAuthProvider();
    auth.signInWithPopup(provider).catch(e=>showLoginError(traduzErroFirebase(e)));
  });
  document.getElementById('btnEmailLogin').addEventListener('click', ()=>{
    const email = document.getElementById('loginEmail').value.trim();
    const senha = document.getElementById('loginSenha').value;
    if(!email || !senha){ showLoginError('Preencha e-mail e senha.'); return; }
    auth.signInWithEmailAndPassword(email, senha).catch(e=>showLoginError(traduzErroFirebase(e)));
  });

    auth.sendPasswordResetEmail(email).then(()=>toast('E-mail de redefinição enviado')).catch(e=>showLoginError(traduzErroFirebase(e)));
